    retrieval_evidence: portal_lookup get 2026-08-10 (76493 bytes; data_as_of 2026-07-01;
      source FRED)
    consumer_evidence: comp-estate FRED-02 -- explicitly a parallel/STAGING artifact, NOT
      a co-writer of macro_data.json; frontend-orphan [CVO ground-truth]; the
      FRED-vs-Bloomberg merge is a pending integration decision
  - artifact: json/macro/vix_data.json
    state: live            # still published (LastModified 2026-08-10 12:30)
    retrieval_evidence: portal_lookup get 2026-08-10 (787062 bytes; data_as_of 2026-08-06,
      source FRED VIXCLS)
    consumer_evidence: "getVIXData (portal-proxy.ts:1860-1861) has ZERO callers outside
      its definition (grep over src, first-hand); the Volatility tab consumes
      volatility_data.json (vix+move combined) instead -- superseded-but-still-published"
  - artifact: market-metrics.json.gz (bucket top level)
    state: frozen          # 04-15 vintage per PORTAL_RETRIEVAL NEVER-SERVE-as-current row
    consumer_evidence: BUCKET_ALLOWLIST names it for market-overview queries WITH its real
      vintage stated; it is the Market Overview surface's key, adjacent to (not owned by)
      the macro vertical -- listed here because the allowlist routes catalog row-4 macro
      dashboard queries at it
