# ============================================================================
# ddb_sources -- Plane 2 of the Q7 Option-C union (residue-section pattern; no new
# grammar level). The concierge serving surface: portal_lookup.py catalog row 5 serves
# these tables DIRECTLY through ddb-query -- query patterns stand in for panels.
# QUERY-only discipline from the build stands; scans refused.
# ALL COUNTS: LIVE aws dynamodb describe-table reads stamped 2026-08-10 (never a quoted
# prior; drift vs priors is real data: articles 303,603 today vs 298,417 quoted 08-06
# vs 233,159 quoted 07-30).
# ============================================================================
ddb_sources:
  - table: opal-news-articles
    state: ACTIVE, live-writing (today's partition article_date=2026-08-10 held 585 items
      at read time)
    item_count_live: 303603 (2026-08-10; 209.5MB)
    query_pattern: QUERY by article_date (YYYY-MM-DD) ONLY -- ~350-585 items/day
    lineage: news-ingestion-scheduler (NewsAPI+RSS, crons ENABLED) + seeking-alpha
      news/analysis scrape chains -> this table; finbert-batch-processor writes
      sentiment_finbert* back in-place; trending/keyword chains aggregate FROM here
    item_schema:
      - {name: article_date, type: S, role: hash-key, example: "2026-08-10"}
      - {name: url_hash, type: N, role: range-key}
      - {name: entity_type, type: S, example: "RSS"}
      - {name: ingestion_timestamp, type: S, role: vintage, example: "2026-08-10T17:01:04Z"}
      - {name: published_date, type: S}
      - {name: title, type: S}
      - {name: summary, type: S}
      - {name: source, type: S, example: "Zerohedge"}
      - {name: url, type: S}
      - {name: sentiment_finbert, type: N, note: "FinBERT writeback; + _confidence, _label"}
  - table: opal-news-trending-daily
    state: ACTIVE, live-writing (date=2026-08-10 held 20 items at read time, created_at
      21:17:19Z)
    item_count_live: 4537 (2026-08-10; 34.8MB)
    query_pattern: QUERY by date (YYYY-MM-DD) -- ~20 fat GPT-curated topic rows/day
    lineage: news-trending-analysis (Layer 2, cron ENABLED 11:15/21:15Z) ->
      opal-news-layer3-curation (GPT-4o) -> this table; same chain emits
      json/trending/latest.json + json/sentiment/keyword-sentiments.json (S3 plane)
    item_schema:
      - {name: date, type: S, role: hash-key}
      - {name: topic_rank, type: S, role: range-key, example: "bearish-1"}
      - {name: headline, type: S}
      - {name: subtext, type: S}
      - {name: analysis, type: S, note: "3-bullet GPT analysis"}
      - {name: raw_keyword/original_keyword, type: S}
      - {name: article_count, type: N}
      - {name: sentiment, type: M, note: "7-axis map: finbert, bullish_bearish, confidence_fear, risk_appetite, positive_negative, emotional_intensity, legal_risk"}
      - {name: top_articles, type: "L of M", note: "per-article {url, headline, source, published, finbert_score, quality_score, escalation_score}"}
      - {name: trending_score/velocity/momentum/confidence_level, type: "N/N/S/S"}
      - {name: sources/affected_sectors/affected_tickers/citations, type: L}
      - {name: gpt_model, type: S, example: "gpt-4o"}
      - {name: created_at, type: S, role: vintage}
  - table: opal-keyword-intelligence
    state: ACTIVE but NOT writing for current keywords (exercised 2026-08-10 -- see the
      KeywordSentimentModal panel row; newest item seen generated_date 2026-02-23;
      generator cron DISABLED, chained after the frozen drilldown)
    item_count_live: 2892 (2026-08-10; 17.8MB)
    query_pattern: QUERY by keyword (hash) -- or by date via GSI date-index
    lineage: keyword-intelligence-generator (GPT, reads keyword-sentiments.json +
      opal-news-articles) -> this table; served to KeywordSentimentModal via
      POST /v1/sentiment/keyword-intelligence
    item_schema:
      - {name: keyword, type: S, role: hash-key}
      - {name: generated_date, type: S, role: range-key, example: "2026-02-23"}
      - {name: headline_summary, type: S}
      - {name: sentiment_label/sentiment_score/sentiment_pattern/confidence, type: "S/N/S/S"}
      - {name: key_drivers, type: "L of M", note: "{type: BREAKOUT|HEADWIND, title, description, avg_sentiment_estimate, article_count, recency_label}"}
      - {name: counterarguments/pattern_explanation/confidence_reason, type: S}
      - {name: signal_conflict, type: M, note: "{detected, bull_case, bear_case, resolution}"}
      - {name: web_enriched/web_queries/web_context_note, type: "BOOL/L/S"}
      - {name: articles, type: "L of M", note: "source article rows w/ sentiment_finbert"}
      - {name: generated_at, type: S, role: vintage}
  - table: seeking-alpha-article-urls
