              mounted from ModelPortfolios.tsx peers tab, fetch :548 lazy)
            artifacts:
              - artifact: json/peers/peer_performance.json
                source_type: s3
                served_route: /api/general/peers/peer_performance.json
                  (getPeerPerformance, portal-proxy.ts:934-935)
                vintage_field: data_as_of (month-end basis -- a month-old data_as_of is its
                  NORMAL cadence, portal_lookup channel note)
                state: live
                retrieval_evidence: portal_lookup get peers peer_performance.json 2026-08-10
                  (8548 bytes, read COMPLETE; data_as_of 2026-07-31)
                fields:
                  - {name: generated_at, type: datetime, example: "2026-08-03T13:54:45Z"}
                  - {name: data_as_of, type: date, role: vintage, example: "2026-07-31"}
                  - {name: periods, type: "list[6] of string", example: "1M"}
                  - {name: models, type: "object(5 models)", note: "keyed by model code"}
