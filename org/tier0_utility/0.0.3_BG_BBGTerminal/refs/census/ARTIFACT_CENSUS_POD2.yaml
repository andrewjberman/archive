# ARTIFACT_CENSUS_POD2.yaml -- axis: SERVED-ARTIFACT VISUAL+DATA COORDINATES (one intent:
# where does each served artifact appear, and what fields does it carry). Rule 24: one
# grain per level -- page(route) -> location(nav position) -> panel(visual container)
# -> artifact(served object) -> field(datum). Template: ARTIFACT_CENSUS_MP.yaml
# @0c1dae3da (RATIFIED, Andrew @95b3e2852) -- pilot choices carried: residue section,
# scope-family dedup, per-artifact vintage_field, one-panel grain.
#
# VERTICAL DEFINITION (grounded, not assumed): Pod-2 Portfolio Analytics = the portal
# nav "Analysis" section (App.tsx:94-106) MINUS Macroeconomics (vertical 3, TO-4c):
# /cma, /positioning, /attribution, /factor-tilts, /valuations, /correlations (nav order).
#
# DENOMINATOR (binding rule 3 -- COMPLETE token-walks 2026-08-10 via portal_lookup.py +
# boto3 same-pattern for the two prefixes OUTSIDE the channel map; comp-estate threads
# valuation(1)+positioning-adjacent(yalp)+correlation(1)+factor-tilts(1)+cma(1)):
#   json/valuation/        2 keys -- both rendered
#   json/positioning/      3 keys -- all rendered
#   json/correlations/     1 key  -- rendered
#   json/factor-tilts/     3 keys -- all rendered
#   json/capital-markets/  2 keys -- both rendered  (** NOT in the portal_lookup CHANNELS
#                          map or PORTAL_RETRIEVAL table -- channel-map gap, see notes **)
#   VERTICAL-OWNED TOTAL: 11 keys = 11 rendered artifacts (zero owned-unrendered)
#   FROZEN legacy top-level twins (PORTAL_RETRIEVAL rule 3): valuation/ 1 key (2026-01-04)
#   + positioning/ 3 keys (2025-12-23) = 4 keys, residue section
#   BORROWED cross-vertical (rendered here, owned elsewhere): json/portfolios/aum-metrics.json
#   (AGG weighting on 3 pages) + json/latest/manifest.json (SmartPanelFooter freshness on
#   ALL 6 pages) -- referenced with pointers, fields NOT censused here (owner verticals').
vertical: pod2_portfolio_analytics
census_vintage: 2026-08-10
census_author: 0.5.0_AE_OpalETL~Z (OPAL_ANALYST.TO4b)
grounding: every artifact row carries live retrieval evidence (portal_lookup / boto3
  same-pattern COMPLETE read, bytes + vintage); every panel row carries component
  file:line (portal DEV tree HEAD 2026-08-10)

