<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1800 1320' width='1800' height='1320' role='img' aria-labelledby='title desc'>
  <title id='title'>MDPF Portfolio Classification and Sleeve Attribution</title>
  <desc id='desc'>Current portfolio_classification_v1 diagram showing that all accounts are SMAs structurally, the five mutually exclusive categories Models, Strategy, Alternative, Client, and Insurance, category-specific drilldowns, client mandate and sleeve layers, advisory scope, fee basis, and the binding v0 supersession rules.</desc>

  <defs>
    <linearGradient id='headerGrad' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#0B1F3A'/>
      <stop offset='62%' stop-color='#173B63'/>
      <stop offset='100%' stop-color='#145C66'/>
    </linearGradient>
    <linearGradient id='ledgerGrad' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#EAF4FF'/>
      <stop offset='100%' stop-color='#E7F7F4'/>
    </linearGradient>
    <filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='4' stdDeviation='6' flood-color='#0B1F3A' flood-opacity='0.13'/>
    </filter>
    <marker id='arrowNavy' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'>
      <path d='M0,0 L0,6 L9,3 z' fill='#234A72'/>
    </marker>
    <marker id='arrowTeal' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'>
      <path d='M0,0 L0,6 L9,3 z' fill='#14837B'/>
    </marker>
    <style>
      .title { font: 700 34px Segoe UI, Arial, sans-serif; fill: #FFFFFF; }
      .subtitle { font: 400 16px Segoe UI, Arial, sans-serif; fill: #D8E7F4; }
      .kicker { font: 700 13px Segoe UI, Arial, sans-serif; fill: #73D2C6; letter-spacing: 1.7px; }
      .section { font: 700 13px Segoe UI, Arial, sans-serif; fill: #45617B; letter-spacing: 1.35px; }
      .cardTitle { font: 700 18px Segoe UI, Arial, sans-serif; fill: #102B47; }
      .cardTitleSm { font: 700 16px Segoe UI, Arial, sans-serif; fill: #102B47; }
      .cardBody { font: 400 13px Segoe UI, Arial, sans-serif; fill: #4B6175; }
      .small { font: 400 12px Segoe UI, Arial, sans-serif; fill: #5B6F82; }
      .micro { font: 700 10.5px Segoe UI, Arial, sans-serif; fill: #607588; letter-spacing: 0.45px; }
      .pill { font: 700 10.5px Segoe UI, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0.2px; }
      .pillDark { font: 700 10.5px Segoe UI, Arial, sans-serif; fill: #29445D; }
      .axisTitle { font: 700 16px Segoe UI, Arial, sans-serif; fill: #132F4C; }
      .axisBody { font: 600 11.5px Segoe UI, Arial, sans-serif; fill: #415D74; }
      .warnTitle { font: 700 14px Segoe UI, Arial, sans-serif; fill: #6B3F11; }
      .warnBody { font: 400 11.5px Segoe UI, Arial, sans-serif; fill: #695438; }
      .flow { fill: none; stroke: #234A72; stroke-width: 2.3; marker-end: url(#arrowNavy); }
      .flowTeal { fill: none; stroke: #14837B; stroke-width: 2.2; marker-end: url(#arrowTeal); }
      .dash { fill: none; stroke: #8297AA; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrowNavy); }
    </style>
  </defs>

  <rect x='0' y='0' width='1800' height='1320' fill='#F5F8FB'/>
  <rect x='0' y='0' width='1800' height='112' fill='url(#headerGrad)'/>
  <text x='70' y='34' class='kicker'>RCN-0005 | CURRENT CONTRACT</text>
  <text x='70' y='72' class='title'>MDPF Portfolio Classification &amp; Sleeve Attribution</text>
  <text x='70' y='98' class='subtitle'>schema_id = portfolio_classification_v1 | five categories | effective-dated Model lifecycle | v0 explicitly superseded</text>
  <rect x='1435' y='29' width='295' height='55' rx='27' fill='#FFFFFF' fill-opacity='0.12' stroke='#FFFFFF' stroke-opacity='0.35'/>
  <text x='1582' y='52' text-anchor='middle' class='pill'>NORMATIVE TARGET</text>
  <text x='1582' y='74' text-anchor='middle' class='subtitle'>Andrew / Yang revision</text>

  <!-- SMA structural ribbon -->
  <g filter='url(#shadow)'>
    <rect x='70' y='138' width='1660' height='72' rx='18' fill='#E8F2FA' stroke='#86A8C4'/>
    <rect x='70' y='138' width='12' height='72' rx='6' fill='#315C84'/>
    <text x='108' y='169' class='cardTitle'>Every account is inherently an SMA</text>
    <text x='108' y='193' class='cardBody'>SMA is the shared account structure, not a classification category. Never emit SMA as a sixth bucket.</text>
    <rect x='1410' y='155' width='282' height='38' rx='19' fill='#315C84'/>
    <text x='1551' y='179' text-anchor='middle' class='pill'>5 CATEGORIES, NOT 5 + SMA</text>
  </g>

