  <g filter='url(#shadow)'>
    <rect x='70' y='266' width='320' height='84' rx='15' fill='#FFFFFF' stroke='#AFC4D8'/>
    <text x='98' y='294' class='micro'>RELATIONSHIP ROOT</text>
    <text x='98' y='322' class='cardTitle'>Client / Household</text>

    <rect x='70' y='380' width='320' height='84' rx='15' fill='#FFFFFF' stroke='#AFC4D8'/>
    <text x='98' y='408' class='micro'>CUSTODY PERIMETER</text>
    <text x='98' y='436' class='cardTitle'>Account</text>

    <rect x='70' y='494' width='320' height='96' rx='15' fill='#EDF4FB' stroke='#789BBA'/>
    <text x='98' y='522' class='micro'>GOVERNING RELATIONSHIP</text>
    <text x='98' y='550' class='cardTitle'>Client Mandate</text>
    <text x='98' y='573' class='small'>Effective-dated | may span accounts</text>

    <rect x='70' y='620' width='320' height='112' rx='15' fill='#E9F5F3' stroke='#5A9D95'/>
    <text x='98' y='648' class='micro'>ATTRIBUTION GRAIN</text>
    <text x='98' y='676' class='cardTitle'>Sleeve</text>
    <text x='98' y='699' class='small'>Why the assets are present</text>
    <text x='98' y='718' class='small'>and what governs them</text>

    <rect x='70' y='762' width='320' height='112' rx='15' fill='url(#ledgerGrad)' stroke='#5D91AB'/>
    <text x='98' y='790' class='micro'>CANONICAL LEAF</text>
    <text x='98' y='818' class='cardTitle'>Holding / Tax Lot</text>
    <text x='98' y='841' class='small'>One dollar -> one sleeve per date</text>
    <text x='98' y='860' class='small'>or explicit weights summing to 1.0</text>
  </g>

