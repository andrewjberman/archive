    <text x='1149' y='456' text-anchor='middle' class='pill'>muni</text>
    <rect x='1187' y='440' width='60' height='23' rx='11' fill='#4C83AE'/>
    <text x='1217' y='456' text-anchor='middle' class='pill'>tax</text>
