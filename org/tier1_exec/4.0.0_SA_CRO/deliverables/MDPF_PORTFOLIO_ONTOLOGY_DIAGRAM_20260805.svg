  <text x='460' y='300' class='micro'>PORTFOLIO CATEGORY ASSIGNMENT | EXACTLY ONE CATEGORY</text>
  <text x='460' y='326' class='cardBody'>Category-specific fields are required only where shown; every other qualifier/drilldown is null.</text>

