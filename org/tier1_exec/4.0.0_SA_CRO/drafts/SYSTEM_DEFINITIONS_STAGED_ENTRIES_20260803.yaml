# STAGED entries for infra/system/ontology/SYSTEM_DEFINITIONS.yaml -- CRO draft, 2026-08-03
# Source rulings: rcg/rulings/RULINGS.jsonl R-0004, R-0006..R-0012 (Andrew-direct, CRO terminal).
# EVERY ENTRY BELOW IS status: assessed -- drafted by an agent, awaiting Andrew ratification
# at canon landing (CVO lane; Andrew ferries per R-0001). Keys lowercase snake_case per R-0004.
# The epistemic_status schema is applied to its own staging: this file cannot ratify itself.

staged_terms:
  knowledge_space:
    definition: The plane of versioned REPRESENTATION -- everything that describes or prescribes (code, docs, configs, ontology, governance records); ground truth is the repository at a commit vintage. Principal territory -- git (the codebase).
    sits_at: plane
    epistemic_status: assessed
  execution_space:
    definition: The plane of REALIZED, RUNNING state -- a catchall including the AWS estate and associated cloud resource infrastructure, runtime services, deployed topology; ground truth is live primitives. Home of lifecycle_value.
    sits_at: plane
    epistemic_status: assessed
  territory:
    definition: EXISTING CANON TERM, placement confirmed by Andrew 2026-08-03 -- a bounded surface where authoritative state physically lives; territories are the bounded members of the spaces (git -> knowledge_space; aws-cloud -> execution_space; ms-cloud -> execution_space [assessed placement]; local -> working surface of knowledge_space [assessed placement]). The canon 'Estate'-as-totality entry STANDS; the collision is dissolved by using territory for bounded surfaces.
    sits_at: partition of a space
    epistemic_status: assessed
  epistemic_status:
    definition: "Mandatory flag on every semantic qualification, globally: observed (deterministically qualified, structural) | assessed (an agent made a semantic qualification) | ratified (a human confirmed it). A claim never self-promotes; ratified is reachable only through a human act."
    sits_at: meta-schema on all qualifications
    epistemic_status: assessed
  taxonomy_law:
    definition: "Prerequisites for any classification/taxonomical schema, all three provable before the schema enters a registry or gates a decision: (i) MECE -- values mutually exclusive (overlaps resolved by RULES, never author taste) and collectively exhaustive (loud residual class legal, silent non-coverage not); (ii) same grain -- all values provably sit at one named grain; (iii) intent/behavior coherence -- one classification axis serves ONE intent; values mixing intents foundationally break the schema."
    sits_at: meta-law on schema authorship (CLAUDE.md persistence per Andrew)
    epistemic_status: assessed
  rcg_activity_axis:
    definition: RCG axis 1 -- deterministic reachability/dependency analysis over the codebase territory (mark-and-sweep over typed reference edges). Verdicts are observed.
    sits_at: rcg, knowledge_space/git
    epistemic_status: assessed
  rcg_relevance_axis:
    definition: "RCG axis 2, directly downstream of the activity_axis -- file-level DRIFT analysis: is a document a clean, accurate representation of the state/process it describes? New canonical docs and old stable canon are both CLEAN (age alone is never drift). Every drift-evidence item carries a defined executable resolution (R-0011). Routing: high-drift -> agent assesses first, human only on agent-unsure; clearly-deprecated -> summary-delete queue, still reviewed."
    sits_at: rcg, knowledge_space/git
    epistemic_status: assessed
  lifecycle_class:
    definition: "REGRAINED per Andrew 2026-08-03: specifically an RCG concept -- the producer-asserted shape of one artifact's life at folder/file grain in the codebase territory (knowledge_space). Enum + polarity + falsifier tables per rule bank v1.8. Prior execution-side usage (VELOCITY WS-E1 contracts on S3 keys) regrains at the VELOCITY redesign; the concepts carry distinct layers AND territories of influence."
    sits_at: rcg, knowledge_space/git, file grain
    epistemic_status: assessed
  lifecycle_value:
    definition: An execution_space concept -- the human-annotated business stage of a SEMANTIC SYSTEM (via the Kimi user-input pipeline), giving agents a world-map of where systems sit for the business. Never written at artifact grain; never consumed by RCG.
    sits_at: execution_space, semantic-system grain
    epistemic_status: assessed
