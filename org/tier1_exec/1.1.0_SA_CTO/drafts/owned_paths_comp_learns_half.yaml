# ---------------------------------------------------------------------------
# OWNED-PATHS CONFIG — COMP_LEARNS half (DRAFT, not for commit by this agent)
# ---------------------------------------------------------------------------
#
# Authored by: 1.1.0_SA_CTO (2026-04-22)
# Status: DRAFT — route to 1.0.0_SA_CTO for integration into workspace-wide config
#          and pre-commit hook implementation (hook shipping is out of 1.1.0 lane).
# Purpose: declare path globs owned by COMP_LEARNS lane so a pre-commit hook
#          can reject commits whose --author falls outside the permitted agents
#          for a touched path. Prevents cross-team sweeps like 2b3bfcd4.
# Scope of this file: ONLY COMP_LEARNS-scoped paths. Workspace-wide scope
#          (REGISTRY.md, MACRO_CODES.md, CLAUDE.md, other projects' paths,
#          infra/, portal/, data/, shared-infra configs) is base CTO's to author.
#
# Expected merge target: a workspace-wide config file (path TBD by base CTO)
#          that aggregates each project's half + workspace-wide paths.
# ---------------------------------------------------------------------------

# ===========================================================================
# LANES — named groupings of permitted agents
# ===========================================================================

lanes:

  # Full COMP_LEARNS dyad + reports (all six agents)
  COMP_LEARNS:
    description: >
      Full project-scoped agent pool. Project-scoped exec dyad (CTO + COO),
      four DS agents, one SC agent. Any of these may commit to
      broad-COMP_LEARNS-lane paths.
    permitted_agents:
      - 1.1.0_SA_CTO
      - 2.1.0_SA_COO
      - 1.1.0_DS_CompLearns
      - 1.2.0_DS_CompLearns
      - 1.3.0_DS_CompLearns
      - 1.4.0_DS_CompLearns
      - 2.1.0_SC_CompLearns

  # PRD authorship lane — CTO only; base CTO permitted for closure-mechanical edits
  # (e.g., REGISTRY row coordination during 3-step atomic closure)
  COMP_LEARNS-PRD:
    description: >
      Architecture PRDs under docs/architecture/COMP_LEARNS_*.md. CTO-authored
      only, per 1.1.0_SA_CTO prompt.md. Base CTO permitted strictly for
      closure-mechanical cross-reference edits during project closure.
    permitted_agents:
      - 1.1.0_SA_CTO
      - 1.0.0_SA_CTO  # closure-mechanical only — hook can't enforce "mechanical"; trust-based exception

  # TO decomposition + project JSON ownership — COO + CTO (dyad), no DS writes
  COMP_LEARNS-EXEC:
    description: >
      Task-order decomposition, dispatch records, project JSON (phase,
      blocking, status, threads). COO decomposes; CTO edits JSON narrative.
      DS agents do NOT write these files (only their own agent folder).
    permitted_agents:
      - 1.1.0_SA_CTO
      - 2.1.0_SA_COO

  # SC-only lane — scorer stability certs, integrity audits
  COMP_LEARNS-SC:
    description: >
      Scorer stability reports, integrity audits, scorer-certification artifacts.
      Owned by 2.1.0_SC_CompLearns. CTO may read but does not author SC work.
    permitted_agents:
      - 2.1.0_SC_CompLearns
      - 1.1.0_SA_CTO  # read-only in practice; included so CTO can annotate during closure

# ===========================================================================
# PATH GLOBS — mapped to a lane OR to an ad-hoc permitted_agents list
# ===========================================================================
# Hook evaluation order: longest-match-wins. More specific globs override broader ones.

paths:

  # ---------------------------------------------------------------------
  # Project code (broad COMP_LEARNS lane)
  # ---------------------------------------------------------------------

  - glob: "comp/**"
    lane: COMP_LEARNS
    notes: |
      Code root. All seven COMP_LEARNS agents can commit here, but within their
      own functional scope (DS touches targets + bundles; SC touches scorers;
      exec dyad touches cross-cutting infrastructure like comp/bin/ tools).
      Fine-grained scope is enforced by each agent's prompt.md, not by the hook.
      Hook's job: keep non-COMP_LEARNS agents (0.4.0_DS lanes, 1.0.0_SA_CTO's
      other-project work, pod agents) out.

  - glob: "comp/program.md"
    lane: COMP_LEARNS-EXEC
    notes: |
      comp/program.md is CTO-authored doctrine per TO .018. Narrow to exec lane.

  - glob: "comp/targets/*/gold/**"
    lane: COMP_LEARNS
    notes: |
      Gold benchmark data — DS authors + maintains; SC audits.

  # ---------------------------------------------------------------------
  # Architecture / PRDs (CTO-only)
  # ---------------------------------------------------------------------

  - glob: "docs/architecture/COMP_LEARNS_*.md"
    lane: COMP_LEARNS-PRD

  - glob: "docs/architecture/COMP_LEARNS_*/**"
    lane: COMP_LEARNS-PRD
    notes: |
      Subdirectories under COMP_LEARNS_* PRD titles (if any emerge).

  # ---------------------------------------------------------------------
  # Project metadata (exec dyad only — not DS)
  # ---------------------------------------------------------------------

  - glob: "org/projects/COMP_LEARNS.json"
    lane: COMP_LEARNS-EXEC
    notes: |
      Project JSON. CTO edits phase/blocking narrative; COO flips statuses
      at TO-level closure; both authorized.

  - glob: "org/projects/COMP_LEARNS_DISPATCH_BUNDLE.md"
    lane: COMP_LEARNS-EXEC

  - glob: "org/projects/COMP_LEARNS*"
    lane: COMP_LEARNS-EXEC
    notes: |
      Catch-all for any COMP_LEARNS-prefixed project files not covered above.
      Does NOT include REGISTRY.md or MACRO_CODES.md — those are workspace-wide
      (base CTO scope).

  # ---------------------------------------------------------------------
  # Agent folders (each agent owns their own folder exclusively)
  # ---------------------------------------------------------------------

  - glob: "org/tier1_exec/1.1.0_SA_CTO/**"
    lane:
      permitted_agents:
        - 1.1.0_SA_CTO

  - glob: "org/tier1_exec/2.1.0_SA_COO/**"
    lane:
      permitted_agents:
        - 2.1.0_SA_COO

  - glob: "org/tier2_senior/1.1.0_DS_CompLearns/**"
    lane:
      permitted_agents:
        - 1.1.0_DS_CompLearns

  - glob: "org/tier2_senior/1.2.0_DS_CompLearns/**"
    lane:
      permitted_agents:
        - 1.2.0_DS_CompLearns

  - glob: "org/tier2_senior/1.3.0_DS_CompLearns/**"
    lane:
      permitted_agents:
        - 1.3.0_DS_CompLearns

  - glob: "org/tier2_senior/1.4.0_DS_CompLearns/**"
    lane:
      permitted_agents:
        - 1.4.0_DS_CompLearns

  - glob: "org/tier2_senior/2.1.0_SC_CompLearns/**"
    lane:
      permitted_agents:
        - 2.1.0_SC_CompLearns

  # ---------------------------------------------------------------------
  # Threads (project-scoped)
  # ---------------------------------------------------------------------

  - glob: "org/threads/**/COMP_LEARNS_*"
    lane: COMP_LEARNS
    notes: |
      COMP_LEARNS-tagged thread artifacts. Any dyad/DS/SC agent may author
      message files within a thread they're participating in.

# ===========================================================================
# EXPLICITLY NOT OWNED BY THIS FILE
# ===========================================================================
# These paths are WORKSPACE-WIDE and must be covered by base CTO's half of the
# config. Listing here as a routing aid — do not duplicate into the merged
# workspace config from this file.
#
# - org/projects/REGISTRY.md            (workspace registry; base CTO)
# - org/projects/MACRO_CODES.md         (macro code registry; base CTO)
# - CLAUDE.md                           (workspace instructions; Andrew + base CTO)
# - org/XXX.md                          (startup doc; base CTO)
# - org/ref/**                          (shared protocols; base CTO + Andrew)
# - org/standards/**                    (workspace standards; base CTO)
# - infra/**                            (AWS infrastructure; AE + DT pods)
# - portal/**                           (portal submodule; DE + RD pods)
# - data/**                             (pipeline data; AE + DS pods, non-COMP)
# - docs/architecture/{non-COMP_LEARNS}.md  (base CTO + domain CTOs)

# ===========================================================================
# HOOK BEHAVIOR NOTES (for base CTO when implementing)
# ===========================================================================
#
# 1. Author extraction: read git commit --author flag; match against serial
#    field (e.g., "1.1.0_SA_CTO <1.1.0_SA_CTO@opal.agent>" → serial "1.1.0_SA_CTO").
#
# 2. Path matching: longest glob match wins. If multiple globs match a file,
#    the one with the most specific path wins (count path segments + literal
#    chars, higher is more specific).
#
# 3. Unmapped paths: fail closed OR fail open? Recommend fail-open during
#    rollout (log warning, don't block) to avoid breaking agents whose paths
#    aren't yet declared. After one week of warnings, flip to fail-closed.
#    Base CTO's call.
#
# 4. Multi-file commits: if ANY file in the commit fails the author check,
#    reject the whole commit. No partial-accept.
#
# 5. Closure-mechanical exception (base CTO editing COMP_LEARNS-PRD): hook
#    cannot distinguish "mechanical" from "substantive" edits. Recommend
#    permitted_agents list allows 1.0.0_SA_CTO under COMP_LEARNS-PRD, with
#    a post-commit audit to catch misuse (low frequency, trust-based).
#
# 6. Bypass mechanism: every hook needs a documented escape hatch for
#    legitimate emergencies. Recommend `--author-override <lane>` flag that
#    logs the override to an audit trail and requires Andrew's sign-off
#    (via a second signer or just recorded-in-log, base CTO's call).
#
# 7. Testing: before enabling in pre-commit, run as dry-run on the last 500
#    commits. Expect to find MULTIPLE violations matching the 2b3bfcd4 class
#    of incident — those are the data points confirming the hook catches
#    the real failure mode.
