notes: >
  Compiler-win case — proves the ratchet loop achieves real improvement, not just
  apparatus configuration churn.
  Task definition: Click supports chained command groups where a Group can contain
  other Groups. The `invoke` dispatch logic used in Case 2 handles 2-level nesting
  (Group -> Command). Extend the refactor to handle 3-level nesting (Group -> Group ->
  Command) while preserving all 8 structural invariants from Case 2 PLUS the
  additional invariant: context propagation through intermediate group (Group B must
  receive the parent Group A's context, not just the root context).
  Why the current compiler is mediocre here: the pilot Case 2 compiler graph localized
  dispatch to the Group class but did not surface the context-propagation invariant
  across multiple Group.invoke calls. A DS agent aided with the current compiler would
  still need to read the context-passing logic manually. The 3-hop case makes this worse.
  Dev loop target: compiler mutations that make context-propagation edges explicit in
  the graph output, reducing the DS agent's need to read click/core.py Group.invoke
  body line-by-line.
  Primary metric: DS token cost or wall_clock for the full refactor under aided condition
  (lower = better). A KEEP event means the mutation reduced the metric. Stop condition:
  3 consecutive KEEP events OR plateau (5 iterations without KEEP).
  Baseline: pin to click 8.3.1 (SHA f80cf4b0 — same as Case 2 baseline) before dev_active.
  This is intentional: same codebase, harder task, lets us compare compiler output
  quality directly to Case 2 pilot results.
