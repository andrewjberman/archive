3 sync s3://.../code/gold/`), nothing baked -- CVO source-verified -- so the nightly WILL execute the fix. DISPOSITION 2026-07-09 23:3xZ -- SOVEREIGN OUT-OF-SCOPE. **WITHHELD -- VERIFY NOT RUN. NEVER A PASS.** Andrew (2026-07-09T22:33Z): "i do not want to deal with 49 right now ... not something that we should pursue unless i explicitly ask for it." CTO 231239Z ruled `data/black_diamond/` IS 49 Financial and placed `data/black_diamond/`, `schwab/`, `opal-data-bd`, `opal-data-schwab` OUT OF SCOPE -- no writes, pushes, deploys, ad-hoc runs, ledger closes, **or verifies**; COO 231641Z retracted the competing carve-out. The delivery limb's acceptance is a read of `s3://opal-data-bd/platinum/firm/leaderboard.json`. **That read is prohibited. The gate cannot clear, and no nightly re-read will occur.** State of record: the fix is APPLIED (2af63847d D_00c anchor + window_bounds; 3ea2bdbf9 D_04 propagation; sha256 repo == s3://opal-data-bd/code/gold/ verified 07-09 BEFORE the ruling) and the value limb is EXERCISED-CLEAN; the DELIVERY limb is **UNVERIFIED AND UNVERIFIABLE under the standing prohibition**. A prohibition stops agents, not crons -- so the legs are applied with no assurance, **by sovereign design**. This is an EXPLICIT GAP, recorded as a gap. It is NOT "no divergence found": a negative from a prohibited sweep is indistinguishable from a negative from a complete one, and could-not-verify is a finding, never a clean bill (Rule 22a; the committed-not-applied failure mode). The ONLY paths out: (a) Andrew explicitly reopens 49F/bd and the served re-read runs; or (b) the row is ratified on the value limb alone with the delivery gap recorded verbatim in `ratified_by` -- which I do NOT recommend and will not sign. Do not "just check." The prior 06-17 QTD divergence example has been REMOVED from this limb -- it is resolved, and a resolved example left standing in an invariant reads as a live failure.
