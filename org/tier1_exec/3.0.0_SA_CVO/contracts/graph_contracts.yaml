# graph_contracts — CVO-authored rows for globgrph.graph_contracts (NFRA_GCONTR TO-3)
#
# AUTHORING MODEL (lane split, per AE convergence 2026-06-16):
#   - CVO authors this YAML declaratively (the row CONTENT; value-layer lane).
#   - AE runs `--load-contracts <this file>` IN-VPC (the Nessie REST catalog is in-VPC only;
#     no dev-box pyiceberg write). Every row write = an attributable Nessie commit; the loader
#     stamps `ratified_at` = that authoring commit hash at write time (existence-in-window = exact).
#
# RATIFICATION (§9 tiered — authored here, NOT self-ratified):
#   - SEV1 rows (benchmark / headline / advisor_intelligence): ratified_by MUST be [Andrew].
#     The row is AUTHORED here but is NOT a ratified sign-off until Andrew signs off (routed via COO)
#     AND AE writes it in-VPC. Until then `ratified_at: PENDING-ANDREW-SIGNOFF` — it does NOT count
#     as a sanctioning edit (AE's existence-in-window check keys on a real commit hash).
#   - SEV2 rows (peers / aum): ratified_by [CTO, COO] (co-signable by CTO+COO).
#
# SEMANTICS (converged w/ AE, CTO-endorsed):
#   - canonical_writer = the single IAM role-id == the WRITES-edge principal node-id, verbatim.
#   - forbidden_writers = the UNSANCTIONED tripwire; CVO-curated COMPLETE per surface (CTO cond. (a)):
#     a co-tenant NOT in this list only ever reaches WATCH, so catch-power depends on completeness.
#   - period_defs = the value-layer semantic contract (CVO-owned value_check runs the served col vs it).
#   - active: true = live contract (retire-without-delete sets false; CTO amendment).
#   - v1 enforcement is ADVISORY (UNSANCTIONED WARNs, does NOT exit 2) until the CTO ramp-flip.
#
# WAVE STATUS (2026-06-16):
#   [LIVE+RATIFIED] benchmark (SEV1) — Andrew-signed, in-VPC on Nessie main, BOTH axes verified (TO-2b).
#   [AUTHORED, pending CTO+COO] peers (SEV2) — THIS session; clean yang-Lambda producer, Q2-resolvable.
#   [AUTHORED, pending CTO+COO] aum (SEV2) — THIS session; smartx-ingestion-lambda-role (CloudWatch-confirmed
#       live writer 06-16 11:30, MDPF-sourced); smartx-exporter EC2 = dormant dual-writer (stopped since 06-01,
#       Q2-invisible -> declarative forbidden_writers until the 06-17 EC2-WRITES-derive fix). SEV2 ceiling COMPLETE.
#   [AUTHORED, pending Andrew] advisor_intelligence/NNA (SEV1) — 2026-06-17. POLICY limb UNBLOCKED: the 06-17 nightly
#       derive closed the EC2-WRITES gap (CVO independent comp-kuzu re-verify: EC2 WRITES 0->~66; canonical_writer
#       bd-exporter-ec2-role now Q2-resolvable via via_role). Value-limb authored from the served artifact
#       (window_vocabulary/bounds + F4b + reconciliation). aum's EC2-dual-writer tripwire rode the SAME 06-17 fix.
#   REMAINING:
#     - headline (SEV1)  — Andrew sign-off; AUA-total surface (MDPF aggregate + account-distribution; $1.71B
#         stale-headline incident history) -> careful value-contract analysis required.
#     - the period_defs value-check assertion (CVO-owned, §9 homing) — the runnable codified BMKAUD WS-2 check.

contracts:

  # ── SEV1 #1 — the benchmark seed (the BMKAUD-catch; fully worked in the seed brief) ──
  - contract_id: benchmark-model-portfolios
    surface: "critical-surfaces:model_portfolios.benchmark (SEV1) | pipescript:model-portfolios/yang-benchmarks-etf-returns"
    artifact_keys:
      - s3://opal-data-portal-v2/json/benchmarks/model_portfolio_benchmarks.json
      - s3://opal-data-portal-v2/json/benchmarks/benchmark_returns.json
      - s3://opal-data-portal-v2/json/benchmarks/model_portfolio_timeseries.json
      - s3://opal-data-portal-v2/json/benchmarks/etf_returns.json
    canonical_writer: yang-pipeline-lambda-role
    canonical_producer: "yang-model-portfolio-benchmarks (ProcessBothPKLs branch)"
    source_of_truth: "s3://opal-data-portal-v2/benchmarks/data_YYYYMMDD_v1.pkl  # Yang PKL (BMKAUD WS-1)"
    period_defs:
      "1D":  "prior-trading-day -> as-of"
      "WTD": "week-start(Mon) -> as-of"
      "MTD": "month-start -> as-of  (PARTIAL current month)"
      "1M":  "trailing-1-calendar-month -> as-of"   # NOT last-complete-calendar-month = the SmartX violation
      "1Q":  "trailing-3-calendar-months -> as-of"
      "YTD": "year-start -> as-of"
      "1Y":  "trailing-365-CALENDAR-days, TOTAL return (incl dividends)"   # feca94a1f: 365 not 252, total not price
      "3Y":  "trailing-3Y, annualized"
      "SI":  "since-inception, annualized"
      "_rfr_tenor":    "duration-matched per model: UST/ST=1Y, INT=5Y, LTC/LTA=10Y (2c18f0c06)"
      "_return_basis": "TOTAL return (dividends included) + calendar-day arithmetic"
    models: [UST, ST, INT, LTC, LTA]
    forbidden_writers:
      - smartx-model-monthly-pull        # ROOT CAUSE: 1M=last-complete-calendar-month != contract
      - opal-generate-benchmark-returns  # EC2 smartx-exporter generate_benchmark_performance.py, own period-math (dormant dual-writer)
      - smartx-ingestion-role            # latent writer (BMKAUD writer census)
      - news-pipeline-role               # latent writer (BMKAUD writer census)
    enforcement:
      iam_backstop: "DenyNonYangWriteBenchmarks on opal-data-portal-v2/json/benchmarks/* (b1a3543c9)"
      surface_gate: "comp-surface-check SEV1 (model_portfolios.benchmark in critical-surfaces.yaml)"
      value_check:  "period_defs check vs the Yang PKL (codifies BMKAUD WS-2; CVO-owned)"
    ratified_by: [Andrew]                # SEV1 tier (§9) — PENDING Andrew sign-off via COO; do NOT treat as ratified until AE writes with a real ratified_at
    ratified_at: PENDING-ANDREW-SIGNOFF  # AE stamps the authoring Nessie commit hash on in-VPC write, AFTER Andrew sign-off
    active: true
    provenance: "BMKAUD 2026-06-01 (benchmark-yang-truth-audit-20260601.md); revert 80224d674; Deny b1a3543c9; seed 48635a865"

  # ── SEV1 #2 — advisor_intelligence / NNA (advisor net-new-cash canonical) ──
  # Census cvo_1555Z 2026-06-16 + 06-17 EC2-WRITES re-verify (policy-limb HOLD LIFTED). Producer = bd-gold-layer-runner
  # EC2 (HAS_PROFILE bd-exporter-profile -> ASSUMES bd-exporter-ec2-role) running gold_dispatch D_00f.advisor_nna_canonical.py
  # from C_01 gold/canonical/nna/{date}.parquet. canonical_writer = bd-exporter-ec2-role (the via_role role-short-name;
  # contract_engine writes_into() keys on via_role read from the FULL-FIDELITY derive -- kuzu DROPS via_role so the kuzu
  # edge shows on the EC2_INSTANCE + role-WRITES=0, but Q2 resolves the role; code-grounded by base-AE). EC2-WRITES path
  # Q2-resolvable as of the 06-17 nightly derive: CVO independent comp-kuzu re-verify (provenance current/06-17) =
  # EC2 WRITES 0->~66, INSTANCE_PROFILE/HAS_PROFILE 0->11/24, iam:GetInstanceProfile egress-proven (no AccessDenied).
  # forbidden_writers HONESTLY EMPTY: no known non-canonical NNA writer (no smartx/dual-writer override on this surface,
  # unlike benchmark's smartx-model-monthly-pull or aum's smartx-exporter EC2).
  #
  # AUDIT-RESHAPED 2026-06-17 (cvo_1804Z, plan APPROVED): the source (C_01<-load_flows) is clean, but the
  # value-limb is reshaped by the ADVI/bd NNA audit. Per-advisor scope = ALL ROLES (Andrew: architect+
  # implementor+consultant+local_ops+additional), NON-additive (firm stays additive account-once). MAX=2021-Q1
  # (Andrew). The audit found per-advisor NNA DIVERGES by route from a DUAL ATTRIBUTION SOURCE (D_00f via
  # C_01 acct_dim SCD parks 34.5%/$35.3M in Unassigned+49F House placeholders; D_00c via C_07 account_team
  # resolves them). value_check below asserts the POST-REMEDIATION target invariants (advisory v1) and so
  # CURRENTLY FLAGS the live divergence -- that is the point. F-0 RESOLVED (Andrew 2026-06-17): 49F House =
  # canonical bucket (kept, NEVER inferred into individuals); Unassigned = transient (self-resolves, research-
  # confirmed); individuals EXCLUDE both; the D_00c C_07-Layer-3 placeholder->individual inference is the
  # leaderboard-side over-attribution to REMOVE (the canonical's bucket-preservation was correct).
  - contract_id: advisor-intelligence-nna
    surface: "critical-surfaces:advisor_intelligence (SEV1) | pipescript:advi-bd/advisor_nna_canonical"
    artifact_keys:
      - s3://opal-data-bd/platinum/firm/advisor_nna_canonical.json
    canonical_writer: bd-exporter-ec2-role
    canonical_producer: "bd-gold-layer-runner EC2 (HAS_PROFILE bd-exporter-profile -> ASSUMES bd-exporter-ec2-role) running gold_dispatch.sh D_00f.advisor_nna_canonical.py"
    source_of_truth: "s3://opal-data-bd/gold/canonical/nna/{date}.parquet  # C_01 bd atomic daily NNA (load_flows: daily_inflow - daily_outflow); the served platinum artifact aggregates these over window_bounds"
    period_defs:
      "QTD":       "quarter-to-date: current-calendar-quarter-start -> data_as_of (PARTIAL current quarter)"
      "YTD":       "year-to-date: Jan-1 -> data_as_of"
      "MAX":       "since 2021-Q1 (start 2021-01-01) -> data_as_of  # AUDIT F-2 + Andrew 2026-05-14: 2021-Q1 NOT 2000; MUST match in canonical + leaderboard + FE ADVI_MAX_WINDOW_ANCHOR"
      "1Y":        "trailing-365-CALENDAR-days -> data_as_of"
      "3Y":        "trailing-1095-CALENDAR-days -> data_as_of"
      "q_current": "current calendar quarter to date (== QTD; snapshot strip)"
      "q1":        "prior FULL calendar quarter (snapshot strip)"
      "q2":        "2 calendar quarters ago (FULL)"
      "q3":        "3 calendar quarters ago (FULL)"
      "_metric_per_advisor": "AUDIT-RESHAPED: Advisor-NNA(advisor,window) = sum(nna_txn) over [window_start,window_end] across ALL roles the advisor holds (architect/implementor/consultant/local_ops/additional), from ONE C_07-resolved attribution source + ONE tenure rule. NON-additive (Sigma advisors approx 3x firm). nna_txn = daily_inflow - daily_outflow."
      "_metric_firm":        "Firm-NNA(window) = account-once net flow (each account credited once) = the ADDITIVE total ($102.35M QTD). Sigma(account-once / one-architect-per-account) == firm. Per-advisor all-roles is NOT summed against this."
      "_invariant_F4b":      "nmnc.nna + nmec.nna == total.nna per (advisor x window); NMNC = relationship first_seen WITHIN the window (not pre-existing at data_start), NMEC = all others"
      "_reconciliation":     "FIRM/account-once: sum(leaves) == parent per dimension x window, tol 0.01 USD. Per-advisor all-roles is declared non-additive (do NOT assert Sigma(advisors)==firm). series_tie: sum(monthly buckets) == leaf MAX-window nna."
      "_return_basis":       "NET CASH FLOW (USD), not a return %; window arithmetic is calendar-day inclusive [start,end]"
    forbidden_writers: []   # HONEST: no known non-canonical NNA writer on advisor_nna_canonical (no smartx/dual-writer override). Catch rests on canonical_writer match (bd-exporter-ec2-role) + WATCH(advisory) + the value-limb (window-bound conformance + F4b/reconciliation). A co-tenant only ever reaches WATCH by construction.
    enforcement:
      iam_backstop: "bd-exporter-ec2-role = the bd-gold instance-profile role; opal-data-bd platinum/firm write governed by the bd bucket policy + instance-profile scoping (no surface-specific Deny observed; a novel writer -> Q2 WATCH advisory + the value_check)"
      surface_gate: "comp-surface-check SEV1 (advisor_intelligence in critical-surfaces.yaml)"
      value_check:  >-
        AUDIT-RESHAPED 2026-06-17 (cvo_1804Z); advisory v1; CVO-owned. FIVE invariants:
        (1) WINDOW-BOUND conformance: served window_bounds[w] match window_vocabulary[w] (1Y.start==end-365d; 3Y.start==end-1095d; QTD/q_current.start==calendar-quarter-start; YTD.start==Jan-1; q1/q2/q3==prior 1/2/3 FULL calendar quarters; **MAX.start==2021-01-01** per F-2/Andrew, NOT 2000) -- a non-conforming bound = violation independent of who wrote it (PRD 3.3).
        (2) CROSS-ROUTE IDENTITY (F-1): for a given (advisor, window), the per-advisor NNA is IDENTICAL across every served route (advisor_nna_canonical, leaderboard, rendered profile, rendered Distribution) -- one C_07-resolved attribution source + one tenure rule. CURRENTLY FAILS (Travis QTD $4.14M canonical vs $6.95M leaderboard) -- catches the live divergence.
        (3) WITHIN-SURFACE COHERENCE (F-1c): on each surface, served nna == inflows - outflows.
        (4) FIRM-ADDITIVE vs PER-ADVISOR ALL-ROLES: firm = account-once additive (Sigma(account-once)==firm, tol 0.01) + F4b (nmnc+nmec==total); per-advisor = all-roles, declared non-additive (NOT summed against firm).
        (5) BUCKET INTEGRITY (F-0, ANDREW-DECIDED 2026-06-17): 49F House is a RECOGNIZED CANONICAL bucket (49 Financial house book) -- kept as its own row, NEVER resolved/inferred into individual advisors. Unassigned is a BOUNDED TRANSIENT bucket (research: purely 2026 arrivals, YTD==MAX, q2/q3==0; self-resolves to a real advisor within ~1-2 quarters; its share MUST collapse in long windows -- ~80% of MAX is QTD, ~2.5% of MAX is pre-current). Individual-advisor per-advisor NNA EXCLUDES both buckets. The C_07 Layer-3 placeholder->individual INFERENCE is DISABLED (it over-credits individuals with the $357.6M house book + the transient pool -- that is the leaderboard-side cross-route divergence to remove).
    ratified_by: [Andrew]                # SEV1 tier (§9)
    ratified_at: PENDING-ANDREW-SIGNOFF  # AE stamps the authoring Nessie commit hash on in-VPC write, AFTER Andrew sign-off
    active: true
    provenance: "TO-3 SEV1 wave; producer census cvo_1555Z 2026-06-16; EC2-WRITES policy-limb HOLD LIFTED 2026-06-17 (CVO comp-kuzu re-verify: EC2 WRITES 0->~66, INSTANCE_PROFILE/HAS_PROFILE 0->11/24, iam:GetInstanceProfile egress-proven); via_role attribution code-grounded (contract_engine writes_into); value-limb AUDIT-RESHAPED 2026-06-17 (cvo_1804Z_nna_estate_audit_seams_verdict.md, plan approved): /seams root-caused dual attribution source (C_01 acct_dim SCD parks 34.5%/$35.3M placeholders vs C_07 account_team resolved); scope=all-roles + MAX=2021-Q1 (Andrew); served advisor_nna_canonical generated_at 2026-06-17T05:04Z data_as_of 2026-06-15"

  # ── SEV1 #3 — model_portfolios.headline (Model Portfolios page "Portfolio Analytics" top panel) ──
  # Census 2026-06-17 (CVO). DISTINCT from the bd-NNA ADVI headline (that = advisor_intelligence/F-4). This is
  # the AUM headline: total/model/non-model AUM + quarterly growth (q0..q3). Shares the aum.ts backend +
  # json/portfolios/aum-metrics.json chain with the model_portfolios.aum SEV2 row (critical-surfaces.yaml
  # severity_resolution note) -> SAME canonical_writer/producer = smartx-ingestion-lambda-role (MDLP daily
  # re-source, MDPF-sourced; aum-metrics.json last_updated 11:30:40Z matches the aum row's producer log).
  # Served 2026-06-17: total.aum $1,805,679,796 (FUNDED), model $1.53B + non_model $355M, account_count 7410.
  - contract_id: headline-model-portfolios
    surface: "critical-surfaces:model_portfolios.headline (SEV1) | ModelPortfolios.tsx 'Portfolio Analytics' panel + portal/src/api/endpoints/aum.ts"
    artifact_keys:
      - s3://opal-data-portal-v2/json/portfolios/aum-metrics.json
      - s3://opal-data-portal-v2/json/portfolios/account-distribution.json
    canonical_writer: smartx-ingestion-lambda-role
    canonical_producer: "opal-smartx-ingestion-pipeline (MDLP daily re-source; compute_account_distribution.py + aum-metrics build); trigger smartx-account-distribution-daily cron(30 11 UTC) -- SAME chain as model_portfolios.aum"
    source_of_truth: "the MDPF feed (opal-data-mdpf) -- 'all MDPF-feed-sourced' per the 11:30 producer log; legacy smartx-scrape EC2 path DEAD"
    period_defs:
      "as_of":      "POINT-IN-TIME: total.aum + by_model AUM as-of the latest complete business day (period field). NOT a trailing-window metric."
      "q0":         "current calendar quarter (quarter-to-date growth vs priorLevel = quarter-start AUM)"
      "q1":         "prior FULL calendar quarter (growth vs its priorLevel)"
      "q2":         "2 calendar quarters ago (FULL)"
      "q3":         "3 calendar quarters ago (FULL)"
      "MAX":        "since 2021-Q1 (start 2021-01-01)  # AUDIT F-2 + Andrew 2026-05-14: 2021-Q1 across ADVI/model-portfolios, NOT 2000"
      "_aum_basis": "total.aum = FUNDED account balances as-of (unfunded EXCLUDED -- the never-widen invariant); model_aum + non_model_aum is the ALL-basis split (incl unfunded), so model_aum+non_model_aum >= total.aum by the unfunded delta (observed 2026-06-17: $1.888B all vs $1.806B funded, ~$82M = the funded-exclusion; the reconciliation rule must net this, NOT assert raw equality)"
      "_growth":    "qN.change = aum - priorLevel (level-diff, NOT a flow); qN.growth% = change/priorLevel; historical quarter levels IMMUTABLE (never-widen on past dates)"
    forbidden_writers:
      - smartx-exporter-role        # EC2 smartx-exporter dual-writer of json/portfolios/* -- DORMANT (EC2 stopped since 2026-06-01); Q2-visibility rides the 06-17 EC2-WRITES-derive fix (same as aum row)
    enforcement:
      iam_backstop: "none surface-specific (no json/portfolios/* Deny); dormant EC2 dual-writer contained by EC2-stopped + (post-06-17) Q2; a novel Lambda writer -> Q2 WATCH advisory + value_check"
      surface_gate: "comp-surface-check SEV1 (model_portfolios.headline in critical-surfaces.yaml; shares aum.ts nodes with model_portfolios.aum -> MAX-severity resolution = SEV1 wins)"
      value_check:  >-
        CVO-owned, advisory v1: (1) CROSS-SURFACE AUM IDENTITY -- the headline total.aum == the
        model_portfolios.aum surface total == the firm additive account-once AUM (one AUM number across the
        Model Portfolios page; same spirit as the NNA cross-route identity). (2) FUNDED-BASIS reconciliation:
        total.aum = FUNDED-only; model_aum + non_model_aum nets to total + the unfunded delta (NOT raw
        equality -- ~$82M unfunded 2026-06-17); by_model AUM sums to total.aum funded-basis. (3) POINT-IN-TIME +
        never-widen: as_of latest-complete-day; historical quarter levels immutable. (4) MAX window start ==
        2021-01-01. (5) AUA-vs-AUM: this is AUM (under management); do NOT assert equality with the bd ADVI
        AUA headline (under advisement) -- different metric, expected to differ.
    ratified_by: [Andrew]                # SEV1 tier (§9)
    ratified_at: PENDING-ANDREW-SIGNOFF  # AE stamps the authoring Nessie commit on in-VPC write, AFTER Andrew sign-off
    active: true
    provenance: "TO-3 SEV1 wave (completes the SEV1 ceiling: benchmark + advisor_intelligence-NNA + headline); census CVO 2026-06-17; shares the aum.ts/MDLP chain with aum-model-portfolios (smartx-ingestion-lambda-role, CloudWatch 11:30 MDLP re-source); served aum-metrics.json period 2026-06-16 total.aum $1.806B funded; DISTINCT from F-4 bd-NNA headline (-> ADVI_NNAATTR)"

  # ── SEV2 #1 — model_portfolios.peers (peer-universe percentiles + model/benchmark per window) ──
  # Census 2026-06-16 (CVO, comp-kuzu canonical graph HEAD current): producer yang-generate-peer-performance
