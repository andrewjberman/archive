# graph_contracts — CVO-authored rows for globgrph.graph_contracts (NFRA_GCONTR TO-3)
#
# AUTHORING MODEL (lane split, per AE convergence 2026-06-16):
#   - CVO authors this YAML declaratively (the row CONTENT; value-layer lane).
#   - AE runs `--load-contracts <this file>` IN-VPC (the Nessie REST catalog is in-VPC only;
#     no dev-box pyiceberg write). Every row write = an attributable Nessie commit; the loader
#     stamps `ratified_at` = that authoring commit hash at write time (existence-in-window = exact).
#
# RATIFICATION (§9 tiered — authored here, NOT self-ratified):
#   - SEV1 rows (benchmark / headline / advisor_intelligence): ratified_by MUST be [Andrew].
#     The row is AUTHORED here but is NOT a ratified sign-off until Andrew signs off (routed via COO)
#     AND AE writes it in-VPC. Until then `ratified_at: PENDING-ANDREW-SIGNOFF` — it does NOT count
#     as a sanctioning edit (AE's existence-in-window check keys on a real commit hash).
#   - SEV2 rows (peers / aum): ratified_by [CTO, COO] (co-signable by CTO+COO).
#
# SEMANTICS (converged w/ AE, CTO-endorsed):
#   - canonical_writer = the single IAM role-id == the WRITES-edge principal node-id, verbatim.
#   - forbidden_writers = the UNSANCTIONED tripwire; CVO-curated COMPLETE per surface (CTO cond. (a)):
#     a co-tenant NOT in this list only ever reaches WATCH, so catch-power depends on completeness.
#   - period_defs = the value-layer semantic contract (CVO-owned value_check runs the served col vs it).
#   - active: true = live contract (retire-without-delete sets false; CTO amendment).
#   - v1 enforcement is ADVISORY (UNSANCTIONED WARNs, does NOT exit 2) until the CTO ramp-flip.
#
# WAVE STATUS (2026-06-16):
#   [LIVE+RATIFIED] benchmark (SEV1) — Andrew-signed, in-VPC on Nessie main, BOTH axes verified (TO-2b).
#   [AUTHORED, pending CTO+COO] peers (SEV2) — THIS session; clean yang-Lambda producer, Q2-resolvable.
#   [AUTHORED, pending CTO+COO] aum (SEV2) — THIS session; smartx-ingestion-lambda-role (CloudWatch-confirmed
#       live writer 06-16 11:30, MDPF-sourced); smartx-exporter EC2 = dormant dual-writer (stopped since 06-01,
#       Q2-invisible -> declarative forbidden_writers until the 06-17 EC2-WRITES-derive fix). SEV2 ceiling COMPLETE.
#   REMAINING:
#     - headline (SEV1)  — Andrew sign-off; AUA-total surface (MDPF aggregate + account-distribution; $1.71B
#         stale-headline incident history) -> careful value-contract analysis required.
#     - advisor_intelligence/NNA (SEV1) — value-limb authorable; POLICY limb HELD to the 06-17 nightly derive
#         (EC2-produced canonical_writer was Q2-invisible; AE deployed the iam:GetInstanceProfile fix, re-verify
#         pends the nightly). aum's EC2-dual-writer tripwire rides the SAME 06-17 fix.
#     - the period_defs value-check assertion (CVO-owned, §9 homing) — the runnable codified BMKAUD WS-2 check.

contracts:

  # ── SEV1 #1 — the benchmark seed (the BMKAUD-catch; fully worked in the seed brief) ──
  - contract_id: benchmark-model-portfolios
    surface: "critical-surfaces:model_portfolios.benchmark (SEV1) | pipescript:model-portfolios/yang-benchmarks-etf-returns"
    artifact_keys:
      - s3://opal-data-portal-v2/json/benchmarks/model_portfolio_benchmarks.json
      - s3://opal-data-portal-v2/json/benchmarks/benchmark_returns.json
      - s3://opal-data-portal-v2/json/benchmarks/model_portfolio_timeseries.json
      - s3://opal-data-portal-v2/json/benchmarks/etf_returns.json
    canonical_writer: yang-pipeline-lambda-role
    canonical_producer: "yang-model-portfolio-benchmarks (ProcessBothPKLs branch)"
    source_of_truth: "s3://opal-data-portal-v2/benchmarks/data_YYYYMMDD_v1.pkl  # Yang PKL (BMKAUD WS-1)"
    period_defs:
      "1D":  "prior-trading-day -> as-of"
      "WTD": "week-start(Mon) -> as-of"
      "MTD": "month-start -> as-of  (PARTIAL current month)"
      "1M":  "trailing-1-calendar-month -> as-of"   # NOT last-complete-calendar-month = the SmartX violation
      "1Q":  "trailing-3-calendar-months -> as-of"
      "YTD": "year-start -> as-of"
      "1Y":  "trailing-365-CALENDAR-days, TOTAL return (incl dividends)"   # feca94a1f: 365 not 252, total not price
      "3Y":  "trailing-3Y, annualized"
      "SI":  "since-inception, annualized"
      "_rfr_tenor":    "duration-matched per model: UST/ST=1Y, INT=5Y, LTC/LTA=10Y (2c18f0c06)"
      "_return_basis": "TOTAL return (dividends included) + calendar-day arithmetic"
    models: [UST, ST, INT, LTC, LTA]
    forbidden_writers:
      - smartx-model-monthly-pull        # ROOT CAUSE: 1M=last-complete-calendar-month != contract
      - opal-generate-benchmark-returns  # EC2 smartx-exporter generate_benchmark_performance.py, own period-math (dormant dual-writer)
      - smartx-ingestion-role            # latent writer (BMKAUD writer census)
      - news-pipeline-role               # latent writer (BMKAUD writer census)
    enforcement:
      iam_backstop: "DenyNonYangWriteBenchmarks on opal-data-portal-v2/json/benchmarks/* (b1a3543c9)"
      surface_gate: "comp-surface-check SEV1 (model_portfolios.benchmark in critical-surfaces.yaml)"
      value_check:  "period_defs check vs the Yang PKL (codifies BMKAUD WS-2; CVO-owned)"
    ratified_by: [Andrew]                # SEV1 tier (§9) — PENDING Andrew sign-off via COO; do NOT treat as ratified until AE writes with a real ratified_at
    ratified_at: PENDING-ANDREW-SIGNOFF  # AE stamps the authoring Nessie commit hash on in-VPC write, AFTER Andrew sign-off
    active: true
    provenance: "BMKAUD 2026-06-01 (benchmark-yang-truth-audit-20260601.md); revert 80224d674; Deny b1a3543c9; seed 48635a865"

  # ── SEV2 #1 — model_portfolios.peers (peer-universe percentiles + model/benchmark per window) ──
  # Census 2026-06-16 (CVO, comp-kuzu canonical graph HEAD current): producer yang-generate-peer-performance
  # ASSUMES yang-pipeline-lambda-role (SAME canonical_writer as the benchmark seed — both yang-pipeline, Q2-resolvable).
  # Bucket-grain WRITES into opal-data-portal-v2 (~58 Lambda co-tenants); peers has NO known non-canonical writer
  # (no smartx peer override, unlike benchmark's smartx-model-monthly-pull) -> forbidden_writers HONESTLY EMPTY.
  - contract_id: peers-model-portfolios
    surface: "critical-surfaces:model_portfolios.peers (SEV2) | pipescript:model-portfolios/yang-peer-performance"
    artifact_keys:
      - s3://opal-data-portal-v2/json/peers/peer_performance.json
    canonical_writer: yang-pipeline-lambda-role
    canonical_producer: "yang-generate-peer-performance (peer_excel branch; module.generate_peer_performance)"
    source_of_truth: "peer-universe Excel in the uploads/ manifest (peer_excel branch input) for the percentiles + canonical model/benchmark Yang returns for the model+benchmark legs"
    period_defs:
      "1M":  "trailing-1-calendar-month -> as-of"   # SAME BMKAUD-class invariant as benchmark (NOT last-complete-calendar-month)
      "QTD": "quarter-start -> as-of  (PARTIAL current quarter)"
      "1Q":  "trailing-3-calendar-months -> as-of"
      "YTD": "year-start -> as-of"
      "1Y":  "trailing-365-CALENDAR-days, TOTAL return (incl dividends)"
      "Since Inception": "since-inception, annualized"
      "_return_basis":      "TOTAL return (dividends included) + calendar-day arithmetic"
      "_per_period_fields": "{percentiles:{p5,p25,p50,p75,p95}, model, benchmark}"
      "_percentile_source": "peer-universe Excel; the model+benchmark legs MUST agree with the benchmark contract (1M=trailing) = the cross-surface value-check"
    models: [UST, ST, INT, LTC, LTA]
    forbidden_writers: []   # HONEST: no known non-canonical peer writer (no smartx peer override). Catch rests on canonical_writer match + WATCH(advisory, bucket-grain) + the value-limb + bucket policy. A co-tenant only ever reaches WATCH by construction.
    enforcement:
      iam_backstop: "none surface-specific (no peer override observed; no json/peers/* Deny). Bucket policy governs writers; a novel writer -> Q2 WATCH (advisory) + the value_check."
      surface_gate: "comp-surface-check SEV2 (model_portfolios.peers in critical-surfaces.yaml)"
      value_check:  "period_defs check: model+benchmark legs vs canonical Yang returns (1M=trailing-1-calendar-month); CVO-owned"
    ratified_by: [CTO, COO]               # SEV2 tier (§9) — co-signable by CTO+COO (NOT Andrew-gated)
    ratified_at: PENDING-CTO-COO-SIGNOFF  # AE stamps the authoring Nessie commit hash on in-VPC write, AFTER CTO+COO sign-off
    active: true
    provenance: "TO-3 SEV2 wave; producer census 2026-06-16 (comp-kuzu: yang-generate-peer-performance ASSUMES yang-pipeline-lambda-role; bucket-grain WRITES opal-data-portal-v2); lambda-source-map module.generate_peer_performance; served peer_performance.json data_as_of 2026-05-31 (intermittent, peer_excel-gated)"

  # ── SEV2 #2 — model_portfolios.aum (account-distribution + aum-metrics + aum-timeseries) ──
  # Census 2026-06-16 (CVO). DO-NOT-TRANSFER lesson applied: aum is SMARTX-produced, NOT yang.
  # LIVE CANONICAL WRITER DISAMBIGUATED via CloudWatch: at 2026-06-16T11:30:35Z opal-smartx-ingestion-pipeline
  # (smartx-ingestion-lambda-role) logged "MDLP daily re-source job ... all MDPF-feed-sourced; dead-source
  # pipeline skipped" and uploaded account-distribution.json + aum-metrics.json + aum-timeseries.json + per-firm.
  # The smartx-exporter EC2 (i-06ebcb27395eb3f49, ai-supervisor-v2.py writes the SAME keys) is a DORMANT
  # dual-writer: STOPPED since 2026-06-01 (the "dead-source" path) -> it did NOT write today's files. The Lambda
  # is Q2-VISIBLE (has the WRITES edge) so the aum row IS authorable now (unlike NNA). CAVEAT: the EC2 dormant
  # dual-writer is Q2-INVISIBLE (0 EC2 WRITES edges, the NNA-class gap) -> its forbidden_writers tripwire is
  # DECLARATIVE-only until the 06-17 EC2-WRITES-derive fix lands; today its containment = EC2-stopped + IAM + value-limb.
  - contract_id: aum-model-portfolios
    surface: "critical-surfaces:model_portfolios.aum (SEV2) | producer:opal-smartx-ingestion-pipeline (MDLP daily re-source)"
    artifact_keys:
      - s3://opal-data-portal-v2/json/portfolios/account-distribution.json
      - s3://opal-data-portal-v2/json/portfolios/aum-metrics.json
      - s3://opal-data-portal-v2/json/portfolios/aum-timeseries.json
      - s3://opal-data-portal-v2/json/mdpf/49financial/account-distribution.json
      - s3://opal-data-portal-v2/json/mdpf/inflection/account-distribution.json
    canonical_writer: smartx-ingestion-lambda-role
    canonical_producer: "opal-smartx-ingestion-pipeline (MDLP daily re-source job: compute_account_distribution.py + compute_per_firm_account_distribution.py + append_new_dates_only.py); trigger smartx-account-distribution-daily cron(30 11 UTC)"
    source_of_truth: "the MDPF feed (opal-data-mdpf) -- 'all MDPF-feed-sourced' per the 11:30 producer log; the legacy smartx-scrape EC2 source path is DEAD ('dead-source pipeline skipped')"
    period_defs:
      "as_of":       "POINT-IN-TIME snapshot as-of the latest complete business day (period field = the as-of date). account-distribution + aum-metrics are NOT trailing-window metrics."
      "aum_basis":   "total_aum = sum of FUNDED account balances as-of; active_accounts_count vs excluded_unfunded_count demarcated (unfunded EXCLUDED from total_aum) -- the never-widen value invariant"
      "timeseries":  "aum-timeseries.json = append-only by period(date); historical points IMMUTABLE (never-widen on past dates)"
      "_per_firm":   "json/mdpf/{firm}/account-distribution.json mirrors the global schema EXACTLY (49financial + inflection); global json/portfolios/account-distribution.json untouched by the per-firm pass"
    models: [UST, ST, INT, LTC, LTA, "Opal Blend 5050 Int Ltc", "Opal Blend 5050 St Int"]   # served by_model set (codes + 2 blends present in account-distribution)
    forbidden_writers:
      - smartx-exporter-role        # EC2 smartx-exporter ai-supervisor-v2.py dual-write of json/portfolios/* -- DORMANT (EC2 i-06ebcb27395eb3f49 STOPPED since 2026-06-01, the dead-source path). Q2-INVISIBLE (0 EC2 WRITES edges) so this tripwire is DECLARATIVE until the 06-17 EC2-WRITES-derive fix; same gap class as NNA.
    enforcement:
      iam_backstop: "none surface-specific (no json/portfolios/* Deny found). The dormant EC2 dual-writer is contained by the EC2 being stopped + (post-06-17-fix) Q2; a novel Lambda writer -> Q2 WATCH (advisory, bucket-grain) + the value_check."
      surface_gate: "comp-surface-check SEV2 (model_portfolios.aum in critical-surfaces.yaml)"
      value_check:  "point-in-time AUM contract: total_aum = FUNDED-accounts sum as-of latest-complete-day (NOT trailing-window, unfunded EXCLUDED); aum-timeseries append-only (past points immutable). CVO-owned."
    ratified_by: [CTO, COO]               # SEV2 tier (§9)
    ratified_at: PENDING-CTO-COO-SIGNOFF  # AE stamps the authoring Nessie commit on in-VPC write, AFTER CTO+COO sign-off
    active: true
    provenance: "TO-3 SEV2 wave; CloudWatch 2026-06-16T11:30:35Z MDLP daily re-source (opal-smartx-ingestion-pipeline wrote all aum artifacts, MDPF-feed-sourced, dead-source skipped); smartx-exporter EC2 i-06ebcb27395eb3f49 STOPPED since 06-01 (dormant dual-writer); smartx-ingestion-lambda-role Q2-visible; served account-distribution.json/aum-metrics.json period=2026-06-15"
