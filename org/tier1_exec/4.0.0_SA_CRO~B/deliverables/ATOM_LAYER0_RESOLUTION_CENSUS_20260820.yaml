    line or line range. Multiple anchors are read together and compared.
  o1_shorthand_expansion: >-
    O1 results row N means line N of
    org/tier1_exec/4.0.0_SA_CRO/deliverables/
    O1_RESOLVES_VIA_RESULTS_20260819.jsonl as present at read_vintage.
