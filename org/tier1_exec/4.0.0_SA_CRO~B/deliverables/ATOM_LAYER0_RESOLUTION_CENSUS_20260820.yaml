integration_interface:
  consumer: future_4.0.0_SA_CRO_tilde_C
  input_selector: rows[] where assessment_state equals ASSESSED
  mapping_to_atom_layer0_run:
    concept_name: row.concept
    claimed_layer: population_artifact.surfaces[row.surface].role
    authority_and_binding_reads: row.evidence under rerun_contract
    resolution_start_state: row.resolution_state plus row.failure_classes
    routing_candidate: row.owner
    observation_vintage: read_vintage
    proving_priority: display_verdict precedence then smallest evidence span
  no_hand_translation: >-
    The consumer parses this YAML and selects a row object directly. Unknown
    consumers of the concept are discovered by atom_layer0 S0; they are not
    guessed into the census row.
  row_schema_rule_24:
    declared_layer: one machine-consumable census finding row
    required_fields: [id, surface, concept, assessment_state, resolution_state, failure_classes, display_verdict, evidence, owner]
    optional_fields: [direct_read, known_residual, note]
    mece: PASS_each_field_has_one_non_overlapping_record_purpose
    same_grain: PASS_all_fields_describe_one_surface_x_concept_binding
    intent_coherence: PASS_one_rerunnable_and_routable_finding_record
    state_coherence: PASS_fields_version_and_rerun_as_one_row
    token_hygiene_at_read_vintage:
      corpus: infra/system/ontology/** plus org/modules/graph/**
      word_boundary_counts: {id: 2459, surface: 1097, concept: 111, assessment_state: 0, resolution_state: 0, failure_classes: 0, display_verdict: 0, evidence: 658, owner: 204}
      adjudication: >-
        The four compound field names are unoccupied. Generic record words are
        intentionally reused as local YAML keys, not minted as ontology terms;
        their row-schema meanings are fixed by this interface.

rule_24_record:
  finding: >-
    The supplied starting taxonomy flattened three axes: traversal/assessment
    state, binary resolution state, and failure mechanism. It is retained only
    as a deterministic display mapping after splitting those axes.
  axes:
    assessment_state:
      intent: whether the row received an evidence-bearing evaluation
      grain: one surface_x_concept binding
      values: [ASSESSED, NOT_ASSESSED]
      postulates:
        mece: PASS_exactly_one
        same_grain: PASS
        intent_coherence: PASS
        state_coherence: PASS_same_evaluation_stage
    resolution_state:
      intent: whether an assessed binding satisfies the resolution predicate
      grain: one assessed surface_x_concept binding
      values: [RESOLVED, UNRESOLVED]
      postulates:
        mece: PASS_exactly_one_for_every_assessed_row
        same_grain: PASS
        intent_coherence: PASS
        state_coherence: PASS_re_evaluation_moves_either_state
    failure_classes:
      intent: mechanism by which an assessed unresolved binding fails
      grain: one failed property on one surface_x_concept binding
      cardinality: zero_or_more; multi_label_not_an_outcome_array
      values:
        - UNRESOLVED_NO_AUTHORITY
        - DANGLING
        - GOVERNED_DUAL_CARRIER
        - AMBIGUOUS_TWO_HOMES
        - CONTENT_MISMATCH
        - GRAIN_MISMATCH
        - CODE_REDECLARATION
        - SUPERSEDED_UNBANNERED
        - NO_DECLARED_TARGET_CONTENT
        - NON_INDEPENDENT_RESOLUTION
        - INSTRUMENT_UNKNOWN
        - NOT_EXERCISABLE
      postulates:
        mece: NOT_APPLICABLE_multi_label; precedence_produces_one_display_verdict
        same_grain: PASS_each_label_is_one_failed_binding_property
        intent_coherence: PASS_failure_mechanism_only
        state_coherence: PASS_all_exist_post_assessment_and_clear_only_on_reassessment
      two_home_discriminator:
        GOVERNED_DUAL_CARRIER: >-
          Multiple carriers are authorized by ruled design, authority or
          precedence is explicit, and a live comparison instrument covers the
          carriers. On an unresolved row this class means that instrument has
          detected extant drift; it does not mean the carriers are ambiguous.
        AMBIGUOUS_TWO_HOMES: >-
          Multiple independently editable authority claims lack the ruled
          dual-carry relation, precedence, or covering comparison instrument.
          An unauthorized member-list copy is not made governed merely because
          the same entry also contains a healthy authority citation.
        postulates:
          mece: PASS_one_and_only_one_class_for_every_observed_two_home_row
          same_grain: PASS_one_surface_x_concept_binding
          intent_coherence: PASS_governance_discriminator_only
          state_coherence: PASS_reclassification_requires_new_binding_evidence
  display_verdict_precedence:
    - AMBIGUOUS_TWO_HOMES
    - GOVERNED_DUAL_CARRIER
    - CODE_REDECLARATION
    - DANGLING
    - UNRESOLVED_NO_AUTHORITY
    - GRAIN_MISMATCH
    - CONTENT_MISMATCH
    - SUPERSEDED_UNBANNERED
    - NO_DECLARED_TARGET_CONTENT
    - NON_INDEPENDENT_RESOLUTION
    - INSTRUMENT_UNKNOWN
    - NOT_EXERCISABLE
  display_mapping: >-
    NOT_ASSESSED when assessment_state is NOT_ASSESSED; RESOLVED when assessed
    and resolved; otherwise the first present failure class in precedence order.
  layer_coverage_additions_to_starting_taxonomy:
    - GOVERNED_DUAL_CARRIER
    - NO_DECLARED_TARGET_CONTENT
    - NON_INDEPENDENT_RESOLUTION
    - INSTRUMENT_UNKNOWN
    - NOT_EXERCISABLE
  token_hygiene_at_read_vintage:
    corpus: infra/system/ontology/** plus org/modules/graph/**
    word_boundary_counts:
      RESOLVED: 113
      UNRESOLVED_NO_AUTHORITY: 0
      DANGLING: 1
      GOVERNED_DUAL_CARRIER: 0
      AMBIGUOUS_TWO_HOMES: 0
      CONTENT_MISMATCH: 0
      GRAIN_MISMATCH: 0
      CODE_REDECLARATION: 0
      SUPERSEDED_UNBANNERED: 0
      NOT_ASSESSED: 0
    collision_adjudication: >-
      RESOLVED is an existing ordinary result token and is intentionally reused
      at the same outcome sense. The sole DANGLING hit is a DATA-EDGE-DANGLING
      comment in comp_aws_cli.py and is not this binding-failure enum.
      GOVERNED_DUAL_CARRIER is unoccupied and minted here for Base's adjudicated
      governed-versus-ungoverned discriminator.

