  # ===== VERDICT tools (a contracted nonzero is an ESTATE-VERDICT, not a tool crash) =====

  comp-blast:
    coverage: "the CANONICAL KUZU resource graph (~20,480 CloudNode / ~40,945 CloudEdge) -- all of AWS plus the GIT code plane and MS_CLOUD -- overlaid with the blasted SUBJECT's worktree-derived edges"
    address_space: "kuzu_nessie_db CloudNode/CloudEdge (estate) + a subject-scoped working-tree overlay (mid-edit, uncommitted included)"
    universe_change_20260803: >-
      ANDREW-DIRECT RULING (ANDREW_RULING_projections_default_kuzu_full_graph_20260803.md, verbatim:
      "all projections should by default be kuzudb full resource graph ... Comp-blast absolutely
      should cover all of AWS"). comp-blast previously built a PRIVATE trace graph at invocation --
      2,255 nodes / 2,950 edges / ~35s cold, carrying exactly FOUR S3_BUCKET nodes. `comp-blast
      opal-data-mdpf`, a real production bucket with live consumers verified the same session,
      returned NOT-FOUND while comp-kuzu resolved it. The full graph existed, was fresh, and knew the
      answer; the projection did not ask it. A private universe is not a smaller answer, it is a
      CONFIDENT WRONG ONE -- on a Rule-20 change-safety gate a NOT-FOUND reads as "nothing breaks".
      The ONE property worth keeping was invocation-time head-pinning, which survives as a
      subject-scoped OVERLAY (seconds, one file) rather than a whole private universe (35s,
      everything). Cold path IMPROVED: ~2.5s vs ~35s.
    declared_exceptions:
      - "NONE. The interim exception (--compare / --overlap-sweep / --all-producers reading the private trace graph) was DISCHARGED 2026-08-04: all three now run on the canonical graph narrowed to a DECLARED TERRITORY. CTO arch call: the problem was never private-vs-canonical, it was that THE POPULATION WAS DEFINED BY WHATEVER THE PRIVATE CACHE HAPPENED TO CONTAIN -- not a definition at all -- and a naive re-base to all 20,480 nodes would have traded an undefined population for a wrong one."
    declared_territory:
      predicate: "a node with >=1 outbound edge of type WRITES|WRITES_S3|PROJECTS_TO|TRIGGERS|SFN_INVOKES|S3_INVOKES|EVENT_INVOKES|SNS_INVOKES"
      basis: "ROLE-derived, not TYPE-derived. A node_type allowlist would re-encode the same accident in new names -- still a list someone chose. Role membership is a property of the GRAPH, self-maintaining as the estate changes, and it matches what the metric measures (overlap of what two things WRITE)."
      grain_rule: "function-grain node_types = PipelineFunction|Hook|DataFetch (kuzu has no function_name field; the retired universe read grain off one)"
      emitted: "The DEFINITION is printed on every statistical run -- predicate + grain rule + selector + N -- never a label. A score without its population is not a weak number, it is an uninterpretable one. (CTO acceptance term T1.)"
      not_comparable: "SCORES ACROSS POPULATION DEFINITIONS ARE NOT COMPARABLE -- a score over a different population is a different statistic wearing the same name. Nothing persists comp-blast overlap scores (verified: computed-and-printed only; debtscan dups_latest.json is dup_scan's output, not comp-blast's), so the T2 invalidation was a no-op HERE -- scoped to what was actually searched, not claimed as a universal absence. (CTO acceptance term T2.)"
      declared_tradeoff: "Membership moves when extraction coverage moves. That is why N is emitted: a change in N between runs is a FINDING about coverage, not noise to absorb."
    blind_spots:
      - "dynamic / FUNC-key consumers are INVISIBLE (the comp-pipescript dynamic-key miss class) -- 'zero dependents' is 'no EXTRACTED edge', NOT provably no consumer"
      - "kuzu trails the live estate (02:00Z full re-derive + CloudTrail incremental); the overlay covers ONLY the blasted subject's own edges, so a mid-edit change to a DIFFERENT file is not reflected"
      - "a subject with no worktree file (an S3 bucket, an IAM role) has NO overlay -- reported as scope=none, never as a silent empty overlay"
    failure_direction: "REFUSE, never guess -- an unresolvable subject exits 3, an ambiguous one exits 5, and an unreachable graph exits 1. comp-blast NEVER falls back to a private scan (a silent fallback re-creates the defect this rebase removed, invisibly)."
    plane: projection
    grain: field
    scope: estate
    vintage: "DUAL, always printed: the comp-kuzu provenance block (snapshot-id + build age + per-table vintage) AND a worktree overlay line (HEAD short-sha + dirty flag + subject-file count + content digest). A single-vintage answer is a P3 conformance failure."
    exit_codes:
      "1": {class: failure, meaning: "THE TOOL FAILED, AND ONLY THAT -- usage error, uncaught crash, or the canonical graph unreachable. NEVER a finding about the estate (CTO 20260709T195217Z)"}
      "2": {class: verdict, meaning: "graph STALE -- freshness probe (--check)"}
      "3": {class: refuse,  meaning: "NOT-FOUND: query did not resolve to a node -- nothing was traced, so nothing is concluded (input-resolution refusal, NOT a clean 'nothing-downstream')"}
      "4": {class: verdict, meaning: "phantom / orphan consumer found (a real finding about the estate) -- evaluated over dependents in BOTH directions, so no display flag can manufacture it"}
      "5": {class: refuse,  meaning: "AMBIGUOUS-SUBJECT: the query matched multiple nodes and comp-blast REFUSED to pick one. The nodes EXIST (so not 3) and no answer was given (so not 0). Re-run with an exact node id."}
    defects_fixed_20260803:
      a: "cp1252 UnicodeEncodeError (28 of 2,255 nodes measured, 20 of 2,252 on 07-31). ROOT: nerves-risk-edges.json stores non-ASCII JSON-ESCAPED, so the FILE scans as pure ASCII while json.load decodes real arrows into the claim prose _render_risk prints. The failing nodes were the RISK-BEARING ones, so the crash silenced HOLD warnings on the most dangerous files in the estate. Fixed at the EMISSION BOUNDARY (blast_universe.ascii_safe), not in the data -- the corpus is harvested from commit prose, so non-ASCII is a permanent inflow and a data edit would re-break on the next harvest."
      b: "`--direction up` inverted `--check-consumers` into a FALSE PHANTOM. Measured: gold:A_00.accounts_dimension (143 real consumers) returned rc=0 CONSUMER-OK by default and rc=4 PHANTOM-CONSUMER with --direction up -- and grounding_lib maps rc=4 to deletion evidence. The verdict is now evaluated over the full dependent set in BOTH directions; direction governs DISPLAY only."
      c: "substring find_node + matches[0] answered about a DIFFERENT node at rc=0. Measured: `comp-blast load_accounts_dim` returned a full answer about gold:B_01.holdings_lots:load_accounts_dimension -- different function, different script -- while the exact node existed among 17 matches, with nothing saying a choice had been made. Resolution is now exact-id -> colon-suffix -> exact-segment -> substring, and ANY ambiguous tier refuses with rc=5."
      d: "upstream traversal hid FETCHES callers. PROVEN not assumed (the spec asked): this did NOT dissolve under kuzu. endpoint:getPlatinumPartnerAnalytics has EIGHT upstream callers via FETCHES and ZERO downstream; the old default computed upstream only for function-grain GOLD_SCRIPT, a node_type that existed only in the retired universe, so under kuzu the default hid every caller in the estate -- and with defect (b) would have called that live endpoint an orphan. The default is now bidirectional, because this graph MIXES edge conventions: WRITES points producer->artifact (consumers downstream) while CALLS/FETCHES/READS point consumer->producer (consumers upstream)."
    exit_source: "org/modules/graph/cli.py:502,632 (phantom rc4 via EXIT_PHANTOM_CONSUMER), :199,202 (stale rc2), :263,568,790 (NOT-FOUND rc3) @2026-07-31"
    exit_code_change_20260731: >-
      The phantom verdict MOVED 1 -> 4. It had been sharing rc=1 with usage errors and with uncaught
      crashes, so three unrelated events were indistinguishable to any caller keying on rc -- measured
      2026-07-31: crash (UnicodeEncodeError, 20 of 2252 nodes), `--direction sideways` (usage), and a
      real zero-consumer finding ALL returned 1. The collision was load-bearing, not cosmetic:
      comp_debt/grounding_lib.py keyed `returncode == 1` to GRAPH_ZERO_CONSUMER, so A CRASH WAS
      LAUNDERED INTO EVIDENCE THAT A RESOURCE HAS NO CONSUMERS -- deletion evidence, on the one axis
      where being wrong is irreversible. rc 1 now means only "the tool failed"; the CONSUMER-OK /
      PHANTOM-CONSUMER marker strings are unchanged and remain the stable thing to key on.
    rebaseline_note: "the 39 historical rc3 rows were mis-classified FAIL by the frozen set (comp-blast was absent from it); they are REFUSE -- a named phantom that did not resolve, not a tool failure."

