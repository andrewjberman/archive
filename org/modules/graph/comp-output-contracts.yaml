  # ---- TRUNCATION CONVENTION (tool-wide; comp-estate = reference implementation, Andrew-ratified
  # 2026-07-30) ---- The --head N contract: modes DECLARE structure (body rows vs verdict/denominator
  # footer -- no heuristics); under --head the first N body lines print, then the self-declaring
  # marker `[TRUNCATED --head: showing N of M body lines; verdict/denominator follow|end of output]`
  # (stdout + ONE stderr copy, pipe-survivable), then the footer ALWAYS prints. Rationale: naive
  # unix-head truncation is verdict-destroying and silent -- every comp-estate mode prints its
  # verdict LAST, so `| head` removes exactly the lines that prevent a truncated worldview being
  # mistaken for the whole one. Rules: default bare --head = 50; --json output is NEVER truncated
  # mid-object (a future --json mode leaves the pager unarmed + one stderr note); unarmed = pure
  # pass-through (byte-identical, regression-checked over 10 modes at build). Rollout: other
  # comp-tools adopt AS TOUCHED (no fleet retrofit sweep); pager helpers live in
  # estate_infrastructure_cli.py (set_head/body/footer/close_pager).
  comp-estate:
    coverage: "the Opal world model: C4 segments (stable canon) -> C3 systems -> chains (thread-model plane, resolver snapshot) -> live S3-key derivation (key plane, repo source); plus stable canon serving (--layers ladder doc, --definitions term registry) and the L3 census set-diff (--census-drift, tf/aws planes). --head N = verdict-preserving truncation per the convention block above (marker + footer always; unarmed = byte-identical)"
    blind_spots:
      - "DEPLOYED-plane divergence invisible: key plane reads the repo working tree, never live AWS artifacts -- the bridge, comp-kuzu canonical is the destination (printed in every banner)"
      - "thread-model layer rides the resolver whose underlying lambda census is FROZEN at 2026-06-15 -- run --census-drift for the live set-diff; the tool prints staleness, it cannot repair it"
      - "reachability verdicts are CVO ground-truth adjudications at review time, not live probes"
    plane: desired
    grain: artifact
    scope: estate
    vintage: "banner line 1 every invocation: resolver last_review + run timestamp; --segments/--definitions print their stable-canon source + version"
    exit_codes:
      "1": {class: verdict, meaning: "honest miss -- e.g. --definitions term not in the registry (denominator printed); NOT a tool error"}
      "2": {class: refuse, meaning: "fail-loud: source unresolvable (snapshot absent/corrupt/no-vintage), stable canon unreadable, or a tombstoned-name refusal"}
      "3": {class: refuse, meaning: "--census-drift broken retrieval (taxonomy unloadable or empty live set) -- refuses to diff against nothing"}
    exit_source: "org/modules/graph/opal_estate_infrastructure.py (renamed from opal_business_estates.py 2026-07-30, Andrew-direct consolidation) _fail_loud + cmd_definitions + cmd_census_drift -- DECLARED BY EXERCISE 2026-07-30 (every mode run this session: news/list/resource/tool/debt/fe/validate/gate-b/segments/layers/definitions/census-drift/drift/self-test), per the declare-by-exercise law (a guessed contract renders confident wrong verdicts silently forever)"

