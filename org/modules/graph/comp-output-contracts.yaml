# comp-output-contracts.yaml -- THE OUTPUT CONTRACT (NFRA_MSBEFF.R1R3, 2026-07-23, 0.8.0_AE_CloudComp)
#
# ONE declaration surface, consumed by N tools (gate condition c). Every comp-tool answer draws its
# COVERAGE line (R1: the denominator scanned + what it structurally CANNOT see) and its PLANE/VINTAGE
# header (R3: DESIRED-vs-APPLIED / source-vs-projection / graph vintage) from here, and the appender's
# VERDICT/REFUSE classification (M3) is DERIVED from the exit_codes blocks below -- no frozen list.
#
# >>> THIS IS NOT A CURATED SUBSET. <<<  comp-tools.yaml carries a deliberate SUBSET of the tool
# population BY DESIGN (its own header says "Do NOT count tools from this file"; the true count is the
# gate's, never a digit frozen here) -- and naming it as the derivation source is exactly the
# defect this TO closes (it was named by three independent agents INSIDE the TO about that defect; ratified
# correction to tools_index, MSTR 172141Z, main CTO accepted-in-full no re-gate). THIS file is the OPPOSITE:
# it is ENFORCED-COMPLETE against tools_index by comp-manifest-check's output-contract invariant -- every
# tools_index tool MUST appear in `contracts:` OR `pending_declaration:` OR the commit BLOCKS (condition a:
# a tool cannot register/re-register without declaring its coverage+plane+exit semantics). So the denominator
# here is not curated, it is gate-guaranteed census-grade -- the same enforced-complete pattern the
# DISK-IMPLIES-REGISTERED member already applies to comp-coverage-map.yaml.
#
# UNKNOWN IS NOT A VERDICT (condition b): a tool in `pending_declaration:` (or absent entirely -- caught by
# the invariant) renders its coverage/plane line as a LOUD "UNKNOWN (no output contract declared)", and its
# nonzero exits classify as UNKNOWN, never a silent omission and never a defaulted PASS/FAIL. There is no
# channel for "I don't know," so not-knowing must render AS not-knowing.
#
# SUPERSESSION HISTORY (condition c -- so the next reader does NOT re-freeze this):
#   This exit-code derivation is the FIX-OF-A-FIX-OF-A-FIX. Lineage of the denominator-is-its-own-config class:
#     1. M2 (CTO~Z): a census read the wrong artifact.
#     2. CVO~Z: a census read 2 of 3 mapping surfaces.
#     3. The appender's FROZEN VERDICT_EXIT_TOOLS set (comp_log_auto.py) -- itself the fix for a prior
#        nonzero->FAIL blanket miscount (358+59 rows). A frozen set is a hand-maintained denominator; it
#        drifts from the source contracts silently. The 07-08 freeze + the 2026-07-23 INTERIM +3 (@b62b3a894)
#        were both correct-at-the-time hand-patches OF that frozen set.
#     4. This TO's OWN first spec named comp-tools.yaml as the derivation source -- a curated subset -- in the
#        TO whose subject is that exact class. Caught by the TO's phase-1 if_mismatch clause BEFORE code
#        (0.8.0_AE 171436Z); re-ruled to tools_index (CTO~Z 171543Z); RE-PLANED AGAIN here to an
#        enforced-complete sidecar so the ratified tools_index vocabulary stays byte-untouched.
#   The fix is DERIVATION FROM SOURCE CONTRACTS + a completeness gate, NOT a better-maintained frozen list.
#   Do not re-freeze a verdict set anywhere. If you add a tool, declare it HERE; the gate will make you.
#
# GROUNDING: every exit_source is a file:line confirmed at HEAD 2026-07-23. A line citation without a vintage
# resolves to different code at different vintages (CLAUDE.md Rule 22) -- re-confirm on any material edit.

version: 1
# VINTAGE HONESTY (corrected 2026-07-30, Andrew-flagged): `last_reviewed` is NOT the file's edit
# vintage -- git log is the ONLY edit record (hand-maintained "last updated" fields are the
# frozen-digit class: this one read 07-23 while carrying 07-30 edits from three sessions).
# The field below marks the last FULL R1R3 review pass over every entry; per-entry edits since
# ride git authorship (E4.2 kind: vocabulary + comp-estate contract + truncation convention all
# landed 2026-07-30 without a full-pass re-review).
last_full_review_pass: 2026-07-23 (0.8.0_AE_CloudComp, the NFRA_MSBEFF.R1R3 authoring pass)
owner: 0.8.0_AE_CloudComp   # R1R3 deliverable owner; the surface is ANY_EXEC_OR_AE (.owned-paths) -- edits ride git authorship
enforced_complete_against: graph-call-manifest.yaml::tools_index
enforcing_gate: comp-manifest-check (output-contract completeness member)

# ---------------------------------------------------------------------------------------------------
# plane vocabulary:   source | projection | desired | applied | live | mixed | graph-cache
# vintage vocabulary: free text -- name the artifact + how it is dated (or "n/a -- computed live")
# exit_codes[rc]:     shorthand `pass` | `fail` | {class: verdict|refuse|pass|fail, meaning: "..."}
#                     rc "0" defaults to pass; a listed nonzero classifies that rc; an UNLISTED nonzero on a
#                     DECLARED tool -> fail (an unexpected exit for a contract we know IS a failure).
#   optional `kind:`  ONLY on a fail-class exit (E4.2, NFRA_VELOCITY_ESTATE WS-E4.2, 2026-07-30):
#                     `usage` | `finding` | `negative_control`. It separates the FAIL column's three
#                     meanings IN THE MACHINE RECORD -- (a) a deliberate negative-control probe, (b) a caller
#                     usage error, (c) a genuine estate finding -- because one FAIL token conflates three
#                     things with different owners and OPPOSITE SIGNS: more (a) is BETTER, so a rising FAIL
#                     count is currently indistinguishable from better negative-controlling.
#                     A fail-exit with NO `kind:` renders `kind_undeclared` -- LOUD, bounded, and visible in
#                     `comp_output_contract.fail_kind_coverage()`, exactly like `pending_declaration:` above.
#                     It is NEVER defaulted into one of the three. DO NOT guess a kind to make the tail
#                     shorter: a plausible-but-wrong bucket is worse than an honest unknown, because it
#                     answers the improvement question confidently and wrongly.
#                     `negative_control` is normally supplied at RUN time by COMP_SYNTHETIC_FIXTURE=1 rather
#                     than declared here (a probe is a property of the invocation, not of the exit code).
# ---------------------------------------------------------------------------------------------------

contracts:

  comp-atomcheck:
    coverage: 'One verdict row per product-archetype atom, per product x firm, over the enum CONFORMS /
      VIOLATES / NOT-CHECKABLE-BY-THIS-RUNNER. v1 checks SIX legs: atom 1 product-root grammar, atom 3
      manifest coverage (BOTH the partition-local manifest.json and the _manifests/{data-as-of} sidecar
      conventions, resolved at scope+table+date grain), atom 5 schedule FLOOR only, atom 7 gold SPELLING
      only, atom 8 lineage-declaration COVERAGE only, atom 9 provenance columns. Read-only by construction:
      boto3 in-process GET/LIST + describe/list, zero write calls, and never a monitor.'
    blind_spots:
      - 'ATOMS 2, 4 and 6 ARE NOT CHECKED AT ALL, and neither are the RESIDUE HALVES of atoms 5
        (one-producer-per-key / one-runtime) and 7 (serve-only-via-publisher). They render
        NOT-CHECKABLE-BY-THIS-RUNNER with a stated why and can NEVER render CONFORMS. A NOT-CHECKABLE row
        is an honest absence, not a pass -- reading it as a pass is the primary way to misuse this tool.'
      - 'THE RESIDUE DOES NOT MOVE WITH ONE REMEDY (Rule 24(iv)): atoms 2/5/7 share ONE missing instrument
        (a producer/writer census over code+IAM); atom 8s residue is a DECLARATION artifact awaiting the
        emitting lane; atoms 4/6 are static-analysis depth. Building any one does not deliver the others.'
      - 'ATOM 8 CHECKS COVERAGE, NEVER VERACITY. That a served field is DECLARED to trace to an endpoint is
        checked; that it REALLY does is a human/CVO read this runner cannot make. With no lineage
        declaration for a family the atom renders NOT-CHECKABLE, never CONFORMS.'
      - 'PER-LEG DENOMINATORS ARE AT DIFFERENT GRAINS and must never be summed: atoms 1/3 count PARTITIONS
        and KEYS, atom 8 counts FIELDS, atom 5 counts RULES and SCHEDULES. The declared grain below is the
        grain of the VERDICT ROW, not of every denominator inside it.'
      - 'A PRODUCT ROOT UNDER ACTIVE WRITE MOVES BETWEEN READS. Measured 2026-08-25 on the 49F root: the
        partition denominator moved 2193 -> 5705 -> 8274 -> 8361 across four reads in about eight minutes
        during a live backfill. Every figure is true of the stamped provenance instant and of nothing else;
        quoting one as a standing denominator is a defect in the READER, and the header exists to prevent it.'
      - 'The archetype grammar, declared scopes and floor name-patterns are CONFIG, not discovery. A scope
        the estate uses but nobody declared renders VIOLATES rather than being absorbed -- deliberately, so
        that a grammar tuned to the estate it measures cannot silently become one that can never fail.'
      - 'Only products present in the PRODUCTS registry are analyzable; any other product exits 2 UNCOVERED
        and is explicitly NOT reported as conforming.'
    plane: mixed
    grain: artifact
    scope: estate
    vintage: 'live AWS control-plane + live S3 listing at run time, stamped in a UTC provenance header on
      every run; repo-side declarations (lineage, ratified exceptions, served census) read at HEAD on disk'
    exit_codes:
      '2':
        class: verdict
        meaning: 'UNCOVERED -- unknown product/firm, or the product root could not be listed. NOT analyzed:
          not conforming, not violating, UNVERIFIED.'
    exit_source: 'atomcheck_cli.py main() (2=UNCOVERED). ⛔ THE VERDICT IS IN THE ROWS, NOT THE EXIT CODE:
      a run that reports VIOLATES still exits 0, so an rc-only consumer reads a clean pass over a violating
      estate. READ THE ROWS. Same failure shape comp-validate already carries (PASS/WAIVED vs NO_CONFIG).'

  comp-lease:
    coverage: 'ONE subject per call. `evaluate <closure.json>`: the full coordinate set (five support-member
      identities + the knowledge basis) is COARSE-INTERSECTED with OVER-inclusion enforced (a declared set
      that under-includes is REFUSED); typed exclusion proofs replayed; residual recomputed; policy applied;
      the evaluation record always carries BOTH effect_as_recorded and effect_as_evaluated. `state <lease.json>`:
      all five support identities re-read live and the partition tree computed fresh -- state is never stored.
      Denominators print per run: identities re-read (5), intersecting/residual coordinates, capped axes.'
    blind_spots:
      - 'A lease binds the five VINTAGE COORDINATES of one closure -- it does NOT re-run the closure''s member
         byte-compares or home census: a change that moves none of the five identities (impossible for code
         today, but stated) is invisible to `state`; recompile the closure for a fresh identity set.'
      - 'repo_head is COMMIT-GRAIN on a shared multi-agent worktree: ANY peer commit moves it, so leases expire
         within minutes of minting during active hours. That is honest (the closure''s HEAD-side identities
         genuinely changed), not noise -- but a consumer wanting a coarser support grain needs a ratified
         predicate waiver (e.g. scope: paths-disjoint-from-subject), never a silent tolerance.'
      - 'The one-per refusal (m4) is PROCESS-LOCAL today (an in-memory seen-set per run); cross-session
         duplicate evaluations are caught only by their digest-derived equal ids colliding at the artifact
         store, not by the constructor. Declared, not fixed silently.'
      - 'Null basis members CAP their governed axes at UNKNOWN and the lease NAMES them -- a VALID lease is a
         claim about the SUPPORT-IDENTITY axes only; reading it as validity on a capped axis is a consumer
         error the record''s own text warns against.'
      - 'EXPIRED is not INVALID: INVALID is an evaluation''s result; EXPIRED means the minting evaluation no
         longer binds (out of scope, not out-ranked; CRO D1 ruling). A consumer collapsing them re-fuses the
         axes the partition tree separates.'
    plane: applied         # live side re-reads (source map + get-function + git HEAD) at evaluate/state time
    grain: artifact        # one closure / one lease per call
    scope: single-artifact
    exit: '0 = evaluation/state produced (read result/state + reasons, never rc alone) | 2 = REFUSED (typed:
      m2 under-inclusion, m3 old-waiver, m4 duplicate, m5 untyped silence, unknown argument) | 1 = ERROR
      (an acquisition the envelope could not wrap, a non-reproducing minted basis digest -- never a clean lease).'
  comp-closure:
    coverage: 'ONE subject per call: for `compile <lambda>`, the source-map entry (DECLARATION) + its artifact
      pointer (ARTIFACT_POINTER, UNKNOWN when absent -- the chain continues on source_dir+files[]) + the live
      package (DIGEST: get-function CodeSha256 + every zip member) + EVERY declared member compared to repo bytes
      at last_deployed_commit AND HEAD (BYTES) with a HEAD-tree home census per member (exact blob identity +
      non-generic same-basename at similarity >= 0.5) + the EXECUTION hop (NOT_ATTEMPTED for Lambda -- no invokes).
      `ec2-fixture` replays the census''s recorded staged/on-box/repo hashes. Denominators print per run:
      members compared, homes found, observations emitted (all envelope-valid).'
    blind_spots:
      - 'A Lambda closure NEVER reaches BEHAVIOR tonight: no executing read is taken (read-only bound), so
         reach=PRESENCE_ONLY is BY CONSTRUCTION and says nothing about what RUNS (an invoke, a runtime log or
         an on-instance read is the only way up -- and the constructor refuses the label without one).'
      - 'Shape D entries (files[] empty) resolve by directory+basename -- DECLARED WEAKER; cannot yield EQUIVALENT.
         Shape C (transformed builds) does not byte-compare members at all: identity rides live.CodeSha256 ==
         artifact_sha256; if the digests differ the tool says UNMEASURED, never DIVERGENT-by-bytes.'
      - 'The ambiguity predicate sees HEAD only (a second home that existed at the deploy commit and was since
         deleted is invisible) and counts only exact-bytes or similarity>=0.5 same-basename files -- a renamed
         copy (different basename, drifted content) is a home it cannot see; generic entry-point names never
         count by name alone, so a genuine second handler.py copy is found only by exact bytes.'
      - 'standing=INVALIDATED is produced ONLY by `verify` over an already-compiled closure -- a freshly compiled
         closure cannot be INVALIDATED, so `compile` alone never tells you a side moved since last time.'
      - 'The EC2 path is a FIXTURE: it replays NFRA_DEPLOYCENSUS recorded reads (2026-08-18) and says so on every
         surface; it does not read any instance live. Staged = DESIRED and may be inert; only an on-instance
         read is APPLIED truth (Rule 22a).'
      - 'The source map is a BUILD INPUT read, never validated or rewritten here: an entry pointing at the wrong
         home surfaces as AMBIGUOUS/DIVERGENT, not as a map error.'
    plane: mixed           # source (repo bytes at two commits) + applied (live get-function + package) -- the closure is the join
    grain: artifact        # one Lambda / one EC2 service per call; members are sub-artifacts of it
    scope: single-artifact
    exit: '0 = closure compiled and written (read the reach/standing/equivalence TRIPLE, never rc) | 1 = compiler
      ERROR (an acquisition the envelope could not wrap, or envelope validation failed -- never a clean closure)
      | 2 = REFUSED (unknown argument/flag, missing target, ec2-fixture rows not in list form).'
  comp-directives:
    coverage: 'EVERY top-level `directives:` row of the live register (org/missions/DIRECTIVES.yaml,
      path = the register owner MSTR''s word) + EVERY row of the retired view (DIRECTIVES_RETIRED.yaml),
      parsed text-surgically by the `  D<n>:` row opener. `retire` scans every live row for a COMPLETE
      human-written `retired: {at, by, authority}` record; `check` evaluates PARTITION + CONSERVATION +
      FORM + FREEZE over both views. Live/retired/ever_minted row counts print on every run.'
    blind_spots:
      - 'A row that does not open with the `  D<n>:` shape (a differently-keyed id, a row at another
         indent) is INVISIBLE to the scan -- the tool counts rows it recognizes, and prints that count,
         so a roster drift shows as a count drop, not as silence.'
      - 'CONSERVATION is EMIT-MAINTAINED: ever_minted learns a new live id only at the next successful
         `retire` emit. A live row added and then deleted BETWEEN two emits is not a conservation
         failure here -- git history is the oracle for that class, not this check.'
      - 'FORM checks the tripwire mechanically (reference-only members, no globs/attach, complete
         records); it does NOT judge whether a referenced sub-group/project id actually EXISTS -- that
         is the register owner''s reading protocol, not this tool''s.'
      - 'FREEZE proves the retired BYTES are unchanged (per-row sha256 + whole-file emit_hash); it
         cannot know whether the FACT that put a row there was correct -- the fact is human/sovereign,
         cited, and outside the machine''s competence by design.'
      - 'The hook fires only on commits that touch a register view; a register edited but not committed
         is checked only by a manual `check`.'
    failure_direction: 'FAILS CLOSED toward refusal: a PARTIAL record cuts nothing (rc 2, loud); a
      violated invariant is rc 2 with every violation printed; a tool error is rc 1, never a silent
      green. The dangerous misreading is a CLEAN check after a row was hand-deleted from BOTH views
      before any emit recorded it (see conservation blind spot) -- a count drop, not an absence.'
    plane: source          # reads/writes the working-tree register files (canon token; the register is a source-plane artifact)
    grain: artifact
    scope: single-artifact # ONE register (live view + its retired partition) -- never the estate
    vintage: 'reads both views live at call time; a retired row is FROZEN at its stamped
      retired_vintage (closed-period-immutable -- no TTL aging on a closed judgment).'
    exit_codes: '0 = invariants hold / emit done (including a measured no-op) | 2 = VIOLATION or
      REFUSAL (partial record, partition breach, unknown argument -- every one printed, nothing
      written on refusal) | 1 = tool error (cannot evaluate; never reported as clean).'

  comp-grep:
    coverage: 'EVERY line of EVERY file in the .gitignore-aware repo file set for the given pathspec
      (git ls-files cached+others --exclude-standard, RECURSED into nested repos such as portal), matched
      with python `re`. Prints the scanned-file count and the match count on every run.'
    blind_spots:
      - 'BINARY and undecodable files are skipped by the reader -- a match inside one is invisible.'
      - 'SOVEREIGN-HELD paths are excluded by the shared rail guard. The exclusion PRINTS, so an absence
         over a held path is visible -- but it is still an absence over a REDUCED universe.'
      - '--max CAPS THE MATCH LIST (default 200). The cap is a real truncation: a term with more hits than
         the cap returns a PARTIAL set, so a "reviewed every hit" claim built on a capped run is false.'
      - 'python `re` semantics: a backslash before | ( ) is a LITERAL, not BRE alternation/grouping. A
         BRE-shaped pattern honestly matches nothing; the tool warns inline, and the warning is the only
         guard -- it cannot distinguish a wrong pattern from a real absence.'
      - 'TEXT-LOCAL by construction: it matches strings, not relationships. A coupled thing that never
         names the search term is not findable here (that is what the graph tools are for).'
    failure_direction: 'UNDER-REPORTS rather than over-claims (skips, held-path exclusions and the --max
      cap all REMOVE hits). The dangerous reading is therefore a ZERO: it means "not found in the scanned
      universe", never "absent from the estate".'
    plane: source
    grain: artifact
    scope: estate
    vintage: 'n/a -- reads the working tree live; no cache, no snapshot.'
    exit_codes: '0 = ran (including a measured zero) | 2 = BLOCKED (bad pathspec / no pattern). A
      zero-match run is NOT an error and a BLOCKED run is never reported as zero matches.'

  comp-glob:
    coverage: 'EVERY file path in the same .gitignore-aware repo file set, matched by fnmatch against the
      glob. No pattern = every file under the pathspec. Scanned count printed on every run.'
    blind_spots:
      - 'SOVEREIGN-HELD paths excluded by the shared rail guard (prints).'
      - '--max caps the returned list -- a partial result, not a complete one.'
      - 'Matches the BASENAME/path text only: it cannot know a file is the right one, only that its name
         matches. A correctly-named wrong file and a wrongly-named right file are indistinguishable here.'
    failure_direction: 'UNDER-REPORTS (exclusions + cap remove rows). A zero means "no NAME matched in the
      scanned universe", never "no such thing exists".'
    plane: source
    grain: artifact
    scope: estate
    vintage: 'n/a -- live working tree, no cache.'
    exit_codes: '0 = ran (including a measured zero) | 2 = BLOCKED (bad pathspec).'

  comp-to:
    coverage: 'Writes ONE value -- the session TO_ID -- into a race-free per-session file keyed by
      CLAUDE_CODE_SESSION_ID, consumed by the comp-tool auto-logger for run attribution.'
    blind_spots:
      - 'It does NOT validate that the TO exists. Any string is accepted, so a typo silently attributes
         every subsequent tool run to a task order that does not exist.'
      - 'IT PARSES NO FLAGS. `comp-to --help` SETS the TO_ID to the literal string "--help" (measured
         2026-08-06 on the author of this contract). There is no help surface to ask.'
      - 'Per-SESSION only: it says nothing about what other concurrent agents are attributing, which is
         precisely why it exists instead of the repo-global .comp-graph/.agent_context.'
    failure_direction: 'Silently ACCEPTS a wrong value rather than refusing -- the failure is
      mis-attribution downstream, not an error here. Read back what it echoes.'
    plane: applied
    grain: artifact
    scope: single-artifact
    vintage: 'n/a -- writes at call time; the value persists for the session.'
    exit_codes: '0 = written (echoes the value it set). It does not fail on a nonexistent TO.'

  comp-read:
    coverage: 'EVERY section of the target file appears in the SHAPE panel (never truncated) and every
      line is eligible for the QUALIFIER sweep. The UNREAD LEDGER states, per run, how many lines and
      sections were surfaced out of the file total -- so what was NOT shown is named rather than
      silently omitted.'
    blind_spots:
      - 'INTRA-FILE ONLY. A doc that contradicts a DIFFERENT file is not detected -- that is the
         .owned-paths.yaml specimen (a note documenting a 2-arg call against a 4-arg def in another
         file) and it is out of the millisecond budget by design.'
      - 'SALIENCE IS LEXICAL OVERLAP, not meaning. A section that answers the question in different
         words scores low. The UNREAD LEDGER is the compensating control: it lists high-salience
         unshown sections so a miss is visible.'
      - 'QUALIFIER DETECTION IS LEXICAL. A limitation expressed without any of the lexicon words is
         not flagged. False negatives are possible and are the dangerous direction here.'
      - 'AUTHORITY tagging is heuristic by file type: python code AUTHORITATIVE, comments/docstrings/
         markdown DESCRIPTIVE. A generated or vendored .py reads AUTHORITATIVE and may not be.'
      - 'It CANNOT make an agent read. It changes what "done reading" looks like by making the unread
         set explicit and attributable; satisficing remains available to a determined reader.'
    failure_direction: 'UNDER-SURFACES rather than over-claims: it never summarizes primary text and
      never truncates a panel without printing the denominator. A zero in SALIENT renders as a
      MEASURED zero over the section count, never as "the file does not say".'
    plane: source
    grain: field
    scope: single-artifact
    vintage: 'n/a -- reads the working-tree file at call time. NO CACHE, so there is no vintage that
      can go stale (the UNKNOWN-VINTAGE class does not exist for this tool).'
    exit_codes: '0 = ran (including a measured zero) | 2 = ERROR (no file / unreadable). A zero-hit
      SALIENT panel is NOT an error.'

  comp-claimlink:
    coverage: "EVERY markdown file under the scanned root(s), and every CORRECTS:
      declaration in them. DENOMINATOR PRINTED ON EVERY RUN (files scanned + declarations
      found). ZERO declarations is reported as NOT-A-CLEAN-BILL, never as a pass."
    verdicts: "SEVERE (the declared STALE-MARKER still stands unqualified in the target --
      the wrong claim is LIVE) | TRACE (target corrected, source uncited -- traceability
      only, NOT a failure) | LANDED | BAD-PATH. rc=1 only on SEVERE or BAD-PATH."
    anti_pattern: "reading TRACE as a failure -- it means the reader is NOT misled. And
      reading 0 declarations as clean: it means nothing DECLARED a correction, which is
      unchecked, not verified."
  comp-find:
    coverage: "EVERY line (content mode) or filename (name mode) in the .gitignore-aware repo file
      set for the given pathspec, each assigned exactly one grade band. DENOMINATOR PRINTED ON EVERY
      RUN (hits + files scanned); band counts are TRUE TOTALS, never the current page's."
    blind_spots:
      - "BINARY + undecodable files are skipped by the reader and are NOT in the scanned denominator
         -- a match inside one is invisible here."
      - "SOVEREIGN-HELD paths are excluded by the shared rail guard; the exclusion prints, so an
         absence over a held path is NEVER 'confirmed absent'."
      - "GRADING IS LEXICAL/STRUCTURAL, not semantic: the HEAD band tests the query against the FILE
         NAME, and DEF tests a definition-shaped line. A file that is the true answer under a
         different name sorts as SURFACED, not HEAD. The bands order the dive; they do not decide it."
      - 'python `re` semantics: a backslash before | ( ) is a LITERAL, not BRE alternation/grouping.
         A 0-hit run on a BRE-shaped pattern is warned about inline, but the warning is the only
         guard -- the tool cannot tell a wrong pattern from a real absence.'
      - "NO SLM / no learned rerank BY DESIGN (Andrew-direct 2026-08-05) -- ordering is re-derivable
         from (query, path, line) alone. Recall is the caller's pathspec, not a model's judgment."
    failure_direction: "UNDER-SURFACES rather than over-claims: an ungraded hit is impossible (every
      match lands in exactly one band), and a zero renders as a MEASURED zero naming the scanned
      denominator -- never as a bare 'no results' that reads as confirmed absence."
    plane: source
    grain: artifact
    scope: estate
    vintage: "n/a -- reads the working tree live at call time; no cache, no snapshot."
    exit_codes: "0 = ran (including a measured zero) | 2 = BLOCKED (bad pathspec / unknown band) --
      a zero-hit run is NOT an error, and a BLOCKED run is never reported as zero hits."

  # BORN-REGISTERED entry (ADHOC.comp-cochange-build 2026-08-04): first tool landed WITH its
  # contract + coordinate + intent_from_above in the SAME commit as the code -- the new-tool
  # normative rule (CVO's phrasing, CTO-adopted 200144Z: a regime that only backfills teaches
  # new tools to be born unregistered). The subject_coordinate + intent_from_above fields are
  # this entry's addition to the schema; the first CVO dial confirms the provisional coordinate.
  comp-cochange:
    coverage: "agent-type CO-MOVEMENT pairs over the window's ATTRIBUTED commits (author-serial convention is the tag source); BOTH F4 denominators printed on every output (commits-attributed/total AND pairs-observed/possible)"
    blind_spots:
      - "UNATTRIBUTED commits (non-serial authors, e.g. human operators) count in denominator 1 and are excluded from pairs -- visible, never dropped, but their co-movement is unmeasured"
      - "file-grain coupling only: two types editing DIFFERENT files of one coupled system do not pair here (comp-blast overlap is that Friction-battery leg)"
      - "merge commits excluded by the substrate walk (comp_missions --no-merges, its own documented choice)"
    plane: source
    # canon tokens (ONTOLOGY2): evidence grain = the FILE (artifact); the agent-type PAIR
    # aggregation sits ABOVE that grain -- described here in prose, not a new enum value
    # (enum growth = LAW-2 promotion, ~C's lane, deliberately not exercised at birth).
    grain: artifact
    scope: estate
    vintage: "n/a -- computed live over the caller-set window (default 14 days); HEAD anchor printed on every output"
    subject_coordinate: "C1-discovered-relations (PROVISIONAL -- first CVO dial confirms; declared at birth per the C-indexed regime)"
