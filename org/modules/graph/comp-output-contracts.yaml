  #
  # WHY THIS IS A PRECONDITION OF R8 AND NOT A FOLLOW-UP: R8 makes comp-which self-report into
  # the run sink, and comp-which is the single most-invoked comp surface in the estate
  # (~19,280 route-family events). Landing that telemetry while it was UNDECLARED would have
  # made the largest contributor to the sink also the least classifiable -- every one of its
  # nonzeros rendering UNKNOWN -- visibly degrading the E4.1/E4.2 measurement plane that had
  # just landed. Declaring it first is what keeps the plane honest.
  comp-which:
    coverage: "the curated routing rules + the surface-first coverage ledger, scored against the supplied question"
    blind_spots:
