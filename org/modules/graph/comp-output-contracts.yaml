    plane: projection
    # canon token (ONTOLOGY2 enum [artifact,partition,row,field]): `field` matches the family
    # references comp-blast + comp-kuzu (same graph plane). The function-grain nature of trace
    # nodes is prose, not a new enum value (enum growth = LAW-2 promotion, ~C's lane).
    grain: field
    scope: estate
    vintage: "DUAL, printed on EVERY walk to stderr ('=== comp-trace provenance ==='): (a) cache built_at + age, (b) indexed-SHA drift at load. Head-pinned: a drifted cache is DISCARDED and rebuilt from CURRENT source before answering, so drift_at_load>0 means the answers are FRESHER than the cache was, never staler."
    exit_codes:
      "1": {class: fail, meaning: "the tool failed, and ONLY that -- usage error (_ContractParser routes argparse's native 2 to 1) or crash"}
      "2": {class: verdict, meaning: "STALE -- the --check freshness probe only; never printed by a walk"}
      "3": {class: refuse, meaning: "NOT-FOUND: the query resolved to zero nodes (under --exact: no id EQUALS the query byte-for-byte) -- denominator + universe + UNVERIFIED near-matches (DUPLICATE/LEGACY candidates) printed; NEVER a 'nothing-upstream/downstream' clear"}
    exit_source: "org/modules/graph/cli.py cmd_trace NOT-FOUND (rc3) + _ContractParser.error (rc1) + _freshness_probe (rc2) @2026-08-04 T1/T3/T5/T6 landing commit"

