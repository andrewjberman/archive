      # score comp-which on OUTPUT, never on rc -- is right, and COO holds that lane to correct it).
      "1": {class: refuse, meaning: "usage/help path -- nothing was routed, so nothing is concluded (NOT a routing failure)"}
    exit_source: ".tools/comp-which main()/_route_print + measured exercise of --help (rc1) vs a no-match question (rc0) @2026-07-30"
    rebaseline_note: "comp-which had ZERO rows in comp-tool-runs.jsonl before R8 (the 295x under-report: 42 rows in the md log vs 12,380 July rail routes). Rows begin accruing 2026-07-30; there is NO historical run population to re-baseline, and any pre-R8 comp-which conversion rate is unmeasurable rather than merely imprecise."

