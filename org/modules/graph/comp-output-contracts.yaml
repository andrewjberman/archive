      - "dynamically-keyed / FUNC-key reads+writes are INVISIBLE (the dynamic-prefix holdings-read miss class); a 'consumers' answer of zero is 'no extracted edge', NOT provably no consumer"
    plane: projection
    grain: artifact
    scope: pipeline
    vintage: ".comp-graph graph build for io/consumers; `deployed` reads LIVE S3 code/ prefixes at run time"
    by_subcommand:
      deployed: {plane: applied, vintage: "live s3 ls of the code/ prefix vs the local script hash (MATCH/STALE/MISSING reported in stdout, exit 0)"}
    exit_codes:
      "1": {class: fail, kind: usage, meaning: "script name did not resolve / usage error (MATCH/STALE/MISSING status is reported at exit 0, NOT via a nonzero)"}
      "2": {class: fail, kind: usage, meaning: "usage / argument error"}
    exit_source: "org/modules/graph/pipeline_cli.py:250,370,418,423 (rc1 not-found/error), :227,1213 (rc2 usage); status path returns 0 at :1735 @2026-07-23"
    rebaseline_note: "comp-pipescript nonzero rows are genuine bad-script-name/usage errors (FAIL), NOT verdicts -- the STALE/MISSING VERDICT is carried in stdout text at exit 0. Declaring it keeps those rows FAIL rather than flipping them to UNKNOWN."

  comp-kuzu:
    coverage: "the Cypher query result over the canonical auto-refreshing Kuzu graph DB"
    blind_spots:
      - "--mode inc (NFRA_KUZUSPLIT P1, formerly the comp-kuzu-inc wrapper, retired 2026-09-02): THE VERDICT-BEARING BEHAVIOR IS IN-BAND, NOT IN THE rc -- a labeled-stale serve exits 0; the verdict rides stderr (provenance marker 'SERVED LABELED-STALE ... behind-by-N' + WARN line) and the persistent .fallback.jsonl sink beside the DB. An rc-only caller CANNOT distinguish fresh from labeled-stale; read the header. Declared from source (_canonical.py:483-530, COND-1 :524-529, COND-2 :423 @2026-08-04); the live labeled-stale exercise remains dial re-dial trigger 6"
      - "--mode full (formerly comp-kuzu-full, retired 2026-09-02): forces kuzu_nessie_load UNCONDITIONALLY before serving; a rebuild failure is WARN-and-proceed on the prior DB, never an exit -- read stderr, not rc, for the refresh outcome"
      - "answers ONLY what the graph models; a relationship not extracted into the graph is absent, not zero. Read the provenance header (UNKNOWN VINTAGE = freshness unverifiable; a --db-path scratch DB is a frozen vintage)"
    plane: projection
    grain: field
    scope: estate
    vintage: "the materialized Kuzu DB (provenance header printed to stderr every call). --mode inc: current on small-delta incremental; PRIOR vintage honestly labeled on large-delta/timeout/error fallback (never half-built). --mode full: post-rebuild = current HEAD"
    exit_codes:
      "1": {class: fail, meaning: "tool/input error -- DB not found (incl. --mode inc COLD START: no local DB to serve stale, and inc NEVER full-rebuilds -- run --mode full or wait for MSTR startup), or the Cypher query failed to execute"}
    exit_source: "infra/aws/globgrph/kuzu_cli.py:66 (DB-missing), :90 (query error) -- both genuine errors, not verdicts @2026-07-23"



