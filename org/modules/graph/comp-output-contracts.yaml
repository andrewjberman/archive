      - "trace resolves a URL to an S3 key ONLY through the modelled static rewrite table; a key computed INSIDE a Lambda@Edge router or a backend Lambda is invisible, and an uncovered prefix renders UNRESOLVED (missing coverage, NOT a proof that no key exists)"
      - "a catch-all `/*` match is a DEFAULT, not a resolution -- it matches any path no other behavior claimed, including paths that do not exist; it is disclosed always-on and must never be read as evidence the path is served"
      - "DESIRED plane only: this is parsed Terraform + committed router source, so it CANNOT tell a declared behavior/rewrite from a deployed one -- a drifted distribution or a pinned stale Lambda@Edge version reads identical here (see `edge-versions` for the pinning axis)"
      - "the rewrite table is PARSED from the Lambda@Edge routers' if/else chains (NFRA_TOOLARCH.MACHINEFLAG R2, 2026-07-24 -- was TRANSCRIBED and had drifted), and the parser FAILS LOUD on any branch shape it cannot represent, so a router edit either parses or errors, never silently drifts. Still SOURCE plane (committed .mjs, not the deployed edge version -- ground a security-critical branch on the deployed artifact per Rule 22a, as done for the summary.json 401 @v23)"
      - "a router REFUSAL (the platinum/**/summary.json 401 PII block) yields outcome REFUSED with NO s3_key -- a prefix-only model rendered this as a RESOLVED key, the false-secure defect R2 closed; and a FIRM-PARAMETRIC origin (advisor-intelligence: bucket chosen per requesting firm from FIRM_BUCKET_MAP) emits the KEY but REFUSES a single s3_bucket/s3_uri, because naming one firm's bucket for another firm's query is the cross-firm pointer the firm-sep gates exist to catch"
      - "auth_api_gw is derived from origin TYPE, not from an authorizer's existence, so an API Gateway origin with NO authorizer configured still reports API-GW auth -- a topology-inferred posture, not a grounded one (named residual, NFRA_TOOLARCH.MACHINEFLAG R1-residual; the honest fix splits topology `origin_is_api_gw` from any auth claim)"
      - "origin_type is DOMAIN-derived (is_s3 when _s3_bucket_from_domain resolves the origin domain, OR a legacy `s3_origin_config` block is present -- extract_routes.py:371,385): an OAC-fronted S3 origin now types s3 correctly and auth-map/stats group it right. The NFRA_TOOLARCH.ROUTES false-secure residual (OAC S3 mistyped api_gateway -> wrong auth-map) was CLOSED @21bad5730, CVO~Z-verified live both directions @8dcba598f. RESIDUAL LIMIT (narrower, still real): DESIRED-plane only, and typing relies on the domain being recognizable as S3 -- an S3 origin whose domain the resolver does not map AND that carries no s3_origin_config block would still type api_gateway"
      - "a client-composed URL (runtime-templated base) is UNRESOLVED, and its auth posture is UNDETERMINED -- never a proven auth:NONE"
    plane: desired
    grain: artifact
    scope: estate
    vintage: "parsed cloudfront-distribution.tf + infra/aws/lambda-edge/*/index.mjs + api-gateway .tf + portal/src at working-tree HEAD (SOURCE/DESIRED); never a live CloudFront describe-distribution"
    exit_codes:
      "1": {class: fail, meaning: "tool/input error -- unparseable Terraform, missing route config, or bad args. A query that resolves to nothing is exit 0 with a loud No-match/UNRESOLVED line, not this."}
    exit_source: "org/modules/graph/routes_cli.py (argparse errors + uncaught parse failures; no verdict-exit contract -- every no-match/uncovered answer prints loudly and exits 0) @2026-07-23"

  comp-keys:
    coverage: "keys / partition dates / per-firm existence under an S3 prefix, from a LIVE s3api listing"
    blind_spots:
      - "lists ONLY what s3api returns for the exact prefix given -- a typo'd or wrong prefix reads as a true (loud) zero, not an error; the denominator is always the exact bucket+prefix, never the intended one"
      - "partition dates are DERIVED from key text (YYYY-MM-DD / YYYYMMDD / date=), not --delimiter (which MSYS-mangles); a key that encodes its date differently is not counted; gaps are calendar-weekday, not trading-calendar (resolve NEVER#1 before calling a weekday gap a defect)"
      - "prefix/partitions enumerate ONE bucket; only `exists` is complete-over the declared firm scope (data/firm_registry.json enabled+pipeline)"
    plane: applied
    grain: partition
    scope: partition-window
    vintage: "LIVE s3api list-objects-v2 at run time; LastModified is ISO-8601 Z (never `aws s3 ls` local time)"
    exit_codes:
      "1": {class: fail, meaning: "tool/input error -- aws unavailable, bucket unreadable / access-denied, or bad args (a LOUD zero on an empty prefix is exit 0, not this)"}
    exit_source: "org/modules/graph/comp_keys.py (0 = query ran incl. loud-zero; 1 = _aws err / registry unreadable) @2026-07-23"

  comp-pipescript:
    coverage: "named-thread estate traversal (io/deployed/postdeps/consumers) over the AST-extracted graph"
    blind_spots:
