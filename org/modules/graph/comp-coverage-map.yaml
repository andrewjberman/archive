# comp-toolgraph's SHARES_SUBSTRATE edges surface EVERY shared-backend import (the ripple map).
# distinct_from + the redundancy_census above declare ESTATE-INSPECTION concern-overlap -- a
# DIFFERENT coupling class than a shared internal-utility IMPORT (code reuse). The elements below
# are shared BY DESIGN (validators, engines, the canonical sovereign guard, the router, the
# graph-family CLI dispatcher). An ACTUAL substrate edge whose `shared` set is ENTIRELY within this
# set is INTENTIONAL, not an undeclared ripple. Recorded here (NOT silently excluded) so
# comp-toolgraph's coupling-diff classifies such an edge INTENTIONAL-SHARED-INFRA -- a third bucket,
# DISCLOSED -- preserving full ripple visibility while marking these accepted-by-design. A future
# edge that shares ANY element NOT listed here still surfaces as UNDECLARED (the classifier bites
# only for this set -- proven non-vacuous in comp-toolgraph --self-test). No comp-coverage-check
# gate rule reads this key, so the gate is unaffected (same additive-data pattern as
# node_scope_disposition / role_surface_affinity).
# CVO~A D1 reconcile 2026-07-12 (routed as coverage-map owner); owner 0.8.0_AE_CloudComp. Grounded
