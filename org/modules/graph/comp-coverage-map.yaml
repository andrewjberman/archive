# =============================================================================
# tools_index GENERATED VIEW (CTO ruling #1) -- this LEDGER is the source of truth;
# graph-call-manifest.yaml's flat tools_index becomes a REGENERATED projection of it
# (the tool INVENTORY + each tool's home/concern), NOT a second hand-maintained
# catalog. The manifest keeps its OPERATIONAL fields (does/subcommands/entries/
# routing/examples); only the inventory is a ledger projection. This block defines
# the projection + the regen contract; the manifest carries a GENERATED marker.
# =============================================================================
tools_index_generation:
  source_of_truth: org/modules/graph/comp-coverage-map.yaml
  target: org/modules/graph/graph-call-manifest.yaml#tools_index
  projects: "per-tool {home: (surface|seam), granularity, concern} from tools[] + {role} from meta_tools[]"
  keeps_in_manifest: [does, subcommands, entries, routing, examples]   # operational fields stay; only the inventory is regenerated
  regen_contract: |
    A build step reads tools[] + meta_tools[] here and (re)writes the manifest's tool
    INVENTORY (which tools exist + their home/concern), preserving the manifest's
    operational fields. One catalog: a tool present in the manifest but ABSENT here =>
    a drift FINDING (the manifest must not carry a tool the ledger doesn't home/account).
  generator: org/modules/graph/comp_coverage_view.py   # emit (project) + --verify (the CI non-breaking guard); read-only, never mutates the manifest
  non_breaking_proof: "S1 verified via `comp_coverage_view.py --verify`: all 33 manifest tools_index entries are present in union(tools, meta_tools) here (=44 at S1; =49 as of 2026-07-01 after the COMPROUTE S1 comp-dispatch/comp-symbols adds) -- no tool lost in the projection; exit 0. comp-which routing unaffected (routing fields untouched)."
  manifest_marker_status: "AUTHORED-in-working-tree, commit RAVC'd to COO~B/CTO -- graph-call-manifest.yaml is ANY_EXEC lane (not AE-committable); the GENERATED-VIEW marker edit is ready (source-of-truth = this ledger; regen/verify = comp_coverage_view.py) but lands via an exec commit or a lane grant. The ledger side (source of truth + generator + non-breaking proof) is COMPLETE + committed; the manifest is the marked projection target once the 1-block marker lands."

