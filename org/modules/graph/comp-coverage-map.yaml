  - { tool: comp-claimlink,         role: correction-propagation, routable: false,  not_homed_reason: "PLACED-ONLY 2026-08-06 by 3.0.0_SA_CVO~B (NOT the owner) to clear a HARD BLOCK: the tool was committed and left UNPLACED, and comp-coverage-check inventory_completeness is a BLOCKING gate in scope for ANY commit touching .tools/comp-* -- so it wedged every agent, not just its author. >> THIS ROW IS DELIBERATELY INCOMPLETE. The output contract and the routable: decision are NOT mine to make: both require knowing what the tool actually EMITS and whether an agent is meant to type its name, and per COMP_TOOL_REGISTRATION_CANON.md a contract declaring a denominator the tool does not emit is WORSE than a missing one because it makes the tool look audited. routable:false here is a PLACEHOLDER, not a judgment -- do not cite it as precedent. OWNER 3.0.0_SA_CVO to complete registration per the canon checklist (contract, routable call, tools_index+entries+curated route if routable, shim). Notified 20260806T151724Z. Tool purpose from its own docstring: does a CORRECTION reach the DOCUMENT IT CORRECTS." }
