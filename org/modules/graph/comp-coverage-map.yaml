# =============================================================================
meta_tools:
  - { tool: comp-surprise,       role: surprise-channel-rollup, routable: false, not_homed_reason: "THE SURPRISE CHANNEL ROLLUP (Andrew-direct 2026-08-25, context-flooding remediation; CLAUDE.md Rule 27 / Directive Execution Pipeline stage 5). Reads every org/surprise_channel/{PROJECT}/INVESTIGATION_v*.md + REMEDIATION_v*.md JSON block into ONE list with denominators, and flags the item schema's OWN unmet obligations (ARMED with no disarm_owner; GRADUATED without GROUNDED grounding; DISMISSED with no reason). THE GAP IT CLOSES: the protocol writes one file PER PROJECT and nothing read them together, so an item could be FILED AND INVISIBLE AT THE SAME TIME -- which is where investigate -> graduate -> remediate stalls at 'filed'. First run surfaced 143 items / 14 projects / 30 open / 67 ARMED / 1 schema obligation unmet, none of it visible in aggregate before. NOT ROUTABLE and NOT a graph-query use-case BY SUBJECT: it queries RECORDS (the channel's JSON blocks + investigation_item.schema.json), never the dependency graph, so there is no traversal to route TO -- the comp-missions precedent exactly. Excluded in graph-call-manifest.yaml excluded_not_graph_use_cases with the same reason; that exclusion is a DEBT, not a resting place, and a curated comp-which vocabulary pass is OWED (CTO). READ-ONLY: it REPORTS and never files, graduates, dismisses or edits -- the channel is CVO's surface. Engine .tools/comp-surprise.py." }
  - { tool: comp-ledger-agreement, role: records-agreement-lint, routable: false, not_homed_reason: "ADVISORY header/body AGREEMENT scan over deploy-completion ledgers (CTO ruling 2026-08-19, instrument-repair batch). Classifies header-lags-body (the measured FALSE-RED class: a completed deploy presenting as a stranded leg because the Status header never advanced) vs body-lags-header CANDIDATES (the dangerous inverse). A RECORDS lint over ledger prose, not a graph/surface query -- police, not query, same class as comp-manifest-check. Reports DENOMINATORS and refuses to bucket the 123 of 511 ledgers that carry no machine-readable Status header at all. ADVISORY ONLY: it does not block a commit; escalation to blocking is Andrew's to grant (never-implement-a-gate rule) -- proposed, not implemented. routable:false is a DEBT NOT A JUDGMENT and explicitly not precedent: no law tells an agent to type this name YET, and a tools_index row without curated comp-which vocabulary manufactures a BLOCKED self-route finding (the documented comp-residue/comp-arity trap). It rides CTO's curated-vocabulary batch, already queued at this seat, and flips routable:true there. Registered 2026-08-19 by 0.8.0_AE_CloudComp." }
  - { tool: comp-adversary,         role: validation-context-composer, routable: true, not_homed_reason: "VALIDATOR-CONTEXT COMPOSER (Andrew-ratified name @7241d0dfd7; Andrew-direct 2026-08-19: functional + MANDATORY in the atom_decomp workflow's VALIDATION piece). Composes what the validator of returned work IS and IS NOT shown: author-profile pins -> complement (cited-commit verification, cited-path vintage vs artifact vintage, uncited neighborhood, comp-state drift; v1 defers toolgraph/axes/blast/pulse/read-digests AS DECLARED EXCLUSIONS in its own output) -> a validation_context_declaration (L0a boundary_report SIBLING per the ruled declaration family). --open mode = model-prior validator, zero estate context, declared. routable:TRUE because the PRD protocol TELLS validators to type its name (the door-real-key-not test answers YES). Arch frame: CTO design note DESIGN_NOTE_CHECK_SYSTEM_DEFINITIONS_AND_COMP_ADVERSARY_20260819.md; v2 (deferred sources) = 0.8.0 build per the note. Carries --self-test (4 controls incl. a planted bogus-commit discriminator). Registered 2026-08-19 by 1.0.0_SA_CTO." }
  - { tool: comp-schedule,        role: gate-ledger, routable: true, not_homed_reason: "THE GATE LEDGER (Andrew-direct 2026-09-01: 'having preconditions floating from 12 days ago with no immediate visibility is not good planning ... we need a clear way of managing these ... and clear means of cleaning/sweeping items from that list when they no longer are needed'). Answers what /schedule-check and comp-lease do NOT: /schedule-check covers scheduled JOBS from the live AWS APIs, comp-lease covers C3 CLOSURES -- neither covers GATES, a promise to check something later. A job that stops firing gets noticed because something expected output; A GATE THAT OUTLIVES ITS REASON EMITS NOTHING AT ALL. VIEW-TIME COMPILED from five carriers (code sentinels via safe_deploy_core.SERVE_HELD_RE -- the grammar that gates real deploys, REUSED not copied; open deploy-ledger entries; CLAUDE.md standing moratoria; task-order scope_guards; project blocking fields) -- NO artifact, NO registry, so nothing can go stale, which is the exact failure a curated gate list would reproduce. CARRIES A DECIDABILITY SCHEMA (Rule 24 four-postulate record in its header): DECIDABLE carriers are counted, SEMI-DECIDABLE are counted only after a declared chatter exclusion, and org/projects/*.json `blocking` is NOT-DECIDABLE and NEVER counted -- measured 333 keys of which 189 are the word None in English and 135 are prose (16 SELF-NEGATING, 65 using closed/resolved language, median 648 chars, max 30,625): a 30KB blocking field is an essay, not a field, and counting it would report 135 blocked and be wrong before the second line. UNREADABLE is never rendered as zero rows. --drift is EXCEPTIONS-ONLY and raises CANDIDATES, never verdicts: THE TOOL NEVER CLOSES A GATE. First live run: 20 sentinel lines collapsed to 4 gates (a line count is not a gate count; 19 further raw matches were agents QUOTING a sentinel in inbox mail, excluded and declared), and it surfaced a gate whose own comment reads SATISFIED 2026-07-13 while still armed seven weeks later. routable:TRUE -- agents should type this name when asking what is blocked or who can lift a hold. LAST-VERIFIED is a DERIVED WEAK proxy (carrier last-edit, not a human confirmation) and is labelled weak on every row. Carries --self-test (5 controls) + a 9-leg battery incl. a planted mutant. Read-only; no AWS, no model calls. Engine .tools/comp-schedule. Registered 2026-09-01 by 3.0.0_SA_CVO~C." }
  - { tool: comp-genesis,           role: genesis-provisioner, routable: true, not_homed_reason: "NFRA_GENESIS provisioner SDK: spins up a NEW company's semantic system (graph + ontology-binding + closed learning loop) from company.yaml on the proven Opal stack, parameterized -- a cross-surface META/tooling provisioner (like comp-system), ROUTED to when an agent asks how to generalize/bootstrap to a new company. Tenant-neutral (operates on ANY tenant; a tenant's recognizers/adapters are DATA under tenants/<c>/, never comp-tools). Thin shim -> infra/system/sdk/genesis. Registered 2026-07-18 (NFRA_GENESIS P5, LD-0313 ownpath)" }
