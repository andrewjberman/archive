      - { tool: comp-graph, shared_resource: freshness, my_concern: "pipeline-DATA S3/DDB freshness", their_concern: "graph-cache VINTAGE" }
      - { tool: comp-xray,  shared_resource: freshness, my_concern: "pipeline-DATA S3/DDB freshness", their_concern: "value-MOTION (content)" }
  - tool: comp-secrets
