    concern: "bidirectional dependency PATH walk from any repo node (where does data come/go -- up/down/both)"
    touches_resource: [trace-graph]
    distinct_from:
      - { tool: comp-blast, shared_resource: trace-graph, my_concern: "dependency PATH walk", their_concern: "IMPACT set (what breaks downstream)" }
      - { tool: comp-diff,  shared_resource: trace-graph, my_concern: "dependency PATH walk", their_concern: "uncommitted-CHANGE blast" }
      - { tool: comp-xref,  shared_resource: trace-graph, my_concern: "dependency PATH walk", their_concern: "symbol OCCURRENCE lookup" }
  - tool: comp-blast
    surface: AWS-CLOUD
    granularity: graph-node
    concern: "downstream IMPACT set + upstream callers (what breaks if I change X; function-level)"
    touches_resource: [trace-graph]
    distinct_from:
      - { tool: comp-trace, shared_resource: trace-graph, my_concern: "IMPACT set (what breaks)", their_concern: "dependency PATH walk" }
      - { tool: comp-diff,  shared_resource: trace-graph, my_concern: "IMPACT set (what breaks)", their_concern: "uncommitted-CHANGE blast" }
      - { tool: comp-xref,  shared_resource: trace-graph, my_concern: "IMPACT set (what breaks)", their_concern: "symbol OCCURRENCE lookup" }

  # ====================== seam-homed (inter-surface parity) ======================
  - tool: comp-lambdamap
    seam: seam-2                              # GIT->AWS deploy parity (the lambda engine of seam-2; drift-topology.yaml)
    granularity: lambda
    concern: "DEPLOY-SHA parity -- source-map record == live CodeSha256 == S3-artifact sha (3-leg); lambda-source-map drift"
    touches_resource: [IAM, parity]
    distinct_from:
      - { tool: comp-iam,        shared_resource: IAM,    my_concern: "deploy-SHA (IAM role on a deployed Lambda)", their_concern: "grant-analysis (permission gaps)" }
      - { tool: comp-aws,        shared_resource: IAM,    my_concern: "deploy-SHA (IAM role on a deployed Lambda)", their_concern: "IAM-as-graph-nodes (estate topology)" }
      - { tool: comp-parity,     shared_resource: parity, my_concern: "DEPLOY parity (deployed-SHA vs live CodeSha256)", their_concern: "DATA/served parity (cutover gate)" }
      - { tool: comp-incrparity, shared_resource: parity, my_concern: "DEPLOY parity (deployed-SHA)", their_concern: "INCREMENTAL parity (cache vs oracle)" }

  # ====================== TRINO (federation) surface ======================
  - tool: comp-kuzu
    surface: TRINO
    granularity: graph-node
    concern: "cross-surface federated READ -- Cypher over the loaded estate graph (the FAST default read-path)"
    touches_resource: []
  - tool: comp-graph
    surface: TRINO
    granularity: graph-node
    concern: "graph-cache VINTAGE/freshness across the derived models (local trace caches + cloud artifacts) + clear"
    touches_resource: [freshness]
    distinct_from:
      - { tool: comp-freshness, shared_resource: freshness, my_concern: "graph-cache VINTAGE (derived-model staleness)", their_concern: "pipeline-DATA S3/DDB freshness" }
      - { tool: comp-heat,      shared_resource: freshness, my_concern: "graph-cache VINTAGE", their_concern: "estate-object write-freshness (repo files)" }
      - { tool: comp-xray,      shared_resource: freshness, my_concern: "graph-cache VINTAGE", their_concern: "value-MOTION (content)" }

# =============================================================================
# META TOOLS -- the tooling LAYER: router/search/enforcement-gate/cache-mgmt/test/
# COMPLEARN-loop/estate-router. These do NOT operate on a territory surface's state,
# so they carry NO (surface|seam) home -- but they are ACCOUNTED here (not dropped)
# with a `role` + `not_homed_reason`. This mirrors graph-call-manifest.yaml's
# `excluded_not_graph_use_cases`. Gate `inventory_completeness` asserts union(tools,
# meta_tools) == the full .tools/comp-* + pipescript inventory (CVO completeness).
# =============================================================================
meta_tools:
  - { tool: comp-which,             role: router,             not_homed_reason: "the rail ENTRY -- maps a plain-English question to the canonical homed tool; it ROUTES, it is not a surface inspection (PRD deliverable 4 reorgs it surface-first)" }
  - { tool: comp-grep,              role: search-primitive,   not_homed_reason: "on-rails grep comp-which RUNS when no rich tool fits (never-dead-end); a search primitive, not a surface tool" }
  - { tool: comp-glob,              role: search-primitive,   not_homed_reason: "on-rails glob comp-which RUNS when no rich tool fits; a search primitive" }
  - { tool: comp-to,                role: session-primitive,  not_homed_reason: "session-context setter (race-free per-session TO_ID for the comp auto-logger); a startup primitive" }
  - { tool: comp-build,             role: cache-management,   not_homed_reason: "rebuilds the trace-graph cache (the trace WRITE-PATH); operates on the tooling cache, not a surface" }
  - { tool: comp-manifest-check,    role: enforcement-gate,   not_homed_reason: "D6 manifest-ENFORCEMENT commit-gate; polices the manifest, not a surface query" }
  - { tool: comp-surface-check,     role: enforcement-gate,   not_homed_reason: "D8 critical-surface commit-gate (auto in safe-commit); an enforcement gate" }
  - { tool: comp-coverage-check,    role: enforcement-gate,   not_homed_reason: "THE COMPUNIFY gate (NFRA_COMPUNIFY S2) -- enforces this ledger's own gate_contract + projection-currency; polices the coverage map, not a surface query" }
  - { tool: comp-registry,          role: governance,         not_homed_reason: "REGISTRY-narrative vs project-JSON drift + write-back; governs project records, not an estate surface" }
  - { tool: comp-coverage,          role: meta-report,        not_homed_reason: "compiler/task-order coverage report; a meta view over the tooling/TOs" }
  - { tool: comp-perf,              role: meta-measurement,   not_homed_reason: "tool-performance measurement; meta, not a graph-query use-case (manifest-excluded)" }
  - { tool: pipescript,             role: estate-router,      not_homed_reason: "the HUMAN ENTRY over the whole estate -- a named-thread traversal SUPERSET that ROUTES to homed sub-resolvers (comp-pipescript/globgrph/stitch/portal); a router+discovery surface, not a single-surface tool" }
  - { tool: comp-learns-run,        role: complearn-loop,     not_homed_reason: "the COMPLEARN (tool-USE verb) loop -- the SIBLING program, not a COMPUNIFY/COMPDRIFT surface tool" }
  - { tool: comp-learns-status,     role: complearn-loop,     not_homed_reason: "COMPLEARN loop status; the sibling use-verb program" }
  - { tool: comp-v5-composite-test, role: test-harness,       not_homed_reason: "comp-tool regression test harness; not an estate inspection" }
  - { tool: comp-which-routing-test, role: test-harness,      not_homed_reason: "comp-which routing regression test harness; not an estate inspection" }

# =============================================================================
# GAP CENSUS (PRD deliverable 2) -- every (surface|seam) x level node with NO tool.
# Hands to the COMPLEARN worklist: a COMPUNIFY empty node + high COMPLEARN demand =
# a build-next. tool-front gap (no tool) is DISTINCT from a designed-cadence asymmetry
# (a low-cadence surface is NOT a gap -- see MS-CLOUD provenance.designed_asymmetry).
# =============================================================================
gap_census:
  status: populated
  hand_to: COMPLEARN
  gaps:
    - { node: "MS-CLOUD high-level tool", kind: tool-front, detail: "no comp-ms; reachable only via m365 MCP + the graph ms-layer column. The high-leverage build-next.", severity: high }
    - { node: "TRINO comp-fed front",     kind: tool-front, detail: "comp-kuzu is the current read-front; comp-fed (the federated Trino front) is future -- the graph x code-heat JOIN has no dedicated tool yet", severity: medium }
    - { node: "TRINO tool_activity catalog", kind: catalog, detail: "the +1 federation catalog (COMPLEARN tool-USE telemetry) is not built", severity: low }
    - { node: "seam-6 iceberg-catalog bindings", kind: seam, detail: "graph_nodes/edges/contracts Trino-binding parity UNCOVERED (git-code-heat binding COVERED); design the per-catalog signal into the heat-federation build", severity: high }
    - { node: "LOCAL drill-down depth", kind: surface-depth, detail: "below comp-heat the LOCAL surface is thin -- no value-level local inspection beyond freshness/drift", severity: low }
    - { node: "GIT->MS deploy seam", kind: seam, detail: "msgraph deploy is thin/batch; no dedicated parity tool (designed-batch, low concurrency -- a tool gap, NOT a coverage gap; see MS provenance)", severity: low }

# =============================================================================
# REDUNDANCY CENSUS (PRD deliverable 3) -- every shared-resource overlap, each
# RESOLVED with a DECLARED distinct_from concern-difference in tools[] above. Zero
# silent overlaps. Any overlap WITHOUT a declared concern-difference is a finding ->
# merge/retire/disambiguate. The gate `declared_non_redundancy` enforces this.
# =============================================================================
redundancy_census:
  status: populated
  overlaps:
    - { resource: IAM,              tools: [comp-iam, comp-aws, comp-lambdamap], concerns: ["grant-analysis", "IAM-as-graph-nodes", "deploy-SHA"], state: DECLARED, finding: none }
    - { resource: parity,           tools: [comp-lambdamap, comp-parity, comp-incrparity], concerns: ["DEPLOY parity", "DATA/served parity", "INCREMENTAL parity"], state: DECLARED, finding: none }
    - { resource: freshness,        tools: [comp-freshness, comp-heat, comp-graph, comp-xray], concerns: ["pipeline-DATA freshness", "estate-OBJECT freshness", "graph-cache VINTAGE", "value-MOTION"], state: DECLARED, finding: none }
    - { resource: trace-graph,      tools: [comp-trace, comp-blast, comp-diff, comp-xref], concerns: ["dependency PATH walk", "IMPACT set", "uncommitted-CHANGE blast", "symbol OCCURRENCE"], state: DECLARED, finding: none }
    - { resource: portal-component, tools: [comp-transform, comp-adapter-audit, comp-pii], concerns: ["JSX field-render vs TS type", "adapter field-threading vs live S3", "PII exposure"], state: DECLARED, finding: none }
    - { resource: estate-structure, tools: [comp-dups, comp-aws], concerns: ["DUPLICATE/dead census", "DUAL-MANAGED (TF-state conflict)"], state: DECLARED, finding: none }

# =============================================================================
# tools_index GENERATED VIEW (CTO ruling #1) -- this LEDGER is the source of truth;
# graph-call-manifest.yaml's flat tools_index becomes a REGENERATED projection of it
# (the tool INVENTORY + each tool's home/concern), NOT a second hand-maintained
# catalog. The manifest keeps its OPERATIONAL fields (does/subcommands/entries/
# routing/examples); only the inventory is a ledger projection. This block defines
# the projection + the regen contract; the manifest carries a GENERATED marker.
# =============================================================================
tools_index_generation:
  source_of_truth: org/modules/graph/comp-coverage-map.yaml
  target: org/modules/graph/graph-call-manifest.yaml#tools_index
  projects: "per-tool {home: (surface|seam), granularity, concern} from tools[] + {role} from meta_tools[]"
  keeps_in_manifest: [does, subcommands, entries, routing, examples]   # operational fields stay; only the inventory is regenerated
  regen_contract: |
    A build step reads tools[] + meta_tools[] here and (re)writes the manifest's tool
    INVENTORY (which tools exist + their home/concern), preserving the manifest's
    operational fields. One catalog: a tool present in the manifest but ABSENT here =>
    a drift FINDING (the manifest must not carry a tool the ledger doesn't home/account).
  generator: org/modules/graph/comp_coverage_view.py   # emit (project) + --verify (the CI non-breaking guard); read-only, never mutates the manifest
  non_breaking_proof: "S1 verified via `comp_coverage_view.py --verify`: all 33 manifest tools_index entries are present in union(tools, meta_tools)=44 here (no tool lost in the projection); exit 0. comp-which routing unaffected (routing fields untouched)."
  manifest_marker_status: "AUTHORED-in-working-tree, commit RAVC'd to COO~B/CTO -- graph-call-manifest.yaml is ANY_EXEC lane (not AE-committable); the GENERATED-VIEW marker edit is ready (source-of-truth = this ledger; regen/verify = comp_coverage_view.py) but lands via an exec commit or a lane grant. The ledger side (source of truth + generator + non-breaking proof) is COMPLETE + committed; the manifest is the marked projection target once the 1-block marker lands."
