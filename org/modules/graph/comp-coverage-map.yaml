# ROLE -> SURFACE AFFINITY (NFRA_COMPROUTE L2 -- the surface_prior context input).
# GOVERNOR-REGISTERED (~C, 2026-07-01): COMPUNIFY owns the map's one-home; COMPROUTE
# READS this table, never edits it from the router side (PRD section 8). The COMPROUTE
# posterior scorer reads it as: surface_prior(cap.surface, ctx) =
#   role_surface_affinity.by_role[ctx.role][ normalize(cap.surface) ].
# The affinity-KEY domain == the normalized capability surface: a surface-homed tool
# keys on its surface (LOCAL/GIT/AWS-CLOUD/MS-CLOUD/TRINO); a seam-homed tool buckets
# to SEAM; the tooling layer buckets to META.
#
# PRIOR-not-FILTER (PRD section 2 + CTO ruling 3, INVIOLABLE): these weights are an
# ADDITIVE bias in score() -- 0.0 is neutral (no bias), a value NEVER excludes a
# cross-surface capability with strong query_match. An unknown role -> default_prior.
# COLD-START SEED ONLY (LD-0231 curated cold-start priors -- the DE's surface-of-
# operations observation -- + the CLAUDE.md role->surface mapping). Deliberately
# conservative (max 0.8) so query_match + the LEARNED history_affinity (COMPLEARN
# tool_activity, ~E; Goodhart-anchored, CVO~B-verified) dominate and accrete over it.
# The provider (org/modules/graph/comp_capability_provider.py) reads THIS block.
