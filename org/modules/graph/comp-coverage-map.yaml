# =============================================================================
# ONE NOUN, TWO VERBS (Andrew-direct, LD-0227): this file is the static MAP (the
# noun) that both NFRA_COMP* loops reference -- COMPDRIFT (the resource-STATE verb,
# per-seam parity) and COMPLEARN (the tool-USE verb, build/optimize/retire). It is
# authored FIRST and stably so the loops hang on ONE surface/seam taxonomy instead
# of each inventing -- and diverging on -- its own (the meta-drift this prevents).
#
# WHAT THIS FILE IS (the S0 skeleton -- the cheap modeling step the program hangs on):
#   - the 5-surface APEX (4 territory + Trino federation)            [section: surfaces]
#   - the HIGH-LEVEL tool per surface (ms-cloud flagged GAP)         [section: surfaces]
#   - the TRINO federation modeled by PHYSICAL CATALOG               [section: trino_federation]
#   - the SEAM axis -- REFERENCING drift-topology.yaml seam IDs       [section: seams]
#   - the NODE SCHEMA every entry carries + the machine-check gate    [section: schema]
#   - one WORKED OVERLAP (IAM x3) proving distinct_from is structured [section: tools]
#
# WHAT THIS FILE IS NOT (yet):
#   - the full drill-down population of all ~38 tools -> S1 (this skeleton places
#     only the high-level entries + the worked overlap; S1 homes every tool).
#   - the gap census / redundancy census -> S1.
#   - the comp-coverage-check GATE itself -> S2 (this file defines the contract it enforces).
#   - the tools_index regenerated-VIEW wiring -> S1 (ruling #1: this ledger SUPERSEDES
#     the flat tools_index in graph-call-manifest.yaml; that becomes a generated projection).
#
# LOCKED CTO RULINGS (PRD section 6 -- NOT re-openable):
#   1. This LEDGER is the source of truth; tools_index becomes a generated VIEW (ONE catalog).
#   2. SEAM == COMPDRIFT topology, ONE artifact: reference drift-topology.yaml seam IDs; never duplicate.
#   3. TRINO fan-in = PHYSICAL catalogs (iceberg[3 tables]/code_heat/+tool_activity), not logical layers.
#   4. NON-REDUNDANCY invariant = a machine-checkable GATE; the schema below is built so S2 can read it.
# =============================================================================

version: 1
status: populated          # S0 apex-skeleton + S1 full population (all tools homed/accounted, both censuses); S2 builds the gate
last_reviewed: "2026-06-30"
supersedes: graph-call-manifest.yaml#tools_index   # ruling #1 -- that becomes a generated view (S1 wires)
seam_source: org/modules/graph/drift-topology.yaml  # ruling #2 -- ONE seam artifact; we reference its IDs

# =============================================================================
# SCHEMA -- the structure every `tools[]` node carries, AND the contract the S2
# `comp-coverage-check` gate verifies MECHANICALLY (no prose-only escape).
# THE LOAD-BEARING INVARIANT (Andrew-direct, PRD section 4):
#   Every tool has exactly ONE home = (surface OR seam) x granularity x concern.
#   Two tools may touch the same RESOURCE only if their CONCERN differs -- and that
#   difference must be DECLARED. Silent overlap is a violation -> merge or disambiguate.
# =============================================================================
schema:
  node_fields:
    # --- the (surface|seam) x granularity x concern HOME (exactly one home) ---
    surface:
      type: enum
      values: [LOCAL, GIT, AWS-CLOUD, MS-CLOUD, TRINO]
      doc: "the territory/federation surface this node lives on. Set IFF this is a surface node."
    seam:
      type: enum
      values: [seam-1, seam-2, seam-3, seam-4, seam-5, seam-6, seam-7]
      doc: "the inter-surface parity seam this node checks. Set IFF this is a seam node. Value MUST exist in seam_source (drift-topology.yaml) -- referenced, never redefined."
    granularity:
      type: enum
      values: [object, file, table, catalog, lambda, iam-policy, graph-node, served-json, component, route, cache-key, secret, symbol, type, seam, estate]
      doc: "the grain the tool operates at -- the second home axis. EXEMPLIFIES the stable-grain
        contract: grain is a DECLARED ATTRIBUTE on a stable tool, never a per-depth re-typing (a
        deeper-grain tool is the same kind of node carrying a finer `granularity`, not a new type).
        The graph-side edge/node grain model this governs is grain_contract (the cross-macro invariant)."
    concern:
      type: string
      doc: "the SINGLE question this node answers at its home. MUST be unique within any shared touches_resource group (that uniqueness IS the non-redundancy gate)."
    # --- overlap declaration (the non-redundancy machinery) ---
    touches_resource:
      type: list[string]
      doc: "named resources this tool reads/inspects (e.g. IAM, 'parity', S3-artifact). The gate GROUPS tools by shared entries here; any group size > 1 REQUIRES distinct_from on every member."
    distinct_from:
      type: list[record]
      record_fields: [tool, shared_resource, my_concern, their_concern]
      doc: "POPULATED iff this node shares a touches_resource with another node. Each record names the sibling tool, the shared resource, and the two CONCERNS that differ. A structured field a gate READS -- not free prose."
    # --- per-SURFACE provenance (refresh-cadence) -- explains DESIGNED cadence asymmetry ---
    provenance:
      type: record
      record_fields: [refresh_mechanism, cadence, concurrency_basis]
      applies_to: surface-nodes
      doc: "how the surface's live state reaches the derived graph/map, and WHY at that cadence. LOAD-BEARING for read-correctness: the cadence is matched to each surface's multiagent-concurrency intensity BY DESIGN (MSTR/Andrew-clarified 2026-06-30; memory project_globgrph_refresh_cadence_by_concurrency_basis). A reader (or the COMPDRIFT seam-3 spec) MUST NOT mis-read a low-cadence surface (ms-cloud batch) as a coverage GAP -- a designed asymmetry is not a gap. concurrency_basis records the reason (where Opal runs concurrent agent processes)."

  # --- the contract comp-coverage-check (S2) enforces against tools[] ---
  # CTO DESIGN NOTE (S0 gate, carries to S2): these 4 rules ARE the comp-coverage-check
  # SPEC. S2 READS this gate_contract as its machine-readable input and implements exactly
  # these -- it does NOT re-implement a parallel rule-set (so the map can never drift from
  # its own gate). Each rule is a structured record {id, applies_to, inputs, predicate,
  # on_violation} a checker keys off; `description` is the human gloss only.
  gate_contract:
    reads: "this block is S2's input contract -- comp-coverage-check enumerates `rules` and evaluates each `predicate` over `inputs`"
    rules:
      - id: one_home
        applies_to: "every tools[] entry"
        inputs: [surface, seam, granularity, concern]
        predicate: "len([f for f in (surface, seam) if f]) == 1  AND  granularity is set  AND  concern is set"
        on_violation: "FAIL -- unplaced (zero-home) or ambiguous (two-home) tool"
        description: "exactly ONE of {surface,seam} set + granularity + concern => the (surface|seam) x granularity x concern home invariant"
      - id: seam_reference_integrity
        applies_to: "every node with `seam` set"
        inputs: [seam, seam_source]
        predicate: "seam in seam_ids(load(seam_source))"
        on_violation: "FAIL -- a seam_id absent from drift-topology.yaml (we reference, never invent)"
        description: "seam IDs are DEFINED in drift-topology.yaml (ruling #2, ONE artifact); this map only references them"
      - id: declared_non_redundancy
        applies_to: "every touches_resource group of size > 1"
        inputs: [touches_resource, distinct_from, concern]
        predicate: "for each resource R touched by tools T (|T|>1): (a) every t in T has a distinct_from record citing R for every OTHER member of T;  (b) the `concern` values across T are pairwise DISTINCT"
        on_violation: "FAIL -- (a) silent overlap (undeclared) ; (b) true redundancy (concern collision) -> merge/retire/disambiguate"
        description: "the load-bearing non-redundancy invariant -- shared RESOURCE allowed only with a DECLARED, distinct CONCERN per tool"
      - id: coverage_single_home
        applies_to: "every seams.axis[] entry"
        inputs: [seams.axis, seams.coverage_source]
        predicate: "no axis entry carries a stored `coverage` field; coverage is READ from seams.coverage_source at view-time"
        on_violation: "FAIL -- a stored coverage copy (drift-prone; coverage has ONE home = drift-topology.yaml). CTO S0 (b)-ruling; extends seam_reference_integrity to the coverage field"
        description: "coverage status is referenced (read from coverage_source), never copied into the axis -- one-artifact-clean (parallels ruling #1 tools_index supersession + ruling #2 seam-ID reference)"
      - id: no_trino_phantom_seam
        applies_to: "trino_federation.catalogs"
        inputs: [trino_federation.fan_in_model, trino_federation.catalogs]
        predicate: "fan_in_model == 'physical-catalog'  AND  no catalog entry keyed on a logical layer (aws/portal/ms)"
        on_violation: "FAIL -- a per-logical-layer catalog (ruling #3 violation; layer is a graph_nodes COLUMN, not a catalog)"
        description: "Trino fans in by PHYSICAL catalog only (iceberg[3 tables]/code_heat/+tool_activity); zero phantom per-layer seams"
      - id: inventory_completeness
        applies_to: "the full .tools/comp-* + pipescript executable inventory"
        inputs: [tools, meta_tools, "ground-truth: .tools/comp-* + pipescript"]
        predicate: "set(t.tool for t in tools) | set(m.tool for m in meta_tools) == set(ground-truth inventory)  AND  the two sets are DISJOINT (no tool both homed and meta)"
        on_violation: "FAIL -- an UNPLACED tool (in neither tools nor meta_tools = silently dropped) or a DOUBLE-PLACED tool. CVO completeness (AC1)"
        description: "every comp-tool is ACCOUNTED exactly once -- either homed (tools[]) or carved out with a role (meta_tools[]); zero silently-dropped tools (the AC1 completeness contract)"
      - id: stable_grain
        applies_to: "grain_contract.edge_types + grain_contract.node_grain_ladder (the cross-macro graph type model)"
        inputs: [grain_contract]
        predicate: "grain_contract present; for edge_types: (a) each `relation` maps to EXACTLY ONE edge_type (group by relation; a relation in >1 type = per-depth re-typing); (b) every edge_type declares a non-empty `levels` attribute (grain is a DECLARED attribute, not encoded in the type name); (c) no edge_type NAME is another type's name + a node_grain_ladder level token (name-encoded re-typing). node_grain_ladder declares ONE CONTAINS relation with an ordered `levels` domain."
        on_violation: "FAIL -- a semantic split by depth (per-depth re-typing of one relation/node) instead of carrying a `level` attribute. Violates the stable-grain contract (Amendment 2 x ruling 4)"
        description: "STABLE-GRAIN CONTRACT (CTO reconciliation; COMPUNIFY governs, GRAPHUNI populates, COMPDRIFT seams on): DIFFERENT relation -> DIFFERENT edge_type (ruling 4); SAME relation at DIFFERENT grain -> SAME edge_type + a `level` attribute (Amendment 2); NEVER split a semantic by depth. Extends seam_reference_integrity/declared_non_redundancy to grain-stability"
      - id: grain_drilldown_seams
        applies_to: "grain_contract.drilldown_seams + grain_contract.strata (the fractal stratum-stitchers)"
        inputs: [grain_contract.drilldown_seams, grain_contract.strata, grain_contract.edge_types]
        predicate: "for each drilldown_seam: its edge_type is a DECLARED stable type in edge_types (carrying a `levels` attr), and from_stratum/to_stratum are both declared in `strata`. A cross-stratum edge that is name-encoded by grain or missing its `levels`/strata = FAIL. (Empty when fractal not yet populated -> PASS, gate-ready-ahead-of-need.)"
        on_violation: "FAIL -- a stratum-stitching drilldown edge that is not a stable declared type, lacks a grain `level`, or bridges an undeclared stratum (CTO sec-10)"
        description: "FRACTAL DRILLDOWN-SEAM stability (CTO sec-10, ratified 205709Z): coarse resource nodes drill to fine structure via stable RUNS/CONTAINS/OWNED_BY edges across resource<->compute<->object strata -- each a stable type with grain as a `level` attribute"
      - id: grain_rollup_consistency
        applies_to: "grain_contract.rollup (the cross-grain existential rollup contract)"
        inputs: [grain_contract.rollup, grain_contract.edge_types]
        predicate: "rollup.semantics == 'existential-aggregation' (CTO 047ce51d0, NOT 1:1 equality); BOTH defect classes UNSUPPORTED + COARSE-INCOMPLETE declared; every rollup_via edge is a declared edge_type. Contract-level (type) check at commit; the INSTANCE-level existential check (coarse edge EXISTS iff >=1 fine rolls up) runs against POPULATED edges via the shared comp_coverage_check.rollup_defects()."
        on_violation: "FAIL -- the rollup contract is mis-declared (wrong semantics = the 1:1-vs-existential drift 047ce51d0 corrected, or a missing defect class / undeclared rollup edge)"
        description: "GRAIN-CONSISTENCY ROLLUP (CTO sec-10, EXISTENTIAL-AGGREGATION 047ce51d0): a coarse edge EXISTS iff >=1 fine edge rolls up (OR-rollup); defects UNSUPPORTED (coarse, zero fine basis) + COARSE-INCOMPLETE (fine, coarse target absent). One canonical definition shared with GRAPHUNI/COMPDRIFT (rollup_defects)"
      - id: producer_attribution
        applies_to: "grain_contract.edge_types (the denominator universe)"
        inputs: [grain_contract.edge_types]
        predicate: "every edge_type carries a producer DISPOSITION -- a scalar `producer` OR a `producer_by_pair` map (multi-producer, e.g. CONTAINS). An edge_type with NEITHER = a silent gap in the denominator universe."
        on_violation: "FAIL -- an UNATTRIBUTED edge_type (no producer disposition); a silent gap in the denominator universe the partition must cover (COO~B/CTO denominator structure)"
        description: "DENOMINATOR completeness (COO~B/CTO affirmation): the grain_contract registry IS the universe the enumerated denominator partitions EXHAUSTIVE+DISJOINT. This rule enforces the no-silent-gap precondition (every type attributed); COO~B assembles the full disjoint partition + CVO verifies; the S4 calibration fills the precise (pair x level) attribution map"
      - id: referenceable_target
        applies_to: "grain_contract.referenceable (the breadth-edge target contract)"
        inputs: [grain_contract.referenceable]
        predicate: "every breadth_edges entry has a referenceable_targets map entry (KEYED by edge_type, EP-2); every allowed-target in referenceable_targets is in referenceable.node_types and NOT in terminal_node_types; node_types and terminal_node_types are DISJOINT. INSTANCE-level (a populated breadth edge's target node_type in its allowed set) runs in the seam MECHANICAL axis."
        on_violation: "FAIL -- a breadth edge_type with no allowed-target entry, an allowed-target that is a terminal member (breadth landing on a terminal), or node/terminal type overlap (GRAPHDEPTH invariant 5)"
        description: "REFERENCEABLE-TARGET (GRAPHDEPTH invariant 5, LD-0230): breadth edges (CALLS/REFERENCES_TYPE/FETCHES/READS_S3) may ONLY target referenceable nodes (Function/TypeDecl/Endpoint/ReactComponent/S3Key), never terminal members (Statement/Field/Prop) -- where breadth composes with depth. KEYED by edge_type so EP-2's per-edge narrowing is DATA, not a code fork (CTO shape note)"
      - id: disposition_complete
        applies_to: "every (edge_type x declared-level) in grain_contract.level_dispositions (the categorical bar's denominator)"
        inputs: [grain_contract.edge_types, grain_contract.level_dispositions]
        predicate: "every declared level of every edge_type has an EXPLICIT disposition in {eager, bounded, n_a}. An UNDISPOSED level (in edge_types.levels but absent from level_dispositions, or with an unknown value) = the SILENT GAP that FAILs. (Coverage of eager levels is the seam's job; this rule enforces the no-silent-cap precondition: every level is explicitly disposed.)"
        on_violation: "FAIL -- an undisposed level (a silent cap; the cap must be EXPLICIT + policy-justified -- eager/bounded/n_a -- never silent). COO~B ruling 2206Z reconciling Andrew no-silent-caps + CTO boundary b/c"
        description: "EXPLICIT-DISPOSITION (COO~B ruling): the categorical bar is disposition-relative over the FIXED full denominator -- 'comprehensive' = every level explicitly disposed eager(must-cover)|bounded(lazy, boundary b)|n_a(type bottoms out, boundary c), ZERO undisposed. Bounded/n_a levels are NOT false gaps; a silently-omitted level IS a gap. The seam asserts eager-covered; this gate asserts disposition-complete"

# =============================================================================
# GRAIN CONTRACT -- the CROSS-MACRO stable-grain invariant (CTO-directed via COO~B,
# ratified 2026-06-30T20:52Z). COMPUNIFY GOVERNS it (this schema + the `stable_grain`
# gate rule), GRAPHUNI POPULATES to it (its P1 tier-ladder nodes/edges), and COMPDRIFT
# SEAMS ON it (edge-grain stability). Aligned ONCE here so the three never drift.
#
# THE RECONCILIATION (CTO -- Amendment-2 stable-grain WITH ruling-4 distinct-by-semantic;
# they are COMPLEMENTARY, and the `stable_grain` gate enforces exactly this test):
#   - DIFFERENT RELATION   -> DIFFERENT edge_type           (ruling 4: semantic distinctness)
#   - SAME RELATION, DIFFERENT depth/grain -> SAME edge_type + a `level` attribute  (Amendment 2)
#   - NEVER split a semantic by depth (no per-depth re-typing of one relation)
#   - Node granularity likewise = a DECLARED attribute on a stable CONTAINS ladder,
#     never per-depth node re-typing. (tools[].granularity already embodies this -- grain is a
#     FIELD on a stable tool, not a re-typed home.)
# GRAPHUNI's ~D P1 population adds edge_types/levels HERE (one head); a populator that re-types a
# relation by depth instead of adding a `level` FAILS the gate at commit (B6) -- the map-true-by-
# enforcement discipline extended to grain.
# =============================================================================
grain_contract:
  principles:
    - "DIFFERENT RELATION -> DIFFERENT edge_type (ruling 4: semantic distinctness; e.g. gold READS_S3 != portal-field READS)."
    - "SAME RELATION at DIFFERENT depth/grain -> SAME edge_type + a `level` attribute (Amendment 2: grain is a declared attribute, never a re-typing)."
    - "NEVER split a semantic by depth (no per-depth re-typing of one relation)."
    - "Node granularity = a declared attribute on a stable CONTAINS ladder, never per-depth node re-typing."
  # The stable CONTAINS ladder: node grain is an ATTRIBUTE drawn from these ordered levels
  # (coarse -> fine), never a per-depth node TYPE. ONE relation (contains), many levels.
  node_grain_ladder:
    relation: contains
    edge_type: CONTAINS
    levels: [estate, surface, container, file, object, function, field]
  # The canonical RELATION vocabulary GRAPHUNI populates + COMPDRIFT seams on. SEED (GRAPHUNI
  # extends in P1). INVARIANT: each `relation` -> exactly ONE edge_type; grain difference rides
  # the `levels` attribute, NEVER a new type. distinct_relations are distinct types (ruling 4).
  # `producer` = the lane that POPULATES this edge_type (~D seam-pre-flight finding 3): the seam's
  # DECLARATIVE registry-orphan check is scoped to the producer under validation, so it never falsely
  # demands ~D populate another lane's grain. Ties to the tool-calibration sweep (each tool at its grain).
  edge_types:
    - { edge_type: CALLS,     relation: calls,     levels: [function], producer: graphuni-gold, note: "function INVOKES function (gold call graph, ~1624 edges -- the single largest gold class; what comp-blast/comp-trace traverse). DISTINCT relation (control-flow) from contains/reads_s3/runs -> distinct type (ruling 4). compute->compute (intra-stratum, not a drilldown seam). script-level call edges fold in as a `script` level if they materialize. Added per ~D pre-flight finding 1." }
    - edge_type: CONTAINS                          # ONE semantic type (no re-type, rule 7/8), MULTI-PRODUCER by stratum-pair (COO~B encoding A)
      relation: contains
      levels: [estate, surface, container, file, object, prefix, function, field]   # prefix = storage bucket-contains-prefix-key grain (~A refinement-1)
      producer: shared                             # disposition = a per-stratum-pair split (below), NOT a single slice
      producer_by_pair:
        "compute->compute": graphuni-gold          # Pipeline contains Script contains Function (~D, compute-internal)
        "resource->object": graphuni-storage       # Bucket contains Key (~A, storage -- per fleet DECOMP-MAP, ~A F3)
        "compute->object": graphuni-infra          # Lambda contains handler (~B) -- UNAMBIGUOUS: ~D confirmed (4c6fc9352) its compute-internal CONTAINS is [container,file,function] (Pipeline->Script->Function) ONLY, NOT Function->Field, so there is NO ~D compute->object CONTAINS. The earlier level-split concern is RESOLVED -> compute->object CONTAINS is cleanly ~B (the denominator partition is fully disjoint here).
      note: "the structural grain ladder -- one relation, all depths as levels; populated by DIFFERENT producers per stratum-pair (the edge_type stays single; the ATTRIBUTION partitions). Denominator partitions CONTAINS by pair, not by re-typing."
    - { edge_type: READS,     relation: reads,     levels: [field, object], producer: portal, note: "portal-field/object READ -- DISTINCT relation from READS_S3 (ruling 4). Producer=portal/TSGRAPH, NOT graphuni-gold" }
    - { edge_type: READS_S3,  relation: reads_s3,  levels: [object, prefix], producer: graphuni-gold, note: "gold/lambda reads an S3 artifact; key-vs-prefix depth = the `levels` attr, SAME type (Amendment 2)" }
    - { edge_type: WRITES_S3, relation: writes_s3, levels: [object, prefix], producer: graphuni-gold, note: "writes an S3 artifact; depth = level attr" }
    - { edge_type: DEPLOYS,   relation: deploys,   levels: [lambda, script], producer: deploy-seam, note: "GIT->CLOUD deploy edge (seam-2); producer=the deploy seam (AE/CI), NOT graphuni-gold" }
    - { edge_type: SERVES,    relation: serves,    levels: [route, served-json], producer: routing, note: "CF/route serves a payload; producer=routing/platinum, NOT graphuni-gold" }
    - { edge_type: RUNS,      relation: runs,      levels: [ec2, lambda, stepfn], producer: graphuni-infra, note: "resource RUNS compute (fractal stratum-stitcher, sec-10); EC2 -RUNS-> PipelineScript. graphuni INFRA tier (later than gold)" }
    - { edge_type: OWNED_BY,  relation: owned_by,  levels: [object, prefix], producer: graphuni-storage, note: "object/prefix S3Key OWNED_BY its bucket-resource (sec-10); S3Key -OWNED_BY-> S3_BUCKET. Producer=graphuni-storage (~A). levels=object (plain key) + prefix (trailing-slash + glob key, per node_identity forms -- ~A materializes 125 prefix-level keys eagerly, ~A refinement-1). The S3Key-vs-DDB-item entity distinction is the NODE TYPE, not the level (~A F4). Fires grain_drilldown_seams." }

  # LEVEL DISPOSITIONS (COO~B ruling 2206Z, reconciling Andrew's no-silent-caps WITH CTO boundary b/c):
  # the categorical bar = EXPLICIT-DISPOSITION-relative over the FIXED full denominator. EVERY
  # (edge_type x declared-level) carries ONE disposition: `eager` -> MUST be covered (a missing eager
  # level = a real gap = FAIL); `bounded` (boundary b) -> lazy/on-demand, covered-when-materialized,
  # NOT charged as a gap; `n_a` (boundary c) -> the type bottoms out before this level, declared-absent.
  # "COMPREHENSIVE" = every level explicitly disposed (zero undisposed); an UNDISPOSED level = the
  # SILENT GAP that FAILs. Defaults below; the producers (~D/~A/~B) refine THEIR slice's eager-vs-bounded.
  level_dispositions:
    CALLS:     { function: eager }
    CONTAINS:  { estate: eager, surface: eager, container: eager, file: eager, object: eager, prefix: eager, function: eager, field: bounded }  # storage prefix=eager (~A, 125 keys); field = deep terminal -> lazy (boundary b)
    READS:     { field: bounded, object: eager }
    READS_S3:  { object: eager, prefix: bounded }     # ~D compute READS: object=eager; prefix=bounded -- the 15 STATIC prefix-read edges materialize, but the prefix->object EXPANSION is lazy (~D precision). DISTINCT from storage prefix (~A, eager nodes).
    WRITES_S3: { object: eager, prefix: bounded }
    DEPLOYS:   { lambda: eager, script: eager }
    SERVES:    { route: eager, served-json: eager }
    RUNS:      { ec2: eager, lambda: eager, stepfn: eager }
    OWNED_BY:  { object: eager, prefix: eager }       # ~A storage: both object + prefix S3Key nodes materialized eagerly (~A refinement-1, 125 prefix keys)
  # ============ FRACTAL DRILLDOWN -- CTO section-10, RATIFIED 205709Z (FOLDED ACTIVE) ============
  # Coarse resource nodes drill to fine internal structure via stable stratum-stitching edges.
  # Folded as the 8th+9th gate rules (grain_drilldown_seams + grain_rollup_consistency) -- a pure
  # FOLD (new rule entries + checker fns), no engine refactor. CTO dispatched directly + lifted the
  # scope-guard; COO~B confirmed (mandate-first applies to the CALIBRATION sweep, NOT this fold).
  strata: [resource, compute, object]      # coarse -> fine
  drilldown_seams:                          # stratum-stitching edges (reference edge_types + the strata they bridge)
    - { edge_type: RUNS,     from_stratum: resource, to_stratum: compute }   # EC2 -RUNS-> PipelineScript
    - { edge_type: CONTAINS, from_stratum: compute,  to_stratum: object }    # LAMBDA/Script -CONTAINS-> handler/function/field
    - { edge_type: OWNED_BY, from_stratum: object,   to_stratum: resource }  # S3Key -OWNED_BY-> S3_BUCKET
  rollup:
    semantics: existential-aggregation       # CTO 047ce51d0: a coarse edge EXISTS iff >=1 fine edge rolls up (OR-rollup), NOT 1:1 equality
    rollup_via: [RUNS, CONTAINS, OWNED_BY]    # the stratum-stitchers a fine edge aggregates UP through
    example: "coarse EC2 READS S3_BUCKET  <==  fine PipelineFunction READS_S3 S3Key, where the fn rolls up (RUNS+CONTAINS) to EC2 AND S3Key OWNED_BY S3_BUCKET -- the coarse edge is the OR-rollup of the fine"
    defect_classes:
      - { id: UNSUPPORTED,       meaning: "a COARSE edge with ZERO supporting fine edges (the coarse claim has no fine basis)", verdict: FAIL }
      - { id: COARSE-INCOMPLETE, meaning: "a FINE edge whose rolled-up coarse target is ABSENT (the coarse stratum is missing an edge the fine layer implies)", verdict: FAIL }
    enforced_at: "GRAPHUNI derive / COMPDRIFT seam against POPULATED edge INSTANCES (instance-level); comp-coverage-check validates the contract is well-declared (type-level) at commit + EXPOSES comp_coverage_check.rollup_defects() so the populator + the seam call ONE canonical existential-rollup definition (the 1:1-vs-existential drift 047ce51d0 corrected must not recur)"
  pending_extensions: []                     # sec-10 now FOLDED ACTIVE; none pending

  # ============ NODE IDENTITY -- canonical convergence (COO~B encoding B; ~D input b0ffd71f5) ============
  # ONE-HEAD node identity so a producer's EDGE-target id and another producer's NODE id converge on
  # the SAME node (no dangling edge, no duplicate node). ~D emits READS_S3/WRITES_S3 to the canonical
  # S3Key id; ~A populates the S3Key node at the same id; validated at the ~D+~A /seams (Phase A).
  node_identity:
    S3Key:
      canonical_id: "<bucket>/<normalized-key>"   # bucket-QUALIFIED (globally unique across firms); no s3:// scheme; no leading slash; duplicate // collapsed; case PRESERVED (S3 keys are case-sensitive)
      forms:                                       # ~D's 288-key reference set carries 3 forms -- each a DISTINCT canonical id (no collapse)
        - { form: object, level: object, marker: "no trailing slash, no '*'", example: "opal-data-bd/gold/dimensions/accounts_dimension_latest.parquet  (273 of 288)" }
        - { form: prefix, level: prefix, marker: "trailing slash PRESERVED -- significant: a prefix node is DISTINCT from the same-path object node", example: "opal-data-bd/gold/canonical/holdings/" }
        - { form: glob,   level: prefix, marker: "literal '*' PRESERVED -- dynamic/rolling-window ref; NOT expanded, NOT collapsed into `object`", example: "opal-data-inf/bronze/orion-api-v2/*/representatives.json" }
      answer_to_D: "wildcards treated SPECIALLY -- form `object` (1) and form `glob` (3) do NOT collapse: glob keeps the literal '*' at level=prefix; object has no '*' at level=object. object/prefix/glob are 3 distinct canonical ids. Bucket-QUALIFY your edge targets (id = bucket + '/' + key) so they converge with ~A's S3Key node ids."
      level_binding: "BINDING (~A refinement-2, govern ruling): a key containing a literal '*' = level `prefix`, ALWAYS -- this OVERRIDES any ends-in-filename heuristic. Rationale: a '*' matches MULTIPLE objects (a pattern), so it is a prefix/pattern node, NOT a single object, even when it ends in a filename (e.g. bronze/orion-api-v2/*/representatives.json = level PREFIX, not object). Both the edge-target (~D) and the S3Key node (~A) MUST tag a glob key level=prefix, or the id/level won't converge (dangling edge). ~D's reference-set count must reclassify its 111 glob keys object->prefix to match (the 273-object/15-prefix split becomes 163-object/125-prefix). Validated at the Phase-A ~D+~A convergence /seams."
      convergence_check: "the ~D(edge-target) <-> ~A(node) id equality is a DECLARATIVE+MECHANICAL /seams check in Phase A (no dangling READS_S3 target, no duplicate S3Key node)."

  # ============ REFERENCEABLE-TARGET (GRAPHDEPTH invariant 5, LD-0230 EP-2; ~C builds, CTO shape) ============
  # Breadth edges may ONLY target `referenceable` nodes, never terminal structural members -- this is
  # where BREADTH composes with DEPTH (a breadth edge lands on a referenceable unit at some recursion
  # level, never a raw statement/field/prop). KEYED BY edge_type (CTO EP-2 forward-compat): the future
  # statement-grain DATA_FLOW/TAINTS narrowing (CALLS->Function, REFERENCES_TYPE->TypeDecl) is then a
  # DATA change, NOT a schema/code fork. Today every breadth edge maps to the SAME referenceable set
  # (the gross referenceable-vs-terminal gate); the keyed shape is the only forward-compat cost.
  referenceable:
    node_types: [Function, TypeDecl, Endpoint, ReactComponent, S3Key]   # VALID breadth-edge targets (referenceable units across surfaces)
    terminal_node_types: [Statement, Field, Prop]                       # raw structural members -- NEVER breadth-edge targets
    breadth_edges: [CALLS, REFERENCES_TYPE, FETCHES, READS_S3]          # the cross-surface/breadth edges this gate governs
    referenceable_targets:                                              # per-edge-type allowed-target map (EP-2-keyed); today all -> the full set
      CALLS:           [Function, TypeDecl, Endpoint, ReactComponent, S3Key]
      REFERENCES_TYPE: [Function, TypeDecl, Endpoint, ReactComponent, S3Key]
      FETCHES:         [Function, TypeDecl, Endpoint, ReactComponent, S3Key]
      READS_S3:        [Function, TypeDecl, Endpoint, ReactComponent, S3Key]

# =============================================================================
# SURFACES -- the 5-surface APEX (PRD section 2, Andrew-direct).
# FOUR territory surfaces (where state lives) + TRINO as the FEDERATION surface
# (the derived join-layer ACROSS the others -- special, NOT a peer).
# =============================================================================
surfaces:
  - id: LOCAL
    kind: territory
    store: "working tree (uncommitted scripts / .tf / src)"
    high_level_tool: "comp-heat drift"
    high_level_concern: "uncommitted-write drift -- is a commit-worthy local write still untracked/modified?"
    provenance:
      refresh_mechanism: on-demand-read       # comp-heat scans the working tree at invocation; not part of the nightly graph derive
      cadence: on-invocation
      concurrency_basis: "per-agent working tree (ephemeral, uncommitted); not a shared graph surface"
    drill_down: S1   # depth tools home here in S1 (e.g. comp-shell on new .sh)

  - id: GIT
    kind: territory
    store: "committed source (CLOUD / DEV / PROD branches)"
    high_level_tools: ["comp-heat", "comp-xray (code/config)"]
    high_level_concern: "committed-source state: object write-freshness (comp-heat) + value-MOTION / frozen-but-fresh (comp-xray)"
    provenance:
      refresh_mechanism: commit-driven         # state advances per commit; comp-heat/comp-xray read git on-demand
      cadence: per-commit
      concurrency_basis: "multi-agent commits to shared branches (CLOUD/DEV/PROD) -- high write-concurrency, captured at commit granularity"
    drill_down: S1   # comp-pipescript io, comp-validate, comp-constants home here in S1

  - id: AWS-CLOUD
    kind: territory
    store: "live AWS (S3 artifacts / Lambda / EC2 code / DynamoDB config / IAM)"
    high_level_tool: "comp-aws"
    high_level_concern: "live-AWS + Terraform-state cloud-graph (the write-path + cert)"
    provenance:
      refresh_mechanism: "event-driven (incremental_updater Lambda, near-real-time) + nightly comp-aws derive full reconcile"
      cadence: near-real-time                  # HIGH-freshness BY DESIGN
      concurrency_basis: "HIGH -- Opal runs multiagent processes IN AWS, so the estate changes continuously; event-driven freshness is matched to that intensity. (memory project_globgrph_refresh_cadence_by_concurrency_basis)"
    drill_down: S1   # comp-routes/comp-cache/comp-transform/comp-freshness/comp-secrets/comp-iam/comp-pii/comp-platinum/comp-blast/trace home here in S1

  - id: MS-CLOUD
    kind: territory
    store: "Microsoft 365 estate (Teams / SharePoint / OneDrive / mail)"
    high_level_tool: GAP                      # <-- explicit GAP, NOT invented. Feeds COMPLEARN worklist (PRD deliverable 2).
    high_level_concern: "ms-estate state -- NO dedicated comp-ms tool exists today"
    gap: true                                  # the TOOL-FRONT gap (no comp-ms) -- a real empty node -> feeds COMPLEARN worklist
    gap_note: "reachable ONLY via the m365 MCP gateway + the graph ms-`layer` column on graph_nodes; no comp-tool fronts this surface. Empty node flagged, not invented (TO scope rule)."
    provenance:
      refresh_mechanism: "batch extract only (extract_ms_cloud -> Kuzu via the same marker->refresh; NO incremental path -- CloudTrail is AWS-only)"
      cadence: batch                           # LOW-cadence BY DESIGN -- NOT a coverage gap
      concurrency_basis: "LOW -- Opal runs NO concurrent agent processes in MS / does not use Azure; batch cadence is matched to that. (Andrew-direct 2026-06-30)"
      designed_asymmetry: true                 # DISTINCT from the tool-front `gap` above
      not_a_gap_note: "the BATCH CADENCE is INTENTIONAL (Andrew-direct), NOT a coverage gap -- do NOT build an MS event-driven updater (effort against a non-need). COMPDRIFT seam-3 / any reader must read ms cadence as a designed asymmetry, not unguarded drift. The only ms GAP is the tool-front (no comp-ms), not the refresh cadence."

  - id: TRINO
    kind: federation                          # SPECIAL: the derived join-layer ACROSS the territory surfaces, NOT a peer.
    store: "federated query surface (unified heat_map / analytics; fan-in by physical catalog)"
    high_level_tool: "comp-kuzu"
    future_tool: "comp-fed"                    # future federated front (PRD section 2)
    high_level_concern: "cross-surface federated read -- the join over the derived models (Nessie->Kuzu->Iceberg) that FEED Trino"
    provenance:
      refresh_mechanism: "DERIVED -- refreshes as its backing catalogs do (iceberg nightly materialization; code_heat live-read); inherits each territory surface's cadence upstream"
      cadence: "worst-of backing catalogs (per-catalog, see trino_federation)"
      concurrency_basis: "federation has no native write-concurrency; its freshness is bounded by the slowest contributing surface/catalog -- so the per-surface cadences above explain the federation's freshness envelope"
    note: "The derived MODELS (Nessie -> Kuzu -> Iceberg) are the MAP over the territory; they FEED Trino and can DRIFT (the comp-kuzu provenance-header lesson). They are NOT surfaces. Trino's fan-in is modeled in trino_federation below."

# =============================================================================
# TRINO FEDERATION -- modeled by PHYSICAL CATALOG (ruling #3, COO~B-grounded;
# aligns the 2026-06-30 ICEBERG grain fix adc20b328). NOT per-logical-layer
# catalogs -> zero phantom per-layer seams. aws/portal/ms is a `layer` COLUMN on
# graph_nodes, not separate tables/catalogs.
# =============================================================================
trino_federation:
  fan_in_model: physical-catalog            # ruling #3 -- gate `no_trino_phantom_seam` enforces this
  catalogs:
    - name: iceberg
      kind: iceberg
      physical_tables: [graph_nodes, graph_edges, graph_contracts]   # 3 physical tables; layer(aws/portal/ms) is a COLUMN on graph_nodes
      inbound_seam: seam-6                   # the ICEBERG->TRINO fan-in seam (drift-topology.yaml; fan_in:true)
      note: "pipeline=0 nodes dropped; the old aws/portal/ms/pipeline per-layer framing was a grain mismap (corrected adc20b328)."
    - name: code_heat
      kind: hive                             # Glue hive over the code_heat parquet prefix
      inbound_seam: seam-6                   # git-code-heat binding under the seam-6 fan-in node (live-read special case)
    - name: tool_activity
      kind: future                           # COMPLEARN tool-USE telemetry catalog (not yet built)
      status: GAP
      gap_note: "future +1 catalog (PRD section 2 '+tool_activity future'); feeds COMPLEARN. Empty node flagged, not invented."

# =============================================================================
# SEAMS -- the inter-surface parity axis. We REFERENCE the COMPDRIFT seam IDs
# from drift-topology.yaml (ruling #2: ONE seam artifact). This is the static
# MAP-of-seams view: seam_id + the surfaces it spans + its owning tool. The per-seam
# parity ENGINE + verdict_vocab + disposition model live in drift-topology.yaml
# (COMPDRIFT) -- we do NOT duplicate them; we point at them.
#
# CTO S0 (b)-RULING (option ii, 2026-06-30): `coverage` is NOT stored here -- it has
# ONE home (drift-topology.yaml) and is READ at view-time from coverage_source, never
# copied (a stored copy is drift-prone -- extends seam_reference_integrity to the
# coverage field). gate rule `coverage_single_home` enforces no stored coverage.
# =============================================================================
seams:
  ref: org/modules/graph/drift-topology.yaml             # ruling #2 -- the seam IDs are DEFINED there; both loops consume them
  coverage_source: org/modules/graph/drift-topology.yaml # CTO (b)-ruling -- coverage status is READ from here at view-time, never stored/copied
  # The COMPUNIFY map-view: {seam_id, spans, owning_tool}; coverage is rendered from coverage_source at display.
  axis:
    - seam_id: seam-1
      spans: LOCAL -> GIT
      owning_tool: "comp-heat drift"
    - seam_id: seam-2
      spans: GIT -> AWS-CLOUD
      owning_tool: "comp-pipescript deployed | comp-lambdamap parity | comp-iam reconcile"   # multi-engine (per artifact class)
    - seam_id: seam-3
      spans: AWS-CLOUD -> NESSIE              # NESSIE/KUZU/ICEBERG = derived models (feed Trino), not apex surfaces
      owning_tool: "globgrph derive marker-oracle (comp-kuzu provenance header)"
    - seam_id: seam-4
      spans: NESSIE -> KUZU
      owning_tool: "comp-kuzu HEAD-advance (auto-refresh marker)"
    - seam_id: seam-5
      spans: KUZU -> ICEBERG
      owning_tool: "infra/aws/globgrph/iceberg_parity.py"
    - seam_id: seam-6
      spans: ICEBERG -> TRINO
      owning_tool: "code_heat_parity.py (git-code-heat binding COVERED); iceberg-catalog bindings UNCOVERED"
      fan_in: true                            # per physical catalog (see trino_federation.catalogs)
    - seam_id: seam-7
      spans: TRINO -> SERVED
      owning_tool: "comp-freshness + heat-view check"

# =============================================================================
# TOOLS -- S1 FULL POPULATION. Every surface/seam-homed inspection tool placed at
# exactly ONE (surface|seam) x granularity x concern home. The tooling-layer
# (router/search/gate/cache-mgmt/test/COMPLEARN) lives in `meta_tools` below -- NOT
# silently dropped; ACCOUNTED with a declared role + not_homed_reason (mirrors the
# manifest's excluded_not_graph_use_cases). Completeness = union(tools, meta_tools)
# == the full .tools/comp-* + pipescript inventory (gate `inventory_completeness`).
# Inventory ground-truthed from `.tools/` (43 comp-* + pipescript = 44) + per-tool
# concern/DISTINCT-from harvested from comp-tools.yaml (the prose this map re-homes).
# =============================================================================
tools:
  # ====================== LOCAL surface ======================
  - tool: comp-heat
    surface: LOCAL                            # LOCAL->GIT (drift) is its seam-1 ownership; freshness is the estate-object read
    granularity: object
    concern: "estate-OBJECT write-freshness + uncommitted-write drift (repo files; hot/warm/cold + archive candidates)"
    touches_resource: [freshness]
    distinct_from:
      - { tool: comp-freshness, shared_resource: freshness, my_concern: "estate-object write-freshness (repo files)", their_concern: "pipeline-DATA S3/DDB freshness (gold-run readiness)" }
      - { tool: comp-graph,     shared_resource: freshness, my_concern: "estate-object write-freshness (repo files)", their_concern: "graph-cache VINTAGE (derived-model staleness)" }
      - { tool: comp-xray,      shared_resource: freshness, my_concern: "estate-object write-freshness (wrapper mtime/size)", their_concern: "value-MOTION (frozen-but-fresh CONTENT)" }

  # ====================== GIT surface ======================
  - tool: comp-xray
    surface: GIT
    granularity: file
    concern: "value-MOTION -- is the CONTENT genuinely changing or frozen-but-fresh? (code/config/schema/served-key motion lens)"
    touches_resource: [freshness]
    distinct_from:
      - { tool: comp-heat,      shared_resource: freshness, my_concern: "value-MOTION (frozen-but-fresh content)", their_concern: "estate-object write-freshness (wrapper mtime/size)" }
      - { tool: comp-freshness, shared_resource: freshness, my_concern: "value-MOTION (content)", their_concern: "pipeline-DATA S3/DDB freshness" }
      - { tool: comp-graph,     shared_resource: freshness, my_concern: "value-MOTION (content)", their_concern: "graph-cache VINTAGE" }

  - tool: comp-pipescript
    surface: GIT
    granularity: file
    concern: "gold-script DAG -- intra-pipeline I/O (reads/writes), chains, column-gaps, portal consumers (the `deployed` subcmd serves seam-2)"
    touches_resource: []
  - tool: comp-validate
    surface: GIT
    granularity: file
    concern: "gold-artifact INVARIANT validation pre-upload (key_present/count_min/sum_approx/...; the no-crash-but-wrong-output gate)"
    touches_resource: []
  - tool: comp-constants
    surface: GIT
    granularity: symbol
    concern: "marker/firm-CONSTANT drift vs canonical config (rep_id sweeps, FIRM_ID, AUA bounds; pre-commit gate)"
    touches_resource: []
  - tool: comp-shell
    surface: GIT
    granularity: file
    concern: "Rule-16 bare-util scan in new .sh (Git-Bash-3.6.7-missing pgrep/pkill/flock/pidof/setsid/wget)"
    touches_resource: []
  - tool: comp-types
    surface: GIT
    granularity: type
    concern: "TS TYPE consumers/blast/fields before editing a shared type"
    touches_resource: []
  - tool: comp-xref
    surface: GIT
    granularity: symbol
    concern: "SYMBOL cross-ref across graph nodes/edges + graph-state diff-vs-baseline"
    touches_resource: [trace-graph]
    distinct_from:
      - { tool: comp-trace, shared_resource: trace-graph, my_concern: "symbol OCCURRENCE lookup (where is X referenced)", their_concern: "dependency PATH walk (where does data come/go)" }
      - { tool: comp-blast, shared_resource: trace-graph, my_concern: "symbol OCCURRENCE lookup", their_concern: "IMPACT set (what breaks)" }
      - { tool: comp-diff,  shared_resource: trace-graph, my_concern: "symbol OCCURRENCE lookup", their_concern: "uncommitted-CHANGE blast" }
  - tool: comp-diff
    surface: GIT
    granularity: file
    concern: "map git/uncommitted CHANGES to graph blast radius (pre-commit/post-pull/pre-deploy)"
    touches_resource: [trace-graph]
    distinct_from:
      - { tool: comp-trace, shared_resource: trace-graph, my_concern: "uncommitted-CHANGE blast", their_concern: "dependency PATH walk" }
      - { tool: comp-blast, shared_resource: trace-graph, my_concern: "uncommitted-CHANGE blast", their_concern: "IMPACT set (what breaks)" }
      - { tool: comp-xref,  shared_resource: trace-graph, my_concern: "uncommitted-CHANGE blast", their_concern: "symbol OCCURRENCE lookup" }

  # ====================== AWS-CLOUD surface ======================
  - tool: comp-aws
    surface: AWS-CLOUD
    granularity: graph-node
    concern: "IAM-as-graph-nodes -- the live-AWS cloud-graph estate topology (17 node classes; the WRITE-PATH + cert; the LIVE half of the desired-vs-live overlay)"
