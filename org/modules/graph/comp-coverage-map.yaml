    concern: "honesty/completion GATE over the GOV-A invariants (I1 honest-missing / I2 measure-per-case / I3 control-fires-when-exercised); claim+evidence (or --file src.py) -> per-invariant PASS/FAIL/N-A, makes NFRA_SEMCTL_HONESTY_INVARIANTS.md runnable (N-A is LOUD, never a silent pass)"
    touches_resource: []
