# >>> THE COHERENCE LAW -- READ THIS BEFORE ANY OTHER ONTOLOGY DOCUMENT <<<
# C2 (motifs) and C3 (systems) are AGNOSTIC STRUCTURAL layers: recurring path-shapes and their
# connected aggregations, named in the 14-role / 10-relation vocabulary. They are NOT debt
# concepts. The six detector motifs (silent-display-fork, cross-firm-asymmetry, hardcoded-firm-
