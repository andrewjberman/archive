# =============================================================================================
# C4 SEGMENTS -- THE AGENT ROUTING LAYER (Andrew-direct 2026-07-30: "Segments may be a better
# name than Verticals ... it needs to be immediately obvious to those agents where to look.
# Each C4 segment is a registry of C3 systems." Names ratified by Andrew this session,
# incl. renames 3 -> Interactive Products, 5 -> Global Infrastructure.)
#
# PURPOSE: when a user queries an agent, the agent STARTS HERE. Each segment carries a dense
# high-signal description -- the token surface a real query hits. Route: C4 segment -> C3 system
# -> C2 motif (D2 chain) -> C1 -> C0. The C3.ii SEMANTIC VERTICALS (re-slotted from "overlay on
# C4" 2026-07-30; count is the resolver's, never this comment's) are listed per segment,
# listed per segment; both entry paths land in the same registries.
# =============================================================================================
# =============================================================================================
# C4 SUBJECT x FUNCTION GRID -- the MECE schema UNDERNEATH c4_segments.
# Ratified Andrew-direct 2026-08-12 (CRO terminal). Terms Subject/Function are registered in
# infra/system/ontology/SYSTEM_DEFINITIONS.yaml and CITE this block as their authority.
# =============================================================================================
c4_subject_function_grid:
  status: RATIFIED 2026-08-12 (Andrew-direct, CRO terminal)
  purpose: >
    The five c4_segments are a ROUTING INDEX, not a classification. This grid is the
    classification they index. A segment is a NAMED QUERY over this grid -- optimized for agent
    RECALL, deliberately overlapping -- and the grid is what denominators resolve against.
    Rationale, Andrew-direct verbatim -- "the premise of C4 is to broadly cover what the Opal
    system does/contains". The prior single axis mixed a subject cut and a function cut on one
    level (Rule 24(ii) grain incoherence), the same flattening that retired Territory one rung
    down (substrate x deploy_state on one axis).
  subject:
    question: What world does this describe?
    postulate_note: >
      MECE over the three worlds Opal touches. client and market are EXTERNAL referents;
      estate is SELF-REFERENTIAL, and that asymmetry is the normal shape of a system that
      observes itself, not a defect. estate passes the residue-bucket test -- its contents are
      statable POSITIVELY (graph infrastructure, the agent fabric and its ops, the ontology,
      comp-tooling, governance records) rather than as "everything else". Contrast
      UNASSIGNED-RESIDUE in c3_deterministic_structures, which genuinely IS a residue bucket
      and is named as one.
    values:
      client: >
        Advisor-, client- and partner-level data and the systems over it -- the business we
        run. Andrew-direct: "advisor-level data and systems, e.g. the advisor intelligence and
        model portfolio portal products and what they consume."
      market: >
        Non-client external financial data and the systems over it -- the environment we
        operate in. Andrew-direct: "non-partner data and systems, e.g. the market overview
        portal product and most of the data coming in from bloomberg and factset that is not
        explicitly about clients/their data, e.g. the news scanner and news ingestion backend."
      estate: >
        Opal's own machinery as the subject -- the instrument we operate with. The referent is
        the Estate itself (SYSTEM_DEFINITIONS Estate = THE COLLECTIVE SUBSTRATE, re-ruled the
        same day). Andrew-direct: "the tools i use to build the estate, like the multiagent
        fabric and their ops, ontology, graph infrastructure (kuzudb/trino/nessie/iceberg)."
        ⛔ NOT named `internal` or `infra` -- Andrew floated both and they were declined WITH a
        reason: `internal` is an AUDIENCE word (not-customer-facing), and audience is a
        DIFFERENT discriminator already separating the experience column from this row, so
        placing it here would re-import the exact two-principles-on-one-axis flattening this
        grid exists to remove. `infra` implies plumbing and excludes the ontology and
        governance records, which are not plumbing.
  function:
    question: What role does it play in the system?
    postulate_note: >
      COARSE BY DESIGN. Andrew-direct -- "Function is good and it doesnt matter if multiple
      things are done under that; i dont think it needs to be single action, will never be the
      case of a systems level abstraction layer." Rule 24(i) binds on values being mutually
      EXCLUSIVE, never on values being ATOMIC; a function value covering several actions is
      correct, not a violation.
    values:
      acquisition: Ingest, refine and store -- feeds, medallion pipelines, converters, bronze/silver/gold.
      analysis: Compute and engines -- analytics, scoring, models, derived research artifacts.
      serving: Delivery, identity and access -- serving routes, user tables, gateway, IAM.
      experience: A tool or surface a human operates directly -- portal tools, agents, CLIs.
      build: >
        COLLAPSED 2026-08-19 (Andrew-direct at the CRO terminal, /open-calls card 2, VERBATIM
        "All recs approved, go ahead and implement as necessary" -- ruling on the W-24
        placement-pass report @19f3d59ebd). NEVER RATIFIED; the provisional question this value
        carried is ANSWERED EMPIRICALLY: zero of the 138 ground-set chains are deploy/CI
        machinery, and every estate-row chain placed cleanly in the four ratified values --
        exactly the collapse the provisional text hypothesized ("the tools I use to build the
        estate" is already fully described by subject:estate spanning the four functions).
        THE GRID IS THE CLEAN 3x4. Ground-set caveat carried with the ruling, so the collapse
        is never over-read: deploy/CI tooling sits OUTSIDE the C4 chain ground set by
        construction (operator-gated deploy tools land estate x experience; standing law
        permits no autonomous deploy machinery for a build column to hold). Records:
        org/tier1_exec/4.0.0_SA_CRO/deliverables/W24_29VERTICAL_PLACEMENT_PASS_20260819.md s6 +
        ANDREW_DIRECT_20260819_W24_RULINGS_ALL_RECS_APPROVED.md. Retained as a TOMBSTONE so the
        question stays legible as asked-and-answered, never re-opened as an oversight.
  segment_definitions_note: >
    Each of the five c4_segments resolves to a ROW or a COLUMN of this grid. Three rows plus
    two columns is exactly the five segments -- which is the structural reason the segments
    overlap at all. (Moved OUT of segment_definitions 2026-08-20 so that block's keys ARE the
    member set -- 5 keys = 5 segments -- and a keys-based count never reads 6 != 5 as a false
    membership mismatch; CRO 63878 / census R010 namespace-mixing finding. The grid's member
    predicate is now "keys of segment_definitions", no exclusion clause needed.)
  segment_definitions:
    partner-data: subject:client (ROW)
    market-intelligence: subject:market (ROW)
    andrew-infrastructure: subject:estate (ROW) -- renamed from estate-infrastructure, Andrew-direct 2026-08-12
    interactive-products: function:experience (COLUMN)
    access-delivery: function:serving (COLUMN)
  overlap_law:
    rule: >
      A ROW and a COLUMN MUST intersect -- a row-x-column overlap is CORRECT BY CONSTRUCTION and
      is never a finding. A ROW-x-ROW overlap is a DEFECT -- rows are mutually exclusive by
      MECE, so a vertical served by two rows has an UNRESOLVED SUBJECT and requires adjudication.
    measured_2026_08_12: >
      38 assignment slots over 29 distinct verticals. 8 verticals are multi-segment -- 6 are
      row-x-column (legitimate) and 2 are row-x-row (defects, named below).
    # Cells below RESOLVED at the W-15 one-touch 2026-08-20 [content authored 3.0.0_SA_CVO per
    # @51285984d6, placed by 0.8.0]; prior texts in git history.
    open_adjudications:
      model-portfolios: >
        RESOLVED 2026-08-20: entry merged into mdpf (W-24 ratified form); subject adjudicated
        client (W-27). The ambiguity dissolved with the duplicate entry.
      ops-internal: >
        RESOLVED-BY-DECOMPOSITION 2026-08-20: the catch-all read was correct -- members re-homed
        (ops-ec2-governance-lambdas + ops-anomaly-scanners -> observability @eb58b97bc7;
        PPI-13 -> canonical-schwab; semantic-pipeline-parallel-set -> news at this touch;
        yfinance scaffolds retired per W-26), container DISSOLVING, see the vertical entry note.
    semantically_suspect_not_a_defect:
      portfolio-management: >
        RESOLVED 2026-08-20 by W-28: subject is CLIENT, not estate -- the flagged oddity was
        real and the assignment answers it; COL(experience) x ROW(client) is row-x-column
        legitimate.
  # vertical_subject_assignments -- ruled values on the RATIFIED subject axis (Andrew "All recs
  # approved" @27f941ede5; adjudication @51285984d6; placed at the W-15 one-touch 2026-08-20).
  # [content authored 3.0.0_SA_CVO, placed by 0.8.0] Rule-24 note (CVO's, carried verbatim): this
  # extends the RATIFIED grid section at its own grain and intent (subject mapping); no new axis
  # and no new schema field on the verticals roster is minted; the Stage precedent (per-entry
  # fields need their own declared population act) is deliberately not repeated here.
  vertical_subject_assignments:
    mdpf: client                    # W-27 -- applies to the MERGED row, same pass as the merge, per its own rider
    portfolio-management: client    # W-28 -- ALSO RESOLVES the grid's semantically_suspect cell above
    trade-submission: client        # F-1
    security-scanner: 'market (live factor-scanner chain); split ruled F-2 -- see the split note at the vertical entry'
  non_summable_rule:
    rule: >
      ⛔ C4 IS NOT SUMMABLE. Per-segment vertical counts total 38 across 29 distinct verticals,
      so any per-segment denominator OVERSTATES BY 31 PERCENT. Report denominators against the
      GRID (subject x function), never against segment membership.
    why: >
      This is the same law as SYSTEM_DEFINITIONS Substrate_Side one rung down -- a presentation
      device that is CORRECT as a cover and WRONG as a partition. Substrate_Side pooled an
      average across populations with no shared scale (79.3 vs 13.2 averaging to 38.4, which
      described neither); C4 double-counts membership. Same failure, two grains, one rule.

c4_segments:
  partner-data:
    display_name: Partner Firm Data
    registry: [sys-bd-medallion, sys-inf-medallion, sys-cot-mdpf-assets, sys-smartx-feed]
    residue_inbound: [canonical-schwab chains]
    verticals_served: [advi-bd, advi-inf, advi-cot, mdpf, smartx, canonical-schwab, partners, etf-reports]  # model-portfolios folded into the already-listed mdpf (merged row, W-15 touch)
    high_signal: >
      Everything that ingests, refines, and stores partner firm financial data: the per-firm
      medallion pipelines (bronze, silver, gold, platinum) for 49 Financial / 49F / Black
      Diamond / BD, Inflection / Orion, Cottonwood, and the SmartX and Schwab CRS/RPS feeds.
      Look here for AUM, AUA, holdings, positions, lots, transactions, allocations, fees,
      realized and unrealized gains, NNA, net new assets, advisor assignments, client
      dimensions, custody data, account data; the firm buckets opal-data-bd, opal-data-inf,
      opal-data-cot, opal-data-assets, opal-data-schwab; gold scripts (A_00..D_00, INF_*, cot
      trees), silver converters, bronze ingest triggers, EC2 runners, SSM download documents,
      EventBridge pipeline crons, fact_* and dim_* tables, parquet artifacts, and the mdpf /
      Model Portfolios aggregate feeds. Questions that live here: is the data fresh; did last
      night's pipeline run; why is an account or AUM number wrong; where does this parquet come
      from; what writes silver or gold for firm X; is the deployed code current on S3. Firm
      separation is law in this segment: bd, inf, and cot never mirror.
  market-intelligence:
    display_name: Market & Research Intelligence
    registry: [sys-yang-analytics-engine, sys-market-intelligence-engine, sys-news-intelligence-engine, sys-macro-data-engine, sys-causality-engine]
    flags: [sys-causality-engine ADJUDICATED WINDING_DOWN 2026-07-30 (then-prose RETIREMENT-PENDING, respelled at the 2026-08-20 Stage-enum ratification) -- producers DEAD on applied plane; teardown owed to VELOCITY WS-E3 (keep-dormant), never map-side]
    verticals_served: [cma, correlation, factor-tilts, macroeconomics, market-overview, mdpf, positioning, valuation, news, causality, trade-submission, ops-internal, ceo-digest]  # model-portfolios -> mdpf (merged row, W-15 touch); segment recall-listing is legitimate overlap
    high_signal: >
      The shared quantitative analytics and research-generation engines that compute what the
      portal knows about markets -- one engine serves many products by design. Look here for
      capital market assumptions (CMA), correlation matrices, factor tilts, volatility,
      valuation models, risk premia, positioning, attribution, the yang pipeline family; news
      ingestion and scanning, Seeking Alpha, FinBERT sentiment scoring, keyword and trending
      analysis, fear and greed index, sentiment gauges; FRED and macroeconomic series;
      generated research artifacts (executive summaries, market updates, thematic signals,
      causality and trade-idea generation); the opal-news-articles DynamoDB table; and served
      artifacts under json/sentiment/*, json/valuation/*, json/positioning/*. Questions that
      live here: where does this chart's number come from; what scores sentiment; what
      generates the daily market update; which model produced this factor, correlation, or
      valuation value; why is a sentiment or macro artifact stale.
  interactive-products:
    display_name: Interactive Products
    registry: [sys-portfolio-management-suite, sys-trade-submission-engine]
    verticals_served: [portfolio-management, trade-submission, market-overview, ticketing]
    high_signal: >
      The interactive product machinery -- where a user DOES something rather than reads
      something: portfolio management workflows, model portfolio selection, rebalancing views,
      proposal building, and the trade submission path (trade tickets, order intake, submission
      tracking, ticket APIs). Distinct from pages that merely render data: this segment owns
      the chains where user action flows back INTO the estate. Questions that live here: what
      happens when an advisor submits a trade; where does a ticket go; what backs the
      portfolio-management page's interactive state; which lambda handles this user action;
      why did a submission fail.
  access-delivery:
    display_name: Access, Identity & Serving
    registry: [sys-partner-serving-platform]
    verticals_served: [partners, portal-infra, data-refresh, ops-internal, advi-inf, mdpf]
    high_signal: >
      The spine every request crosses between a browser and the data: authentication,
      authorization, OTP login, the portal authorizer, session and token handling, Secrets
      Manager auth config; CloudFront distributions, Lambda@Edge origin-request and
      origin-response routers, firm-scoped origin rewriting (shared-advisor-router); API
      Gateway partner data APIs (/api/scoped/*, /api/general/*); the portal proxy,
      cache-control headers, data-refresh endpoints, CORS and error-body shaping. Look here
      when a page 401s or 403s; a partner sees the wrong firm's path; an artifact serves stale
      from CDN cache; an endpoint 404s or returns HTML instead of JSON; or the question is who
      is allowed to see what, through which route. If the data is right in the bucket but
      wrong in the browser, the answer is in this segment.
  andrew-infrastructure:   # RENAMED 2026-08-20 from estate-infrastructure at THIS key (the c4_segments home) under the Andrew-direct 2026-08-12 naming act (registry v2.1: "the audience is the discriminator; naming it makes explicit what 'estate' left implied") -- segment_definitions (:519) and the registry already carried the new name; this key was the intra-file second home (CRO 63878, atom_layer0 Segment run B-C4-SEGMENTS-CARRIER). Engine reads keys generically (opal_estate_infrastructure.py:676); no consumer indexed the old literal.
    display_name: Andrew Infrastructure   # lineage: global-infrastructure (Andrew 2026-07-30) -> estate-infrastructure -> andrew-infrastructure (Andrew 2026-08-12): the segment that maintains the Estate itself -- coherent under the reservation, not colliding with it
    registry: [sys-estate-ops-platform]
    note: observation chains (watchdog-observe motif) route here even when the observed thing
      lives in another segment -- the observed belongs to its segment, the observing belongs here.
    verticals_served: [graph-platform, security-scanner, m365-mcp, insurance, ops-internal, portfolio-management]
    high_signal: >
      The estate's self-knowledge and self-maintenance: the dependency graph platform (Kuzu,
      Nessie, Iceberg, Trino, the comp-tools substrate), case-find, security scanning, secrets
      sweeps, access-anomaly detection, the m365 gateway (Teams, SharePoint, email
      integration), agent fabric infrastructure, and the watchdog, parity, liveness, and
      keepalive chains -- file-presence checks, value-parity validators, partition checkers,
      EC2 runtime monitors, canaries. Questions that live here: what depends on X; what breaks
      if I change Y; is the graph current; did a watchdog fire; is a monitor's silence
      meaningful; where is the telemetry or audit record; anything about comp-tools, agents,
      or the estate observing itself.

# =============================================================================================
# TERMINOLOGY LAW -- "ESTATE" (scan ordered by Andrew 2026-07-30; ~208 uses across NFRA PRDs)
# =============================================================================================
terminology_law:
  estate: >
    RESERVED. "The estate" means the WHOLE live operational surface (AWS + pipelines + portal +
    records) -- it is the ratified ALL-value of the ONTOLOGY2 scope enum [estate, tree, firm,
    pipeline, motif, partition-window, single-artifact], and it is additionally reserved by the
    LOCKED-but-unbuilt estate WHERE-axis design (ESTATE_AXIS_AND_SEAM_GRAIN_DESIGN.md: do not
    consume as live vocab until built). NEVER a segment, system, or layer name. The historical
    "C1 estate" tier shorthand was formally corrected (01_substrate.md). "Semantic estates"
    (plural, qualified -- the comp-estate tool name, Andrew-chosen) refers to the
    business-thread traversal domain and is the ONLY sanctioned qualified use; never shorten
    it to bare "estate(s)".
  substrates: >
    The RATIFIED platform partition of the Estate: the graph layer axis materializes C0-C3
    SEPARATELY per substrate -- aws, portal, ms, pipeline (derive_runner NODE_TYPE_LAYER;
    GLOBGRPH numbers the partition L1-L7 at design level). "Substrate" is the word for WHICH
    PLATFORM a thing lives on. DEPRECATED LOOSE USE: per-platform "estate" phrasing ("the
    SharePoint/OneDrive estate", 01_substrate.md) -- under the reservation, a platform is a
    SUBSTRATE of the Estate, never an estate of its own.
  territory_vs_map: >
    SPLIT 2026-08-21 (3.0.0_SA_CVO owner act on 4.0.0_SA_CRO~C Runs 42/43, grounded on the
    registry's own Territory entry at infra/system/ontology/SYSTEM_DEFINITIONS.yaml:114-119).
    THIS BLOCK WAS HALF-LIVE: one paragraph carried a SURVIVING doctrine and a RETIRED
    classification with nothing distinguishing them -- inside the file whose job is to fence
    this word. The halves are now separated and labelled.

    (a) SURVIVING -- THE DRIFT ASYMMETRY (Territory.binding_residue sense (a); the entry it is
    preserved ON is Map). The derived models (Nessie -> Kuzu -> Iceberg) are the MAP layer: a map
    CAN drift and therefore always carries provenance; the thing it represents cannot. "Map" = a
    derived representation. THIS IS LIVE LAW and is the sense in which the pairing is still used.

    (b) RETIRED -- THE FOUR-SURFACE CLASSIFICATION (LOCAL, GIT, AWS-CLOUD, MS-CLOUD as an apex of
    "territory surfaces"). RETIRED 2026-08-12, Andrew-direct, VERBATIM: "Territory is not actually
    useful here, that is already covered by substrate". WHY RETIRED RATHER THAN MERELY REDUNDANT:
    the four values were TWO AXES FLATTENED ONTO ONE (Rule 24(ii)) -- LOCAL and GIT are DEPLOY
    STATES of a code substrate; AWS-CLOUD and MS-CLOUD are SUBSTRATES -- and the word's existence
    was the EVIDENCE that the deploy axis existed unnamed. It decomposes WITHOUT LOSS into
    Substrate x Deploy_State, both ratified. MIGRATE: LOCAL/GIT -> Deploy_State; AWS-CLOUD ->
    Substrate aws; MS-CLOUD -> Substrate ms. NFRA_COMPUNIFY_PRD.md#2's 5-surface apex is retained
    as HISTORICAL, never as live canon. UNAFFECTED: TRINO's FEDERATION role -- Federation is its
    own ratified entry (the derived join-layer, special, not a peer surface); the retirement bound
    the four-value classification, not the federation layer above it.

    SWEEP WARNING -- why this block is FENCED rather than deleted: a bare-word sweep matching
    "territory" against the deprecation commits the homonym error (~30 false positives measured
    2026-08-19 on this term alone). TWO senses survive unbound: (a) above, and the GRAPHLEARNS
    territory-PREDICATE sense (an extractor's declared territory minus produced nodes). Adjudicate
    WHICH SENSE in context; never match the bare word against the status.
  surface: >
    Scoped, not free: (a) a TERRITORY or FEDERATION surface (COMPUNIFY apex, above); (b) a
    tool's declared coverage space (boundary_report address_space); (c) genesis-surface doc
    tags. Do not coin new senses; qualify which sense on use.
  plane: >
    RATIFIED sense: DESIRED vs APPLIED (the ONTOLOGY2 plane axis -- config/TF vs live). The
    loose usage "planes (AWS / pipeline / frontend / M365)" for platform partitions is
    DEPRECATED in favor of SUBSTRATES.
  segments_vs_verticals: >
    C4 = SEGMENTS (Andrew 2026-07-30): the five agent-routing registries of C3 systems above.
    VERTICALS ARE C3.ii (re-slotted 2026-07-30 from the earlier "business overlay on C4"
    framing this block briefly carried): the declared semantic partition of the SAME chain
    ground set C3.i partitions deterministically -- listed per segment, many-to-many with
    C3.i by design; the count is the resolver's, never prose's. An agent routes segment ->
    structure -> chain; a business question may equally enter by C3.ii vertical name and
    lands in the same registries.
