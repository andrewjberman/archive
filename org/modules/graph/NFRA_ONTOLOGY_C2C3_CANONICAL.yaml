# defect-shaped departures FROM these canonical forms, absorbed from a defect-detector library.
# They remain valid AS deviation motifs. Presenting them as 'the C2 catalog' or their clusters
# as 'the C3 systems' is the exact incoherence this file exists to kill: THE PRIMARY POPULATION
# OF C2/C3 IS THE CANONICAL CATALOG BELOW. A debt motif is a shadow; this file is the object.

