# ---------------------------------------------------------------------------------------------
# C2 -- THE TWELVE CANONICAL PATH-MOTIF FAMILIES (agnostic; defined in role vocabulary)
# ---------------------------------------------------------------------------------------------
c2_motif_families:
  scheduled-ingest:
    shape: 'Trigger(cron) -> Producer -> Store(raw/bronze)'
    canon_binding: 'PIPELINE_CANON (first hop)'
    meaning: 'Cadence-driven acquisition of external/source data into the raw layer.'
    first_pass_recurrence: 2
  staged-transform:
    shape: 'Store -> Trigger(event) -> Transformer -> Store(next layer)'
    canon_binding: 'PIPELINE_CANON (inner hop)'
    meaning: 'Layer-to-layer refinement fired by upstream landing (the medallion inner step).'
    first_pass_recurrence: 2
  orchestrated-compute:
    shape: 'Trigger -> Router -> Producer(EC2/StepFn) -> Store'
    canon_binding: 'PIPELINE_CANON (heavy variant)'
    meaning: 'A lambda marshals heavy compute (EC2 runner / StepFn) whose output lands in a Store.'
    first_pass_recurrence: 12
  fanin-quorum:
    shape: 'Store xN -> Observer(quorum) -> Trigger(downstream)'
    canon_binding: 'PIPELINE_CANON (junction)'
    meaning: 'Multiple upstream completions observed until quorum, then downstream fired once.'
    first_pass_recurrence: 3
  publish-serve:
    shape: 'Store(gold) -> Trigger -> Transformer(publisher) -> Store(served) -> Consumer(frontend)'
    canon_binding: 'SERVED_LINEAGE_CANON'
    meaning: 'Event-driven publication of refined data into served artifacts consumed by the portal.'
    first_pass_recurrence: 7
  scheduled-publish:
    shape: 'Trigger(cron) -> Producer -> Store(served) -> Consumer(frontend)'
    canon_binding: 'SERVED_LINEAGE_CANON (cadence variant)'
    meaning: 'Cadence-driven regeneration of a served artifact.'
    first_pass_recurrence: 10
  generative-publish:
    shape: 'Trigger -> Producer(model/LLM) -> Store(served) -> Consumer'
    canon_binding: 'SERVED_LINEAGE_CANON (generative variant)'
    meaning: 'A generation step (LLM/model inference) producing a served artifact.'
    first_pass_recurrence: 14
  api-serve:
    shape: 'Consumer(request) -> Gateway -> Producer(handler) -> Store(read) -> response'
    canon_binding: 'AUTH_CANON + SERVED_LINEAGE_CANON'
    meaning: 'On-demand serving through an API surface reading Stores at request time.'
    first_pass_recurrence: 25
  edge-route:
    shape: 'Gateway(CDN) -> Router(edge) -> Store'
    canon_binding: 'AUTH_CANON (edge leg)'
    meaning: 'Request-path rewriting/steering at the edge to firm-scoped origins.'
    first_pass_recurrence: 30
  access-guard:
    shape: 'Gateway -> Guard -> policy verdict'
    canon_binding: 'AUTH_CANON (guard leg)'
    meaning: 'Authorization: identity resolved to an access verdict gating everything behind it.'
    first_pass_recurrence: 2
  enrichment-writeback:
    shape: 'Store -> Transformer -> SAME Store (in-place)'
    canon_binding: '(no canon yet -- candidate)'
    meaning: 'In-place enrichment: read rows, compute, write fields back to the same Store.'
    first_pass_recurrence: 5
  watchdog-observe:
    shape: 'Trigger -> Observer -> Sink(signal only, no data artifact)'
    canon_binding: '(no canon yet -- candidate)'
    meaning: 'Observation-only chains: presence/parity/liveness checks emitting signals, never data.'
    first_pass_recurrence: 5

