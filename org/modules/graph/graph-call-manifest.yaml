    # repo", "where is this defined"). The registration gate checks that a tool SURFACES FOR ITS
    # OWN use_case, and it caught this: the first phrasing here was prose no route matched, so
    # comp-which grepped instead of naming the tool. A use_case nobody can route to is a use_case
