    use_case: "Named-thread estate traversal entry point: comp-estate news -> every resource in that named thread + producers->served->frontend + owning tool + coverage + debt flags. What is IN the <name> pipeline or named business thread, across the whole estate with no silent Unknown. RENAMED from bare pipescript (Andrew-direct 2026-07-29/30): the bare name is PROHIBITED, its executable is an rc=2 tombstone, and it no longer resolves on PATH -- the retained-for-transition clause is DISCHARGED (CVO GATE-0 readiness pass 2026-07-30)."
