  comp-debris:   { does: "Coldest-first cloud-resource invocation-coldness ledger (advisory; NEVER deletes): ranks lambdas by oldest last-invocation (dormancy AFTER activity). never-invoked!=cold (STILLBORN-OR-GUARD purpose review by creation age); UNKNOWN is a band; hold-aware; fusion is a separate confirmation pass. Read-only. Extended IN-PLACE (ruling B @97f6a8b70) to a MULTI-RESOURCE-PLANE ledger via --types ddb,s3,ec2,events (default lambda byte-for-byte unchanged) -- one classify, N adapters (debris_adapters.py), reusing classify/BANDS/_HELD_RX with trading-calendar dormancy (T-1 data) + cadence-aware windowing folded. Engine comp_debris.py", subcommands: ["--types <lambda|ddb|s3|ec2|events>", "--days N", "--hot-days N", "--json", "--self-test"], entries: [cloud.debris.coldness_ledger] }
  comp-atomcheck: { does: "Product-ARCHETYPE CONFORMANCE runner (READ-ONLY, never a monitor): one verdict row per atom per product x firm -- {atom, scope, verdict, evidence, denominator, why?} over CONFORMS / VIOLATES / NOT-CHECKABLE-BY-THIS-RUNNER. v1 legs: 1 root-grammar, 3 manifest-coverage (BOTH the partition-local and _manifests sidecar conventions, resolved at scope+table+date grain), 5-floor schedule (sweeps BOTH the events and scheduler planes -- one cannot see the other), 7-spelling, 8 lineage-declaration COVERAGE (never veracity), 9 provenance-columns. Atoms 2/4/6 + the residue halves of 5/7 print NOT-CHECKABLE WITH A WHY and can never print CONFORMS. UTC provenance header on every run; a live-written root moves between reads. Engine atomcheck_cli.py", subcommands: ["--product P --firm F", "--atom N", "--json"], entries: [cloud.product.archetype_conformance] }
  comp-trigger:  { does: "EventBridge/Scheduler trigger-dispatch forensics (READ-ONLY): what fires X, ENABLED/DISABLED live state, targets, fired-evidence (TriggeredRules w/ printed denominator; absence != never-fired), TF declared-ness (text-scan; cannot tell landed from planned). No write path by construction. Engine comp_trigger.py", subcommands: ["<name-or-target-substring>", "--list", "--days N", "--json", "--self-test"], entries: [cloud.trigger.dispatch_forensics] }
