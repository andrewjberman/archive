# graph-call-manifest.yaml — the authoritative catalog of EVERY graph use-case -> its canonical call.
#
# NFRA_GRAPHS (PRD: docs/architecture/NFRA_GRAPHS.md). Referenced in CLAUDE.md and MANDATED: any code
# change or agent workflow that derives/rebuilds/queries the dependency graph MUST use the `canonical`
# call for its use-case. Default to QUERY (comp-kuzu / cached comp-trace); REBUILD only to preempt a
# staleness you just created, or on the scheduled refresh. Gate: comp-manifest-check (advisory -> blocking).
#
# STATUS: v0.1 SCAFFOLD (1.0.0_SA_CTO 2026-06-11). Seeded with the high-frequency canonical calls; full
# coverage (one `canonical` per distinct use-case across all ~30 comp-* tools + the Kuzu Cypher surface)
# is the AC1 close-gate. Cross-layer entries are `planned` until NFRA_GLOBGRPH P2-STITCH lands.
#
# Per-entry schema:
#   id:              stable dotted id (layer.topic.specific)
#   use_case:        the question this answers, in agent terms
#   canonical_call:  the exact command / Cypher to run
#   tool:            comp-kuzu | comp-trace | comp-blast | comp-platinum | comp-pipescript | ...
#   mode:            query | query-cached | rebuild
#   layer:           cloud | trace | cross-layer | pipeline
#   cost:            "~ms" | "~2s" | "~9.8s" | "~8min"
#   freshness:       how current the answer is + what backs it
#   rebuild_trigger: when to force a rebuild INSTEAD of querying (staleness-preempt)
#   anti_pattern:    the slower/ad-hoc thing NOT to do
#   status:          canonical | deprecated | planned
#   superseded_by:   (deprecated only) the canonical id that replaces this

# INTENTIONALLY NOT CATALOGED (not graph-access use-cases -> exempt from the mandate, AC1-complete):
#   comp-learns-run / comp-learns-status  -- compiler self-learning/telemetry harness (not a graph query)
#   comp-perf                             -- tool-perf benchmarking (not a graph query)
#   comp-v5-composite-test.sh             -- tool regression test
excluded_not_graph_use_cases: [comp-learns-run, comp-learns-status, comp-perf, comp-v5-composite-test, comp-manifest-check]  # comp-manifest-check = the D6 manifest-ENFORCEMENT gate (polices this manifest, not a graph-query use-case)

contract:
  default: QUERY        # comp-kuzu (cloud/cross-layer) or cached comp-trace/comp-blast (trace)
  rebuild_only_when:
    - "you changed something the graph does not yet reflect AND you need it now (preempt staleness)"
    - "the scheduled refresh (cloud: nightly 02:00 derive->Nessie->kuzu_nessie_load; trace: comp-build)"
  rule: "Never rebuild the full graph to answer a traversal a query can answer."

entries:

  # ---- CLOUD GRAPH (Kuzu / comp-kuzu) — the fast query layer ----
  # PROVENANCE CONTRACT (TO-F1, AC10a): every comp-kuzu invocation prints a
  # provenance header to STDERR from the DB's `<db>._build_manifest.json`
  # sibling -- DB, built-when, source vintage (tarball key / Nessie dual
  # snapshot-id pin / stitch file+mtime), node/edge counts. Build age > 26h
  # (missed-nightly) => WARN: STALE. Nessie-sourced DBs print live
  # commit-distance "BEHIND Nessie HEAD by N commits" (count of warehouse
  # graph_nodes metadata.json newer than the pin). A manifest-less DB =>
  # loud UNKNOWN VINTAGE. Header is stderr-only so --json/table stdout stays
  # parseable. The graph is a minutes-stale-and-LABELED traversal surface,
  # never a read-your-own-writes verification substitute (verify vs served
  # artifact / live AWS). Stamped by kuzu_load / kuzu_nessie_load / kuzu_stitch_load.
  - id: cloud.lookup.nodes_by_type
    use_case: "List/inspect cloud resources of a type (all Lambdas, all S3 buckets, all roles)."
    canonical_call: |
      comp-kuzu "MATCH (n:CloudNode) WHERE n.node_type='LAMBDA' RETURN n.id, n.name LIMIT 50"
    tool: comp-kuzu
    mode: query
    layer: cloud
    cost: "~ms"
    freshness: "kuzu DB <- latest Nessie/Iceberg commit (nightly + intraday); every call prints a provenance header (built-when + source vintage + counts), WARNs past 26h, reports BEHIND-Nessie-HEAD-by-N for nessie DBs, UNKNOWN VINTAGE if unstamped (TO-F1 contract above)"
    rebuild_trigger: "resource created/changed since last load -> comp-aws derive --resource <arn> ; kuzu_nessie_load"
    anti_pattern: "comp-aws derive (8-min full rebuild) to list nodes"
    status: canonical

  - id: cloud.reachability.transitive
    use_case: "What can X reach transitively (role->resources, lambda->KMS via role/policy)?"
    canonical_call: |
      comp-kuzu "MATCH (a:CloudNode {name:$x})-[*1..3]->(b:CloudNode) RETURN DISTINCT b.node_type, b.id"
    tool: comp-kuzu
    mode: query
    layer: cloud
    cost: "~ms"
    freshness: "kuzu DB (provenance header on every call -- see contract above)"
    rebuild_trigger: "edges changed since last load"
    anti_pattern: "manual multi-hop tracing or a full re-derive"
    status: canonical

  - id: cloud.blast.what_breaks
    use_case: "What breaks if I change/remove this cloud resource (blast radius)?"
    canonical_call: |
      comp-kuzu "MATCH (n:CloudNode {id:$arn})<-[e:CloudEdge*1..3]-(dep) RETURN dep.id, dep.node_type, e"
    tool: comp-kuzu
    mode: query
    layer: cloud
    cost: "~ms"
    freshness: "kuzu DB"
    rebuild_trigger: "you just added the dependency you're checking for"
    anti_pattern: "eyeballing terraform / a full derive"
    status: canonical
    notes: "Used as the teardown blast-radius gate (ADHC_CDNCOHT 0-cross-edge confirm, 2026-06-11)."

  - id: cloud.iam.permission_gaps
    use_case: "Does this Lambda/EC2 call boto3 actions its IAM role doesn't grant (or over-grant)?"
    canonical_call: "comp-iam gaps   # or: comp-iam service <lambda> | comp-iam role <name>"
    tool: comp-iam
    mode: rebuild
    layer: cloud
    cost: "~2s"
    freshness: "live TF state + code scan (no Kuzu dependency)"
    rebuild_trigger: "n/a — this is the canonical IAM-gap path"
    anti_pattern: "comp-aws derive to reason about a single role's grants"
    status: canonical

  - id: cloud.derive.refresh
    use_case: "Rebuild the cloud graph from live AWS (the WRITE-PATH — scheduled, not agent-default)."
    canonical_call: "comp-aws derive --out <path>    # full; or --resource <arn> for bounded"
    tool: comp-aws
    mode: rebuild
    layer: cloud
    cost: "~8min full / seconds bounded"
    freshness: "live"
    rebuild_trigger: "scheduled nightly OR a verified change you must reflect before querying"
    anti_pattern: "running this to answer a traversal -> query comp-kuzu instead"
    status: canonical

  # ---- TRACE GRAPH (repo/code) — comp-trace / comp-blast (cached) ----
  - id: trace.blast.what_breaks
    use_case: "What breaks if I change this function/file/artifact (repo blast radius)?"
    canonical_call: "comp-blast <fn-or-arn> [--function name] [--check-consumers]"
    tool: comp-blast
    mode: query-cached
    layer: trace
    cost: "~ms warm (graph.json 5-min cache)"
    freshness: "graph.json (5-min TTL; rebuilds if stale)"
    rebuild_trigger: "you added new files since the last build -> comp-build"
    anti_pattern: "Explore-agent sweep or manual grep for dependents"
    status: canonical

  - id: trace.walk.dependency_chain
    use_case: "Full dependency chain to/from any repo node (imports, fetches, reads/writes)."
    canonical_call: "comp-trace <node> --direction both [--depth N]"
    tool: comp-trace
    mode: query-cached
    layer: trace
    cost: "~ms warm"
    freshness: "graph.json (5-min TTL)"
    rebuild_trigger: "new files -> comp-build"
    anti_pattern: "manual file-by-file tracing"
    status: canonical

  - id: trace.fullstack.component_to_gold
    use_case: "Full-stack trace: portal component -> endpoint -> Lambda/S3 -> gold script, PER FIRM."
    canonical_call: "comp-platinum page <Component> --firm <bd|inf|cot>   # ADVI is firm-isolated"
    tool: comp-platinum
    mode: query-cached  # NFRA_GRAPHS D2 — LANDED 2026-06-11
    layer: trace
    cost: "~0.2s warm (cache read); ~5s cold/--force rebuild"
    freshness: "per-firm cache (.comp-graph/platinum.*), 5-min TTL — same model as the trace graph.json"
    rebuild_trigger: "TTL expiry, --force (always), or --fresh (re-derive if source files changed); --firm REQUIRED for inf/cot (else defaults bd)"
    anti_pattern: "omitting --firm for an Inflection/Cottonwood trace (firm-blind -> wrong producer/bucket); --force on a warm trace that the cache would serve"
    status: canonical
    notes: "Firm-parameterized 2026-06-11 (NFRA 514d433). Caching LANDED via NFRA_GRAPHS D2 (graph_cache.py): routing table + per-firm gold DAG + dataflows cached, keyed by --firm; warm page is a cache read, bd cold==warm regression-clean."

  - id: trace.pipeline.gold_dag
    use_case: "Gold script I/O, chain membership, deployed-match, overlap."
    canonical_call: "comp-pipescript <io|dag|chain|feeds|consumers|deployed|overlap> <script>"
    tool: comp-pipescript
    mode: rebuild
    layer: pipeline
    cost: "~1-2s"
    freshness: "live repo parse"
    rebuild_trigger: "n/a — canonical pipeline path"
    anti_pattern: "manual s3_layout reading"
    status: canonical

  - id: trace.routes.serving_path
    use_case: "CloudFront -> behavior -> origin -> Lambda serving path for a URL/endpoint."
    canonical_call: "comp-routes trace <url|endpoint> | comp-routes behaviors"
    tool: comp-routes
    mode: rebuild
    layer: trace
    cost: "~1-2s"
    freshness: "live TF parse"
    rebuild_trigger: "n/a"
    anti_pattern: "guessing CF behavior order"
    status: canonical

  - id: trace.rebuild.refresh
    use_case: "Rebuild the trace graph cache (WRITE-PATH — after adding files)."
    canonical_call: "comp-build [--check]"
    tool: comp-build
    mode: rebuild
    layer: trace
    cost: "~9.8s"
    freshness: "writes graph.json"
    rebuild_trigger: "new files / suspected stale cache; or comp-build --check to verify without rebuild"
    anti_pattern: "rebuilding to answer a query comp-trace would serve from cache"
    status: canonical

  - id: trace.diff.staged_blast
    use_case: "What's the blast radius of my uncommitted/staged changes (before commit)?"
    canonical_call: "comp-diff [--staged | --ref HEAD~3]"
    tool: comp-diff
    mode: rebuild
    layer: trace
    cost: "~2s (rebuilds graph + git diff)"
    freshness: "live repo + git"
    rebuild_trigger: "n/a — must reflect your uncommitted change, so a rebuild is correct here"
    anti_pattern: "committing blind then discovering the break"
    status: canonical

  - id: trace.xref.symbol
    use_case: "Find every graph node touching a symbol (id/label/file/edge endpoints)."
    canonical_call: "comp-xref <symbol>"
    tool: comp-xref
    mode: query-cached
    layer: trace
    cost: "~ms (symbol mode uses cached graph)"
    freshness: "graph.json (5-min TTL)"
    rebuild_trigger: "new files -> comp-build"
    anti_pattern: "manual grep across the repo for a symbol's dependents"
    status: canonical

  - id: trace.xref.graph_drift
    use_case: "Did the dependency graph change vs a saved baseline (after a deploy/re-run)?"
    canonical_call: "comp-xref --save   # snapshot; then comp-xref (no-arg) to diff"
    tool: comp-xref
    mode: rebuild
    layer: trace
    cost: "~2s (diff mode rebuilds graph)"
    freshness: "live vs saved baseline"
    rebuild_trigger: "n/a — drift detection needs the fresh graph"
    anti_pattern: "assuming the graph is unchanged after a structural edit"
    status: canonical

  - id: trace.transform.component_fields
    use_case: "Which response fields does a component actually render? (schema-check / unused-field audit)"
    canonical_call: "comp-transform schema-check <Component> [--feature <token>] ; comp-transform ternary-audit <Component>"
    tool: comp-transform
    mode: rebuild
    layer: trace
    cost: "~1s (portal parse)"
    freshness: "live portal/src"
    rebuild_trigger: "n/a — fast targeted parse"
    anti_pattern: "manually reading the TSX to find MISSING/UNUSED fields"
    status: canonical

  - id: trace.cache.key_collisions
    use_case: "Do components share a React Query cache key (cache corruption risk)?"
    canonical_call: "comp-cache collisions ; comp-cache key <substring>"
    tool: comp-cache
    mode: rebuild
    layer: trace
    cost: "~1s"
    freshness: "live portal/src"
    rebuild_trigger: "n/a"
    anti_pattern: "debugging a stale-data bug without checking key collisions"
    status: canonical

  - id: trace.pii.exposure
    use_case: "Does a component/route expose PII to external users (pseudonymized vs cleartext)?"
    canonical_call: "comp-pii audit ; comp-pii scan <Component>"
    tool: comp-pii
    mode: rebuild
    layer: trace
    cost: "~2s"
    freshness: "live routes + registry"
    rebuild_trigger: "n/a"
    anti_pattern: "shipping a field without a PII check"
    status: canonical

  - id: trace.types.type_consumers
    use_case: "Which components consume this TypeScript type (before editing an interface)?"
    canonical_call: "comp-types index <TypeName> [--firm-conditional-sites]"
    tool: comp-types
    mode: rebuild
    layer: trace
    cost: "~5s (regex portal grep)"
    freshness: "live portal/src"
    rebuild_trigger: "n/a"
    anti_pattern: "editing a shared type without enumerating consumers"
    status: canonical

  - id: trace.adapter.field_threading
    use_case: "Pre-ship field-threading audit of a portal adapter function."
    canonical_call: "comp-adapter-audit <adapter-fn> [--severity warn|error]"
    tool: comp-adapter-audit
    mode: rebuild
    layer: trace
    cost: "~60s (live S3 fetch + regex parse)"
    freshness: "live S3 + portal"
    rebuild_trigger: "n/a — needs the live served artifact"
    anti_pattern: "shipping an adapter without verifying the field threads through"
    status: canonical

  - id: trace.platinum.reverse
    use_case: "Which routes + components consume this S3/platinum key (reverse of the page trace)?"
    canonical_call: "comp-platinum reverse <s3_key> [--firm <bd|inf|cot>] [--fresh|--force]"
    tool: comp-platinum
    mode: query-cached  # NFRA_GRAPHS D2 — LANDED 2026-06-11
    layer: trace
    cost: "~0.2s warm (cache read); ~5s cold/--force"
    freshness: "per-firm cache (.comp-graph/platinum.*), 5-min TTL"
    rebuild_trigger: "TTL expiry / --force / --fresh (source drift) — see trace.fullstack.component_to_gold"
    anti_pattern: "guessing which components break if a key changes"
    status: canonical

  # ---- PIPELINE / DATA ----
  - id: pipeline.validate.artifact
    use_case: "Does a gold artifact satisfy its declared invariants BEFORE S3 upload?"
    canonical_call: "comp-validate <script_id> --artifact <local/path>"
    tool: comp-validate
    mode: rebuild
    layer: pipeline
    cost: "~1s JSON / ~2s parquet"
    freshness: "live artifact + config"
    rebuild_trigger: "n/a — validates a specific artifact"
    anti_pattern: "uploading a gold artifact unvalidated (signalling SAFE on NO_CONFIG)"
    status: canonical
    notes: "Exit-0 PASS/WAIVED = SAFE to signal; NO_CONFIG/ZERO_CHECKS = UNVALIDATED (not a pass). See COMP_VALIDATE_PROTOCOL.md."

  - id: pipeline.pipescript.deployed_match
    use_case: "Does the runner have my code (before running a gold script ad-hoc)?"
    canonical_call: "comp-pipescript deployed <script>"
    tool: comp-pipescript
    mode: rebuild
    layer: pipeline
    cost: "~2-5s (AWS API calls)"
    freshness: "live S3 deployed code"
    rebuild_trigger: "n/a — must check live deployed state"
    anti_pattern: "running a gold script without confirming MATCH (STALE/MISSING runner)"
    status: canonical
    notes: "comp-pipescript deployed only checks opal-data-bd; inf/mdpf/backfill paths are blind (verify served S3 directly)."

  - id: pipeline.freshness.chain_ready
    use_case: "Is the upstream S3 data fresh enough to run a gold chain?"
    canonical_call: "comp-freshness chain {bd|inf} ; comp-freshness script <id>"
    tool: comp-freshness
    mode: rebuild
    layer: pipeline
    cost: "~30s full chain (parallel AWS calls)"
    freshness: "live S3 LastModified"
    rebuild_trigger: "n/a — live freshness check"
    anti_pattern: "dispatching a chain on stale upstream"
    status: canonical

  - id: pipeline.chainrun.atomic_bundle
    use_case: "Snapshot/diff gold artifacts around an atomic multi-commit producer+consumer refactor."
    canonical_call: "comp-chainrun snapshot --label <L> ; comp-chainrun diff <A> <B>"
    tool: comp-chainrun
    mode: rebuild
    layer: pipeline
    cost: "~3-10s/snapshot (reads ~10 S3 artifacts)"
    freshness: "live S3"
    rebuild_trigger: "n/a"
    anti_pattern: "landing an atomic bundle without before/after artifact verification"
    status: canonical

  - id: pipeline.constants.drift
    use_case: "Marker/firm constant drift (FIRM_ID, thresholds) vs the canonical config."
    canonical_call: "comp-constants check [--lane bd|inf|cot|multifirm] ; comp-constants new"
    tool: comp-constants
    mode: rebuild
    layer: pipeline
    cost: "~1s (AST scan)"
    freshness: "live code AST vs config"
    rebuild_trigger: "n/a"
    anti_pattern: "committing a constant edit that drifts from the registered canonical"
    status: canonical

  - id: pipeline.incrparity.bd
    use_case: "Incremental BD-pipeline parity (windowed cache vs oracle full-recompute)."
    canonical_call: "comp-incrparity <args>"
    tool: comp-incrparity
    mode: rebuild
    layer: pipeline
    cost: "varies (reads S3 parity artifacts)"
    freshness: "live S3 _parity"
    rebuild_trigger: "n/a — parity is a live comparison"
    anti_pattern: "asserting incremental==oracle without the parity check (the GLDINC class)"
    status: canonical

  # ---- CLOUD additions ----
  - id: cloud.lambdamap.deployed_sha
    use_case: "Lambda deployed-SHA vs live CodeSha256 / multi-runtime enumeration."
    canonical_call: "comp-lambdamap <args>"
    tool: comp-lambdamap
    mode: rebuild
    layer: cloud
    cost: "~live AWS"
    freshness: "live Lambda config"
    rebuild_trigger: "n/a — live deployed-SHA check"
    anti_pattern: "assuming a Lambda is deployed without the SHA compare (stale-deploy class)"
    status: canonical

  - id: cloud.score.cert
    use_case: "Score the derived cloud graph vs the certified hand-audit oracle (F1)."
    canonical_call: "comp-aws score [--class C]"
    tool: comp-aws
    mode: rebuild
    layer: cloud
    cost: "~2min (bounded derive of scored classes)"
    freshness: "live vs aws-shapes oracle"
    rebuild_trigger: "n/a — cert scoring re-derives"
    anti_pattern: "asserting a cert pass without the independent oracle score"
    status: canonical

  - id: cloud.classes.list
    use_case: "List the supported AWS resource classes the cloud compiler models."
    canonical_call: "comp-aws classes"
    tool: comp-aws
    mode: query
    layer: cloud
    cost: "~ms"
    freshness: "static (the CLASSES registry)"
    rebuild_trigger: "n/a"
    anti_pattern: "guessing what's modeled — ask comp-aws classes (and graph-call-manifest tools_index)"
    status: canonical

  - id: cloud.metrics.summary
    use_case: "Summary metrics of a derived cloud graph (per-class counts, drift distribution, findings)."
    canonical_call: "comp-aws metrics [--graph <derived.json>]"
    tool: comp-aws
    mode: rebuild
    layer: cloud
    cost: "~ms over a derived graph (or rides a derive)"
    freshness: "as fresh as the graph it reads"
    rebuild_trigger: "needs a current derive to be meaningful"
    anti_pattern: "n/a"
    status: canonical

  - id: cloud.diff.snapshot
    use_case: "Diff two cloud-graph snapshots (what nodes/edges/findings changed between derives)."
    canonical_call: "comp-aws diff <graphA.json> <graphB.json>"
    tool: comp-aws
    mode: query
    layer: cloud
    cost: "~ms (operates on two saved snapshots)"
    freshness: "as fresh as the snapshots"
    rebuild_trigger: "n/a — diffs existing snapshots"
    anti_pattern: "manually eyeballing two derives"
    status: canonical

  - id: cloud.dual_managed.conflict
    use_case: "Find resources managed in >1 Terraform root-module state (apply-conflict risk)."
    canonical_call: "comp-aws dual-managed"
    tool: comp-aws
    mode: rebuild
    layer: cloud
    cost: "~seconds (TF state union)"
    freshness: "live TF state"
    rebuild_trigger: "n/a — the canonical dual-management check"
    anti_pattern: "shipping a resource into a second state without checking for the conflict"
    status: canonical

  - id: cloud.snapshot.archive
    use_case: "Archive the canonical cloud graph (the versioned snapshot the analytics/cert feed)."
    canonical_call: "comp-aws snapshot"
    tool: comp-aws
    mode: rebuild
    layer: cloud
    cost: "~8min (full derive + persist)"
    freshness: "live -> archived"
    rebuild_trigger: "scheduled / a deliberate cert-baseline snapshot"
    anti_pattern: "n/a — this IS the write-path archive"
    status: canonical

  - id: cloud.iceberg.persist
    use_case: "Persist the derived cloud graph to Iceberg/Nessie (the versioned store Kuzu loads from)."
    canonical_call: "comp-aws iceberg-commit"
    tool: comp-aws
    mode: rebuild
    layer: cloud
    cost: "~minutes (write graph_nodes/graph_edges to Nessie)"
    freshness: "derive -> Nessie commit"
    rebuild_trigger: "the WRITE-PATH that feeds comp-kuzu; nightly or after a verified change"
    anti_pattern: "querying a Kuzu DB that predates the iceberg-commit (stale) -> check comp-graph status"
    status: canonical

  # ---- META / governance + hygiene ----
  - id: meta.shell.bare_util_scan
    use_case: "Does a new local-runtime .sh use a util missing from Git Bash 3.6.7 (pgrep/flock/...)?"
    canonical_call: "comp-shell scan [path ...]"
    tool: comp-shell
    mode: rebuild
    layer: meta
    cost: "~1s/file"
    freshness: "live file scan"
    rebuild_trigger: "n/a"
    anti_pattern: "committing a .sh with a bare pgrep/pkill/flock (CLAUDE.md Rule 16)"
    status: canonical

  - id: meta.registry.drift
    use_case: "REGISTRY narrative vs project-JSON drift (phase/commit-citation/status mismatch)."
    canonical_call: "comp-registry sync ROW=N | --project CODE | --all"
    tool: comp-registry
    mode: rebuild
    layer: meta
    cost: "~1-2s"
    freshness: "live REGISTRY vs JSON vs git"
    rebuild_trigger: "n/a"
    anti_pattern: "letting REGISTRY narrative drift from the project JSON"
    status: canonical

  - id: meta.coverage.report
    use_case: "Compiler/task-order coverage report (what's covered vs gaps)."
    canonical_call: "comp-coverage <args>"
    tool: comp-coverage
    mode: rebuild
    layer: meta
    cost: "~1-2s"
    freshness: "live"
    rebuild_trigger: "n/a"
    anti_pattern: "n/a"
    status: canonical

  - id: meta.tooltip.migration
    use_case: "Tooltip migration audit (portal tooltip coverage)."
    canonical_call: "comp-tooltip <args>"
    tool: comp-tooltip
    mode: rebuild
    layer: trace
    cost: "~1-2s"
    freshness: "live portal/src"
    rebuild_trigger: "n/a"
    anti_pattern: "n/a"
    status: canonical

  # ---- FRESHNESS (D3 — planned) ----
  - id: meta.freshness.status
    use_case: "Is each graph current? (cloud/trace/kuzu freshness at a glance.)"
    canonical_call: "comp-graph status [--json]   # comp-graph clear <platinum|trace|all> drops a cache"
    tool: comp-graph
    mode: query
    layer: cross-layer
    cost: "~ms"
    freshness: "n/a (reports freshness)"
    rebuild_trigger: "n/a"
    anti_pattern: "guessing whether the graph reflects your change"
    status: canonical     # NFRA_GRAPHS D3 — LANDED 2026-06-11
    notes: "Reports every graph's freshness verdict (FRESH/STALE/MISSING/PRESENT) + age + TTL: local trace caches (graph.json, baseline, per-firm platinum.*) and cloud artifacts (kuzu_db, stitch_graph). Executable freshness contract = graph_cache.py (the uniform --fresh/--force semantics shared by the rebuild-capable trace tools)."

  # ---- CROSS-LAYER (planned — post P2-STITCH) ----
  - id: xlayer.fullstack.firm_component_to_bucket
    use_case: "Frontend component -> API route -> Lambda -> S3 bucket -> IAM role, LIVE-truth, per firm."
    canonical_call: |
      comp-kuzu "MATCH (c:PortalComponent {name:$comp})-[:FETCHES]->(:ApiRoute)
                 -[:ROUTES_TO]->(l:CloudNode {node_type:'LAMBDA'})-[:WRITES]->(b:CloudNode {node_type:'S3_BUCKET'})
                 RETURN c.name, l.name, b.id"
    tool: comp-kuzu
    mode: query
    layer: cross-layer
    cost: "~ms"
    freshness: "kuzu stitch DB (stitched trace+cloud); db-path infra/aws/globgrph/kuzu_stitch_db"
    rebuild_trigger: "n/a once stitched; reload on the nightly comp-aws derive->Nessie->kuzu cycle"
    anti_pattern: "comp-platinum (static heuristic, inf producer-incomplete) for a question the live stitch answers"
    status: canonical     # LANDED 2026-06-11 (P2-STITCH f754164b4, CTO-certified); supersedes the heuristic inf producer-resolution
    notes: "The structural fix for comp-platinum's firm producer-resolution residual (live per-bucket truth). Cypher uses the CloudNode/CloudEdge schema: -[:CloudEdge {edge_type:'FETCHES'}]->. CTO-verified: 49F+cottonwood ADVI components resolve component->lambda->dynamodb/s3 cross-layer; 15 components reach a bucket."

# ===========================================================================
# tools_index — per-tool instructional reference (AC1 'instructional for each
# comp tool'). One block per comp-* tool: what it does, its subcommands, and
# the canonical entry id(s) that carry the full query/rebuild instruction.
# Full prose per-tool (when/cost/output history) cross-links to comp-tools.yaml.
# ===========================================================================
tools_index:
  comp-kuzu:     { does: "Cypher query the loaded Kuzu graph (cloud + cross-layer); the FAST default read-path", subcommands: ["<cypher>", "--db-path", "--json", "--limit"], entries: [cloud.lookup.nodes_by_type, cloud.reachability.transitive, cloud.blast.what_breaks, xlayer.fullstack.firm_component_to_bucket] }
  comp-aws:      { does: "Live-AWS + Terraform-state cloud-graph compiler (the WRITE-PATH + cert)", subcommands: [derive, score, snapshot, metrics, diff, dual-managed, classes, iceberg-commit], entries: [cloud.derive.refresh, cloud.score.cert, cloud.classes.list, cloud.metrics.summary, cloud.diff.snapshot, cloud.dual_managed.conflict, cloud.snapshot.archive, cloud.iceberg.persist] }
  comp-trace:    { does: "Bidirectional dependency walk from any repo node (cached)", subcommands: ["<node>", "--direction", "--depth", "--json"], entries: [trace.walk.dependency_chain] }
  comp-blast:    { does: "Downstream blast radius + upstream callers (cached)", subcommands: ["<node|file>", "--function", "--check-consumers"], entries: [trace.blast.what_breaks] }
  comp-platinum: { does: "Full-stack component->gold trace, FIRM-AWARE (cached, NFRA_GRAPHS D2)", subcommands: [page, reverse, tab-audit, summary, "--firm", "--fresh/--force"], entries: [trace.fullstack.component_to_gold, trace.platinum.reverse] }
  comp-pipescript: { does: "Gold-script DAG: I/O, chains, deployed-match, overlap", subcommands: [io, dag, chain, feeds, consumers, deployed, overlap, stats], entries: [trace.pipeline.gold_dag, pipeline.pipescript.deployed_match] }
  comp-routes:   { does: "CloudFront->origin->Lambda serving path", subcommands: [trace, behaviors, origins, rewrites, api-routes, auth-map, edge-versions], entries: [trace.routes.serving_path] }
  comp-iam:      { does: "IAM permission-gap cross-reference (boto3 calls vs grants)", subcommands: [gaps, roles, services, service, role, stats], entries: [cloud.iam.permission_gaps] }
  comp-build:    { does: "Rebuild the trace-graph cache (the trace WRITE-PATH)", subcommands: ["--check"], entries: [trace.rebuild.refresh] }
  comp-diff:     { does: "Map git/uncommitted changes to graph blast radius", subcommands: ["--ref", "--staged"], entries: [trace.diff.staged_blast] }
  comp-xref:     { does: "Symbol cross-ref (cached) + graph-state drift-vs-baseline", subcommands: ["<symbol>", "--save"], entries: [trace.xref.symbol, trace.xref.graph_drift] }
  comp-transform: { does: "React component field-render schema-check (MISSING/UNUSED)", subcommands: [schema-check, ternary-audit], entries: [trace.transform.component_fields] }
  comp-cache:    { does: "React Query cache-key collision detection", subcommands: [map, collisions, key], entries: [trace.cache.key_collisions] }
  comp-pii:      { does: "PII exposure audit (routes + components)", subcommands: [audit, scan], entries: [trace.pii.exposure] }
  comp-types:    { does: "TS type consumers (before editing a shared type)", subcommands: [index], entries: [trace.types.type_consumers] }
  comp-adapter-audit: { does: "Portal adapter field-threading audit", subcommands: ["<adapter-fn>", "--severity"], entries: [trace.adapter.field_threading] }
  comp-tooltip:  { does: "Tooltip migration/coverage audit", subcommands: ["<args>"], entries: [meta.tooltip.migration] }
  comp-validate: { does: "Gold artifact invariant validation pre-upload", subcommands: ["<script_id> --artifact", "--list"], entries: [pipeline.validate.artifact] }
  comp-freshness: { does: "Is upstream S3 data fresh enough to run a gold chain", subcommands: [chain, script, artifact], entries: [pipeline.freshness.chain_ready] }
  comp-chainrun: { does: "Snapshot/diff gold artifacts around an atomic bundle", subcommands: [snapshot, diff], entries: [pipeline.chainrun.atomic_bundle] }
  comp-constants: { does: "Marker/firm-constant drift vs canonical config", subcommands: [check, index, new, list], entries: [pipeline.constants.drift] }
  comp-incrparity: { does: "Incremental BD-pipeline parity (cache vs oracle)", subcommands: ["<args>"], entries: [pipeline.incrparity.bd] }
  comp-lambdamap: { does: "Lambda deployed-SHA vs live CodeSha256 + runtime enum", subcommands: ["<args>"], entries: [cloud.lambdamap.deployed_sha] }
  comp-shell:    { does: "Bare Git-Bash-missing-util scan in new .sh (Rule 16)", subcommands: [scan], entries: [meta.shell.bare_util_scan] }
  comp-registry: { does: "REGISTRY narrative vs project-JSON drift", subcommands: ["sync ROW=N", "--project", "--all"], entries: [meta.registry.drift] }
  comp-coverage: { does: "Compiler/task-order coverage report", subcommands: ["<args>"], entries: [meta.coverage.report] }
  comp-graph:    { does: "Freshness status across all graphs (local trace caches + cloud artifacts) + clear; uniform --fresh/--force contract (graph_cache.py)", subcommands: [status, clear, "--json"], entries: [meta.freshness.status] }
