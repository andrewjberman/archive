    notes: "Four-state axis {VALID, INVALID, UNKNOWN, EXPIRED} is a TWO-LEVEL PARTITION TREE (binds? -> EXPIRED on no; then the evaluation's result), MECE with no ordering language; NEVER_EVALUATED unreachable by construction (a lease requires minted_by_evaluation). The effect PAIR (effect_as_recorded + effect_as_evaluated, UNCOMPUTED -> EXPANDING one-way) is mandatory on every evaluation record. Null basis members (UNRATIFIED_BASIS) CAP their governed axes at UNKNOWN and the lease names them. Content-addressed ids (evaluation_id/lease_id) derive via the normative home over named payloads -- derivation home in the contract, not at a line number (COO 64098). comp-which routing string: 'is this lease still valid ; may I rely on this claim ; eligibility evaluation ; lease expired ; support identity changed ; knowledge basis digest' -> comp-lease."

