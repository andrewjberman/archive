  comp-heat:     { does: "Estate OBJECT write-freshness + hygiene (repo files: hot/warm/cold + cold SUBTREES=archive candidates, uncommitted-write drift); ADVISORY-ONLY, read-only. BASIS-IN-OUTPUT (Andrew-ratified CH-3, 2026-08-04): every band verdict prints WITH age/score/half-life/barrier-definition. `compare` = heat CONVERGING/DIVERGING/PARALLEL between two resources (per-window series + delta + windows/commits/shared denominators -- the Friction battery's trajectory leg). `federated` = LIVE-Trino estate-ASSETS x git code-heat view (Andrew round-3 registration 2026-08-04). DISTINCT from comp-freshness (data-pipeline S3/DDB)", subcommands: [freshness, drift, score, "compare <A> <B> [--windows N --window-days D]", federated], entries: [estate.heat.object_freshness, estate.heat.uncommitted_drift] }
  comp-xray:     { does: "Value-MOTION lens (NFRA_COMPDIFF): is the CONTENT genuinely changing, or FROZEN-BUT-FRESH (value frozen while timestamp advances -- the 3x-2026-06-29 freeze class wrapper-tools cannot see)? Checks MOTION not the wrapper (mtime/size/existence). VINTAGE-PRIMARY, read-only, tri-state exit. DISTINCT from comp-diff (git->graph blast) + comp-freshness/comp-heat (wrapper freshness)", subcommands: [frozen, s3, code, config, schema, freeze-monitor], entries: [estate.xray.frozen_but_fresh, estate.xray.content_motion_axis] }
  comp-dups:     { does: "Estate duplicate/dead-resource CENSUS (NFRA_DEBTSCAN standing dimension): 4 structural duplicate classes (CROSS_FIRM/IAM_POLICY_SPLIT/SERVICE_SPLIT/ENV_TWIN) + dual-evidence dead-confirm (30d reads AND writes); bare=on-demand scan, --nightly=post-derive ledger-write to org/modules/graph/debtscan/ (DUPS_candidates.json + dups_latest.json). DISTINCT from comp-aws dual-managed (TF-state apply-conflict only); removal = worklist+human-confirm. Engine: dup_scan.py", subcommands: ["--class", "--nightly", "--json"], entries: [estate.dups.duplicate_resources] }
  comp-clobber:  { does: "OUTPUT-KEY COLLISION scanner: are 2+ DISTINCT producers writing the SAME sink (S3 key / DynamoDB table) -- a two-writers-one-key CLOBBER where a stale producer overwrites a fresh one. The class comp-dups is blind to (comp-dups scans code BODIES; this scans write TARGETS). STATIC = write-call-windowed code candidate-finder (terminal artifacts; bucket-blind on bare Key=). LIVE/--sweep = the ORACLE: an etag-lineage that REAPPEARS after another intervened = an ACTIVE clobber (catches publish/copy-mediated clobbers the static scan cannot). Born from the 2026-07-21 aum-timeseries freeze. Advisory/read-only. Engine: clobber_scan.py", subcommands: ["--min-writers", "--include-partitioned", "--live BUCKET KEY", "--sweep BUCKET PREFIX", "--json", "self-test"], entries: [estate.clobber.output_key_collision] }
  comp-estate: { does: "THE GLOBAL LOSSLESS FIDELITY DESCENT FROM SEMANTICS TO FACTS (Andrew-direct purpose ruling, verbatim, 2026-07-30) -- FIRST CONTACT for the Estate (naming consolidated 2026-07-30, Andrew-direct: pipescript -> comp-semantic-estates -> comp-estate; old names deleted, do not resolve). TWO FACES: (1) named-thread traversal -- what is IN a named pipeline/thread: every resource, producers -> served artifacts -> frontend consumers, owning tool, coverage + debt flags, whole estate, NO silent Unknown; (2) the ONTOLOGY VIEWS -- C4 segments (--segments, the agent routing entry point), the C3.i x C3.ii cross-partition matrix (--matrix), the stable layer ladder (--layers), canonical terms (--definitions), lambda-census set-diff (--census-drift). KEYS re-derived LIVE from source; NAMES from the resolver snapshot with a FAIL-LOUD source-timestamp head (unnameable substrate = rc=2 SOURCE UNRESOLVABLE, never silence) -- reference implementation of the header contract. --refresh is a BRIDGE to a newer snapshot, never a canonical one (comp-kuzu is the destination). Engine opal_estate_infrastructure.py + delegated legacy thread-model engine estate_infrastructure_cli.py (AE lane). Slow modes declared: --drift/--self-test ~25s key-plane scan; everything else sub-second", subcommands: ["<name>", "--list", "--resource <substr>", "--tool <name> <tool>", "--debt", "--fe-reachability", "--orphans-only", "--validate", "--gate-b", "--keys", "--drift", "--refresh", "--refresh-only", "--segments", "--layers", "--definitions [term]", "--matrix", "--census-drift", "--plane tf|aws", "--structure <sys-name>", "--head [N]", "--self-test"], entries: [estate.thread.traversal, estate.ontology.views] }
  comp-legacywriter: { does: "WRITER-CONTEST + DECOMMISSION-SAFETY lens: who WRITES a served location, who READS it, and WHAT BREAKS WHEN IT IS GONE. Location identity is the (BUCKET,KEY) PAIR and call DIRECTION is modelled, so a cross-FIRM path match is not a collision and an existence PROBE is not a writer -- the two corrections that made 8 of comp-clobber's 11 reported multi-writer sinks false on the live estate 2026-07-29. Every reader carries REMOVAL BEHAVIOUR (hard-fail / silent-default / unknown) from its error handling; silent-default is the DANGEROUS class. Emits RETIRECOND-shaped retires: entries with the evidence bar pre-filled. A JOIN of existing instruments, zero new scanners (imports comp_dataflow's resolver). Declared blindness printed every run; UNRESOLVED bucket => UNDETERMINABLE both directions. Advisory/read-only, no delete verb. Engine: comp_legacywriter.py", subcommands: ["<key-or-bucket>", "--json", "--require-live-substrate", "--self-test"], entries: [estate.legacywriter.writer_contest] }
  comp-similar:  { does: "Functional-similarity / SUPERSEDE scan (NFRA_COMPSIMILAR PH2): BM25 over the derive-at-scan SUMMARY corpus (what a resource DOES) -- engine-sibling of comp-describe (same corpus, describe-ONE vs similar-MANY) + concept-sibling of comp-dups (NAME/body, what it IS). pairwise score+HYPOTHESIS / neighbor list / supersede = summary-twin x heat-DIVERGENT cold-candidate->hot-replacement (confidence-graded + coverage denominator) / cluster = same-JOB overlap census. Advisory/read-only/hold-aware, NO delete verb (feeds OPAL_LCLRPO). Name-EXCLUDED corpus (C2, no comp-dups collapse). Engine: debtscan/comp_similar.py", subcommands: ["<arn-or-name> [<arn-or-name>]", supersede, cluster, "--heat-json", "--live-heat", "--type", "--json"], entries: [cloud.similar.resource] }
  comp-secrets:  { does: "AWS Secrets Manager lens: inventory (firm-tagged + rotation/freshness), SAFE read (redacted shape by default; --reveal=cleartext-to-stdout-never-logged), secret->consumer code/TF map, rotation audit. Read-only; SSL-fallback to the Windows cert store. DISTINCT from comp-iam (the IAM-grant/who-can-read view)", subcommands: [list, get, consumers, rotation], entries: [cloud.secrets.inspect] }
  comp-system:   { does: "NFRA_SYSTEM current-state COMPILER (the dynamic SYSTEM half): reads LIVE compiled-system state across the LOCALROOT knowledge-classes via the EXISTING comp-tools (comp-kuzu graph counts + marker-oracle, cse_schema, comp_coverage_view/TOOLCHECK matrix, comp-fedobs served-artifact, PROMOTE recognizer manifest) -> emits infra/system/06_current_state.{md,json}. ONE source, THREE consumers: the SYSTEM current-state + base COO's LOCALROOT runtime index (per-class ## anchors) + COO~B's P4-maturity grading (parses the .json maturity_evidence -> derives 07_maturity). HARD LINE: every number grounded-against-live or UNKNOWN-VINTAGE, ZERO fabrication (CTO/GOV-A); marker-oracle auto-refresh (--check). Shape: per-LOCALROOT-class object {static_home, current_state, maturity_evidence, maturity_rollup} + provenance header + observe-diversity metric. Engine: org/modules/graph/comp_system.py (AE lane); the 06 output is exec-committable (infra/system/** carve)", subcommands: ["", "--stdout", "--json", "--self-test", "--check"], entries: [system.current_state.compile] }
  comp-depth:    { does: "DEPTH-scoped querying on the marker-head graph (NFRA_GRAPHDEPTH P3): the GRAIN coordinate of an investigation -- a node's grain and CONTAINS-ladder level, every node at a given grain, coarse-to-fine drill and fine-to-coarse rollup, and a grain-scoped traversal. Grain-calibrated by the grain_contract; composes the provenance-checked marker-head read-handle (ONE head, checked every call). Answers WHAT GRAIN, not what-is-affected.", subcommands: ["grains <node-id>", "scope <grain> [--limit N]", "drill <node-id> --to <grain>", "rollup <node-id> --to <grain>", "blast <node-id> --grain <g>"], entries: [graph.depth.grain_scope] }
  comp-dispatch: { does: "The gold-dispatch ORCHESTRATION-DAG (NFRA_COMPROUTE Stage-1 #1; CTO-ratified 2026-07-01 as a distinct one-home node): which gold scripts run, in what order, under which chain/group flags + conditional gates, and which gold-dir scripts are UNDISPATCHED (standalone diagnostics). CHAIN/orchestration grain -- the sibling to comp-pipescript's per-SCRIPT grain. Read-only parse of gold_dispatch.sh's declared blocks; never executes the bash", subcommands: ["<firm>", "<firm> --chain <name>", "<firm> --script <ID>", "<firm> --gates", "<firm> --undispatched", "--list [--json]"], entries: [pipeline.dispatch.orchestration_dag] }
  comp-lease: { does: "NFRA_EPISTEMY C4 -- the FOUR-STATE LEASE SERVICE + Eligibility_Evaluation (COO GO 64063; base cert + first basis mint @053b83f414). Runs ONE Eligibility_Evaluation over a committed C3 closure (pipeline in the spec's order: OVER-included coarse intersection -> typed exclusion replay -> residual -> policy; one per (assessment, scope, basis, support-state), identical replay REFUSED; untyped silence REFUSED; old enumerated waiver never covers a new member), mints the Lease it licenses (NEVER_EVALUATED unreachable: minted_by_evaluation required), and computes lease state at READ TIME via the partition tree {binds? no -> EXPIRED; yes -> VALID|INVALID|UNKNOWN} -- a moved support identity without re-evaluation is EXPIRED, never VALID. Consumes: the C1 envelope (observations), C3 side-readers (support identities), Knowledge_Basis minted instance (digest reproduced through the normative home precondition_token.py _request_hash before use). Engine: org/modules/graph/comp_lease.py (AE lane).", subcommands: ["evaluate <closure.json> [--out DIR]", "state <lease.json>", "--self-test", "--help"], entries: [epistemy.lease.eligibility] }
  comp-closure: { does: "NFRA_EPISTEMY C3 -- the IDENTITY + SUPPORT-CLOSURE COMPILER (COO GO 63813; object shape per 4.0.0_SA_CRO cert 63859 + 1.0.0_SA_CTO gate 63865). For a logical fact ('Lambda F runs code C@v') compiles the typed hop chain build-input -> package manifest -> deployed bytes -> repo bytes -> (execution), every hop resolved_via BUILD_INPUT:<field> (a filename-resolved hop is REFUSED), every acquisition an Observation_Record built by the C1 envelope (a failed stage forces UNKNOWN). Emits Support_Closure (reach per member {NONE,PRESENCE_ONLY,BEHAVIOR}, closure reach = MIN; standing {BROKEN,AMBIGUOUS,CURRENT,INVALIDATED}) + Identity_Bundle (equivalence {EQUIVALENT,DIVERGENT,UNMEASURED,UNKNOWN}). Last-hop honesty by construction: a deployed digest is PRESENCE_ONLY; BEHAVIOR needs an executing read and cannot be labelled in. The two-copies class (08-12 specimen inf-silver-chain) reads AMBIGUOUS, never drift/clean. Read-only AWS; never rewrites the source map; arms nothing; observations carry the ratified plane enum + substrate (C1 rider @6f944857c4). Engine: org/modules/graph/comp_closure.py (AE lane).", subcommands: ["compile <lambda> [--out DIR]", "verify <closure.json>", "ec2-fixture <service> [--fixture F]", "--self-test", "--help"], entries: [epistemy.closure.identity_support] }
  comp-directives: { does: "The DIRECTIVES-NATIVE retirement compiler + mechanical check (LD-0433, Andrew-approved @52db6f2835): FACT (human/sovereign `retired: {at,by,authority}` on the live row -- the machine NEVER writes a fact) + MOVE (`retire`: cuts recorded rows from org/missions/DIRECTIVES.yaml into DIRECTIVES_RETIRED.yaml -- byte-frozen literal blocks, stamped vintage, ever_minted roster, emit_hash seal; 100% machine-written, text-surgical on the hand-written live view, idempotent, partial records REFUSED) + CHECK (`check`: PARTITION/CONSERVATION/FORM-tripwire/FREEZE invariants, rc 0|2|1, denominators printed; a hand edit in the retired view FAILS it). Directives-native by ruling (CTO 63580 fence: zero missions dependency either direction); NO attribution leg (Andrew ruling c). Register home = the owner's word (MSTR 63620). Engine: org/modules/graph/comp_directives.py (AE lane); post-commit hook fires check on register-touching commits.", subcommands: ["retire [--dry-run]", "check", "--self-test", "--help"], entries: [governance.directives.retirement] }
  comp-symbols:  { does: "Intra-file SYMBOL INVENTORY (NFRA_COMPROUTE Stage-1 #3; CTO-ratified 2026-07-01 as a distinct one-home node): what functions, classes, module-constants and imports a source FILE declares, with line numbers. Input is a FILE; output is that file's forward AST inventory. Deterministic ast.parse; read-only, no LLM, no execution.", subcommands: ["<file>", "<file> --grep <pattern>", "<file> --kind func|class|const|import", "<file> --json"], entries: [trace.symbols.file_inventory] }
