# graph-call-manifest.yaml — the authoritative catalog of EVERY graph use-case -> its canonical call.
#
# NFRA_GRAPHS (PRD: docs/architecture/NFRA_GRAPHS.md). Referenced in CLAUDE.md and MANDATED: any code
# change or agent workflow that derives/rebuilds/queries the dependency graph MUST use the `canonical`
# call for its use-case. Default to QUERY (comp-kuzu / cached comp-trace); REBUILD only to preempt a
# staleness you just created, or on the scheduled refresh. Gate: comp-manifest-check (advisory -> blocking).
#
# STATUS: v0.1 SCAFFOLD (1.0.0_SA_CTO 2026-06-11). Seeded with the high-frequency canonical calls; full
# coverage (one `canonical` per distinct use-case across all ~30 comp-* tools + the Kuzu Cypher surface)
# is the AC1 close-gate. Cross-layer entries are `planned` until NFRA_GLOBGRPH P2-STITCH lands.
#
# Per-entry schema:
#   id:              stable dotted id (layer.topic.specific)
#   use_case:        the question this answers, in agent terms
#   canonical_call:  the exact command / Cypher to run
#   tool:            comp-kuzu | comp-trace | comp-blast | comp-platinum | comp-pipescript | comp-estate | ...
#   mode:            query | query-cached | rebuild
#   layer:           cloud | trace | cross-layer | pipeline
#   cost:            "~ms" | "~2s" | "~9.8s" | "~8min"
#   freshness:       how current the answer is + what backs it
#   rebuild_trigger: when to force a rebuild INSTEAD of querying (staleness-preempt)
#   anti_pattern:    the slower/ad-hoc thing NOT to do
#   status:          canonical | deprecated | planned | retired
#   superseded_by:   (deprecated / retired) the canonical id that replaces this
#
# ENTRY-GRAIN RETIREMENT (`status: retired`) -- added 2026-09-09, NFRA_CLDGRPH CG-s-17.
#   A `retired` entry is a RECORD, not a route: the call it named no longer exists, the entry is
#   KEPT so the retirement stays legible (the same reason retired_aliases: keeps a NAME), and it
#   carries `superseded_by` (a LIVE entry id), `retired:` (when, by whom, and the consumers-first
#   ORDER) and `why:` -- the retired_aliases convention applied one grain down, at the entry.
#   WHY NOT `deprecated` HERE: `deprecated` is TOOL-grained in its only consumer.
#   manifest_check_cli.deprecated_signatures() :355-380 builds its detection signature from the
#   entry's `tool:` name alone, so marking a MODE-VARIANT entry of a still-LIVE tool `deprecated`
#   flags every code line that names that tool. Measured 2026-09-09 before choosing: the two
#   entries below, set to `deprecated`, produced 168 ERROR-class A_deprecated_call findings over
#   5 files. `deprecated` stays reserved for what it can actually detect -- a whole TOOL superseded.

# WHAT THIS FILE'S DENOMINATOR DOES AND DOES NOT COVER, FOR A RETIREMENT QUESTION
# -- added 2026-09-10, NFRA_CLDGRPH CG-s-36 (TO-CG-H-1), the remedy row W1-S38 asked for.
#   THIS FILE IS A DECLARATION OF ROUTED QUERY TOOLS. IT IS NOT A CENSUS OF THE ESTATE'S
#   CONSUMERS OF THE GRAPH'S EDGE VOCABULARY. Both statements are true at once, and only the
#   first one is what tools_index/entries were built to be.
#   SO: this file is a SOUND denominator for "which routed tool answers question X", "is this
#   call the canonical one", and "does a use-case have a route". It is an UNSOUND denominator
#   for "may this edge type / node type / vocabulary term be RETIRED" -- a producer, a fixture,
#   a spike loader, a materialized producer JSON and another project's instrument all consume
#   the vocabulary while declaring no route, so none of them can appear here, and a census
#   scoped to this file cannot see them.
#   MEASURED, not asserted (NFRA_CLDGRPH CG-s-36, rows W1-S38 / S110): asked whether STORED_IN
#   had readers, the census over this file's 78 tools returned 0 of 78 with 78 of 78 names
#   resolving to a file -- an HONEST zero for this domain, with the resolution arm present and
#   passing. The unscoped sweep of the same repository, denominator 29,964 files, returned 15
#   consumers, and the declared domain held 0 of the 88 files carrying the term: the domain and
#   the claim's population are DISJOINT. The scoped zero would have authorized a retirement that
#   broke every one of them.
#   THE REQUIRED SECOND ARM, therefore: ANY retirement of a vocabulary term censused against
#   this manifest MUST also run an UNSCOPED sweep of the whole repository corpus, print that
#   sweep's own denominator beside the manifest's, and print the DELTA between the two counts.
#   The delta is the finding. Where the two disagree, THE REPOSITORY IS THE DENOMINATOR AND THIS
#   FILE IS ONE INPUT TO IT. A zero from this file alone never authorizes a retirement.
#   WHY THIS SENTENCE LIVES HERE RATHER THAN IN THE PROJECT THAT LEARNED IT: the next vocabulary
#   retirement in this estate will be censused against this manifest, by an agent who has not
#   read that project, and it will again read clean. CLAUDE.md Rule 22's shared-dependency limb
#   and Rule 24(i)'s domain clause both land on exactly this file.

