  comp-tool-health: { does: "Fused per-comp-tool 3-axis HEALTH query (used / rail_consistent / effective -> KEEP|FIX|PROMOTE|RETIRE) over the COMPLEARN substrate; value-anchored (outcome value + rail quality, never invocation count); read-only advisory (CTO ratifies). Engine comp_tool_health.py", subcommands: ["[<tool>]", "--json"], entries: [meta.toolhealth.keep_fix_retire] }
  comp-toolgraph: { does: "The comp-tool SUITE as a measure-only graph: C0 nodes (the ratified universe) + C1 mechanical edges (SHARES_SUBSTRATE/WRITES/INVOKED_BY) + the DECLARED-vs-ACTUAL coupling diff (the undeclared-ripple finding). Engine comp_toolgraph.py", subcommands: ["--json"], entries: [meta.toolgraph.suite_coupling] }
  comp-learns-score: { does: "COMPLEARN P2 value-anchored SCORER: ranks build-next / route-fix / merge-retire candidates by escapes-prevented / drift-caught / cost-per-outcome (NEVER usage count -- the Goodhart gate, provable via --goodhart-audit); --file-candidates appends new top candidates to the tracked backlog comp-learns-backlog.md (the gap->build bridge). Advisory-only; CTO ratifies. Engine comp_learns_score.py", subcommands: ["--top N", "--file-candidates", "--goodhart-audit", "--self-test", "--json"], entries: [meta.learns.value_scorer] }
  comp-pydeps:   { does: "Repo-wide Python REFERENCE graph incl .tools/ + org/modules (closes COMPRAIL F-5): who imports/loads/subprocess-invokes a compiler-layer file (edge-kind-typed code-consumer vs prose-mention, docstring-aware) + per-file egress. comp-blast consults it on a .tools/org-modules NOT-FOUND. Engine comp_pydeps.py", subcommands: [consumers, deps, egress, build, "--self-test", "--json"], entries: [meta.pydeps.reference_graph] }
