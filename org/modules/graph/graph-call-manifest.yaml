  - id: pipeline.pipescript.deployed_match
    use_case: "Does the runner have my code (before running a gold script ad-hoc)?"
    canonical_call: "comp-pipescript deployed [<script>] [--firm bd|inf|cot|mdpf | --pipeline <key>]   # no arg = sweep ALL trees"
    tool: comp-pipescript
    mode: rebuild
    layer: pipeline
    cost: "~2-5s single tree; ~15-30s no-arg all-trees sweep (AWS API calls)"
    freshness: "live S3 deployed code"
    rebuild_trigger: "n/a — must check live deployed state"
    anti_pattern: "running a gold script without confirming MATCH (STALE/MISSING runner); reading a sweep MATCH without noting which bucket it checked; counting an UNCOVERED row as clean"
    status: canonical
    notes: "comp-pipescript deployed covers ALL PIPELINE_MAP trees (NFRA_DEBTSCAN.TOOL-01 2026-06-12): bd+inf+cot firm-bucket mapping derives from safe_deploy_core.PIPELINE_MAP (single source, no drift); mdpf appended check-only (NOT in the deploy-gate map -- non-standard code/scripts/<layer>/ layout, deploys via its own mechanism -- but still checked because MDPF_COUNTS proved it strands). Scope resolution: --firm {bd,inf,cot,mdpf} or --pipeline <key> = single tree; a data/<tree>/scripts/... path AUTO-DETECTS the tree (generalizes the cot-only auto-route); NO arg = sweep EVERY tree. Firm separation: each tree reads ONLY its own bucket (no cross-bucket fallback). Sweep prints a per-tree banner naming the bucket so every MATCH/STALE/MISSING row is bucket-attributed (an un-attributed row is how a stranded-deploy blind spot hides). backfill/feeders now covered via the mdpf branch + canonicalize regex. Closes the inf/cot/mdpf DEBTSCAN UNKNOWN-VINTAGE caveat. BRONZE first-class (NFRA_DEBTSCAN.TOOL-03 2026-06-12): data/<dir>/scripts/bronze -> code/bronze/ swept for bd+inf+cot ([BRONZE] rows) -- closes the Rule-13 bronze-verifiability gap (2026-06-12 inf-ADVI stranded-deploy hand-diff). New layer-scoped keys bd-bronze/inf-bronze/cot-bronze make safe-deploy's '{firm}-{layer}' verify call work for bronze. AUX prefixes CHECK-ONLY ([aux:<prefix>] rows): inf bronze-runner (the dual-prefix the runner ACTUALLY syncs -- divergence there is a live stranded-deploy until ADVI_INFETL.BRONZE-FIX collapses it) + inf manual_api mapped to repo homes; aux divergence prints DRIFT in full-tree views (never the deploy-gate STALE token; only the *-bronze view reports bronze-homed aux as real STALE); runner/exporter/cleanup + any prefix NOT in the tool registry emit explicit UNCOVERED rows (live code/ enumeration) -- tool-blindness is NEVER countable as cleanliness (false-clean guard)."

