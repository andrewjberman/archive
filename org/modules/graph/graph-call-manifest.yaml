    rebuild_trigger: "n/a -- evaluate on demand; a changed basis digest or support state is a legitimately NEW evaluation (an identical replay is REFUSED, m4)."
    anti_pattern: "storing a lease state and reading it later (the stored verdict is the thing this service exists to abolish); leasing a closure by NAME (leases bind the closure's vintage IDENTITIES); an untyped 'we did not see it change' offered as an exclusion proof (REFUSED, m5); covering a NEW member with an old ENUMERATED waiver (REFUSED, m3 -- only a ratified predicate whose declared scope includes it covers); re-implementing the digest derivation (the normative home is precondition_token.py _request_hash; any other serialization is NON-CONFORMANT even if the pattern matches); reading a lease's EXPIRED as INVALID (INVALID is an EVALUATION's result; EXPIRED means no binding evaluation exists -- out of scope, not out-ranked; CRO D1 ruling @053b83f414)."
