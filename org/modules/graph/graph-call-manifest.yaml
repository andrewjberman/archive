    status: canonical
    notes: "NFRA_PIPESCRIPT COMPLETE 2026-06-15 (full PRD: a+b+c+P1b+P3, CVO final attestation bce23d613). Named-thread estate traversal; the COUNTS ARE THE RESOLVER'S, live via --list -- 29 named threads / 138 sub-threads / 188-lambda census as of 2026-07-30 (the digits 25/134/169 this note once froze drifted within six weeks; do not re-freeze them here). Routes each thread to its owning_tool (comp-pipescript=medallion / globgrph=AWS-resource / stitch=cross-layer / portal-consumer-tools=frontend / none=ops-local). P1b.2 = read-only drill POINTER (surfaces the canonical sub-resolver call per thread; does NOT live-invoke -- F5). P3.1 = inline debtscan flags (--debt). P3.2 = FE-reachability status (--fe-reachability) surfacing CVO GROUND-TRUTH (mounted-reachable/frontend-orphan/phantom/unreviewed-LOUD) -- NOT a live portal grep (scaffolding-fooled). Unknown name OR unowned-tool query ALWAYS LOUD (exit 2) -- generalized TOOL-02 false-clean guard. Standing regression oracle: comp-estate --gate-b + --fe-reachability. MEASURED WALL-CLOCKS 2026-07-30: thread/list/resource/debt/fe/validate/gate-b all 0.1-0.4s; --census-drift ~1.2s; --drift and --self-test ~25s (live key-plane scan) -- the two slow modes, declared so no caller is surprised. Read-only; ASCII-only stdout; SIGPIPE-clean under a closing reader (exercised). Owner: AE/cloud-ops (estate_infrastructure_cli.py, nee pipescript_cli.py 2026-07-30, = AE lane, same as extract_iam -- Andrew-direct 2026-06-23, correcting the prior DS-lane label); non-AE cross-tool edits route owner-review through AE per the two-rule lane convention."

