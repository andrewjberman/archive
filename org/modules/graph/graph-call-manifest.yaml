# graph-call-manifest.yaml — the authoritative catalog of EVERY graph use-case -> its canonical call.
#
# NFRA_GRAPHS (PRD: docs/architecture/NFRA_GRAPHS.md). Referenced in CLAUDE.md and MANDATED: any code
# change or agent workflow that derives/rebuilds/queries the dependency graph MUST use the `canonical`
# call for its use-case. Default to QUERY (comp-kuzu / cached comp-trace); REBUILD only to preempt a
# staleness you just created, or on the scheduled refresh. Gate: comp-manifest-check (advisory -> blocking).
#
# STATUS: v0.1 SCAFFOLD (1.0.0_SA_CTO 2026-06-11). Seeded with the high-frequency canonical calls; full
# coverage (one `canonical` per distinct use-case across all ~30 comp-* tools + the Kuzu Cypher surface)
# is the AC1 close-gate. Cross-layer entries are `planned` until NFRA_GLOBGRPH P2-STITCH lands.
#
# Per-entry schema:
#   id:              stable dotted id (layer.topic.specific)
#   use_case:        the question this answers, in agent terms
#   canonical_call:  the exact command / Cypher to run
#   tool:            comp-kuzu | comp-trace | comp-blast | comp-platinum | comp-pipescript | ...
#   mode:            query | query-cached | rebuild
#   layer:           cloud | trace | cross-layer | pipeline
#   cost:            "~ms" | "~2s" | "~9.8s" | "~8min"
#   freshness:       how current the answer is + what backs it
#   rebuild_trigger: when to force a rebuild INSTEAD of querying (staleness-preempt)
#   anti_pattern:    the slower/ad-hoc thing NOT to do
#   status:          canonical | deprecated | planned
#   superseded_by:   (deprecated only) the canonical id that replaces this

# INTENTIONALLY NOT CATALOGED (not graph-access use-cases -> exempt from the mandate, AC1-complete):
#   comp-learns-status                    -- compiler self-learning/telemetry status (not a graph query). NOTE: comp-learns-run RETIRED 2026-07-08 (NFRA_TOOLCHECK P2, CTO-ruled: un-landed stub superseded by the PROMOTE loop).
#   comp-perf                             -- tool-perf benchmarking (not a graph query)
#   comp-v5-composite-test.sh             -- tool regression test
#   comp-grep / comp-glob                 -- the ON-RAILS SEARCH PRIMITIVES comp-which RUNS when
#                                            no rich tool fits (the never-dead-end); a search
#                                            primitive, not a graph-query rich tool you route TO
excluded_not_graph_use_cases: [comp-perf, comp-v5-composite-test, comp-manifest-check, comp-surface-check, comp-to, comp-grep, comp-glob, comp-imgread, comp-coverage-check, comp-routable-check, comp-kit-striplist-gate, comp-tool-health-gate, comp-canon-motif, comp-passcraft, comp-stitch-refresh]  # NFRA_COMPCLOSE 2026-07-14: (a) comp-learns-status REMOVED from this exclusion -- it IS a graph-query use-case (routable, tools_index entries: meta.learns.demand_gap_cost); (b) ADDED the 7 previously-unaccounted disk tools so the registration invariant (every .tools/comp-* is in tools_index OR excluded-here-with-a-reason) is TRUE again: comp-coverage-check/comp-routable-check/comp-kit-striplist-gate/comp-tool-health-gate = enforcement gates (police, not query); comp-canon-motif = debtscan scorer (worklist producer); comp-passcraft = anti-harness recon scaffolding (stops at the verdict door); comp-stitch-refresh = graph PRODUCER (write-path substrate refresh, not a query target)  # comp-manifest-check = D6 manifest-ENFORCEMENT gate; comp-surface-check = D8 critical-surface commit-gate (polices critical-surfaces.yaml at commit, auto in safe-commit) -- both ENFORCEMENT gates, not graph-query use-cases (so excluded here; they're in CLAUDE.md's invoke-table). comp-to = session-context setter (writes the race-free per-session TO_ID for the comp auto-logger); a startup/context primitive like comp-which/comp-grep/comp-glob, not a graph-query use-case. comp-grep/comp-glob = the on-rails search PRIMITIVES comp-which RUNS when no rich tool fits (the never-dead-end targets); search primitives, not graph-query rich tools you route TO -- now formally accounted so the registry is COMPLETE (every .tools/comp-* is in tools_index, in entries as comp-which the router, or here with a reason). comp-grep/comp-glob registry-accounting added 3.0.0_SA_CVO 2026-06-26 comp-tools campaign (LD-0208 coverage reconcile 2026-06-25, CTO). comp-imgread ADDED 0.7.0_AE_CloudOps~A 2026-07-15 (Andrew-direct, the .188-vs-.186 photo-misread incident): native-resolution image-region tiler -- a LOCAL-FILE inspection primitive like comp-grep/comp-glob, not a graph-query use-case

contract:
  default: QUERY        # comp-kuzu (cloud/cross-layer) or cached comp-trace/comp-blast (trace)
  rebuild_only_when:
    - "you changed something the graph does not yet reflect AND you need it now (preempt staleness)"
    - "the scheduled refresh (cloud: nightly 02:00 derive->Nessie->kuzu_nessie_load; trace: comp-build)"
  rule: "Never rebuild the full graph to answer a traversal a query can answer."

entries:

  # ---- CLOUD GRAPH (Kuzu / comp-kuzu) — the fast query layer ----
  # PROVENANCE CONTRACT (TO-F1, AC10a): every comp-kuzu invocation prints a
  # provenance header to STDERR from the DB's `<db>._build_manifest.json`
  # sibling -- DB, built-when, source vintage (tarball key / Nessie dual
  # snapshot-id pin / stitch file+mtime), node/edge counts. Build age > 26h
  # (missed-nightly) => WARN: STALE. Nessie-sourced DBs print live
  # commit-distance "BEHIND Nessie HEAD by N commits" (count of warehouse
  # graph_nodes metadata.json newer than the pin). A manifest-less DB =>
  # loud UNKNOWN VINTAGE. Header is stderr-only so --json/table stdout stays
  # parseable. The graph is a minutes-stale-and-LABELED traversal surface,
  # never a read-your-own-writes verification substitute (verify vs served
  # artifact / live AWS). Stamped by kuzu_load / kuzu_nessie_load / kuzu_stitch_load.
  # TO-Q1 (2026-06-12): Nessie-sourced headers also add a PENDING line when
  # opal-globgrph-incremental-events has uncommitted events in the SQS debounce
  # window: "PENDING: ~N event(s) in flight (<=2min debounce, not yet committed)".
  # Absent when queue is empty or sqs:GetQueueAttributes unreachable (best-effort).
  # COMMITTED HEAD = marker; IN-FLIGHT delta = PENDING. Both together = full
  # freshness picture at query time.
  - id: cloud.lookup.nodes_by_type
    use_case: "List/inspect cloud resources of a type (all Lambdas, all S3 buckets, all roles)."
    canonical_call: |
      comp-kuzu "MATCH (n:CloudNode) WHERE n.node_type='LAMBDA' RETURN n.id, n.name LIMIT 50"
    tool: comp-kuzu
    mode: query
    layer: cloud
    cost: "~ms"
    freshness: "kuzu DB <- latest Nessie/Iceberg commit (nightly + intraday); every call prints a provenance header (built-when + source vintage + counts), WARNs past 26h, reports BEHIND-Nessie-HEAD-by-N for nessie DBs, UNKNOWN VINTAGE if unstamped (TO-F1 contract above); DEFAULT surface (no --db-path) = canonical Nessie kuzu_nessie_db; auto-refreshes on Nessie-HEAD-advance ENGINE-INTERNALLY (Rule 20 QUERY-default posture UNCHANGED -- agents never run rebuilds to answer traversals; engine rebuilds exactly when pin trails HEAD); explicit --db-path for scratch DBs (kuzu_db tarball/stitch/ac7) (TO-F2); HEAD oracle = writer-stamped s3://warehouse/_branch_head.main.json marker (mtime-scan RETIRED, CVO dc06744c6); header prints current/BEHIND+writer+ts/HEAD-ORACLE-UNKNOWN per marker (TO-F6)"
    rebuild_trigger: "resource created/changed since last load -> comp-aws derive --resource <arn> ; kuzu_nessie_load"
    anti_pattern: "comp-aws derive (8-min full rebuild) to list nodes"
    status: canonical

  - id: cloud.reachability.transitive
    use_case: "What can X reach transitively (role->resources, lambda->KMS via role/policy)?"
    canonical_call: |
      comp-kuzu "MATCH (a:CloudNode {name:$x})-[*1..3]->(b:CloudNode) RETURN DISTINCT b.node_type, b.id"
    tool: comp-kuzu
    mode: query
    layer: cloud
    cost: "~ms"
    freshness: "kuzu DB (provenance header on every call -- see contract above); DEFAULT surface = canonical Nessie kuzu_nessie_db; auto-refreshes ENGINE-INTERNALLY on Nessie-HEAD-advance; explicit --db-path for scratch DBs (TO-F2); HEAD oracle = writer-stamped _branch_head.main.json marker (mtime-scan RETIRED, CVO dc06744c6); header prints current/BEHIND+writer+ts/HEAD-ORACLE-UNKNOWN per marker (TO-F6)"
    rebuild_trigger: "edges changed since last load"
    anti_pattern: "manual multi-hop tracing or a full re-derive"
    status: canonical

  - id: cloud.blast.what_breaks
    use_case: "What breaks if I change/remove this cloud resource (blast radius)?"
    canonical_call: |
      comp-kuzu "MATCH (n:CloudNode {id:$arn})<-[e:CloudEdge*1..3]-(dep) RETURN dep.id, dep.node_type, e"
    tool: comp-kuzu
    mode: query
    layer: cloud
    cost: "~ms"
    freshness: "kuzu DB (provenance header on every call -- see contract above); DEFAULT surface = canonical Nessie kuzu_nessie_db; auto-refreshes ENGINE-INTERNALLY on Nessie-HEAD-advance; explicit --db-path for scratch DBs (TO-F2); HEAD oracle = writer-stamped _branch_head.main.json marker (mtime-scan RETIRED, CVO dc06744c6); header prints current/BEHIND+writer+ts/HEAD-ORACLE-UNKNOWN per marker (TO-F6)"
    rebuild_trigger: "you just added the dependency you're checking for"
    anti_pattern: "eyeballing terraform / a full derive"
    status: canonical
    notes: "Used as the teardown blast-radius gate (ADHC_CDNCOHT 0-cross-edge confirm, 2026-06-11)."

  - id: cloud.iam.permission_gaps
    use_case: "Does this Lambda/EC2 call boto3 actions its IAM role doesn't grant (or over-grant)?"
    canonical_call: "comp-iam gaps   # or: comp-iam service <lambda> | comp-iam role <name>"
    tool: comp-iam
    mode: rebuild
    layer: cloud
    cost: "~2s"
    freshness: "live TF state + code scan (no Kuzu dependency)"
    rebuild_trigger: "n/a — this is the canonical IAM-gap path"
    anti_pattern: "comp-aws derive to reason about a single role's grants"
    status: canonical

  - id: cloud.iam.usage_coldness
    use_case: "Is this IAM role/grant still USED, and who still REACHES a resource -- the access-plane decommission signal comp-iam lacks (role last-used coldness; who-can-reach an ARN via APPLIED resource policies; a (principal,action,resource) reachability verdict on live simulate)?"
    canonical_call: "comp-iam-usage {role-cold | who-can-reach <arn> | reach-check <role> <action> <arn> | limits}"
    tool: comp-iam-usage
    mode: query
    layer: cloud
    cost: "~seconds-minutes (per-role get-role for RoleLastUsed; get-*-policy; one simulate per reach-check; read-only)"
    freshness: "live AWS IAM (APPLIED, not DESIRED); RoleLastUsed coldness bands; Rule-22a fix-or-carry NAMED in output; an unreadable policy is UNKNOWN not no-reach"
    rebuild_trigger: "n/a"
    anti_pattern: "using comp-iam (DESIRED, (action)-not-(action,resource)) to answer a reachability/usage question -- the exact fails-GREEN class Rule 22a warns about; silently inheriting comp-iam's 3 limits (this tool NAMES the fix-or-carry); or enabling an Access Analyzer (HELD under the alert-suspension)"
    status: canonical
    notes: "comp-which routing: 'is this IAM role unused / role last used / who can reach this bucket / access-plane coldness / decommission a role or grant' -> comp-iam-usage. The lifecycle SIBLING of comp-iam (deploy-time correctness); NFRA_DECOMTOOL access plane."

  - id: cloud.derive.refresh
    use_case: "Rebuild the cloud graph from live AWS (the WRITE-PATH — scheduled, not agent-default)."
    canonical_call: "comp-aws derive --out <path>    # full; or --resource <arn> for bounded"
    tool: comp-aws
    mode: rebuild
    write_path: true    # DR3/E1: mutating write-path (rebuilds Nessie/graph) -- read/navigate intents EXCLUDE cap.write_path==true (~E DR1 pre-filter). NOT a read answer.
    layer: cloud
    cost: "~8min full / seconds bounded"
    freshness: "live"
    rebuild_trigger: "scheduled nightly OR a verified change you must reflect before querying"
    anti_pattern: "running this to answer a traversal -> query comp-kuzu instead"
    status: canonical

  # ---- LOCAL-PROJECTION REFRESH MODES (comp-kuzu-full / comp-kuzu-inc -- NFRA_KUZUSPLIT P1, code @5de839ff0) ----
  # Refresh WRITE-PATH counterparts to cloud.derive.refresh, but for the LOCAL kuzu projection (kuzu_nessie_load),
  # NOT the Nessie derive. Bare comp-kuzu stays the READ default; these are the two named REFRESH modes (LD-0307
  # three-tool model). Registration is COO-SoD (grantee ~D cannot self-register); landed as the first worked
  # example of the emerging canonical comp-tool registration flow.
  - id: cloud.refresh.full
    use_case: "Full rebuild / ground-truth reset / reconcile the LOCAL kuzu projection from Nessie -- the once-per-session MSTR-startup warm that absorbs the whole-table daily delta and warms the shared canonical for peers."
    canonical_call: "comp-kuzu-full [--json] [--limit N] \"<Cypher>\"   # forces a FULL kuzu_nessie_load unconditionally, then serves the query"
    tool: comp-kuzu-full
    mode: rebuild
    write_path: false   # SERVES the Cypher query after a refresh-first (read-WITH-refresh: `comp-kuzu-full "<Cypher>"` returns results), NOT a pure producer like comp-aws derive. Must stay in the read/navigate candidate set or the DR1 write_path pre-filter EXCLUDES it from the very 'reconcile then query' intents it owns (measured 2026-07-17).
    layer: cloud
    cost: "~482s (measured P0 @b0c94d9ff -- absorbs the daily whole-table delta once)"
    freshness: "post-run = current Nessie HEAD (unconditional full load); the MSTR-startup warm-once mode"
    rebuild_trigger: "MSTR session startup (once), or an explicit ground-truth reset when the local projection is untrusted"
    anti_pattern: "running comp-kuzu-full mid-task to answer a traversal (a 482s full rebuild to serve a read) -> bare comp-kuzu (auto) or comp-kuzu-inc"
    status: canonical
    notes: "NFRA_KUZUSPLIT P1 (code @5de839ff0, 0.8.0_AE_CloudComp~D; registration COO-SoD-landed -- grantee cannot self-register). Refresh-mode VARIANT of the comp-kuzu graph-query surface (SAME kuzu_nessie_db store, NOT a new surface). Three-tool model (LD-0307): comp-aws derive = cloud producer (nightly, never MSTR-startup) / comp-kuzu-full = local full (MSTR startup once) / comp-kuzu-inc = local incremental (workers, pre-query). comp-which routing: 'full rebuild / ground-truth reset / reconcile the local projection / MSTR startup graph' -> comp-kuzu-full."

  - id: cloud.refresh.incremental
    use_case: "Refresh / update the graph / my graph is behind -- the DEFAULT every non-MSTR worker runs pre-query: serve the incremental delta, OR serve a LABELED-STALE prior-vintage projection, but NEVER a mid-task full rebuild."
    canonical_call: "comp-kuzu-inc [--json] [--limit N] \"<Cypher>\"   # incremental-OR-serve-labeled-stale (Andrew O-1 / sec-4 hard gate), then serves the query"
    tool: comp-kuzu-inc
    mode: rebuild
    write_path: false   # SERVES the Cypher query after an incremental refresh (read-WITH-refresh: `comp-kuzu-inc "<Cypher>"` returns results), NOT a pure producer. Must stay in the read candidate set: "my graph is behind, refresh then query" is a READ intent, and write_path==true DR1-excludes it before its curated route can fire (measured 2026-07-17).
    layer: cloud
    cost: "~5.2s (measured P0 @b0c94d9ff -- incremental delta) / instant when serving labeled-stale"
    freshness: "post-run = current HEAD when the delta is small; ELSE a LABELED-STALE prior-vintage projection with an in-band SERVED-LABELED-STALE header (COND-1) -- honestly labeled, never a silent stale read"
    rebuild_trigger: "any worker, pre-query, when the local projection may be behind -- the default refresh"
    anti_pattern: "a mid-task FULL rebuild (Andrew O-1 forbids incremental-or-full; the fork is incremental-OR-labeled-stale) -> comp-kuzu-full is MSTR-startup-only"
    status: canonical
    notes: "NFRA_KUZUSPLIT P1 (code @5de839ff0, 0.8.0_AE_CloudComp~D; registration COO-SoD-landed). Refresh-mode VARIANT of the comp-kuzu graph-query surface (SAME store). O-1 (Andrew-ratified): serves incremental OR labeled-stale, NEVER incremental-or-full. In-band provenance header (COND-1) + persistent .fallback.jsonl sink (COND-2) + COMPSIMILAR overlay hook both paths (COND-3). comp-which routing: 'refresh the graph / update the graph / my graph is behind / default worker graph refresh' -> comp-kuzu-inc."

  - id: cloud.describe.resource
    use_case: "What IS this resource / what does it do / describe this ARN / find + describe one AWS resource -- ONE resource's purpose synthesized from the graph (type + layer + producers/consumers/wiring)."
    canonical_call: "comp-describe <arn-or-name> [--json]   # find + describe ONE resource off the derive-at-scan engine"
    tool: comp-describe
    mode: query
    write_path: false
    layer: cloud
    cost: "~ms: 2 targeted comp-kuzu queries for an exact ARN (node + edges); +1 light all-node sweep only for name/substring resolution. Never the full-corpus build."
    freshness: "reads the live comp-kuzu graph (shares its provenance/HEAD-oracle); derive-at-scan -- no projected property, no table, nothing to go stale beyond the graph vintage. 0 matches -> hints comp-kuzu-inc (broken retrieval != absent)."
    rebuild_trigger: "never (Rule 20 QUERY-default)"
    anti_pattern: "using it for NEAREST-BY-PURPOSE similarity (that is comp-similar Phase-2, KUZUSPLIT-P1 + table gated) -> describe is exact/lexical find of ONE resource. Arbitrary Cypher traversal -> comp-kuzu; blast radius -> comp-blast; a named pipeline thread -> pipescript."
    status: canonical
    notes: "NFRA_COMPSIMILAR describe surface (Andrew-direct pull-forward 2026-07-18, code @ff21627b0, 0.8.0_AE_CloudComp~D; registration COO-SoD -- grantee cannot self-register). Servable off the LANDED derive-at-scan engine (summary_corpus.py @3fe0eedf0) over the EXISTING comp-kuzu QUERY path; decoupled from BOTH the KUZUSPLIT-P1 projection AND the resource_summaries table. Resolution LEXICAL (exact ARN -> exact name -> substring); ambiguous -> disambiguation list, no silent guess."

  - id: cloud.similar.resource
    use_case: "Do two resources do the same JOB / find a functional duplicate / is anything SUPERSEDED / a decommission candidate / an old resource left running next to its replacement -- nearest-BY-PURPOSE similarity (BM25 over the derive-at-scan SUMMARY corpus: what a resource DOES). The sibling of comp-dups (NAME/body -- what it IS)."
    canonical_call: "comp-similar <arn-or-name> [<arn-or-name>] | supersede [--heat-json F | --live-heat] | cluster [--type T] [--json]   # functional-similarity / supersede scan off the summary corpus"
    tool: comp-similar
    mode: query
    write_path: false
    layer: cloud
    cost: "corpus = 1 comp-kuzu read (~s, ~1.8k nodes); BM25 cheap (df-cut). supersede heat: --heat-json snapshot ~ms (PREFERRED); --live-heat MINUTES (comp-debris live AWS, partial for S3)."
    freshness: "live comp-kuzu derive-at-scan summary corpus (shares its provenance/HEAD-oracle); no projected property, no table (CTO ruling 1). heat = current comp-debris/comp-heat vintage OR an explicit --heat-json snapshot. A thin/UNKNOWN summary -> UNKNOWN-band, never a twin claim (C3)."
    rebuild_trigger: "never (Rule 20 QUERY-default)"
    anti_pattern: "using it for NAME/body structural duplicates or the dead-resource census (that is comp-dups, the IS axis); describing ONE resource (comp-describe); arbitrary Cypher (comp-kuzu). NO delete verb -- supersede is advisory/hypothesis, deletion stays per-batch Andrew-word (feeds OPAL_LCLRPO)."
    status: canonical
    notes: "NFRA_COMPSIMILAR PH2 engine (0.8.0_AE_CloudComp~D; engine @b63b18853, org/modules/graph/debtscan/comp_similar.py; registration COO-SoD -- grantee cannot self-register). BM25 SUMMARY similarity (the DOES axis) = engine-sibling of comp-describe (same summary corpus, describe-ONE vs similar-MANY) + concept-sibling of comp-dups (dup_scan.py, the IS axis -- NAME/body). Name-EXCLUDED corpus (control C2, no comp-dups collapse). PRD 5 controls: C1 no-verdict-without-heat-divergence / C2 name-excluded / C3 blind-row + coverage-denominator / C4 dogfood / C5 hold-aware; self-test 7/7. comp-which routing: 'same JOB / functional duplicate / superseded / decommission candidate / old resource next to its replacement' -> comp-similar."

  - id: cloud.derive.class
    use_case: "Is this RESOURCE TYPE under Terraform control? Bounded per-class drift ledger (L1 grain: one class)."
    canonical_call: "comp-aws derive --class <ClassName>   # L1 (type-managed?) -- distinct from --resource (L0, one ARN) and bare derive (L2, full edge graph)"
    tool: comp-aws
    write_path: false
    layer: cloud
    cost: "seconds (one class)"
    freshness: "live"
    anti_pattern: "bare `comp-aws derive` (8-min full rebuild) to answer a single-type managed? question"
    status: canonical

  # ---- TRACE GRAPH (repo/code) — comp-trace / comp-blast (cached) ----
  - id: trace.blast.what_breaks
    use_case: "What breaks if I change this function/file/artifact (repo blast radius)?"
    canonical_call: "comp-blast <fn-or-arn> [--function name] [--check-consumers]"
    tool: comp-blast
    mode: query-cached
    layer: trace
    cost: "~ms warm (graph.json 5-min cache)"
    freshness: "graph.json (5-min TTL; rebuilds if stale)"
    rebuild_trigger: "you added new files since the last build -> comp-build"
    anti_pattern: "Explore-agent sweep or manual grep for dependents"
    status: canonical

  - id: trace.walk.dependency_chain
    use_case: "Full dependency chain to/from any repo node (imports, fetches, reads/writes)."
    canonical_call: "comp-trace <node> --direction both [--depth N]"
    tool: comp-trace
    mode: query-cached
    layer: trace
    cost: "~ms warm"
    freshness: "graph.json (5-min TTL)"
    rebuild_trigger: "new files -> comp-build"
    anti_pattern: "manual file-by-file tracing"
    status: canonical

  - id: trace.fullstack.component_to_gold
    use_case: "Full-stack trace: portal component -> endpoint -> Lambda/S3 -> gold script, PER FIRM."
    canonical_call: "comp-platinum page <Component> --firm <bd|inf|cot>   # ADVI is firm-isolated"
    tool: comp-platinum
    mode: query-cached  # NFRA_GRAPHS D2 — LANDED 2026-06-11
    layer: trace
    cost: "~0.2s warm (cache read); ~5s cold/--force rebuild"
    freshness: "per-firm cache (.comp-graph/platinum.*), 5-min TTL — same model as the trace graph.json"
    rebuild_trigger: "TTL expiry, --force (always), or --fresh (re-derive if source files changed); --firm REQUIRED for inf/cot (else defaults bd)"
    anti_pattern: "omitting --firm for an Inflection/Cottonwood trace (firm-blind -> wrong producer/bucket); --force on a warm trace that the cache would serve"
    status: canonical
    notes: "Firm-parameterized 2026-06-11 (NFRA 514d433). Caching LANDED via NFRA_GRAPHS D2 (graph_cache.py): routing table + per-firm gold DAG + dataflows cached, keyed by --firm; warm page is a cache read, bd cold==warm regression-clean."

  - id: trace.pipeline.gold_dag
    use_case: "Gold script I/O, chain membership, deployed-match, overlap."
    canonical_call: "comp-pipescript <io|dag|chain|feeds|consumers|deployed|overlap> <script>"
    tool: comp-pipescript
    mode: rebuild
    layer: pipeline
    cost: "~1-2s"
    freshness: "live repo parse"
    rebuild_trigger: "n/a — canonical pipeline path"
    anti_pattern: "manual s3_layout reading"
    status: canonical

  - id: trace.routes.serving_path
    use_case: "CloudFront -> behavior -> origin -> Lambda serving path for a URL/endpoint."
    canonical_call: "comp-routes trace <url|endpoint> | comp-routes behaviors"
    tool: comp-routes
    mode: rebuild
    layer: trace
    cost: "~1-2s"
    freshness: "live TF parse"
    rebuild_trigger: "n/a"
    anti_pattern: "guessing CF behavior order"
    status: canonical

  - id: trace.rebuild.refresh
    use_case: "Rebuild the trace graph cache (WRITE-PATH — after adding files)."
    canonical_call: "comp-build [--check]"
    tool: comp-build
    mode: rebuild
    write_path: true    # DR3/E1: mutating write-path (rebuilds the trace_graph cache) -- read/navigate intents EXCLUDE cap.write_path==true. NOT a read answer.
    layer: trace
    cost: "~9.8s"
    freshness: "writes graph.json"
    rebuild_trigger: "new files / suspected stale cache; or comp-build --check to verify without rebuild"
    anti_pattern: "rebuilding to answer a query comp-trace would serve from cache"
    status: canonical

  - id: trace.diff.staged_blast
    use_case: "What's the blast radius of my uncommitted/staged changes (before commit)?"
    canonical_call: "comp-diff [--staged | --ref HEAD~3]"
    tool: comp-diff
    mode: rebuild
    layer: trace
    cost: "~2s (rebuilds graph + git diff)"
    freshness: "live repo + git"
    rebuild_trigger: "n/a — must reflect your uncommitted change, so a rebuild is correct here"
    anti_pattern: "committing blind then discovering the break"
    status: canonical

  - id: trace.xref.symbol
    use_case: "Find every graph node touching a symbol (id/label/file/edge endpoints)."
    canonical_call: "comp-xref <symbol>"
    tool: comp-xref
    mode: query-cached
    layer: trace
    cost: "~ms (symbol mode uses cached graph)"
