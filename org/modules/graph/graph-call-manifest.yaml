  comp-whoread:  { does: "WHO-DID-READ S3 object-read forensics: the principals that ACTUALLY read a bucket/prefix (CloudTrail object-level data events via Athena) + counts + first/last-seen. Denominator = the coverage window, printed line 1; FAILS CLOSED (rc=1) on zero data events in range. Floor on reachability, never a ceiling -- do not derive IAM narrowings from it", subcommands: ["<bucket>[/prefix]", "--since"], entries: [cloud.whoread.object_read_forensics] }
