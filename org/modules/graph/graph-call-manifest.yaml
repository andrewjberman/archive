# executable), declared here so (a) the retired-alias invariant keeps the three sections coherent
# -- a name is in EXACTLY ONE of {tools_index, excluded_not_graph_use_cases, retired_aliases}, and
# every `successor` is null or a LIVE name -- and (b) no operational ROUTING surface (the HUD, an
# agent prompt, a skill) may still CITE a declared-retired name (routing agents to a dead tool).
