  # ---- "IS MY ANSWER OLD?" -- THE READ THAT STATES ITS OWN VINTAGE ----
  # NFRA_CLDGRPH CG-s-17 (2026-09-09). The two LOCAL-PROJECTION REFRESH entries that used to sit
  # here are RETIRED RECORDS below. There is no agent-runnable refresh any more: the local
  # projection went with its executable plane (CG-s-8 @173a1d8c90) and the SERVED projection is
  # refreshed on the estate's own schedule. THE SUCCESSOR IS A READ, NEVER A REFRESH -- the answer
  # arrives with a plain-words line saying how old it is, so "my graph is behind" is ANSWERED
  # instead of acted on.
  - id: cloud.read.served_vintage
    use_case: "How old is this answer / is the graph behind / should I refresh before I query / bring the graph up to date -- READ the served projection and read the VINTAGE line it prints. There is nothing an agent refreshes: the served graph is advanced on the estate's own schedule."
    canonical_call: "comp-kuzu \"<Cypher>\" [--json] [--limit N]   # the answer on stdout, then a VINTAGE line on stderr saying in plain words how old it is"
    tool: comp-kuzu
    mode: query
    write_path: false
    layer: cloud
    cost: "~ms -- one call to the projection service; no store is opened, built or downloaded"
    freshness: "STATED BY THE SERVICE, PER CALL. Every read ends with `VINTAGE: <plain-words age>  [vintage=<vintage> manifest=<sha12> prefix=<artifact prefix>]` on stderr (infra/aws/globgrph/kuzu_cli.py:46-61). The sentence is what a reader acts on; the triple is what an auditor re-derives from. NOTHING IS COMPUTED FROM CLIENT TIME: when the service states no age the line says so verbatim (`AGE NOT STATED BY THE SERVICE -- no age was inferred`), and when the service does not answer the line names the ABSENCE (`VINTAGE: unavailable -- the projection service did not answer; no age was inferred and no local copy was read`) rather than a default vintage."
    rebuild_trigger: "none. There is no refresh an agent runs. The served projection is advanced by the estate's own producers on their own schedule; an agent reads, and reads the vintage."
    anti_pattern: "hunting for a refresh flag when an answer looks old, or reaching for a local copy to get a fresher one -> read the VINTAGE line. If the stated vintage is too old for the question, that is an estate-schedule matter to raise, not a call to make."
    status: canonical
    notes: "NFRA_CLDGRPH CG-s-17 (round 5, 2026-09-09) -- the SUCCESSOR entry named by cloud.refresh.full and cloud.refresh.incremental. Deliberately a READ: FWD-2 (the served projection refreshes on the estate's own schedule) and FWD-3 (every answer carries its own age) are what make a refresh route unnecessary, and re-creating one would re-create the retired rebuild path. The client takes NO database path and NO Cypher parameter dict -- projection_client.query(statement, timeout_s) -> {rows, vintage, age_line, manifest_sha256, artifact_prefix} (:194-201). A call form documenting either documents a capability that does not exist."

