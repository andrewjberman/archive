# graph-call-manifest.yaml — the authoritative catalog of EVERY graph use-case -> its canonical call.
#
# NFRA_GRAPHS (PRD: docs/architecture/NFRA_GRAPHS.md). Referenced in CLAUDE.md and MANDATED: any code
# change or agent workflow that derives/rebuilds/queries the dependency graph MUST use the `canonical`
# call for its use-case. Default to QUERY (comp-kuzu / cached comp-trace); REBUILD only to preempt a
# staleness you just created, or on the scheduled refresh. Gate: comp-manifest-check (advisory -> blocking).
#
# STATUS: v0.1 SCAFFOLD (1.0.0_SA_CTO 2026-06-11). Seeded with the high-frequency canonical calls; full
# coverage (one `canonical` per distinct use-case across all ~30 comp-* tools + the Kuzu Cypher surface)
# is the AC1 close-gate. Cross-layer entries are `planned` until NFRA_GLOBGRPH P2-STITCH lands.
#
# Per-entry schema:
#   id:              stable dotted id (layer.topic.specific)
#   use_case:        the question this answers, in agent terms
#   canonical_call:  the exact command / Cypher to run
#   tool:            comp-kuzu | comp-trace | comp-blast | comp-platinum | comp-pipescript | ...
#   mode:            query | query-cached | rebuild
#   layer:           cloud | trace | cross-layer | pipeline
#   cost:            "~ms" | "~2s" | "~9.8s" | "~8min"
#   freshness:       how current the answer is + what backs it
#   rebuild_trigger: when to force a rebuild INSTEAD of querying (staleness-preempt)
#   anti_pattern:    the slower/ad-hoc thing NOT to do
#   status:          canonical | deprecated | planned
#   superseded_by:   (deprecated only) the canonical id that replaces this

# INTENTIONALLY NOT CATALOGED (not graph-access use-cases -> exempt from the mandate, AC1-complete):
#   comp-learns-run / comp-learns-status  -- compiler self-learning/telemetry harness (not a graph query)
#   comp-perf                             -- tool-perf benchmarking (not a graph query)
#   comp-v5-composite-test.sh             -- tool regression test
#   comp-grep / comp-glob                 -- the ON-RAILS SEARCH PRIMITIVES comp-which RUNS when
#                                            no rich tool fits (the never-dead-end); a search
#                                            primitive, not a graph-query rich tool you route TO
excluded_not_graph_use_cases: [comp-learns-run, comp-learns-status, comp-perf, comp-v5-composite-test, comp-manifest-check, comp-surface-check, comp-to, comp-grep, comp-glob]  # comp-manifest-check = D6 manifest-ENFORCEMENT gate; comp-surface-check = D8 critical-surface commit-gate (polices critical-surfaces.yaml at commit, auto in safe-commit) -- both ENFORCEMENT gates, not graph-query use-cases (so excluded here; they're in CLAUDE.md's invoke-table). comp-to = session-context setter (writes the race-free per-session TO_ID for the comp auto-logger); a startup/context primitive like comp-which/comp-grep/comp-glob, not a graph-query use-case. comp-grep/comp-glob = the on-rails search PRIMITIVES comp-which RUNS when no rich tool fits (the never-dead-end targets); search primitives, not graph-query rich tools you route TO -- now formally accounted so the registry is COMPLETE (every .tools/comp-* is in tools_index, in entries as comp-which the router, or here with a reason). comp-grep/comp-glob registry-accounting added 3.0.0_SA_CVO 2026-06-26 comp-tools campaign (LD-0208 coverage reconcile 2026-06-25, CTO)

contract:
  default: QUERY        # comp-kuzu (cloud/cross-layer) or cached comp-trace/comp-blast (trace)
  rebuild_only_when:
    - "you changed something the graph does not yet reflect AND you need it now (preempt staleness)"
    - "the scheduled refresh (cloud: nightly 02:00 derive->Nessie->kuzu_nessie_load; trace: comp-build)"
  rule: "Never rebuild the full graph to answer a traversal a query can answer."

entries:

  # ---- CLOUD GRAPH (Kuzu / comp-kuzu) — the fast query layer ----
  # PROVENANCE CONTRACT (TO-F1, AC10a): every comp-kuzu invocation prints a
  # provenance header to STDERR from the DB's `<db>._build_manifest.json`
  # sibling -- DB, built-when, source vintage (tarball key / Nessie dual
  # snapshot-id pin / stitch file+mtime), node/edge counts. Build age > 26h
  # (missed-nightly) => WARN: STALE. Nessie-sourced DBs print live
  # commit-distance "BEHIND Nessie HEAD by N commits" (count of warehouse
  # graph_nodes metadata.json newer than the pin). A manifest-less DB =>
  # loud UNKNOWN VINTAGE. Header is stderr-only so --json/table stdout stays
  # parseable. The graph is a minutes-stale-and-LABELED traversal surface,
  # never a read-your-own-writes verification substitute (verify vs served
  # artifact / live AWS). Stamped by kuzu_load / kuzu_nessie_load / kuzu_stitch_load.
  # TO-Q1 (2026-06-12): Nessie-sourced headers also add a PENDING line when
  # opal-globgrph-incremental-events has uncommitted events in the SQS debounce
  # window: "PENDING: ~N event(s) in flight (<=2min debounce, not yet committed)".
  # Absent when queue is empty or sqs:GetQueueAttributes unreachable (best-effort).
  # COMMITTED HEAD = marker; IN-FLIGHT delta = PENDING. Both together = full
  # freshness picture at query time.
  - id: cloud.lookup.nodes_by_type
    use_case: "List/inspect cloud resources of a type (all Lambdas, all S3 buckets, all roles)."
    canonical_call: |
      comp-kuzu "MATCH (n:CloudNode) WHERE n.node_type='LAMBDA' RETURN n.id, n.name LIMIT 50"
    tool: comp-kuzu
    mode: query
    layer: cloud
    cost: "~ms"
    freshness: "kuzu DB <- latest Nessie/Iceberg commit (nightly + intraday); every call prints a provenance header (built-when + source vintage + counts), WARNs past 26h, reports BEHIND-Nessie-HEAD-by-N for nessie DBs, UNKNOWN VINTAGE if unstamped (TO-F1 contract above); DEFAULT surface (no --db-path) = canonical Nessie kuzu_nessie_db; auto-refreshes on Nessie-HEAD-advance ENGINE-INTERNALLY (Rule 20 QUERY-default posture UNCHANGED -- agents never run rebuilds to answer traversals; engine rebuilds exactly when pin trails HEAD); explicit --db-path for scratch DBs (kuzu_db tarball/stitch/ac7) (TO-F2); HEAD oracle = writer-stamped s3://warehouse/_branch_head.main.json marker (mtime-scan RETIRED, CVO dc06744c6); header prints current/BEHIND+writer+ts/HEAD-ORACLE-UNKNOWN per marker (TO-F6)"
    rebuild_trigger: "resource created/changed since last load -> comp-aws derive --resource <arn> ; kuzu_nessie_load"
    anti_pattern: "comp-aws derive (8-min full rebuild) to list nodes"
    status: canonical

  - id: cloud.reachability.transitive
    use_case: "What can X reach transitively (role->resources, lambda->KMS via role/policy)?"
    canonical_call: |
      comp-kuzu "MATCH (a:CloudNode {name:$x})-[*1..3]->(b:CloudNode) RETURN DISTINCT b.node_type, b.id"
    tool: comp-kuzu
    mode: query
    layer: cloud
    cost: "~ms"
    freshness: "kuzu DB (provenance header on every call -- see contract above); DEFAULT surface = canonical Nessie kuzu_nessie_db; auto-refreshes ENGINE-INTERNALLY on Nessie-HEAD-advance; explicit --db-path for scratch DBs (TO-F2); HEAD oracle = writer-stamped _branch_head.main.json marker (mtime-scan RETIRED, CVO dc06744c6); header prints current/BEHIND+writer+ts/HEAD-ORACLE-UNKNOWN per marker (TO-F6)"
    rebuild_trigger: "edges changed since last load"
    anti_pattern: "manual multi-hop tracing or a full re-derive"
    status: canonical

  - id: cloud.blast.what_breaks
    use_case: "What breaks if I change/remove this cloud resource (blast radius)?"
    canonical_call: |
      comp-kuzu "MATCH (n:CloudNode {id:$arn})<-[e:CloudEdge*1..3]-(dep) RETURN dep.id, dep.node_type, e"
    tool: comp-kuzu
    mode: query
    layer: cloud
    cost: "~ms"
    freshness: "kuzu DB (provenance header on every call -- see contract above); DEFAULT surface = canonical Nessie kuzu_nessie_db; auto-refreshes ENGINE-INTERNALLY on Nessie-HEAD-advance; explicit --db-path for scratch DBs (TO-F2); HEAD oracle = writer-stamped _branch_head.main.json marker (mtime-scan RETIRED, CVO dc06744c6); header prints current/BEHIND+writer+ts/HEAD-ORACLE-UNKNOWN per marker (TO-F6)"
    rebuild_trigger: "you just added the dependency you're checking for"
    anti_pattern: "eyeballing terraform / a full derive"
    status: canonical
    notes: "Used as the teardown blast-radius gate (ADHC_CDNCOHT 0-cross-edge confirm, 2026-06-11)."

  - id: cloud.iam.permission_gaps
    use_case: "Does this Lambda/EC2 call boto3 actions its IAM role doesn't grant (or over-grant)?"
    canonical_call: "comp-iam gaps   # or: comp-iam service <lambda> | comp-iam role <name>"
    tool: comp-iam
    mode: rebuild
    layer: cloud
    cost: "~2s"
    freshness: "live TF state + code scan (no Kuzu dependency)"
    rebuild_trigger: "n/a — this is the canonical IAM-gap path"
    anti_pattern: "comp-aws derive to reason about a single role's grants"
    status: canonical

  - id: cloud.derive.refresh
    use_case: "Rebuild the cloud graph from live AWS (the WRITE-PATH — scheduled, not agent-default)."
    canonical_call: "comp-aws derive --out <path>    # full; or --resource <arn> for bounded"
    tool: comp-aws
    mode: rebuild
    layer: cloud
    cost: "~8min full / seconds bounded"
    freshness: "live"
    rebuild_trigger: "scheduled nightly OR a verified change you must reflect before querying"
    anti_pattern: "running this to answer a traversal -> query comp-kuzu instead"
    status: canonical

  # ---- TRACE GRAPH (repo/code) — comp-trace / comp-blast (cached) ----
  - id: trace.blast.what_breaks
    use_case: "What breaks if I change this function/file/artifact (repo blast radius)?"
    canonical_call: "comp-blast <fn-or-arn> [--function name] [--check-consumers]"
    tool: comp-blast
    mode: query-cached
    layer: trace
    cost: "~ms warm (graph.json 5-min cache)"
    freshness: "graph.json (5-min TTL; rebuilds if stale)"
    rebuild_trigger: "you added new files since the last build -> comp-build"
    anti_pattern: "Explore-agent sweep or manual grep for dependents"
    status: canonical

  - id: trace.walk.dependency_chain
    use_case: "Full dependency chain to/from any repo node (imports, fetches, reads/writes)."
    canonical_call: "comp-trace <node> --direction both [--depth N]"
    tool: comp-trace
    mode: query-cached
    layer: trace
    cost: "~ms warm"
    freshness: "graph.json (5-min TTL)"
    rebuild_trigger: "new files -> comp-build"
    anti_pattern: "manual file-by-file tracing"
    status: canonical

  - id: trace.fullstack.component_to_gold
    use_case: "Full-stack trace: portal component -> endpoint -> Lambda/S3 -> gold script, PER FIRM."
    canonical_call: "comp-platinum page <Component> --firm <bd|inf|cot>   # ADVI is firm-isolated"
    tool: comp-platinum
    mode: query-cached  # NFRA_GRAPHS D2 — LANDED 2026-06-11
    layer: trace
    cost: "~0.2s warm (cache read); ~5s cold/--force rebuild"
    freshness: "per-firm cache (.comp-graph/platinum.*), 5-min TTL — same model as the trace graph.json"
    rebuild_trigger: "TTL expiry, --force (always), or --fresh (re-derive if source files changed); --firm REQUIRED for inf/cot (else defaults bd)"
    anti_pattern: "omitting --firm for an Inflection/Cottonwood trace (firm-blind -> wrong producer/bucket); --force on a warm trace that the cache would serve"
    status: canonical
    notes: "Firm-parameterized 2026-06-11 (NFRA 514d433). Caching LANDED via NFRA_GRAPHS D2 (graph_cache.py): routing table + per-firm gold DAG + dataflows cached, keyed by --firm; warm page is a cache read, bd cold==warm regression-clean."

  - id: trace.pipeline.gold_dag
    use_case: "Gold script I/O, chain membership, deployed-match, overlap."
    canonical_call: "comp-pipescript <io|dag|chain|feeds|consumers|deployed|overlap> <script>"
    tool: comp-pipescript
    mode: rebuild
    layer: pipeline
    cost: "~1-2s"
    freshness: "live repo parse"
    rebuild_trigger: "n/a — canonical pipeline path"
    anti_pattern: "manual s3_layout reading"
    status: canonical

  - id: trace.routes.serving_path
    use_case: "CloudFront -> behavior -> origin -> Lambda serving path for a URL/endpoint."
    canonical_call: "comp-routes trace <url|endpoint> | comp-routes behaviors"
    tool: comp-routes
    mode: rebuild
    layer: trace
    cost: "~1-2s"
    freshness: "live TF parse"
    rebuild_trigger: "n/a"
    anti_pattern: "guessing CF behavior order"
    status: canonical

  - id: trace.rebuild.refresh
    use_case: "Rebuild the trace graph cache (WRITE-PATH — after adding files)."
    canonical_call: "comp-build [--check]"
    tool: comp-build
    mode: rebuild
    layer: trace
    cost: "~9.8s"
    freshness: "writes graph.json"
    rebuild_trigger: "new files / suspected stale cache; or comp-build --check to verify without rebuild"
    anti_pattern: "rebuilding to answer a query comp-trace would serve from cache"
    status: canonical

  - id: trace.diff.staged_blast
    use_case: "What's the blast radius of my uncommitted/staged changes (before commit)?"
    canonical_call: "comp-diff [--staged | --ref HEAD~3]"
    tool: comp-diff
    mode: rebuild
    layer: trace
    cost: "~2s (rebuilds graph + git diff)"
    freshness: "live repo + git"
    rebuild_trigger: "n/a — must reflect your uncommitted change, so a rebuild is correct here"
    anti_pattern: "committing blind then discovering the break"
    status: canonical

  - id: trace.xref.symbol
    use_case: "Find every graph node touching a symbol (id/label/file/edge endpoints)."
    canonical_call: "comp-xref <symbol>"
    tool: comp-xref
    mode: query-cached
    layer: trace
    cost: "~ms (symbol mode uses cached graph)"
    freshness: "graph.json (5-min TTL)"
    rebuild_trigger: "new files -> comp-build"
    anti_pattern: "manual grep across the repo for a symbol's dependents"
    status: canonical

  - id: trace.xref.graph_drift
    use_case: "Did the dependency graph change vs a saved baseline (after a deploy/re-run)?"
    canonical_call: "comp-xref --save   # snapshot; then comp-xref (no-arg) to diff"
    tool: comp-xref
    mode: rebuild
    layer: trace
    cost: "~2s (diff mode rebuilds graph)"
    freshness: "live vs saved baseline"
    rebuild_trigger: "n/a — drift detection needs the fresh graph"
    anti_pattern: "assuming the graph is unchanged after a structural edit"
    status: canonical

  - id: trace.transform.component_fields
    use_case: "Which response fields does a component actually render? (schema-check / unused-field audit)"
    canonical_call: "comp-transform schema-check <Component> [--feature <token>] ; comp-transform ternary-audit <Component>"
    tool: comp-transform
    mode: rebuild
    layer: trace
    cost: "~1s (portal parse)"
    freshness: "live portal/src"
    rebuild_trigger: "n/a — fast targeted parse"
    anti_pattern: "manually reading the TSX to find MISSING/UNUSED fields"
    status: canonical

  - id: trace.cache.key_collisions
    use_case: "Do components share a React Query cache key (cache corruption risk)?"
    canonical_call: "comp-cache collisions ; comp-cache key <substring>"
    tool: comp-cache
    mode: rebuild
    layer: trace
    cost: "~1s"
    freshness: "live portal/src"
    rebuild_trigger: "n/a"
    anti_pattern: "debugging a stale-data bug without checking key collisions"
    status: canonical

  - id: trace.pii.exposure
    use_case: "Does a component/route expose PII to external users (pseudonymized vs cleartext)?"
    canonical_call: "comp-pii audit ; comp-pii scan <Component>"
    tool: comp-pii
    mode: rebuild
    layer: trace
    cost: "~2s"
    freshness: "live routes + registry"
    rebuild_trigger: "n/a"
    anti_pattern: "shipping a field without a PII check"
    status: canonical

  - id: trace.types.type_consumers
    use_case: "Which components consume this TypeScript type (before editing an interface)?"
    canonical_call: "comp-types index <TypeName> [--firm-conditional-sites]"
    tool: comp-types
    mode: rebuild
    layer: trace
    cost: "~5s (regex portal grep)"
    freshness: "live portal/src"
    rebuild_trigger: "n/a"
    anti_pattern: "editing a shared type without enumerating consumers"
    status: canonical

  - id: trace.adapter.field_threading
    use_case: "Pre-ship field-threading audit of a portal adapter function."
    canonical_call: "comp-adapter-audit <adapter-fn> [--severity warn|error]"
    tool: comp-adapter-audit
    mode: rebuild
    layer: trace
    cost: "~60s (live S3 fetch + regex parse)"
    freshness: "live S3 + portal"
    rebuild_trigger: "n/a — needs the live served artifact"
    anti_pattern: "shipping an adapter without verifying the field threads through"
    status: canonical

  - id: trace.platinum.reverse
    use_case: "Which routes + components consume this S3/platinum key (reverse of the page trace)?"
    canonical_call: "comp-platinum reverse <s3_key> [--firm <bd|inf|cot>] [--fresh|--force]"
    tool: comp-platinum
    mode: query-cached  # NFRA_GRAPHS D2 — LANDED 2026-06-11
    layer: trace
    cost: "~0.2s warm (cache read); ~5s cold/--force"
    freshness: "per-firm cache (.comp-graph/platinum.*), 5-min TTL"
    rebuild_trigger: "TTL expiry / --force / --fresh (source drift) — see trace.fullstack.component_to_gold"
    anti_pattern: "guessing which components break if a key changes"
    status: canonical

  # ---- PIPELINE / DATA ----
  - id: pipeline.validate.artifact
    use_case: "Does a gold artifact satisfy its declared invariants BEFORE S3 upload?"
    canonical_call: "comp-validate <script_id> --artifact <local/path>"
    tool: comp-validate
    mode: rebuild
    layer: pipeline
    cost: "~1s JSON / ~2s parquet"
    freshness: "live artifact + config"
    rebuild_trigger: "n/a — validates a specific artifact"
    anti_pattern: "uploading a gold artifact unvalidated (signalling SAFE on NO_CONFIG)"
    status: canonical
    notes: "Exit-0 PASS/WAIVED = SAFE to signal; NO_CONFIG/ZERO_CHECKS = UNVALIDATED (not a pass). See COMP_VALIDATE_PROTOCOL.md."

  - id: pipeline.pipescript.deployed_match
    use_case: "Does the runner have my code (before running a gold script ad-hoc)?"
    canonical_call: "comp-pipescript deployed [<script>] [--firm bd|inf|cot|mdpf | --pipeline <key>]   # no arg = sweep ALL trees"
    tool: comp-pipescript
    mode: rebuild
    layer: pipeline
    cost: "~2-5s single tree; ~15-30s no-arg all-trees sweep (AWS API calls)"
    freshness: "live S3 deployed code"
    rebuild_trigger: "n/a — must check live deployed state"
    anti_pattern: "running a gold script without confirming MATCH (STALE/MISSING runner); reading a sweep MATCH without noting which bucket it checked; counting an UNCOVERED row as clean"
    status: canonical
    notes: "comp-pipescript deployed covers ALL PIPELINE_MAP trees (NFRA_DEBTSCAN.TOOL-01 2026-06-12): bd+inf+cot firm-bucket mapping derives from safe_deploy_core.PIPELINE_MAP (single source, no drift); mdpf appended check-only (NOT in the deploy-gate map -- non-standard code/scripts/<layer>/ layout, deploys via its own mechanism -- but still checked because MDPF_COUNTS proved it strands). Scope resolution: --firm {bd,inf,cot,mdpf} or --pipeline <key> = single tree; a data/<tree>/scripts/... path AUTO-DETECTS the tree (generalizes the cot-only auto-route); NO arg = sweep EVERY tree. Firm separation: each tree reads ONLY its own bucket (no cross-bucket fallback). Sweep prints a per-tree banner naming the bucket so every MATCH/STALE/MISSING row is bucket-attributed (an un-attributed row is how a stranded-deploy blind spot hides). backfill/feeders now covered via the mdpf branch + canonicalize regex. Closes the inf/cot/mdpf DEBTSCAN UNKNOWN-VINTAGE caveat. BRONZE first-class (NFRA_DEBTSCAN.TOOL-03 2026-06-12): data/<dir>/scripts/bronze -> code/bronze/ swept for bd+inf+cot ([BRONZE] rows) -- closes the Rule-13 bronze-verifiability gap (2026-06-12 inf-ADVI stranded-deploy hand-diff). New layer-scoped keys bd-bronze/inf-bronze/cot-bronze make safe-deploy's '{firm}-{layer}' verify call work for bronze. AUX prefixes CHECK-ONLY ([aux:<prefix>] rows): inf bronze-runner (the dual-prefix the runner ACTUALLY syncs -- divergence there is a live stranded-deploy until ADVI_INFETL.BRONZE-FIX collapses it) + inf manual_api mapped to repo homes; aux divergence prints DRIFT in full-tree views (never the deploy-gate STALE token; only the *-bronze view reports bronze-homed aux as real STALE); runner/exporter/cleanup + any prefix NOT in the tool registry emit explicit UNCOVERED rows (live code/ enumeration) -- tool-blindness is NEVER countable as cleanliness (false-clean guard)."

  - id: estate.pipescript.named_thread
    use_case: "What am I looking for -- the news scanner? -> pipescript news -> EVERY resource in that named thread + producers->served->frontend + owning tool + coverage + debt flags, over the whole estate, no silent Unknown."
    canonical_call: "pipescript <name>   # e.g. pipescript news ; --list ; --resource <substr> ; --tool <name> <tool> ; --debt (debtscan flags inline) ; --fe-reachability (mounted/orphan/phantom/unreviewed) ; --validate ; --gate-b (standing regression oracle)"
    tool: pipescript
    mode: query-cached
    layer: estate
    cost: "~0.3s (reads prebuilt estate-coverage-resolver.json; no AWS calls)"
    freshness: "estate-coverage-resolver.json (gen-estate-resolver.py joins CVO manifest 61e91d334 + census 2d9a0a2a1)"
    rebuild_trigger: "re-run org/modules/graph/gen-estate-resolver.py after the manifest/census changes (resolver is a generated join)"
    anti_pattern: "grepping across single-slice tools for a thread one of them doesn't own (silent Unknown); treating an unowned-tool query as clean instead of the LOUD OUT-OF-SCOPE pointer; live-grepping the portal for FE-reachability (scaffolding-fooled -- bd-time-machine's provider exists in code; use --fe-reachability's CVO ground-truth)"
    status: canonical
    notes: "NFRA_PIPESCRIPT COMPLETE 2026-06-15 (full PRD: a+b+c+P1b+P3, CVO final attestation bce23d613). Named-thread estate traversal: 25 named threads (per-page refined: advi-bd/inf/cot + market-overview/factor-tilts/valuation/correlation/positioning/cma/attribution/macroeconomics/model-portfolios/portfolio-management/trade-submission/news/causality/security-scanner/smartx/mdpf/partners/graph-platform/insurance/portal-infra/ops-internal) / 134 sub-threads over the 169-lambda census. Routes each thread to its owning_tool (comp-pipescript=medallion=13 / globgrph=AWS-resource / stitch=cross-layer / portal-consumer-tools=frontend / none=ops-local). P1b.2 = read-only drill POINTER (surfaces the canonical sub-resolver call per thread; does NOT live-invoke -- F5). P3.1 = inline debtscan flags (--debt). P3.2 = FE-reachability status (--fe-reachability) surfacing CVO GROUND-TRUTH (mounted-reachable/frontend-orphan/phantom/unreviewed-LOUD) -- NOT a live portal grep (scaffolding-fooled). Unknown name OR unowned-tool query ALWAYS LOUD (exit 2) -- generalized TOOL-02 false-clean guard. Standing regression oracle: pipescript --gate-b + --fe-reachability. Read-only; ASCII-only stdout. Owner: AE/cloud-ops (pipescript_cli.py = AE lane, same as extract_iam -- Andrew-direct 2026-06-23, correcting the prior DS-lane label); non-AE cross-tool edits route owner-review through AE per the two-rule lane convention."

  - id: meta.comp_which.router
    use_case: "I don't know WHICH comp tool answers my question -- I'm about to blind-grep. (the entry-point router; makes this whole catalog queryable)"
    canonical_call: "comp-which \"<your natural-language question>\"   # e.g. comp-which \"what produces canonical_prices.parquet?\""
    tool: comp-which
    mode: query-cached
    layer: meta
    cost: "<0.2s (reads this manifest + curated rules; no AWS)"
    freshness: "reads graph-call-manifest.yaml + curated CVO-#3 question->tool rules (no rebuild)"
    rebuild_trigger: "none -- auto-includes new tools as they're added to this manifest (fuzzy backstop)"
    anti_pattern: "blind-grepping for a repo relationship instead of asking comp-which (or heeding the PreToolUse comp-tool-hud advisory) -- the exact gap NFRA_TOOLHUD closes"
    status: canonical
    notes: "NFRA_TOOLHUD #2 (Andrew-direct 2026-06-15). The HUD router: a natural-language question -> the canonical comp call, so an agent never has to KNOW the catalog. Curated high-confidence rules = CVO #3 baseline's ranked question->tool map (bdf7a0a9a: S3-key->comp-pipescript io/pipescript --resource; portal->comp-transform/comp-routes; gold-id->comp-pipescript io/feeds/consumers; lambda->comp-iam service/comp-aws; iam-role->comp-iam; blast->comp-blast; named-thread->pipescript) + a keyword-fuzzy backstop over this manifest. Sibling of the PreToolUse comp-tool-hud.sh intercept hook (#1, fires on the grep reflex). Read-only; points, doesn't run."

  - id: pipeline.freshness.chain_ready
    use_case: "Is the upstream S3 data fresh enough to run a gold chain?"
    canonical_call: "comp-freshness chain {bd|inf|cot} ; comp-freshness script <id>"
    tool: comp-freshness
    mode: rebuild
    layer: pipeline
    cost: "~30s full chain (parallel AWS calls)"
    freshness: "live S3 LastModified"
    rebuild_trigger: "n/a — live freshness check"
    anti_pattern: "dispatching a chain on stale upstream"
    status: canonical

