    tool: comp-dups
    mode: query
    layer: estate
    cost: "~30-60s (TF-name + content tiers; dead-confirm metric/graph calls fire ONLY on high-value findings, cached/short-timeout)"
    freshness: "scans the fresh post-derive canonical graph nightly; dead-confirm overlays a 30d CloudWatch reads-AND-writes window (dual-evidence) per high-value finding"
    rebuild_trigger: "n/a -- runs on the scheduled nightly-post-derive cadence (catches newly-landed dups continuously, not one-shot); the engine reads the already-derived graph, never rebuilds it"
    anti_pattern: "raw `aws dynamodb list-tables` / `grep` across TF roots to hunt duplicates (text-local, connection-blind, no dead-confirm verdict); comp-aws dual-managed catches ONLY the >1-TF-state apply-conflict, NOT the cross-firm/service-split/env-twin duplicate CLASSES or the dead-vs-reachable determination"
    status: canonical    # NFRA_DEBTSCAN standing dimension; CTO arch-gated 2026-06-26 (174422Z: all 4 conditions met + dogfood proven). Engine CVO-owned (dead-confirm window c3e9da2ab + suppression_v1.yaml 4 classes); formalization COND-3 (this entry + comp-which routing) + COND-4 (cadence) COO-owned (2.0.0_SA_COO)
    notes: "DISTINCT from cloud.dual_managed.conflict (comp-aws dual-managed = TF-state apply-conflict ONLY). comp-dups is the broader estate duplicate/triplication CENSUS: 4 structural classes (CROSS_FIRM / IAM_POLICY_SPLIT[role=] / SERVICE_SPLIT / ENV_TWIN), each a REPRODUCIBLE structural predicate (org/modules/graph/debtscan/suppression_v1.yaml, CVO-ruled per CTO cond-2 -- not a hand pair-list), + a dead-confirm verdict from DUAL-EVIDENCE (30d CloudWatch reads AND writes; both flat-zero => CONFIRMED_DEAD; any reach => REACHABLE). Removal = worklist-only + human-confirm (COND-5, hard-wired; verify-before-delete doctrine binding). Dogfood regression target = the opal-users triplication (v1 CONFIRMED_DEAD 0-reads/30d, v2 REACHABLE 1768-reads/30d) + the cot-leg 5-copy lib/trading_calendar (the post-02:00-nightly migration is the regression: comp-dups must confirm the triplication gone). CADENCE = nightly-post-derive (COND-4, aligned to the other debtscan dimensions; light enough -- dead-confirm fires only on high-value findings); the --nightly mode is what the post-derive hook calls. comp-which routing string: 'find duplicate / dead-twin resources across the estate -- double-managed TF, unused legacy tables, triplicated code' -> comp-dups (fuzzy backstop auto-includes this entry; curated-rule add is the follow-up). ENGINE/TOOL CONVENTION (locked w/ CVO 2026-06-26 to avoid a fork): engine home = org/modules/graph/debtscan/dup_scan.py (single source); tool = .tools/comp-dups (thin PATH wrapper); ledger = org/modules/graph/debtscan/YYYY-MM-DD_DUPS_candidates.json + dups_latest.json pointer (matches the D1-D5 dated+latest pattern). Suppression classes landed pending_review (suppression_v1.yaml 4f4cf5202): DUP_BENIGN_{CROSS_FIRM 276 / IAM_POLICY_SPLIT 148 / SERVICE_SPLIT 84 / ENV_TWIN 16}, active:false until CVO-rules each at go-live."

