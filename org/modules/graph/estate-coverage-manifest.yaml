# Estate Coverage Manifest — single source of truth for "which tool owns which estate thread"
# Author: 1.0.0_SA_CTO (schema) · 2026-06-15 · ratifies CVO estate-thread inventory 2d9a0a2a1
#
# PURPOSE: make "Unknown" structurally impossible to mistake for "clean". Every estate
# thread (a coherent lambda/StepFn/EC2 + data + consumer chain) is routed to its OWNING
# tool with an explicit coverage status. Generalizes the TOOL-02 false-clean guard across
# ALL coverage tools (was postdeps-only).
#
# RENAMED from the earlier comp-pipescript-coverage.yaml (CTO 16:56Z): the manifest is
# MULTI-TOOL, not comp-pipescript-specific — comp-pipescript is one specialist of several.
#
# GUARD CONTRACT (every coverage tool reads this): when a tool is queried about a thread it
# does NOT own, it returns LOUD "OUT-OF-SCOPE for {tool} -> see {owning_tool}" + exit 2,
# NEVER a silent Unknown counted as clean. An UNREVIEWED thread returns LOUD "UNREVIEWED —
# not yet adjudicated". Only an explicit determination is a clean answer.

# --- enums ---
# owning_tool: comp-pipescript (medallion data-pipeline) | globgrph (AWS-resource graph)
#            | stitch (cross-layer) | portal-consumer-tools (frontend) | none (ops/local)
# status:     in-scope (owned + modeled) | explicit-out (reason required) | unreviewed
# debtscan_flags: [] or any of: orphan-candidate, dormant, stranded, freshness-risk,
#            frontend-orphan, needs-consumer-trace, needs-owner

