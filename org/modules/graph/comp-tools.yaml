# comp-tools.yaml — Agent directive for compiler tools
#
# These tools replace Explore agents and manual file-by-file tracing
# for any task that involves understanding how systems connect.
# They are deterministic, fast (<2s), and cover the full stack:
#
#   React components -> API endpoints -> Lambda handlers -> S3 artifacts
#   -> gold scripts -> EventBridge schedules -> CloudFront routing
#
# The graph covers ALL layers of the system — not just gold scripts.
# Use them for frontend, middleware, infrastructure, and data questions.
#
# RULE: Before spawning an Explore agent or manually grepping for
# data paths, imports, or dependencies — run the appropriate comp-*
# tool first. If the tool answers your question, do not explore further.

compiler_tools_log_conventions:
  synthetic_test_marker: "(SYNTHETIC TEST FIXTURE)"
  applies_when: "Tool-development testing with deliberately-bad inputs (e.g., synthetic missing-file, invalid-script-name, malformed-payload regression tests)"
  example: "| 2026-04-30 | 0.4.0_DS~A | (no-TO) | comp-validate | comp-validate definitely_not_a_thing | FAIL | (SYNTHETIC TEST FIXTURE) ADHC_COMPIL.012 invalid-script-name regression test |"
  rationale: |
    Distinguishes intentional test failures from real agent-encountered failures during
    retrospective analysis. Pre-2026-05-08 v3 testing day produced ~15 synthetic FAILs
    that inflated comp-validate raw FAIL rate from 29% real to 36.7% raw across the
    full 1-month corpus.
  ship_anchor: "ADHC_COMPIL_V4.016 (2026-05-08 PM, 1.0.0_SA_CTO direct)"
  scope: "Forward-only; pre-2026-05-08 entries may be retroactively annotated when touched, but no backfill required"
  full_methodology: "docs/architecture/ADHC_COMPIL_FULL_CORPUS_RETROSPECTIVE.md §1.4"

tools:
  comp-build:
    command: comp-build
    when: "Graph cache is stale (>5 min) or you suspect new files were added"
    cost: "~2s"
    output: "Node/edge counts by type, cached to .comp-graph/graph.json"

  comp-trace:
    command: "comp-trace <query> [--direction up|down|both] [--depth N] [--json]"
    when: |
      - "Where does this data come from?" (--direction up)
      - "What consumes this data?" (--direction down)
      - "Show me the full data path end to end" (--direction both, default)
      - Investigating a bug that spans ANY layers (frontend, API, Lambda, S3, gold, EventBridge, CloudFront)
      - Understanding what a component, endpoint, Lambda, or artifact depends on before modifying it
      - "Which EventBridge rules trigger this Lambda?"
      - "Which Lambdas serve this API endpoint?"
      - "Which portal pages call this API function?"
    examples:
      - "comp-trace AdvisorsTab --direction up"
      - "comp-trace employee_leaderboard --direction both"
      - "comp-trace getCumulativeChart --direction both"
      - "comp-trace trending --direction both --all"
      - "comp-trace opal-partners-data --direction up"
      - "comp-trace news-trending-analysis --direction both"
    cost: "<1s (cached graph)"
    replaces: "Explore agent, manual grep for imports/fetch calls/S3 keys/Lambda routes/EventBridge rules"

  comp-blast:
    command: "comp-blast <query> [--function name] [--json]"
    when: |
      - Before modifying ANYTHING: "what downstream systems will this affect?"
      - Gold script change: "what S3 artifacts, Lambdas, and portal pages does this feed?"
      - Gold helper fix: "which callers and downstream artifacts depend on this internal function?"
      - Lambda change: "what portal components consume this Lambda's output?"
      - API endpoint change: "which components call this function?"
      - S3 artifact change: "which Lambdas and endpoints read this?"
      - EventBridge rule change: "which Lambdas does this trigger?"
      - COO decomposing a PRD: "which agents need task orders for this change?"
    examples:
      - "comp-blast build_employee_leaderboard"
      - "comp-blast D_00 --function build_timeseries_chart"
      - "comp-blast _compute_window_decomposition"
      - "comp-blast _compute_window_flows"
      - "comp-blast opal-partners-data"
      - "comp-blast timeseries_chart"
      - "comp-blast news-trending-analysis"
    cost: "<1s"
    replaces: "Manual audit of S3 readers, Lambda consumers, portal imports, EventBridge targets"
    note: "Graph now includes top-level Python function nodes plus local caller/callee edges. This means comp-blast can start from internal helpers (for example _compute_window_decomposition) and walk outward to callers, writers, and downstream artifacts instead of requiring grep fallback."

  comp-diff:
    command: "comp-diff [--ref HEAD~3] [--staged] [--json]"
    when: |
      - Before committing: "what is the blast radius of my uncommitted changes?"
      - After pulling changes: "what graph paths were affected by recent commits?"
      - Pre-deploy check: "what portal components are affected by this deploy?"
    examples:
      - "comp-diff"
      - "comp-diff --ref HEAD~5"
      - "comp-diff --staged"
    cost: "~2s (rebuilds graph + runs git diff)"
    replaces: "Manual file-by-file change review"

  comp-xref:
    command: "comp-xref [--save] [--json]"
    when: |
      - After a gold re-run or deploy: "did the dependency graph change?"
      - Periodic audit: "what nodes/edges were added or removed since last check?"
      - Save baseline before major work: "comp-xref --save"
    examples:
      - "comp-xref --save"
      - "comp-xref"
      - "comp-xref --json"
    cost: "~2s"
    replaces: "Manual before/after comparison of file trees"

  comp-pipescript:
    command: "comp-pipescript <subcommand> [args]"
    when: |
      - "What does gold script X read and write?" -> comp-pipescript io X
      - "What feeds script X?" -> comp-pipescript feeds X
      - "What consumes script X output?" -> comp-pipescript consumers X
      - "What's the execution order of a chain?" -> comp-pipescript chain downstream
      - "Do scripts A and B share any S3 artifacts?" -> comp-pipescript overlap A B
      - Designing a new gold script: understand inputs available from upstream
      - Modifying a gold script: check who consumes your output before changing schema
    subcommands:
      dag: "Full pipeline DAG with I/O per script (--json for machine output)"
      io: "comp-pipescript io D_00 -- input/output manifest with upstream writers and downstream consumers. Now includes: S3-DYNAMIC annotations for runtime-resolved reads (dim CSVs, pandas s3:// URIs), and PORTAL CONSUMERS section resolving platinum/* write targets to portal endpoints + components. Use --no-portal to skip routing table lookup."
      chain: "comp-pipescript chain downstream -- chain membership + order + I/O counts"
      feeds: "comp-pipescript feeds D_00 -- upstream scripts that write artifacts D_00 reads"
      consumers: "comp-pipescript consumers C_07 -- downstream scripts that read C_07 output"
      overlap: "comp-pipescript overlap D_00 D_03 -- shared S3 artifacts between two scripts. COO MANDATE: run this on every pair of scripts before authoring cross-domain coordination blocks."
      inject: "Inject pipeline edges into comp-trace graph cache (run after comp-build)"
      stats: "Graph stats + warnings for scripts with missing reads/writes"
      deployed: "comp-pipescript deployed [filter] -- compare local gold + silver scripts against s3://opal-data-bd/code/{gold,silver}/ ETags (BD default). For INF scripts: comp-pipescript deployed --pipeline inf-gold [filter] checks INF gold vs s3://opal-data-inf/code/gold/; --pipeline inf-silver checks INF silver vs s3://opal-data-inf/code/silver/. Output prefixed [GOLD] / [SILVER]. MATCH/STALE/MISSING_ON_S3/LOCAL_MISSING/TIMEOUT per script. Filter is substring/filename: gold IDs (D_04, C_08 for BD; INF_D_08, INF_C_01 for INF) match gold only; silver filenames match silver only; omit for full sweep. Run before any gold or silver run to confirm runner has latest code."
    cost: "<1s (io/feeds/consumers/overlap); ~2-5s (deployed, makes AWS API calls)"
    data_sources: "lib/s3_layout.py (AST-parsed), gold_dispatch.sh (chain/catalog), each script's imports"
    replaces: "Manual import tracing, grepping s3_layout constants, reading gold_pipeline_script_file_flow.md; manual aws s3 ls + sha256sum for deployment verification"
    note: "Use this instead of comp-trace for gold script dependency questions. comp-trace covers cross-layer (frontend->Lambda->S3); comp-pipescript covers intra-pipeline (script->S3->script). comp-pipescript io now shows portal consumers for platinum/* keys -- eliminates the 'terminal in graph' coverage gap for platinum publishers. comp-pipescript deployed now fails honestly on AWS runtime hangs instead of collapsing into silent or misleading output."

  comp-routes:
    command: "comp-routes <subcommand> [args]"
    when: |
      - "How does this data get from S3 to the browser?" -> comp-routes trace <endpoint_fn>
      - "What auth layers does this path go through?" -> comp-routes auth-map
      - "Which CloudFront behavior handles this URL?" -> comp-routes trace /api/scoped/...
      - "What does this React component fetch and how?" -> comp-routes trace ComponentName
      - "What rewrites does shared-advisor-router apply?" -> comp-routes rewrites
      - "Which paths go through API Gateway vs direct S3?" -> comp-routes stats
      - Platinum migration: verify new paths route correctly through CF + auth
      - Auth audit: verify every path has appropriate auth layers
    subcommands:
      trace: "comp-routes trace getEmployeeLeaderboard -- full chain: URL -> CF behavior -> origin -> auth -> router -> S3 key -> components"
      behaviors: "All 23 CloudFront behaviors with origins, auth, edge functions"
      origins: "All 5 CloudFront origins (S3 buckets + API Gateways)"
      rewrites: "URL->S3 rewrite rules from shared-advisor-router + public-data-router"
      api-routes: "All API Gateway route_keys grouped by pipeline"
      endpoints: "All frontend endpoint functions with resolved URLs"
      components: "Component -> endpoint call bindings"
      auth-map: "Which paths have no auth, edge-only, or double auth (edge + API GW)"
      stats: "Routing table summary: origin types, auth coverage, resolved routes"
    cost: "<1s"
    data_sources: "cloudfront-distribution.tf, shared-advisor-router/index.mjs, api-gateway.tf files, portal/src/api/endpoints/*.ts, portal/src/pages/**/*.tsx"
    replaces: "Reading Terraform + Lambda@Edge source + frontend code to trace serving paths manually"
    note: "Use this for any frontend-to-backend question. comp-pipescript covers data production (gold scripts); comp-routes covers data serving (S3 -> CloudFront -> auth -> browser)."

  comp-transform:
    command: "comp-transform <subcommand> [args]"
    when: |
      - "What fields does this component actually render from the API response?" -> comp-transform fields X
      - "What useMemo chains transform the data after fetch?" -> comp-transform chains X
      - "Which response fields are fetched but never used?" -> comp-transform unused X
      - "Full data flow: fetch -> transforms -> JSX?" -> comp-transform trace X
      - Before changing a response shape: know which transforms and JSX refs will break
      - Platinum migration: identify client-side aggregation that pre-aggregated data replaces
      - "Building a new cohort/metric/mode" -> comp-transform schema-check X --feature token THEN comp-transform ternary-audit X (MANDATORY — catches routing ternary gaps before they ship)
      - "I added a new field to a TypeScript union type" -> comp-transform ternary-audit X -- find all ternary chains missing the new value
      - "schema-check shows a feature-named field as UNUSED" -> comp-transform ternary-audit X -- find the routing ternary that's missing the branch
    subcommands:
      trace: "comp-transform trace PartnerAnalytics -- full flow: fetches, transform chains, JSX refs, response types"
      fields: "comp-transform fields PartnerAnalytics -- all response fields actually accessed, grouped by root variable"
      chains: "comp-transform chains PartnerAnalytics -- useMemo/useCallback chains with inputs, field accesses, and operations"
      unused: "comp-transform unused PartnerAnalytics -- waste analysis: response fields fetched but never rendered"
      schema-check: "comp-transform schema-check ClientsTab [--feature <token>] -- cross-reference rendered JSX fields against TypeScript response types. Flags MISSING (rendered but not in type = runtime undefined) and UNUSED (in type but not rendered = waste). --feature ofc: escalates UNUSED fields containing 'ofc' to WARN with routing ternary hint. Use --feature when building a new cohort/metric/mode."
      ternary-audit: "comp-transform ternary-audit DistributionTab -- scan ternary chains on union-typed variables for unhandled members. Finds cohort ternaries missing the 'ofc' branch, metric ternaries missing 'nna', etc. Only flags when 2+ members share an unintended fallthrough. Use --verbose to see single-implicit-fallthrough sites too."
      all: "Summary of all components with data flow"
      stats: "Statistics: fetch count, chain count, common operations"
    cost: "<1s"
    data_sources: "portal/src/pages/**/*.tsx (hooks, JSX), portal/src/pages/**/types.ts (response interfaces)"
    replaces: "Reading component source to understand what fields are used, spawning Explore agents to trace useMemo chains"
    note: "Use BEFORE reading component source. schema-check --feature <token> + ternary-audit together catch the 'new cohort added to type but routing ternary not updated' class of bug (the W3 OFC regression). Run both when building any new cohort, metric, or mode."

  comp-platinum:
    command: "comp-platinum <subcommand> [args]"
    when: |
      - "For this page, trace the full path from fetch to gold script" -> comp-platinum page X
      - "What S3 key does this endpoint resolve to, and what gold script writes it?" -> comp-platinum page X
      - "For this S3 key, what routes serve it and what components render it?" -> comp-platinum reverse S3key
      - "For this payload field path, what artifact/producer/component chain owns it?" -> comp-platinum reverse dotted.path
      - "Audit every ADVI tab in one shot" -> comp-platinum tab-audit
      - Phase 2 tab audits: tab-audit gives you fetches, origins, auth, S3 keys, gold sources, transforms per tab
    subcommands:
      page: "comp-platinum page PartnerAnalytics -- full stack: fetch -> CF -> auth -> S3 key -> gold script, with transforms and JSX refs"
      reverse: "comp-platinum reverse gold/artifacts/employee_leaderboard.json -- S3 key -> route -> components; also accepts dotted payload paths like rfs.decomposition_max.nna and resolves them back to artifact + producer + component"
      tab-audit: "Audit every ADVI tab: fetches, origin type, auth layers, S3 keys, gold sources, transform count"
      summary: "One-line per component: fetch count, chain count, S3 direct vs API GW, auth coverage"
    cost: "<2s (chains comp-transform + comp-routes + comp-pipescript)"
    replaces: "Spawning 2+ Explore agents to manually trace page -> API -> infra -> gold scripts (~200k tokens)"
    note: "This is the composition tool. Use it for full end-to-end page audits. For targeted questions (just pipeline, just serving, just transforms), use the individual tools. reverse now supports both artifact keys and rendered payload field paths, which closes the nested-key consumer-enumeration gap that previously forced portal grep fallback."

  comp-cache:
    command: "comp-cache <subcommand> [args]"
    when: |
      - "Do any components share a React Query cache key?" -> comp-cache collisions
      - "What cache keys exist and which components own them?" -> comp-cache map
      - "Find all cache keys related to advisor-intelligence" -> comp-cache key advisor-intelligence
      - Before changing a queryKey or response type: check for shared keys that would break
    subcommands:
      map: "All cache keys -> components + response types + fetch functions"
      collisions: "Keys shared by multiple components, flags TYPE MISMATCH when same key has different response types"
      key: "comp-cache key <query> -- find all cache keys matching a substring"
    cost: "<1s"
    replaces: "Grepping for useQuery across all .tsx files to find shared keys"

  comp-pii:
    command: "comp-pii <subcommand> [args]"
    when: |
      - "Does this component expose PII to external users?" -> comp-pii scan ComponentName
      - "Full PII audit across all ADVI tabs" -> comp-pii audit
      - "What fields does the pseudonymizer hash?" -> comp-pii fields
      - "Which serving paths carry PII and are they protected?" -> comp-pii routes
      - Phase 4 auth validation: verify pseudonymization coverage after platinum migration
      - Before adding a new field to a response: check if it's PII
    subcommands:
      scan: "comp-pii scan ClientsTab -- flags every PII field reference as [HASHED] or [CLEARTEXT]"
      audit: "Full audit across all ADVI tabs: PII ref counts, pseudonymization coverage, S3-direct warnings"
      sweep: "comp-pii sweep -- scan ALL portal .ts/.tsx files for hardcoded PII values (z-numbers, account IDs). Catches real account numbers in code and comments. Synthetic IDs (z00000001) are allowlisted."
      fields: "PII field registry: 10 pseudonymized + 3 potential, with HMAC prefix and role matrix"
      routes: "Which serving paths carry PII and whether pseudonymizer runs (Lambda vs S3-direct)"
    cost: "<2s"
    data_sources: "pseudonymizer.py (target field list), auth-validator-edge (role matrix), comp-transform (rendered fields)"
    replaces: "Manual cross-referencing of pseudonymizer.py against component source to find PII exposure"

  comp-validate:
    command: "comp-validate <script_id> --artifact <local/path/to/artifact.json>"
    when: |
      - Before uploading any gold artifact to S3: verify output invariants hold
      - After a gold run, before signaling downstream agents: confirm correctness
      - Debugging "no crash but wrong output" failures (zeros, missing keys, wrong sums)
      - DS mandates: run before MCP-signaling AE on any script that has validate config
    subcommands:
      validate: "comp-validate D_04 --artifact /tmp/leaderboard.json -- run all configured checks"
      list: "comp-validate --list -- show all configured checks and invariants"
      list-one: "comp-validate D_00 --list -- show checks for one script"
    check_types: |
      key_present    -- JSON key must exist and be non-null/non-empty
      count_min      -- array at path must have >= N elements
      field_nonzero  -- numeric field > 0 (with optional filter on another field)
      sum_approx     -- two values within tolerance_pct of each other
      no_null_numeric -- no null/NaN in numeric fields at path
      threshold_pct  -- >= min_pct% of entries satisfy a condition
    exit_codes: "0 = all ERROR checks pass; 1 = any ERROR check fails (WARN does not block)"
    cost: "<1s (JSON); ~2s (parquet, uses pyarrow)"
    config: "BD: data/black_diamond/scripts/gold/gold_validate_config.yaml | INF: data/orion/scripts/gold/gold_validate_config.yaml. Pipeline auto-detected from script_id prefix (INF_* -> INF; others -> BD)."
    data_sources: "gold artifact JSON/parquet (local file, use aws s3 cp first)"
    replaces: "Manual spot-checks (Travis Penfield fee_earning_aua sanity check), S3 key presence inspection"
    note: "MANDATORY gate: run before any S3 upload of a gold artifact that has a validate config. Catches 'no crash but wrong output' class of bugs. DS writes invariants once; tool enforces them forever. INF example: comp-validate INF_D_08 --artifact /tmp/nmec_nmnc_nna.json"

  comp-shell:
    command: "comp-shell scan [path ...] [--all] [--guard-lookback N]"
    when: |
      - About to commit a .sh file in .tools/, org/mcp/, org/threads/, infra/aws/lambda/ci/, infra/aws/terraform/
      - Adding a new shell script to any local-runtime path (Rule 16 check)
      - After Git Bash version update or ADHC_BASHFIX incident: verify no new bare utility calls crept in
      - Auditing all local-runtime scripts: comp-shell scan --all (then read WARN/ERROR summary)
    subcommands:
      scan: "comp-shell scan .tools/ -- scan all .sh files in .tools/"
      scan-all: "comp-shell scan --all -- scan full workspace (excluding EC2/data paths)"
      scan-file: "comp-shell scan org/mcp/inbox-watch.sh -- scan a single file"
      list-forbidden: "comp-shell list-forbidden -- print 6 forbidden utilities + canonical fallbacks"
    exit_codes: "0 = no ERROR findings (WARN is advisory); 1 = at least one ERROR; 2 = usage error"
    cost: "<1s per file"
    data_sources: "shell script files in workspace (reads source, no external calls)"
    replaces: "Manual grep for pgrep/pkill/flock/pidof/setsid/wget in local shell scripts"
    note: |
      Detects bare references to the 6 utilities absent from Git Bash 3.6.7
      (pgrep pkill flock pidof setsid wget). UNGUARDED (no command -v guard
      in 30-line lookback) = ERROR. GUARDED = WARN. EC2-side paths
      (infra/aws/ec2/, data/) are exempt. Pre-commit hook (ds-commit-gate.sh)
      runs this automatically on staged .sh files in in-scope paths.
      Canonical guard pattern: if command -v pgrep >/dev/null 2>&1; then ...
      Reference: org/mcp/inbox-watch.sh (commit 045296b18, ADHC_BASHFIX.002)

  comp-freshness:
    command: "comp-freshness {chain {bd|inf} | script <id> | artifact <s3-prefix>} [--list]"
    when: |
      - Before dispatching a gold chain: "is the upstream S3 data fresh enough to run?" -> comp-freshness chain bd|inf
      - About to run a specific script: "are the inputs for this script fresh?" -> comp-freshness script A_03
      - Investigating a stale-data incident: "how old is this S3 prefix right now?" -> comp-freshness artifact s3://...
      - Reviewing all cadence config: "what are the freshness thresholds?" -> comp-freshness --list
      - Debugging a wrong-output run: "was upstream data stale when this ran?"
      - Pre-dispatch gate in bd-gold-dispatch.sh or orion-gold-dispatch.sh (integration wired by ADHC_COMPIL.013)
    subcommands:
      chain: "comp-freshness chain bd  -- check all silver/bronze inputs to the BD gold chain; exit 0=PASS/WARN, 1=FAIL, 2=config error"
      chain_inf: "comp-freshness chain inf  -- same for INF gold chain"
      script: "comp-freshness script A_03  -- check just the inputs tagged for this script in cadence config"
      artifact: "comp-freshness artifact s3://opal-data-schwab/silver/RPS/  -- check one prefix; exit 1 if FAIL"
      list: "comp-freshness --list  -- print all entries grouped by pipeline (BD then INF) sorted by artifact_id"
    output_format: "artifact_id | s3_key | last_modified_iso8601 | age_h | fail_at_h | STATUS (PASS/WARN/FAIL/SKIP)"
    exit_codes: "0=PASS/WARN (WARN does not block), 1=any FAIL (ERROR-severity beyond fail_age_hours), 2=config error or AWS unreachable"
    cost: "<30s for full chain (32 BD or 31 INF artifacts; parallel 8-thread AWS calls)"
    config: "data/black_diamond/scripts/gold/gold_freshness_config.yaml (32 BD entries) | data/orion/scripts/gold/gold_freshness_config.yaml (31 INF entries)"
    incidents_caught: |
      2026-04-17: Schwab RPS (opal-data-schwab/silver/RPS/) 10-day stale -> $130M linear_interpolation overshoot
      2026-04-29: silver/aum_snapshot/ 8-day stale -> $89.6M AUA (vs $182.71M correct)
      Both would have been caught at dispatch time with this tool.
    replaces: "Manual aws s3 ls + timestamp inspection before gold dispatch; post-hoc stale-data forensics"
    note: "ADHC_COMPIL.012 (Theme G). WARN entries (partner-feed severities, weekly dims) do not block dispatch. ERROR entries beyond fail_age_hours exit 1 and block. Vendor-feed thresholds (Schwab + Orion) require Andrew ACK before removing [PENDING ANDREW ACK] flag from config. Dispatch integration is .013 scope."

# ============================================================================
# INF PIPELINE DATA REGISTRY
# Source-of-truth for all Inflection pipeline artifact paths, producers,
# consumers, and data_semantic_class. Replaces manual path assumptions.
# Andrew direct 2026-05-07: "we need master data registry very badly... cannot
# be having issues of not knowing where buckets are and what is in use vs not."
# ============================================================================

inf_pipeline:
  master_data_registry:
    machine_readable: "docs/architecture/inf_data_graph.yaml"
    human_readable: "docs/architecture/INFETL_MASTER_DATA_REGISTRY.md"
    bucket: "opal-data-inf"
    authored: "2026-05-07 (ADVI_INFETL.MDR)"
    usage: |
      Before hardcoding ANY S3 path in an Inflection script:
        1. Look up the canonical s3_path_pattern in inf_data_graph.yaml
        2. Verify data_semantic_class before designing backfill logic
        3. Check status field (LIVE/DEPRECATED/NOT-IN-USE) before adding a dependency
        4. Update the registry entry when adding a new artifact or changing a path
    critical_path_corrections:
      performance_dim: "bronze/performance/{date}.parquet (NOT bronze/orion-api/{date}/performance_dim.csv)"
      representatives: "bronze/orion-api-v2/{date}/representatives.json (NOT bronze/orion-api/)"
      billing: "OFF_CHAIN — manual bronze runner; not in CHAIN_FULL"
      tax_unrealized: "OFF_CHAIN — manual bronze runner; not in CHAIN_FULL"
    inflection_rep_ids: "{3, 6, 11, 12} — post-INFNNA.001 (rep_id=6 Joe Brandenburg re-included 2026-05-07)"
    gold_violations: "16 gold-read violations in portal; full list in INFETL_PORTAL_ROUTE_MATRIX.md; TO-8 migration target"
    guard_b_aua_bounds: "[$150M, $300M] — recalibrated 2026-05-07 (was [$50M, $400M]); baseline $203.2M"

tools_continued:
  comp-iam:
    command: "comp-iam <subcommand>"
    when: |
      - Before deploying a Lambda or EC2 script change: verify IAM permissions are sufficient
      - Debugging silent AWS permission failures (no exception caught, operation silently fails)
      - After adding a new boto3 S3/SSM/DynamoDB call: verify role grants the action
      - Infra audit: confirm all Lambda/EC2 roles have correct permissions
    subcommands:
      gaps: "comp-iam gaps -- show all detected permission gaps (default command)"
      roles: "comp-iam roles -- list all IAM roles parsed from Terraform"
      services: "comp-iam services -- list all Lambda/EC2 services with detected operations"
      service: "comp-iam service bd-gold-trigger -- show operations + grant status for one service"
      role: "comp-iam role bd-exporter-ec2-role -- show all granted actions for one role"
      stats: "comp-iam stats -- summary counts (roles, services, gaps)"
    cost: "~2s (scans Lambda sources + Terraform; no AWS API calls)"
    data_sources: "infra/aws/lambda/ci/lambda-source-map.json, infra/aws/terraform/*/iam.tf, Lambda/gold script sources"
    replaces: "Manual cross-reference of boto3 calls against iam.tf; AWS IAM console audit"
    note: "Catches permission gaps before they cause silent failures. The IAM watchdog loop incident (2026-04-09) was caused by s3:DeleteObject missing from bd-exporter-ec2-role -- comp-iam would have flagged this during the Terraform review."

  check-lambda-layer-deps:
    command: "check-lambda-layer-deps <lambda> [--all] [--json]"
    when: |
      - Before deploying a Lambda zip change: confirm imports resolve through declared layers
      - After adding a new third-party import to a Lambda: verify a layer covers it
      - Auditing inline-vendoring drift: layer ARN comments may have drifted from layer requirements.txt
      - Triaging "ModuleNotFoundError" Lambda failures: surface which import is missing from which layer
    subcommands:
      single: "check-lambda-layer-deps <lambda> -- audit one Lambda's imports vs its declared layers (handles aws_lambda_layer_version + module references via ADHC_LAMBDADOC.003)"
      all: "check-lambda-layer-deps --all -- repo-wide audit of every Lambda in lambda-source-map.json"
      json: "--json output mode for CI/programmatic consumption"
    cost: "<2s per Lambda (parses Python imports + reads layer requirements.txt; no AWS API calls)"
    data_sources: "infra/aws/lambda/ci/lambda-source-map.json, infra/aws/lambda/<pipeline>/<lambda>/*.py, infra/aws/lambda/layers/<layer>/requirements.txt, Terraform aws_lambda_layer_version resources"
    replaces: "Manual cross-reference of Lambda imports against layer requirements.txt; AWS Lambda console trial-and-error for ModuleNotFoundError"
    note: "Shipped 2026-05-07 under ADHC_LAMBDADOC.003 (`fc4d1f18f` MVP + `59350fdc2` aws_lambda_layer_version + module-reference handling). Empirical anchor: v1.7.38 inf-pipeline regression where 3 of 4 inf-api-* Lambdas had nested-path source_map files leading to ModuleNotFoundError + inf-api-assets-v2 had layers=[pandas_layer] but layer didn't have `requests` — old zip masked it via inline-vendoring. v1.7.39 hotfix flat-zip + layer switch to pandas_pyarrow_requests_layer caught + fixed; this tool prevents the class going forward. Cataloged 2026-05-08 under ADHC_COMPIL_V4.007 doc close-out."

  comp-constants:
    command: "comp-constants <subcommand> [args]"
    when: |
      - Pre-commit on any Python edit -> drift gate (wired into ds-commit-gate.sh)
      - "Did the rep_id=6 propagation actually land in all sites?" -> comp-constants check
      - After a coordinated marker-constant change (rep_id sweep, FIRM_ID rename, AUA bound bump) -> comp-constants index to refresh sites + flag missed drift
      - Pre-PRD authoring: discover undocumented marker constants -> comp-constants new
      - Lambda-bundled silver/gold copy drift detection -> check covers infra/aws/lambda/<pipeline>/**/*.py per lane
    subcommands:
      check: "comp-constants check [--file PATH] -- drift detection. Exit 1 on drift, 0 on clean. With --file, filters to sites in that file (used by pre-commit hook). Lane-aware: BD canonical compared only against BD sites, INF vs INF, multifirm vs multifirm. Semantic equivalence for sets/lists/comma-strings ({3,6,11,12} ~ [3,6,11,12] ~ '3,6,11,12')."
      index: "comp-constants index -- live AST re-scan; rewrites sites[] in comp-constants.config.yaml from current state. Preserves notes, canonical_value, lane. Stable alphabetical site ordering. Run after coordinated propagation (e.g., rep_id sweep) to refresh ground truth."
      new: "comp-constants new -- discovery surface. Lists ALL_CAPS_SNAKE constants found in scan but NOT in config. Filters utility patterns (BUFFER_*, RETRY_*, MAX_*, etc.). Operator reviews + manually adds chosen ones. Use case: PRD authoring, pre-FIRMSEP onboarding, post-incident audit."
      list: "comp-constants list -- print current config summary (debug surface). Shows lane, name, site count, drift count per constant."
    cost: "<5s full-repo (~150 Python files); <1s --file (single file). Pre-commit hook overhead acceptable."
    data_sources: "comp-constants.config.yaml (workspace root) + AST parse of Python files matching search_surfaces glob patterns"
    replaces: "Manual grep + spreadsheet drift tracking. Caught the rep_id=6 propagation gap (INFNNA Joe Brandenburg attribution incident 2026-05-07) but only AFTER it shipped to production -- this tool runs at pre-commit so it catches BEFORE."
    note: "AST-only (literal forms str/int/float/list/set/frozenset/dict + os.environ.get(name, default) defaults). MISSED forms: function calls (frozenset({...})), subscripts (PARTNER_FIRM_TAGS['inflection']), name references. JS/TS deferred to v2 (SEED-MULTIFIRM 7 constants in .mjs not scanned). Lane-aware drift filtering: same name across lanes (FIRM_ID bd='49financial' vs inf='inflection') is NOT flagged. Semantic-set normalization handles type-form equivalence."

  comp-tooltip:
    command: "comp-tooltip <subcommand>"
    when: |
      - Tooltip migration audit: which sites use inline navy/silver/hardcoded tooltips vs <DataTooltip>
      - Before a tooltip cleanup sprint: get full inventory of drift sites
      - After a tooltip migration: verify all sites are canonical (DATATOOLTIP)
      - One-off audit tool -- not needed for routine gold/portal work
    subcommands:
      scan: "Full scan, all variants -- shows every tooltip site grouped by type"
      drift: "Only non-conforming sites (migration targets)"
      canonical: "Only sites using <DataTooltip> (post-migration)"
      migrated: "Alias for canonical"
      summary: "Counts by variant + migration progress percentage"
    cost: "<1s"
    data_sources: "portal/src/**/*.tsx"
    note: "One-off audit tool. Scans for inline navy/silver/hardcoded tooltip patterns vs <DataTooltip> canonical component. Use for tooltip migration sprints only."

  loop-quiescence:
    command: "loop-quiescence <MACRO> [--summary]"
    when: |
      - Tier-1 SA agent (CTO/COO/CVO) about to fire /loop {MACRO} expansion mode and needs to validate quiescence first
      - "Is this macro lane truly quiescent or are there active TOs I'm about to ignore?"
      - Before triggering a CTO+CVO bespoke planning thread on apparent macro quiescence (per feedback_loop_macro_expansion.md)
      - Reconciling task_order <status> claims against git log closure-keyword commits for a macro
    output: |
      JSON by default; --summary for human-readable.
      Verdicts:
        ACTIVE                       -- one or more task orders open; do NOT fire expansion; babysit instead
        QUIESCENT_WITH_DISCREPANCIES -- TOs marked closed but git log lacks closure-keyword commits (or vice versa); reconcile docs before expansion
        QUIESCENT_CLEAN              -- all TOs closed, git log corroborates; safe to fire planning-thread expansion
    cost: "<1s (stdlib only, read-only)"
    data_sources: "org/tier1_exec/<serial>/task_orders/<MACRO>.*.md, org/tier2_senior/<serial>/task_orders/<MACRO>.*.md, git log --all"
    replaces: "Manual scan of every tier-1/tier-2 agent's task_orders/ + git log --grep across the whole macro lane"
    note: "Tier-1 SA only (CTO/COO/CVO). The /loop {MACRO} expansion validate-decide-expand protocol relies on this — see auto-memory feedback_loop_macro_expansion.md (Andrew design 2026-04-28). Workflow tool, not a comp-* graph tool; lives in this catalog because it shares the situation-recognition + structured-output pattern. Status parser handles XML <status>X</status> + markdown-bold legacy forms; ACTIVE_KEYWORDS includes 'staged'. Discrepancy classification distinguishes hard signals (zero commit references) from soft signals (commits exist but no closure keyword in subject -- usually convention drift, not missing work). Drafted by 1.1.0_SA_CTO; cataloged by 1.0.0_SA_CTO under cross-CTO assist (1.1.0 is COMP-scoped, can't author general-workspace docs)."

# ============================================================================
# AGENT DECISION TREE
# ============================================================================
#
# Pick the right tool for the question:
#
#   PIPELINE (gold scripts, S3 artifacts, execution order):
#     Q: "What does script D_00 read/write?"              -> comp-pipescript io D_00
#     Q: "What feeds script D_00?"                        -> comp-pipescript feeds D_00
#     Q: "What consumes C_07 output?"                     -> comp-pipescript consumers C_07
#     Q: "What's the chain execution order?"              -> comp-pipescript chain downstream
#     Q: "Do D_00 and D_03 share inputs?"                 -> comp-pipescript overlap D_00 D_03
#     Q: "Is this script deployed to S3?"                 -> comp-pipescript deployed D_00
#     Q: "Are all gold scripts up-to-date on S3?"         -> comp-pipescript deployed
#     Q: "What portal components consume D_04 output?"    -> comp-pipescript io D_04  (see PORTAL CONSUMERS)
#     Q: "Does D_00 access a column it forgot to load?"   -> comp-pipescript io D_00  (see COLUMN GAPS)
#     Q: "What post-steps must run after this script?"    -> comp-pipescript postdeps D_00
#     Q: "Is this gold artifact output correct?"          -> comp-validate D_04 --artifact /tmp/leaderboard.json
#     Q: "Does this Lambda role have required permissions?"-> comp-iam service bd-gold-trigger
#     Q: "Are there any IAM permission gaps across all services?" -> comp-iam gaps
#     Q: "Do this Lambda's imports resolve through its layers?" -> check-lambda-layer-deps <lambda>
#     Q: "Are any Lambdas in the repo missing layer coverage?"   -> check-lambda-layer-deps --all
#
#   SERVING (CloudFront, auth, Lambda, frontend):
#     Q: "How does this data reach the browser?" -> comp-routes trace getEmployeeLeaderboard
#     Q: "What auth does this path go through?"  -> comp-routes auth-map
#     Q: "What does this component fetch?"       -> comp-routes trace PartnerAnalytics
#     Q: "Which paths are S3 vs API Gateway?"    -> comp-routes stats
#     Q: "What rewrite rules exist?"             -> comp-routes rewrites
#
#   CLIENT-SIDE DATA FLOW (inside React components):
#     Q: "What fields does this component use?"  -> comp-transform fields PartnerAnalytics
#     Q: "What transforms happen after fetch?"   -> comp-transform chains PartnerAnalytics
#     Q: "What response fields are wasted?"      -> comp-transform unused PartnerAnalytics
#     Q: "Full fetch-to-render data flow?"       -> comp-transform trace PartnerAnalytics
#
#   CROSS-LAYER (generic graph: components, endpoints, Lambdas, S3, EventBridge):
#     Q: "What depends on this component?"       -> comp-trace X --direction up
#     Q: "What breaks if I change this?"         -> comp-blast Y
#     Q: "Full data path end to end?"            -> comp-trace X --direction both
#     Q: "What did my changes affect?"           -> comp-diff
#     Q: "Did the graph change since baseline?"  -> comp-xref
#
#   FULL-STACK (page-level end-to-end audit):
#     Q: "Full audit of this page's data flow?"  -> comp-platinum page PartnerAnalytics
#     Q: "What S3 key backs this and who writes it?" -> comp-platinum page X
#     Q: "Reverse: who consumes this S3 key?"     -> comp-platinum reverse gold/artifacts/X.json
#     Q: "Audit every ADVI tab at once?"          -> comp-platinum tab-audit
#
#   CACHE (React Query key management):
#     Q: "Do components share cache keys?"         -> comp-cache collisions
#     Q: "All cache keys and their owners?"        -> comp-cache map
#
#   LOOP EXPANSION (tier-1 SA only -- CTO/COO/CVO /loop {MACRO} mode):
#     Q: "Is this macro lane truly quiescent before I fire expansion?" -> loop-quiescence MACRO --summary
#     Q: "Are TO claims reconciled with git log for this macro?"       -> loop-quiescence MACRO
#
#   RULE: comp-platinum for full page audits, comp-pipescript for pipeline,
#   comp-routes for serving, comp-transform for component internals,
#   comp-cache for query key issues, comp-trace/comp-blast for everything
#   else. Never use Explore agents for dependency/data-path questions.
#
# ============================================================================
# MANDATORY USAGE
# ============================================================================
#
# DS agents: comp-pipescript io/feeds/consumers before modifying gold scripts.
#            comp-pipescript io ALSO checks COLUMN GAPS (accessed but not loaded columns) -- zero extra work.
#            comp-pipescript deployed before every gold run (confirm runner has latest code).
#            comp-pipescript overlap when consolidating scripts OR before authoring cross-domain TOs.
#            comp-pipescript postdeps before any ad-hoc script run (check required post-steps).
#            comp-validate <script> --artifact <file> before signaling AE -- MANDATORY if script has validate config.
#            comp-platinum tab-audit for Phase 2 audits (replaces manual tracing).
# DE agents: comp-transform trace before reading component source (may save the read).
#            comp-platinum page before any component wiring changes.
#            comp-cache collisions before changing queryKeys or response types.
#            comp-routes auth-map when touching auth-sensitive paths.
#            comp-routes behaviors when debugging 4xx responses (check custom_error_response intercepts).
# RD agents: comp-platinum page on your component to see the full stack.
# DT agents: comp-diff --staged before committing. comp-routes behaviors
#            before touching CloudFront or Lambda@Edge.
#            comp-iam service <lambda-name> after adding any new boto3 call to a Lambda.
# AE agents: comp-pipescript chain before modifying dispatch.
#            comp-pipescript deployed before triggering any gold run (verify code is on S3).
#            comp-pipescript postdeps before every manual gold run (check required post-steps).
#            comp-iam gaps after any iam.tf change (verify no new permission gaps).
#            comp-blast on infrastructure resources before changes.
#            comp-shell scan <file> before committing any .sh to .tools/ or org/mcp/.
# COO: comp-platinum tab-audit + comp-blast when decomposing PRDs.
#      comp-pipescript overlap A B before creating cross-domain coordination blocks in TOs.
#      loop-quiescence <MACRO> --summary BEFORE firing /loop {MACRO} expansion (validate-decide-expand).
# CTO: comp-platinum + comp-routes + comp-pipescript for architecture design.
#      loop-quiescence <MACRO> --summary BEFORE firing /loop {MACRO} expansion (validate-decide-expand).
#
# After comp-build, run "comp-pipescript inject" to enrich the trace graph
# with pipeline edges. Without this, comp-trace cannot walk upstream
# through gold script dependencies.
#
# PATH: .tools/ is in PATH. All comp-* commands work from any directory.
