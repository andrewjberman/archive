# comp-tools.yaml — Agent directive for compiler tools
#
# SCOPE DECLARATION (NFRA_COMPCLOSE 2026-07-14; T6 v3.3-conformance edit 2026-08-19): this file
# is a CURATED DIRECTIVE SUBSET -- rich when/cost/output prose for the high-traffic tools --
# NOT a registry and NOT a census. It carries a curated subset BY DESIGN; **the subset size and
# the on-disk total are DELIBERATELY NOT STATED HERE** (compile-or-cite, never hand-copy: this
# line once froze "~24 of the 62" while the curated rows grew to 36 and the registered total
# moved past 79 -- the exact frozen-digit drift the counts warning below documents). Live
# numbers: `comp-manifest-check completeness` (gate-maintained). The GENERATE half of T6
# (deriving this file's tool LIST from the registry, prose retained) routes with the s3
# checker builds. The authoritative registries are:
#   comp-coverage-map.yaml   (the router's universe: every tool, one home, explicit routable:)
#   graph-call-manifest.yaml (tools_index + entries -- the fuzzy-routing vocabulary)
# both enforced by comp-manifest-check's completeness family (incl. the DISK-IMPLIES-REGISTERED
# member). Do NOT count tools from this file -- that is how the fabric minted six conflicting
# tool counts (28/29/~30/42/63/66) with no control catching any of them.
#
# These tools replace Explore agents and manual file-by-file tracing
# for any task that involves understanding how systems connect.
# They are deterministic, fast (<2s), and cover the full stack:
#
#   React components -> API endpoints -> Lambda handlers -> S3 artifacts
#   -> gold scripts -> EventBridge schedules -> CloudFront routing
#
# The graph covers ALL layers of the system — not just gold scripts.
# Use them for frontend, middleware, infrastructure, and data questions.
#
# RULE: Before spawning an Explore agent or manually grepping for
# data paths, imports, or dependencies — run the appropriate comp-*
# tool first. If the tool answers your question, do not explore further.

compiler_tools_log_conventions:
  synthetic_test_marker: "(SYNTHETIC TEST FIXTURE)"
  applies_when: "Tool-development testing with deliberately-bad inputs (e.g., synthetic missing-file, invalid-script-name, malformed-payload regression tests)"
  example: "| 2026-04-30 | 0.4.0_DS~A | (no-TO) | comp-validate | comp-validate definitely_not_a_thing | FAIL | (SYNTHETIC TEST FIXTURE) ADHC_COMPIL.012 invalid-script-name regression test |"
  rationale: |
    Distinguishes intentional test failures from real agent-encountered failures during
    retrospective analysis. Pre-2026-05-08 v3 testing day produced ~15 synthetic FAILs
    that inflated comp-validate raw FAIL rate from 29% real to 36.7% raw across the
    full 1-month corpus.
  ship_anchor: "ADHC_COMPIL_V4.016 (2026-05-08 PM, 1.0.0_SA_CTO direct)"
  scope: "Forward-only; pre-2026-05-08 entries may be retroactively annotated when touched, but no backfill required"
  full_methodology: "docs/architecture/ADHC_COMPIL_FULL_CORPUS_RETROSPECTIVE.md §1.4"

tools:
  comp-build:
    command: comp-build
    segment_scope: cross-segment
    when: "Graph cache is stale (>5 min) or you suspect new files were added"
    cost: "~2s"
    output: "Node/edge counts by type, cached to .comp-graph/graph.json"

  comp-cochange:
    command: "comp-cochange <matrix | pair <T1> <T2> | file <path-substr>> [--since \"14 days ago\" | --range A..B] [--grain type|serial] [--json]"
    segment_scope: cross-segment
    when: |
      - "Which agent TYPES change the same files together?" (matrix — co-movement ranked, shared files named)
      - "Do these two seats collide?" (pair — one type-pair's shared surface)
      - "Who co-moves on this file/tree?" (file — coupling around a path)
      - The Kimi Semantic Vertical Pipeline's F4 Friction leg, beside comp-blast overlap + comp-heat trajectory
    cost: "~seconds (one comp-missions commit walk; runs no git of its own, derived live)"
    output: "Per-pair shared_files + jaccard + BOTH F4 denominators (commits-attributed/total AND pairs-observed/possible); HEAD anchor on every output; --json for machine form"
    name_note: "DISTINCT from comp-heat (WRITE-freshness of objects, not pair co-movement) and comp-missions (mission attribution, not coupling). Answers COUPLING, not staleness."
    guardrails: "READ-ONLY, no LLM, observations never verdicts; UNATTRIBUTED authors counted in denominator 1, never dropped."
    engine: "org/modules/graph/comp_cochange.py (typed dispatch over the comp-missions walk)"
    project: "OPAL_KIMIPIPELINE (F4 Friction instrument; born-registered 2026-08-04)"

  comp-heat:
    command: "comp-heat <freshness [path] | drift | score <id> --age-days N> [--half-life N] [--top N] [--json]"
    segment_scope: cross-segment
    when: |
      - "What's stale / dead / safe to archive here?" (freshness — per-path hot/warm/cold + ranked COLD SUBTREES = archive candidates)
      - "What have I written that isn't committed?" (drift — writes NOT in a commit: untracked + modified, freshest first; the LOCAL->GIT layer)
      - Ad-hoc heat score for one item (score — S0 recency-decay band)
    cost: "~seconds (one git-history pass, derived-on-demand; no persisted store)"
    output: "hot/warm/cold bands + cold subtrees (archive candidates) | uncommitted-write drift list | single-item heat score; --json for machine output"
    name_note: "DISTINCT from comp-freshness (DATA-PIPELINE S3/DDB artifact/chain staleness for gold runs). comp-heat = REPO/ESTATE OBJECT write-freshness + hygiene. The GIT->DEPLOY hop = comp-pipescript deployed + comp-freshness (comp-heat drift is LOCAL->GIT only)."
    guardrails: "ADVISORY-ONLY (scores/clusters/flags; never recommends-to-delete = O3, never auto-acts; inherits NFRA_DEBTSCAN never-auto-delete + blast-radius verify-before-recommend) + READ-ONLY (derived from git, no new store)."
    engine: "org/modules/heatmap/{heat_map.py S0, object_freshness.py O1} (NFRA_EXPAND Strand-C; pinned API 2e3c27290)"
    project: "NFRA_EXPAND (HEATMAP_OBJECT strand)"

  comp-drift:
    command: "comp-drift <coverage | <target> | sweep [--deep]> [--json]"
    segment_scope: cross-segment
    when: |
      - "Did my gold script / Lambda / graph node propagate intact all the way (local->git->cloud->nessie->kuzu->iceberg->trino->served)?" (<target> -- full propagation-chain walk)
      - "Where in the estate is the propagation topology UNGUARDED today?" (coverage -- the seam coverage ledger from drift-topology.yaml; any GAP is drift you cannot see)
      - "Is the whole estate in propagation parity?" (sweep -- fan out across every seam -> unified board + coverage line; --deep invokes the live/network engines)
    cost: "coverage ~instant (manifest read); sweep ~seconds (cheap seams live; the live/network engines are cost-guarded behind --deep or a <target>)"
    output: "normalized per-hop drift-record {stage_from,stage_to,target,seam_id,verdict,severity,operator_action,grounding}; tri-state exit 0 clean / 1 integrity-break / 2 UNVERIFIABLE; --json for CI"
    name_note: "ORCHESTRATOR -- CALLS the existing seam engines (comp-heat drift, comp-pipescript deployed, comp-lambdamap parity, comp-iam reconcile, comp-kuzu provenance, iceberg_parity, code_heat_parity, comp-freshness); it NEVER re-implements a seam check (PRD arch-gate b). DISTINCT from comp-xray (CONTENT motion) + comp-freshness (data-pipeline staleness): comp-drift owns the cross-seam propagation TOPOLOGY and never silently MATCHes an unreadable seam (UNVERIFIABLE = exit 2)."
    guardrails: "READ-ONLY orchestration; never-silent-MATCH (an unreadable / GAP / cost-guarded seam -> UNVERIFIABLE, never false-clean -- Rule 22 grounding on every verdict); cost-guarded (cheap seams first; live/network engines behind --deep or a scoped <target>)."
    engine: "org/modules/graph/drift_cli.py over org/modules/graph/drift-topology.yaml (the SSOT); orchestrates .tools/comp-* + infra/aws/globgrph/{iceberg,code_heat}_parity.py"
    project: "NFRA_COMPDRIFT (P2 / TO-2 -- the orchestrator shell)"

  comp-xray:
    command: "comp-xray <frozen <bucket> <key> --fields F[,F] | s3 ... | code <path> | config <path> | schema <parquet|s3://> | freeze-monitor [--publish]> [--json]"
    segment_scope: cross-segment
    when: |
      - "Is this served value GENUINELY changing, or FROZEN-BUT-FRESH (value frozen while the timestamp keeps advancing)?" (frozen — the headline value-MOTION derivation on a served S3 JSON key)
      - "Show me the raw value + freshness version timelines for this served key" (s3 — forensic, the two axes that derive the freeze)
      - "Has this script's/config's LOGIC genuinely changed, or just been re-touched?" (code/config — git content-fingerprint timeline, penny-test de-dup)
      - "Has this parquet's SCHEMA drifted in place (column added/dropped/retyped under a stable path)?" (schema — footer-schema fingerprint)
      - Run the standing FROZEN-BUT-FRESH guard over the served targets (freeze-monitor — dry-run unless --publish to the critical-surface SNS topic)
    cost: "code/config/schema-local ~seconds (git/footer read); frozen/s3/schema-s3/freeze-monitor = one S3 list_object_versions + per-version get (live AWS, ~seconds)"
    output: "drift-record verdict (CLEAN/BREAK/UNVERIFIABLE) + disposition + derived flags + per-axis last_genuine_change + grounding; tri-state exit 0/1/2; --json for machine output"
    name_note: "DISTINCT from comp-diff (the git->graph blast-radius tool, name unchanged) and from comp-freshness/comp-heat (those check the WRAPPER: mtime/existence/size; comp-xray checks the MOTION: is the CONTENT moving). The frozen-but-fresh class the wrapper-tools structurally cannot see."
    guardrails: "READ-ONLY (list_object_versions + get_object + git log; never writes). VINTAGE-PRIMARY (grounds the authoritative retained version history, never newest-by-mtime). UNVERIFIABLE on a could-not-read axis = a finding (exit 2), never a silent clean. freeze-monitor is DRY-RUN by default (only --publish emits SNS)."
    engine: "infra/aws/compdiff/{engine.py, axes_s3.py, axes_git.py, axes_schema.py, freeze_monitor.py} (CLI cli.py); home relocates to org/modules/compdiff/ on COO lane-grant"
    project: "NFRA_COMPDIFF (the value-MOTION lens; P1 frozen-but-fresh prevention)"

  comp-parity:
    command: "comp-parity [firm] [--config <path>] [--json]   # default firm: 49f"
    segment_scope: cross-segment
    when: |
      - "Is the canonical pipeline ready to STAND IN for the BD-served surfaces (never-widen cutover)?" (the daily, tolerance-aware, dual-gated DATA/served parity proof, firm-by-firm)
      - "Has this firm's canonical-vs-served parity held a CLEAN multi-day streak?" (the streak IS the cutover gate)
    cost: "~seconds (reads canonical + BD-served artifacts + the firm parity-config tolerances)"
    output: "per-firm parity verdict (CLEAN/BREAK) + the dual-gate detail + streak state; --json for machine output"
    name_note: "DISTINCT from comp-lambdamap parity (DEPLOY parity = deployed-SHA vs live CodeSha256). comp-parity = DATA/served parity (the canonical output can replace the served surface). Firm spec: data/canonical/schwab/parity/{firm}_parity_config.yaml."
    guardrails: "READ-ONLY (compares live artifacts; never writes). A single clean day is NOT a cutover -- the gate is a multi-day CLEAN streak, never-widen, firm-by-firm."
    engine: "org/modules/graph/comp_parity_cli.py"
    project: "DATA_SSOTMG (TO-4 served-cutover parity gate)"

  comp-aws:
    status: deprecated
    deprecation: |
      DEPRECATED FOR AGENT USE since 2026-09-09 (Andrew-direct, NFRA_CLDGRPH CG-s-30; record:
      org/tier1_exec/1.0.0_SA_CTO/deliverables/ANDREW_DIRECT_20260909_191xZ_NO_LAPTOP_GRAPH_REFRESH_COMP_AWS_WRITE_PATHS_RETIRED.md).
      comp-aws is the ENGINE that derives the cloud graph. The estate runs it: the nightly Fargate
      derive-runner calls the engine IN-PROCESS (infra/aws/globgrph/derive_runner.py), and the
      incremental updater Lambda keeps it near-real-time between runs. No laptop and no agent is a
      producer of this surface, and no question is ever the cause of a rebuild.
      READ THE RESULT INSTEAD: `comp-kuzu "<Cypher>"` (manifest entry cloud.read.served_vintage --
      every call states how old its answer is) or `comp-find --corpus aws '<regex>'` for a
      name/arn sweep with drift_class per hit.
      IT IS NOT GATED. Every subcommand still runs and every exit code is unchanged; the CLI prints
      this notice on stderr first. What changed is ROUTING and DESCRIPTION: comp-which no longer
      ranks it, and no agent-facing text here presents it as something you run.
    command: "comp-aws <classes|metrics|diff|dual-managed|score> [opts]   # the READ-ONLY subcommands. The three write/engine paths (derive, snapshot, and the versioned-store commit subcommand) are CLOUD paths, not agent calls -- they are enumerated in engine_paths below, cited rather than spelled, so a text census of laptop-producer phrasings finds none here."
    segment_scope: aws-cloud
    engine_paths: |
      NOT FOR AGENT USE -- these are the cloud producer's entry points, listed so the name resolves
      and nothing looks missing:
      - derive          -- the full reconcile. Called IN-PROCESS by the nightly Fargate derive-runner.
      - snapshot        -- the estate's point-in-time archive step (black-box recorder).
      - the versioned-store commit subcommand -- commits a derived graph into the versioned store. Its literal name is in comp_aws_cli.py main(); it is CITED and not spelled here on purpose (a tombstone that repeats the literal keeps it in every text census).
    read_only_subcommands: |
      Still callable by name, unchanged, and harmless -- but comp-kuzu answers the same questions
      off the served graph without touching AWS:
      - classes       -- list the resource classes the compiler covers (static reference).
      - metrics       -- summary/security tallies. `--graph FILE` reads a snapshot JSON.
      - diff A B      -- diff two graph JSONs (incident forensics over two existing snapshots).
      - dual-managed  -- ARNs owned by more than one terraform root-module state.
      - score         -- P/R/F1 of the derivation vs the CVO-certified oracles (advisory harness).
    cost: "static compile sub-10s for the read-only subcommands"
    output: "JSON / text on stdout, unchanged. The DERIVED ARTIFACT is produced and published by the estate-side runners, not by a call from here."
    usage_guide: "org/modules/graph/comp-aws-agent-usage.yaml"
    project: "NFRA_COMPAWS"
    overlay_role: "The LIVE half of the desired-vs-live overlay (see comp-iam.overlay_pattern): comp-iam parses TF = DESIRED; the LIVE census is EMITTED BY THE ESTATE'S OWN RUNNERS through this engine (nightly derive-runner + incremental updater) and served for reading, not produced by an agent call; `comp-iam reconcile` overlays live on desired. IAM axis feeds comp-iam reconcile (per-role statements in its contract shape). NOTE 2026-07-14 (NFRA_COMPCLOSE): this file carried a SECOND `comp-aws:` key adjacent to comp-iam -- YAML duplicate-key semantics meant that thin Phase-0 stub SILENTLY REPLACED this canonical entry in every safe_load of this catalog. The stub is now a comment there; this is the one entry."

  comp-kuzu:
    command: 'comp-kuzu "<Cypher>" [--json] [--limit N] [--schema]'
    segment_scope: aws-cloud
    when: |
      - "List/inspect cloud resources of a type, transitive reachability, or blast radius" (the fast ~ms query layer over the served cloud graph)
      - "What AWS resources exist + how are they typed/connected?" -> `comp-kuzu "MATCH (n:CloudNode) RETURN n.node_type, count(*)"` (moved here from the comp-aws entry, CG-s-30: the typed graph is READ, never rebuilt to answer)
      - "What's the drift / blast radius / unmanaged surface?" -> drift_class is a node PROPERTY on the served graph: `comp-kuzu "MATCH (n:CloudNode) WHERE n.drift_class='LIVE-no-DECLARED' RETURN n.arn"`; or `comp-find --corpus aws '<regex>'`, which prints drift_class per hit.
      - "Is any resource dual-managed across TF states?" -> `comp-kuzu "MATCH (n:CloudNode) WHERE n.drift_class='MULTI_STATE_MANAGED' RETURN n.arn"` (the MULTI_STATE_MANAGED apply-conflict footgun).
      - "Cloud-shape snapshot + diff over time" -> the snapshots are produced and archived ESTATE-SIDE on the estate's own schedule. Read the current shape here and its VINTAGE line; there is no snapshot for you to take.
      - THE ONLY surface is the SERVED projection. The tool is a thin client: it takes NO database path and NO Cypher parameter dict, so there is no second surface to select and no frozen-vintage copy to point at.
      - "refresh / update the graph / my graph is behind / ground-truth reset" -> THERE IS NO REFRESH TO RUN. Read: `comp-kuzu "<Cypher>"`. The served projection is advanced on the estate's own schedule (NFRA_CLDGRPH round 5, CG-s-17); the read STATES how old its answer is, so a behind-ness is reported to you rather than fixed by you. Manifest entry: cloud.read.served_vintage.
      - "I do not know the Cypher dialect" -> `comp-kuzu --schema`: the CloudNode/CloudEdge-with-PROPERTIES form (node_type and edge_type are PROPERTIES, not node labels or typed relationships) -- the #1 dialect error, static and service-free.
    cost: "~ms -- one call to the projection service; nothing is opened, built or downloaded locally"
    output: "Cypher result (table, or --json array on stdout)"
    freshness: |
      STATED BY THE SERVICE, PER CALL. comp-kuzu is a THIN CLIENT over the served projection; it holds no
      store, opens none, and builds none. Every read ends with a VINTAGE line on STDERR:
        VINTAGE: <plain-words age>  [vintage=<vintage> manifest=<sha12> prefix=<artifact prefix>]
      The sentence leads because it is what a reader acts on; the bracketed triple trails because it is what
      a machine or an auditor re-derives from (infra/aws/globgrph/kuzu_cli.py:46-61). stderr-only, so --json
      and table stdout stay parseable.
      NOTHING IS COMPUTED FROM CLIENT TIME. If the service states no age, the line says so verbatim
      ("AGE NOT STATED BY THE SERVICE -- no age was inferred"). If the service does not answer, the line
      names the ABSENCE ("VINTAGE: unavailable -- the projection service did not answer; no age was inferred
      and no local copy was read") and the call exits 1 -- it never falls back to a local copy and never
      invents a vintage.
      THERE IS NO REFRESH AN AGENT RUNS (NFRA_CLDGRPH round 5, CG-s-17). The served projection is advanced by
      the estate's own producers on their own schedule; Rule 20's QUERY-default posture is now unconditional.
      A behind-ness is REPORTED to the reader by the VINTAGE line, not fixed by the reader.
      The graph remains a minutes-stale-and-LABELED traversal surface, NOT a read-your-own-writes verification
      substitute (verify against the served artifact / live AWS).
    rebuild_trigger: "none. There is no rebuild call and no database path. The served projection is advanced on the estate's own schedule; read it, and read the VINTAGE line it prints (manifest entry cloud.read.served_vintage)."
    project: "NFRA_GLOBGRPH"

  comp-describe:
    command: 'comp-describe <arn-or-name> [--json]'
    segment_scope: aws-cloud
    when: |
      - "what is this resource / what does it do / describe <arn> / find an AWS resource" -> FIND + DESCRIBE one resource (its purpose + producers/consumers/wiring, synthesized from the graph).
      - Servable NOW off the LANDED derive-at-scan engine (summary_corpus.py) over the EXISTING comp-kuzu QUERY path -- decoupled from BOTH KUZUSPLIT-P1 (the refresh-command split, not the read path) AND the resource_summaries Iceberg table.
    cost: "~ms: 2 targeted comp-kuzu queries for an exact ARN (node + edge neighborhood); +1 light all-node sweep only when resolving a name/substring. NEVER the full-corpus build."
    output: "human summary (RESOURCE / SUMMARY / produced-by / consumes / provenance), or --json. Exit 1 (no silent guess) when a query resolves to 0 (refresh hint) or N (disambiguation list) resources."
    freshness: "Reads the live comp-kuzu graph (shares its provenance/HEAD-oracle contract). derive-at-scan: no projected property, no table -- nothing to go stale beyond the graph vintage itself."
    rebuild_trigger: "Never rebuilds (Rule 20 QUERY-default). 0 matches -> read the served graph's VINTAGE line before concluding absence (a broken retrieval and an absent resource read identically)."
    project: "NFRA_COMPSIMILAR"

  comp-similar:
    command: 'comp-similar <arn-or-name> [<arn-or-name>] | supersede [--heat-json F | --live-heat] | cluster [--type T] [--json]'
    segment_scope: aws-cloud
    when: |
      - "do two resources do the same JOB / find a functional duplicate / what overlaps with X" -> BM25 SUMMARY similarity (what a resource DOES) -- the sibling of comp-dups (NAME/body -- what it IS): different corpus, different question.
      - "is anything SUPERSEDED / a decommission candidate / an old resource left running next to its replacement" -> --supersede: summary-twin x heat-DIVERGENT (comp-heat data-cold AND comp-debris invoke-cold, CONFIDENCE-graded) x not-a-designed-parallel x not-held.
      - "map functional overlap across the estate" -> cluster (same-JOB overlap census).
    cost: "corpus = 1 comp-kuzu read (~s, ~1.8k nodes); BM25 cheap (df-cut). supersede heat: --heat-json snapshot ~ms (PREFERRED); --live-heat MINUTES (comp-debris live AWS, partial for S3)."
    output: "pairwise score + HYPOTHESIS (never a bare 'duplicate'); neighbor list; supersede = ranked cold-CANDIDATE -> hot-REPLACEMENT + confidence (HIGH both-cold / MEDIUM one-cold) + coverage denominator; or --json. Advisory / read-only / hold-aware; NO delete verb (feeds OPAL_LCLRPO, deletion stays per-batch Andrew-word)."
    freshness: "Live comp-kuzu derive-at-scan corpus (shares its provenance/HEAD-oracle). No projected property, no table (CTO ruling 1). Heat = current comp-debris/comp-heat vintage OR an explicit --heat-json snapshot."
    rebuild_trigger: "Never rebuilds (Rule 20 QUERY-default). A thin/UNKNOWN summary -> UNKNOWN-band, never a twin claim (C3); enriched by PH3 authored summaries."
    controls: "PRD 5 controls-not-care: C1 no-verdict-without-heat-divergence, C2 name-excluded-corpus (no comp-dups collapse), C3 blind-row + coverage denominator, C4 dogfood, C5 hold-aware. self-test PASS 7/7."
    project: "NFRA_COMPSIMILAR"

  comp-trace:
    command: "comp-trace <query> [--direction up|down|both] [--depth N] [--json]"
    segment_scope: cross-segment
    segment_scope_note: "ADHC_COMPIL_V4.020: graph now contains BD gold + INF gold scripts (function-level) + s3:platinum/* artifact nodes alongside Lambda/COMPONENT/ENDPOINT/EVENTBRIDGE/S3. For S3 nodes use 's3:' prefix (e.g. s3:platinum/firm/leaderboard.json). Use --all when query matches multiple nodes."
    when: |
      - "Where does this data come from?" (--direction up)
      - "What consumes this data?" (--direction down)
      - "Show me the full data path end to end" (--direction both, default)
      - Investigating a bug that spans ANY layers (frontend, API, Lambda, S3, gold, EventBridge, CloudFront)
      - Understanding what a component, endpoint, Lambda, or artifact depends on before modifying it
      - "Which EventBridge rules trigger this Lambda?"
      - "Which Lambdas serve this API endpoint?"
      - "Which portal pages call this API function?"
    examples:
      - "comp-trace AdvisorsTab --direction up"
      - "comp-trace gold:D_04.client_portal_summary --direction both  # BD gold (canonical form)"
      - "comp-trace gold:INF_D_04.client_portal_summary --direction both  # INF gold (V4.020)"
      - "comp-trace s3:platinum/firm/leaderboard.json --direction up  # platinum artifact (V4.020)"
      - "comp-trace getCumulativeChart --direction both"
      - "comp-trace getFirmLeaderboard --direction up  # endpoint with callers"
      - "comp-trace opal-partners-data --direction up"
      - "comp-trace D_04 --all  # disambiguate when query matches multiple nodes"
    cost: "<1s (cached graph)"
    replaces: "Explore agent, manual grep for imports/fetch calls/S3 keys/Lambda routes/EventBridge rules"

  comp-blast:
    command: "comp-blast <query> [--function name] [--json]"
    segment_scope: cross-segment
    segment_scope_note: "ADHC_COMPIL_V4.020: same scope as comp-trace — BD gold + INF gold (function-level) + Lambda/COMPONENT/ENDPOINT/EVENTBRIDGE/S3 + s3:platinum/* artifacts."
    when: |
      - Before modifying ANYTHING: "what downstream systems will this affect?"
      - Gold script change: "what S3 artifacts, Lambdas, and portal pages does this feed?"
      - Gold helper fix: "which callers and downstream artifacts depend on this internal function?"
      - Lambda change: "what portal components consume this Lambda's output?"
      - API endpoint change: "which components call this function?"
      - S3 artifact change: "which Lambdas and endpoints read this?"
      - EventBridge rule change: "which Lambdas does this trigger?"
      - COO decomposing a PRD: "which agents need task orders for this change?"
    examples:
      - "comp-blast build_employee_leaderboard"
      - "comp-blast D_00 --function build_timeseries_chart"
      - "comp-blast _compute_window_decomposition"
      - "comp-blast _compute_window_flows"
      - "comp-blast opal-partners-data"
      - "comp-blast timeseries_chart"
      - "comp-blast news-trending-analysis"
    cost: "<1s"
    replaces: "Manual audit of S3 readers, Lambda consumers, portal imports, EventBridge targets"
    note: "Graph now includes top-level Python function nodes plus local caller/callee edges. This means comp-blast can start from internal helpers (for example _compute_window_decomposition) and walk outward to callers, writers, and downstream artifacts instead of requiring grep fallback."

  comp-diff:
    command: "comp-diff [--ref HEAD~3] [--staged] [--json]"
    segment_scope: cross-segment
    when: |
      - Before committing: "what is the blast radius of my uncommitted changes?"
      - After pulling changes: "what graph paths were affected by recent commits?"
      - Pre-deploy check: "what portal components are affected by this deploy?"
    examples:
      - "comp-diff"
      - "comp-diff --ref HEAD~5"
      - "comp-diff --staged"
    cost: "~2s (rebuilds graph + runs git diff)"
    replaces: "Manual file-by-file change review"

  comp-xref:
    command: "comp-xref [<symbol>] [--save] [--json]"
    segment_scope: cross-segment
    segment_scope_note: "Both modes (diff + symbol-lookup) operate on the unified graph. Symbol-lookup matches across all node types (GOLD_SCRIPT/COMPONENT/ENDPOINT/LAMBDA/EVENTBRIDGE/S3); inherits the same BD-gold-only limitation for graph nodes."
    when: |
      - After a gold re-run or deploy: "did the dependency graph change?" -> comp-xref (no-arg = diff mode)
      - Periodic audit: "what nodes/edges were added or removed since last check?" -> comp-xref
      - Save baseline before major work: "comp-xref --save"
      - "Where is symbol X referenced across the graph?" -> comp-xref <symbol> (symbol-lookup mode; ADHC_COMPIL_V4.014)
      - "Which nodes/edges mention this Lambda/component/S3-key/function?" -> comp-xref <symbol>
    modes:
      diff: "comp-xref (no positional arg) -- compare current graph against baseline snapshot"
      symbol-lookup: "comp-xref <symbol> -- cross-reference symbol against all graph nodes (id/label/file_path) + edges (source/target). Output mirrors comp-blast structure. Closes 2026-04-21 17/25 FAIL cluster where agents passed positional args expecting symbol-lookup."
    examples:
      - "comp-xref --save"
      - "comp-xref"
      - "comp-xref --json"
      - "comp-xref D_04"
      - "comp-xref AdvisorPublicProfile"
      - "comp-xref inf-bronze-runner"
    cost: "~2s (diff mode rebuilds graph); <1s (symbol mode uses cached graph)"
    replaces: "Manual before/after comparison of file trees (diff mode); manual grep across graph nodes (symbol mode)"
    note: "Dual-purpose tool. No-arg = graph state diff vs baseline. Positional arg = symbol cross-reference lookup. Disambiguation by argparse positional optionality (nargs='?')."

  comp-estate:   # RENAMED from pipescript 2026-07-30 (Andrew-direct; bare name prohibited + rc=2 tombstone)
    command: "comp-estate <name>   |   comp-estate --list | --resource <substr> | --tool <name> <tool> | --debt | --fe-reachability | --validate | --gate-b"
    segment_scope: estate-wide
    segment_scope_note: "NFRA_PIPESCRIPT (Andrew-direct, COMPLETE 2026-06-15). The HUMAN ENTRY POINT over the whole estate: 'what am I looking for -- the news scanner? -> comp-estate news'. THREAD/SUB-THREAD/LAMBDA COUNTS ARE THE RESOLVER'S, LIVE VIA `comp-estate --list` -- deliberately NOT stated here. (This note froze '25 named threads / 134 sub-threads / 169 lambdas' from the 2026-06-15 CVO census 2d9a0a2a1; the estate had moved to 29/138/188 by 2026-07-30 while this line still read the old digits, and graph-call-manifest.yaml carried the newer ones -- two records, two numbers. The durable fix is to stop stating them, per CLAUDE.md's frozen-count rule.) Reads the prebuilt estate-coverage-resolver.json (gen-estate-resolver.py joins the CVO manifest 61e91d334 + census). Read-only, ~0.3s, no AWS calls."
    when: |
      - "What's in the news / advi / market-overview / model-portfolios / trade-submission / <portal-page> pipeline?" -> comp-estate <name>
      - "What named threads exist?" -> comp-estate --list
      - "Which thread owns resource X (a lambda / S3 key / table)?" -> comp-estate --resource <substr>
      - "What debt (orphan/dormant/stranded/freshness/frontend-orphan) is in thread X?" -> comp-estate --debt (or comp-estate <name>, flags inline)
      - "Does this backend thread reach a MOUNTED rendering component, or is it a frontend-orphan/phantom?" -> comp-estate --fe-reachability
      - Starting any cross-layer investigation: comp-estate <name> FIRST to see every resource + its owning tool, THEN drill via the named sub-resolver.
    subcommands:
      "<name>": "Full traversal of a named thread: every sub-thread -> producers (lambdas/EC2/StepFn + triggers) -> served artifacts (S3/DDB) -> frontend consumers (portal components) -> owning_tool + coverage status + debt flags + FE-reachability. NO silent Unknown."
      list: "comp-estate --list -- all 25 named thread names + per-thread IN-SCOPE/OUT/UNREVIEWED counts + owning tools."
      resource: "comp-estate --resource <substr> -- reverse lookup: which named thread(s) + sub-thread own a resource matching the substring."
      tool: "comp-estate --tool <name> <tool> -- only the sub-threads of <name> owned by <tool>; the drill POINTER surfaces the canonical sub-resolver call (read-only; does NOT live-invoke, F5)."
      debt: "comp-estate --debt -- estate debtscan-flag view across all threads (P3.1)."
      fe-reachability: "comp-estate --fe-reachability -- FE-reachability status per backend thread (mounted-reachable / frontend-orphan / phantom / unreviewed-LOUD) from CVO GROUND-TRUTH, NOT a live portal grep (scaffolding-fooled: bd-time-machine's provider exists in code) (P3.2)."
      validate: "comp-estate --validate / --gate-b -- self-validation + the standing regression oracle (gate-b 25/25 named-thread reproduction + gate-c every-resource->exactly-one-thread)."
    process_doc: "org/modules/graph/ESTATE_WORLD_MODEL_PROCESS.md -- the definition/granularity/refresh/evolution process of record (Andrew-commissioned 2026-07-30: the World Model tool)"
    cost: "TWO PLANES (2026-07-30 tool-walk #1): thread-model answers (<name>/--list/--resource/--tool/--debt/--fe-reachability/--validate/--gate-b) ~0.3s from the prebuilt resolver, no AWS; the LIVE KEY-PLANE scan (--drift/--refresh, or --keys appended to a query) re-derives keys from producer source and costs tens of seconds. The old flat ~0.3s claim was true of the old engine only."
    data_sources: "estate-coverage-resolver.json <- gen-estate-resolver.py joins the CVO estate-coverage manifest (61e91d334) + the 2026-06-15 estate census (2d9a0a2a1). Rebuild: re-run org/modules/graph/gen-estate-resolver.py after the manifest/census changes."
    replaces: "Grepping across single-slice tools (comp-pipescript/globgrph/stitch/portal-tools) for a thread one of them doesn't own (silent Unknown); a manual census of 'what's in pipeline X'. An unknown name OR an unowned-tool query is ALWAYS LOUD (exit 2) -- the generalized TOOL-02 false-clean guard."
    note: "comp-pipescript (medallion) is ONE of comp-estate's sub-resolvers (cp=13 of the 134 threads); comp-estate (nee pipescript/comp-semantic-estates; consolidated 2026-07-30) is the estate-wide named-thread SUPERSET that ROUTES to it + globgrph (AWS-resource) / stitch (cross-layer) / portal-consumer-tools (frontend) / none (ops-local). Owner: AE/cloud-ops per Andrew-direct 2026-06-23 (engine estate_infrastructure_cli.py, nee pipescript_cli.py 2026-07-30; this note carried the superseded DS-lane label until 2026-07-30 -- tool_index + NFRA_SYSTEM_P1_class3 both cite the 06-23 correction); cross-tool comp-pipescript guard edits route owner-review (AE) per the two-rule lane convention."

  comp-pipescript:
    command: "comp-pipescript <subcommand> [args]"
    segment_scope: segment-aware
    segment_scope_note: "Auto-detects pipeline by script-id prefix (INF_* -> inf-gold; D_*/C_*/B_*/A_* -> bd-gold; pull_inflection_* / orion_* -> inf-manual-api). For `deployed` (NFRA_DEBTSCAN.TOOL-01 2026-06-12): a data/<tree>/scripts/... PATH arg auto-routes to that tree (bd|inf|cot|mdpf), each reading ONLY its own bucket (firm separation); --firm {bd,inf,cot,mdpf} or --pipeline <key> = single tree; NO arg = sweep EVERY PIPELINE_MAP tree (+ mdpf check-only). Firm bucket mapping derives from safe_deploy_core.PIPELINE_MAP (single source). Explicit --pipeline {bd-gold,bd-silver,inf-gold,inf-silver,inf-manual-api,cot-gold,cot-silver,mdpf}. Known issue: chain --pipeline inf-gold returns BD chain (bug). RESOLVED: deployed --pipeline inf-gold full sweep no longer UnboundLocalErrors (ADHC_COMPIL_V4.019 skip_gold init fix; verified 60 INF gold MATCH in the all-trees sweep 2026-06-12)."
    when: |
      - "What does gold script X read and write?" -> comp-pipescript io X
      - "What feeds script X?" -> comp-pipescript feeds X
      - "What consumes script X output?" -> comp-pipescript consumers X
      - "What's the execution order of a chain?" -> comp-pipescript chain downstream
      - "Do scripts A and B share any S3 artifacts?" -> comp-pipescript overlap A B
      - Designing a new gold script: understand inputs available from upstream
      - Modifying a gold script: check who consumes your output before changing schema
    subcommands:
      dag: "Full pipeline DAG with I/O per script (--json for machine output)"
      io: "comp-pipescript io D_00 -- input/output manifest with upstream writers and downstream consumers. Now includes: S3-DYNAMIC annotations for runtime-resolved reads (dim CSVs, pandas s3:// URIs), and PORTAL CONSUMERS section resolving platinum/* write targets to portal endpoints + components. Use --no-portal to skip routing table lookup. ADHC_COMPIL_V5.002 (2026-05-26): path-mode short-circuit -- when arg is a path to infra/aws/lambda/**/lambda_function.py, output uses node-class `lambda_pipeline_script` and scans boto3 S3/DDB ops directly (module-constant resolution for Key/TableName variables). Empirical AC anchor: DS 0.1.0 YALP_MKTOVR.001 brief §11 Level-1 mapping. Partial AC5: traversal integration (comp-trace + comp-blast wiring) deferred — Lambda nodes not yet linked into BD-gold pipeline DAG. Cross-link via comp-iam service <name> for IAM-side."
      io_scope: "NFRA_DEBTSCAN.TOOL-02 (2026-06-12): io analyzes EVERY tree's OWN graph -- --firm {bd,inf,cot,mdpf} or a data/<tree>/scripts/... path routes to that tree (cot via the parameterized bd-shape parser incl. catalog-driven non-[A-D] ids like S_00/E_*; mdpf via build_mdpf_dag over gold/backfill/feeders/bronze). An unknown pipeline key now exits 2 UNCOVERED instead of silently answering from the bd graph (the D2X false-clean class); 'Unknown script in tree [X]' names the tree it searched. D2X re-run post-TOOL-02: cot 28/28 + mdpf 18/18 resolved, 0 Unknown, 0 column gaps."
      io_prefix_reads: "NFRA_COMPTOOLS.PREFIX-READS (2026-08-25): io enumerates PAGINATED PREFIX reads (list_objects_v2 / get_paginator('list_objects_v2').paginate / Bucket().objects.filter) as read-edges of kind PREFIX beside the KEY reads, tagged [PREFIX] [LOCAL-CONST] and resolved through the script's own module-level constants -- NOT only through lib/s3_layout.py. BEFORE: a prefix read was visible ONLY if its constant came from s3_layout, so a script's PRIMARY INPUT could be wholly absent while io read clean (found on B_00.canonical_holdings, whose SCHWAB_RPS_PREFIX drove a client-facing restore and did not appear). Three independent causes, each sufficient alone: the module-constant regex required a medallion-tier root; it required a FILE EXTENSION, so no prefix could EVER match it; and module-constant resolution was gated behind `if not imported_names`, skipping every HYBRID script. MEASURED at build: 150 of 356 gold scripts (42.1%, all 6 trees) carried a prefix read io could not see -- 252 read-edges, 143 resolved + 109 UNRESOLVED. ⛔ AN UNRESOLVABLE Prefix= PRINTS AN UNRESOLVED-PREFIX ROW AND IS NEVER DROPPED -- silence is the defect, the trace is the bonus. The discriminator is the USAGE (Prefix=), never the path shape. --json carries the same edges plus an always-present unresolved_prefix_reads[]."
      chain: "comp-pipescript chain downstream -- chain membership + order + I/O counts"
      feeds: "comp-pipescript feeds D_00 -- upstream scripts that write artifacts D_00 reads"
      consumers: "comp-pipescript consumers C_07 -- downstream scripts that read C_07 output"
      overlap: "comp-pipescript overlap D_00 D_03 -- shared S3 artifacts between two scripts. COO MANDATE: run this on every pair of scripts before authoring cross-domain coordination blocks."
      inject: "Inject pipeline edges into comp-trace graph cache (run after comp-build)"
      stats: "Graph stats + warnings for scripts with missing reads/writes"
      deployed: "comp-pipescript deployed [<filter>] [--firm bd|inf|cot|mdpf | --pipeline <key>] -- compare local scripts against their DEPLOYED S3 ETags. NFRA_DEBTSCAN.TOOL-01 (2026-06-12) all-trees scope: NO arg = sweep EVERY tree (bd->opal-data-bd, inf->opal-data-inf, cot->opal-data-cot, mdpf->opal-data-mdpf) -- each tree reads ONLY its own bucket (firm separation, no cross-bucket fallback) and the sweep prints a per-tree banner naming the bucket so every MATCH/STALE/MISSING row is bucket-attributed. Scope to one tree via --firm {bd,inf,cot,mdpf}, --pipeline <key>, or a data/<tree>/scripts/... PATH arg (auto-detects the tree; generalizes the former cot-only auto-route). Firm bucket mapping derives from safe_deploy_core.PIPELINE_MAP (bd/inf/cot single source); mdpf is appended check-only (deploys via its own mechanism + non-standard code/scripts/<layer>/ layout, but checked because MDPF_COUNTS proved it strands). NOTE: --pipeline inf-silver shows all MISSING_ON_S3 (INF silver lives elsewhere, V4.OPS Cat 5.5). Statuses: MATCH/STALE/MISSING_ON_S3/LOCAL_MISSING/TIMEOUT/AWS_UNREACHABLE/UNCOVERED/DRIFT per script. Filter is substring/filename (e.g. D_04, INF_C_01, a stem, or a full path). Run before any gold/silver run to confirm the runner has latest code; run a full sweep to de-caveat a cross-firm freshness audit (DEBTSCAN). NFRA_DEBTSCAN.TOOL-03 (2026-06-12) bronze + aux coverage: BRONZE is first-class for bd/inf/cot ([BRONZE] rows, data/<dir>/scripts/bronze -> code/bronze/; closes the Rule-13 bronze-verifiability gap behind the 2026-06-12 inf-ADVI stranded-deploy) with layer-scoped keys bd-bronze/inf-bronze/cot-bronze (safe-deploy's {firm}-{layer} verify now works for bronze). AUX prefixes are CHECK-ONLY ([aux:<prefix>] rows, S3-driven, compares same-basename repo counterparts): inf bronze-runner (the dual-prefix the inf runner ACTUALLY syncs -- divergence here = live stranded-deploy until ADVI_INFETL.BRONZE-FIX collapses it) + inf manual_api (repo home data/inf/manual_api). Aux divergence reports DRIFT in full-tree views (visible but NOT the deploy-gate STALE token -- safe-deploy's verify greps STALE, and an unrelated aux drift must not block a gold/silver deploy); ONLY the *-bronze layer view reports bronze-homed aux divergence as real STALE (there the runner-synced prefix IS the deploy gate). Prefixes with NO repo-home mapping (runner/exporter/cleanup) AND any live code/ prefix absent from the tool registry emit explicit UNCOVERED rows -- UNCOVERED means UNVERIFIED, never clean (false-clean guard; a GAP-grep must not miscount tool-blindness as cleanliness)."
    cost: "<1s (io/feeds/consumers/overlap); ~2-5s (deployed single tree); ~15-30s (deployed no-arg all-trees sweep) -- AWS API calls"
    data_sources: "lib/s3_layout.py (AST-parsed), gold_dispatch.sh (chain/catalog), each script's imports"
    replaces: "Manual import tracing, grepping s3_layout constants, reading gold_pipeline_script_file_flow.md; manual aws s3 ls + sha256sum for deployment verification"
    note: "Use this instead of comp-trace for gold script dependency questions. comp-trace covers cross-layer (frontend->Lambda->S3); comp-pipescript covers intra-pipeline (script->S3->script). comp-pipescript io now shows portal consumers for platinum/* keys -- eliminates the 'terminal in graph' coverage gap for platinum publishers. comp-pipescript deployed now fails honestly on AWS runtime hangs instead of collapsing into silent or misleading output."

  comp-routes:
    command: "comp-routes <subcommand> [args]"
    segment_scope: segment-aware
    segment_scope_note: "URL-based + endpoint-name-based; pipeline-agnostic in input but auto-routes through pipeline-specific CloudFront behaviors + API Gateway routes. Cottonwood paths defer until FIRMSEP.10."
    when: |
      - "How does this data get from S3 to the browser?" -> comp-routes trace <endpoint_fn>
      - "What auth layers does this path go through?" -> comp-routes auth-map
      - "Which CloudFront behavior handles this URL?" -> comp-routes trace /api/scoped/...
      - "What does this React component fetch and how?" -> comp-routes trace ComponentName
      - "What rewrites does shared-advisor-router apply?" -> comp-routes rewrites
      - "Which paths go through API Gateway vs direct S3?" -> comp-routes stats
      - Platinum migration: verify new paths route correctly through CF + auth
      - Auth audit: verify every path has appropriate auth layers
    subcommands:
      trace: "comp-routes trace getEmployeeLeaderboard -- full chain: URL -> CF behavior -> origin -> auth -> router -> S3 key -> components"
      behaviors: "All 23 CloudFront behaviors with origins, auth, edge functions"
      origins: "All 6 CloudFront origins (S3 buckets + API Gateways)"
      rewrites: "URL->S3 rewrite rules from shared-advisor-router + public-data-router"
      api-routes: "All API Gateway route_keys grouped by pipeline"
      endpoints: "All frontend endpoint functions with resolved URLs"
      components: "Component -> endpoint call bindings"
      auth-map: "Which paths have no auth, edge-only, or double auth (edge + API GW)"
      stats: "Routing table summary: origin types, auth coverage, resolved routes"
    cost: "<1s"
    data_sources: "cloudfront-distribution.tf, shared-advisor-router/index.mjs, api-gateway.tf files, portal/src/api/endpoints/*.ts, portal/src/pages/**/*.tsx"
    replaces: "Reading Terraform + Lambda@Edge source + frontend code to trace serving paths manually"
    note: "Use this for any frontend-to-backend question. comp-pipescript covers data production (gold scripts); comp-routes covers data serving (S3 -> CloudFront -> auth -> browser)."

  comp-transform:
    command: "comp-transform <subcommand> [args]"
    segment_scope: segment-aware
    segment_scope_note: "Component-name based; auto-routes by component path. --feature <token> to escalate feature-named UNUSED to WARN."
    when: |
      - "What fields does this component actually render from the API response?" -> comp-transform fields X
      - "What useMemo chains transform the data after fetch?" -> comp-transform chains X
      - "Which response fields are fetched but never used?" -> comp-transform unused X
      - "Full data flow: fetch -> transforms -> JSX?" -> comp-transform trace X
      - Before changing a response shape: know which transforms and JSX refs will break
      - Platinum migration: identify client-side aggregation that pre-aggregated data replaces
      - "Building a new cohort/metric/mode" -> comp-transform schema-check X --feature token THEN comp-transform ternary-audit X (MANDATORY — catches routing ternary gaps before they ship)
      - "I added a new field to a TypeScript union type" -> comp-transform ternary-audit X -- find all ternary chains missing the new value
      - "schema-check shows a feature-named field as UNUSED" -> comp-transform ternary-audit X -- find the routing ternary that's missing the branch
    subcommands:
      trace: "comp-transform trace PartnerAnalytics -- full flow: fetches, transform chains, JSX refs, response types"
      fields: "comp-transform fields PartnerAnalytics -- all response fields actually accessed, grouped by root variable"
      chains: "comp-transform chains PartnerAnalytics -- useMemo/useCallback chains with inputs, field accesses, and operations"
      unused: "comp-transform unused PartnerAnalytics -- waste analysis: response fields fetched but never rendered"
      schema-check: "comp-transform schema-check ClientsTab [--feature <token>] -- cross-reference rendered JSX fields against TypeScript response types. Flags MISSING (rendered but not in type = runtime undefined) and UNUSED (in type but not rendered = waste). --feature ofc: escalates UNUSED fields containing 'ofc' to WARN with routing ternary hint. Use --feature when building a new cohort/metric/mode."
      ternary-audit: "comp-transform ternary-audit DistributionTab -- scan ternary chains on union-typed variables for unhandled members. Finds cohort ternaries missing the 'ofc' branch, metric ternaries missing 'nna', etc. Only flags when 2+ members share an unintended fallthrough. Use --verbose to see single-implicit-fallthrough sites too."
      all: "Summary of all components with data flow"
      stats: "Statistics: fetch count, chain count, common operations"
    cost: "<1s"
    data_sources: "portal/src/pages/**/*.tsx (hooks, JSX), portal/src/pages/**/types.ts (response interfaces)"
    replaces: "Reading component source to understand what fields are used, spawning Explore agents to trace useMemo chains"
    note: "Use BEFORE reading component source. schema-check --feature <token> + ternary-audit together catch the 'new cohort added to type but routing ternary not updated' class of bug (the W3 OFC regression). Run both when building any new cohort, metric, or mode."

  comp-platinum:
    command: "comp-platinum <subcommand> [args]"
    segment_scope: segment-aware
    segment_scope_note: "page subcommand: component-name based. reverse subcommand: S3-key based + hybrid #field resolution. tab-audit / summary: portal-wide (cross-segment). Use --strict to suppress SPECULATIVE results."
    when: |
      - "For this page, trace the full path from fetch to gold script" -> comp-platinum page X
      - "What S3 key does this endpoint resolve to, and what gold script writes it?" -> comp-platinum page X
      - "For this S3 key, what routes serve it and what components render it?" -> comp-platinum reverse S3key
      - "For this payload field path, what artifact/producer/component chain owns it?" -> comp-platinum reverse dotted.path
      - "Audit every ADVI tab in one shot" -> comp-platinum tab-audit
      - Phase 2 tab audits: tab-audit gives you fetches, origins, auth, S3 keys, gold sources, transforms per tab
    subcommands:
      page: "comp-platinum page PartnerAnalytics -- full stack: fetch -> CF -> auth -> S3 key -> gold script, with transforms and JSX refs. Real component names: PartnerAnalytics, ClientsTab, AdvisorBookView, DistributionTab, InflectionInsightsPanel. NOT 'AdvisorIntelligence' (directory) or 'BooksTab' (non-existent)."
      reverse: "comp-platinum reverse gold/artifacts/employee_leaderboard.json -- S3 key -> route -> components; also accepts dotted payload paths like rfs.decomposition_max.nna and resolves them back to artifact + producer + component"
      tab-audit: "Audit every ADVI tab: fetches, origin type, auth layers, S3 keys, gold sources, transform count"
      summary: "One-line per component: fetch count, chain count, S3 direct vs API GW, auth coverage"
    cost: "<2s (chains comp-transform + comp-routes + comp-pipescript)"
    replaces: "Spawning 2+ Explore agents to manually trace page -> API -> infra -> gold scripts (~200k tokens)"
    note: "This is the composition tool. Use it for full end-to-end page audits. For targeted questions (just pipeline, just serving, just transforms), use the individual tools. reverse now supports both artifact keys and rendered payload field paths, which closes the nested-key consumer-enumeration gap that previously forced portal grep fallback."

  comp-cache:
    command: "comp-cache <subcommand> [args]"
    segment_scope: cross-segment
    when: |
      - "Do any components share a React Query cache key?" -> comp-cache collisions
      - "What cache keys exist and which components own them?" -> comp-cache map
      - "Find all cache keys related to advisor-intelligence" -> comp-cache key advisor-intelligence
      - Before changing a queryKey or response type: check for shared keys that would break
    subcommands:
      map: "All cache keys -> components + response types + fetch functions"
      collisions: "Keys shared by multiple components, flags TYPE MISMATCH when same key has different response types"
      key: "comp-cache key <query> -- find all cache keys matching a substring"
    cost: "<1s"
    replaces: "Grepping for useQuery across all .tsx files to find shared keys"

  comp-pii:
    command: "comp-pii <subcommand> [args]"
    segment_scope: cross-segment
    when: |
      - "Does this component expose PII to external users?" -> comp-pii scan ComponentName
      - "Full PII audit across all ADVI tabs" -> comp-pii audit
      - "What fields does the pseudonymizer hash?" -> comp-pii fields
      - "Which serving paths carry PII and are they protected?" -> comp-pii routes
      - Phase 4 auth validation: verify pseudonymization coverage after platinum migration
      - Before adding a new field to a response: check if it's PII
    subcommands:
      scan: "comp-pii scan ClientsTab -- flags every PII field reference as [HASHED] or [CLEARTEXT]"
      audit: "Full audit across all ADVI tabs: PII ref counts, pseudonymization coverage, S3-direct warnings"
      sweep: "comp-pii sweep -- scan ALL portal .ts/.tsx files for hardcoded PII values (z-numbers, account IDs). Catches real account numbers in code and comments. Synthetic IDs (z00000001) are allowlisted."
      fields: "PII field registry: 10 pseudonymized + 3 potential, with HMAC prefix and role matrix"
      routes: "Which serving paths carry PII and whether pseudonymizer runs (Lambda vs S3-direct)"
    cost: "<2s"
    data_sources: "pseudonymizer.py (target field list), auth-validator-edge (role matrix), comp-transform (rendered fields)"
    replaces: "Manual cross-referencing of pseudonymizer.py against component source to find PII exposure"

  comp-validate:
    command: "comp-validate <script_id> --artifact <local/path/to/artifact.json>"
    segment_scope: segment-aware
    segment_scope_note: "Auto-resolver per script_id prefix (INF_* -> INF config; others -> BD config). A data/cot/ PATH arg routes to the COT config in ISOLATION (cot ids collide with bd, so PATH not prefix; never merged into the bd+inf alias map -- NFRA_COT_TOOLING 2026-06-12, firm separation). Explicit --config <path> override (V4.009)."
    when: |
      - Before uploading any gold artifact to S3: verify output invariants hold
      - After a gold run, before signaling downstream agents: confirm correctness
      - Debugging "no crash but wrong output" failures (zeros, missing keys, wrong sums)
      - DS mandates: run before MCP-signaling AE on any script that has validate config
    subcommands:
      validate: "comp-validate D_04 --artifact /tmp/leaderboard.json -- run all configured checks"
      list: "comp-validate --list -- show all configured checks and invariants"
      list-one: "comp-validate D_00 --list -- show checks for one script. V4.021 ship: matcher tightened (D_04 matches D_04 + D_04_positions_output but NOT INF_D_04). Use --lane bd|inf to filter; unknown script_id emits ERROR + 15 candidates (mirror comp-iam service unknown-name pattern)."
    check_types: |
      key_present    -- JSON key must exist and be non-null/non-empty
      count_min      -- array at path must have >= N elements
      field_nonzero  -- numeric field > 0 (with optional filter on another field)
      sum_approx     -- two values within tolerance_pct of each other
      no_null_numeric -- no null/NaN in numeric fields at path
      threshold_pct  -- >= min_pct% of entries satisfy a condition
    exit_codes: "0 = all ERROR checks pass; 1 = any ERROR check fails (WARN does not block)"
    cost: "<1s (JSON); ~2s (parquet, uses pyarrow)"
    config: "BD: data/black_diamond/scripts/gold/gold_validate_config.yaml | INF: data/inf/scripts/gold/gold_validate_config.yaml | COT: data/cot/scripts/gold/gold_validate_config.yaml. Pipeline auto-detected from script_id prefix (INF_* -> INF; others -> BD); a data/cot/ PATH routes to COT in isolation (NFRA_COT_TOOLING 2026-06-12)."
    data_sources: "gold artifact JSON/parquet (local file, use aws s3 cp first)"
    replaces: "Manual spot-checks (Travis Penfield fee_earning_aua sanity check), S3 key presence inspection"
    note: "MANDATORY gate: run before any S3 upload of a gold artifact that has a validate config. Catches 'no crash but wrong output' class of bugs. DS writes invariants once; tool enforces them forever. INF example: comp-validate INF_D_08 --artifact /tmp/nmec_nmnc_nna.json"

  comp-shell:
    command: "comp-shell scan [path ...] [--all] [--guard-lookback N]"
    segment_scope: cross-segment
    when: |
      - About to commit a .sh file in .tools/, org/mcp/, org/threads/, infra/aws/lambda/ci/, infra/aws/terraform/
      - Adding a new shell script to any local-runtime path (Rule 16 check)
      - After Git Bash version update or ADHC_BASHFIX incident: verify no new bare utility calls crept in
      - Auditing all local-runtime scripts: comp-shell scan --all (then read WARN/ERROR summary)
    subcommands:
      scan: "comp-shell scan .tools/ -- scan all .sh files in .tools/"
      scan-all: "comp-shell scan --all -- scan full workspace (excluding EC2/data paths)"
      scan-file: "comp-shell scan org/mcp/inbox-watch.sh -- scan a single file"
      list-forbidden: "comp-shell list-forbidden -- print 6 forbidden utilities + canonical fallbacks"
    exit_codes: "0 = no ERROR findings (WARN is advisory); 1 = at least one ERROR; 2 = usage error"
    cost: "<1s per file"
    data_sources: "shell script files in workspace (reads source, no external calls)"
    replaces: "Manual grep for pgrep/pkill/flock/pidof/setsid/wget in local shell scripts"
    note: |
      Detects bare references to the 6 utilities absent from Git Bash 3.6.7
      (pgrep pkill flock pidof setsid wget). UNGUARDED (no command -v guard
      in 30-line lookback) = ERROR. GUARDED = WARN. EC2-side paths
      (infra/aws/ec2/, data/) are exempt. Pre-commit hook (ds-commit-gate.sh)
      runs this automatically on staged .sh files in in-scope paths.
      Canonical guard pattern: if command -v pgrep >/dev/null 2>&1; then ...
      Reference: org/mcp/inbox-watch.sh (commit 045296b18, ADHC_BASHFIX.002)

  comp-chainrun:
    command: "comp-chainrun {snapshot --label L [--out P] [--manifest P] [--bucket B] [--from-dir D] | diff <pre.json> <post.json> [--verbose] [--json] | spec | selfcheck}"
    segment_scope: cross-segment
    when: |
      - Shipping an ATOMIC-BUNDLE TO (a multi-commit refactor touching a producer + its consumers): snapshot --label pre BEFORE the bundle ships, snapshot --label post AFTER the chain re-runs, diff
      - Verifying a chain refactor did not silently drop a stage artifact, lose a column, or empty a partition
      - Class-B gate of the VALGATE acceptance-gate suite (ADHC_VALGATE.007, N7)
    subcommands:
      snapshot: "comp-chainrun snapshot --label pre -- capture the A/B/C/D-stage shape-sentinel set into a snapshot"
      diff: "comp-chainrun diff pre.json post.json -- partial-refactor-leak report (DROPPED / COLUMNS-LOST / EMPTIED)"
      spec: "comp-chainrun spec -- print the PRD 3.2 six-field Class-B gate contract"
      selfcheck: "comp-chainrun selfcheck -- offline no-op + synthetic-leak verification"
    exit_codes: "0 = PASS / WARN / SKIP (v1 WARN-not-BLOCK); 1 = BLOCK (post-ratchet only)"
    cost: "~3-10s per snapshot (reads ~10 S3 gold artifacts); diff <1s"
    data_sources: "INF gold S3 artifacts per the in-code curated CHAIN_MANIFEST in chainrun_cli.py (parquet + json); --from-dir reads a local directory for offline / fixture use"
    replaces: "Worker-discipline 'eyeball the A/B/C/D chain sentinels' -- no structural pre/post diff existed before"
    note: |
      Class-B gate (ADHC_VALGATE.007, N7 -- formalizes the Class-B half of the
      VALGATE taxonomy). Catches partial-refactor leaks: a sentinel that flips
      green->absent, loses a column, or goes row-count>0->0 across an
      atomic-bundle ship. Reference = the pre-bundle snapshot (the pre-refactor
      sentinel set). The stage-sentinel set is the in-code CHAIN_MANIFEST in
      chainrun_cli.py -- add a sentinel by editing that dict, no separate file
      (the same in-code declared-registry convention as the Class-C
      valgate_baseline.py registries). v1 WARN-not-BLOCK
      per PRD 7-Q1; the WARN->BLOCK ratchet is a one-line GATE_VERDICT_POLICY
      flip in chainrun_cli.py. Anchor: DWSPLT chain #26 partial-refactor leak.
      PRD: docs/architecture/ADHC_VALGATE.md section 4.B.

  comp-axes:
    command: "comp-axes [--axes a,b] [--no-snapshot] [--json] | comp-axes delta [--since ISO-DATE]"
    segment_scope: cross-segment
    when: |
      - "Where should I look? / give me the estate overview by axis" -- ONE screen of every analytic
        axis (heat/pulse/freshness/debt/debris/depth/learns-gaps/fedobs-signals) with its live
        vintage + top-3 + the canonical drill command. THIN: it runs the existing readers; a
        failed/absent reader is an HONEST degraded row, never a silent omission.
      - "What got hotter / colder / more dangerous / staler since <date>?" -> comp-axes delta
        (diffs two dated snapshot rows per axis; the append-only history each directory run feeds:
        org/modules/graph/axes_history.jsonl + S3 mirror).
      - NOT for drilling INTO one axis -- use the per-axis reader the directory row points at.
  comp-freshness:
    command: "comp-freshness {chain {bd|inf} | script <id> | artifact <s3-prefix> | ddb <table> [--pattern PK#] | all} [--list]"
    segment_scope: segment-aware
    segment_scope_note: "Explicit pipeline arg required for chain subcommand. script + artifact work cross-pipeline (inferred from prefix). ddb subcommand targets DynamoDB tables. all runs S3+DDB in one pass."
    when: |
      - Before dispatching a gold chain: "is the upstream S3 data fresh enough to run?" -> comp-freshness chain bd|inf
      - About to run a specific script: "are the inputs for this script fresh?" -> comp-freshness script A_03
      - Investigating a stale-data incident: "how old is this S3 prefix right now?" -> comp-freshness artifact s3://...
      - Checking firm-config DDB freshness (FIRM_BUCKET_MAP / opal-users-v2): comp-freshness ddb opal-users-v2 --pattern FIRM#
      - Full workspace freshness sweep (S3 + DDB): comp-freshness all
      - Reviewing all cadence config: "what are the freshness thresholds?" -> comp-freshness --list
      - Debugging a wrong-output run: "was upstream data stale when this ran?"
      - Pre-dispatch gate in bd-gold-dispatch.sh or orion-gold-dispatch.sh (integration wired by ADHC_COMPIL.013)
    subcommands:
      chain: "comp-freshness chain bd  -- check all silver/bronze inputs to the BD gold chain; exit 0=PASS/WARN, 1=FAIL, 2=config error"
      chain_inf: "comp-freshness chain inf  -- same for INF gold chain"
      script: "comp-freshness script A_03  -- check just the inputs tagged for this script in cadence config"
      artifact: "comp-freshness artifact s3://opal-data-bd/schwab/silver/rps/  -- check one prefix; exit 1 if FAIL"
      ddb: "comp-freshness ddb opal-users-v2 [--pattern FIRM#]  -- scan DDB table for items with PK prefix; check timestamp vs max_age_hours; PASS/WARN/FAIL; MISSING if table not found"
      all: "comp-freshness all  -- run full S3 (bd+inf) + all DDB entries in one pass; exit 1 if any FAIL"
      list: "comp-freshness --list  -- print all entries grouped by pipeline (BD, INF, DDB) sorted by artifact_id"
    output_format: "artifact_id | s3_key_or_ddb_target | last_modified_iso8601 | age_h | fail_at_h | STATUS (PASS/WARN/FAIL/SKIP)"
    exit_codes: "0=PASS/WARN (WARN does not block), 1=any FAIL (ERROR-severity beyond fail_age_hours or table MISSING), 2=config error or AWS unreachable"
    cost: "<30s for full chain (32 BD or 31 INF artifacts; parallel 8-thread AWS calls). DDB scan: <5s per table."
    config: "S3: data/black_diamond/scripts/gold/gold_freshness_config.yaml (32 BD) | data/inf/scripts/gold/gold_freshness_config.yaml (31 INF) | DDB: data/ddb_freshness_config.yaml (2 tables: opal-users-v2, opal-routing-config)"
    ddb_schema_convention: "DDB items must have 'updatedAt' or 'createdAt' string attribute (ISO-8601). comp-freshness checks timestamp_attr first (config), falls back to fallback_timestamp_attr. Items without either attribute surface as WARN."
    incidents_caught: |
      2026-04-17: Schwab RPS (opal-data-schwab/silver/RPS/) 10-day stale -> $130M linear_interpolation overshoot
      2026-04-29: silver/aum_snapshot/ 8-day stale -> $89.6M AUA (vs $182.71M correct)
      Both would have been caught at dispatch time with this tool.
    replaces: "Manual aws s3 ls + timestamp inspection before gold dispatch; post-hoc stale-data forensics. DDB mode replaces manual DDB console inspection for firm-config drift."
    note: "ADHC_COMPIL.012 (Theme G), DDB extension ADHC_COMPIL_V4.015 (AE 0.7, 2026-05-11). WARN entries (partner-feed severities, weekly dims) do not block dispatch. ERROR entries beyond fail_age_hours exit 1 and block. DDB MISSING (table not found) = FAIL for ERROR-severity entries. Vendor-feed thresholds (Schwab + Orion) require Andrew ACK before removing [PENDING ANDREW ACK] flag from config. Dispatch integration is .013 scope."

  comp-types:
    command: "comp-types {index <TypeName> [--firm-conditional-sites] [--severity warn|error] | blast <TypeName> | fields <TypeName> [--severity warn|error]}"
    when: |
      - About to edit a TypeScript type (interface or type alias): which components consume it? -> comp-types index <TypeName>
      - Blast radius: comp-types blast <TypeName> (files with direct imports)
      - Field audit: comp-types fields <TypeName> (all fields + access patterns)
      - Debugging "component shows wrong data / undefined field": comp-types index <TypeName> --firm-conditional-sites
    subcommands:
      index: "comp-types index TenantLayoutConfig -- finds all consumer sites (hook use, field access, DEFAULT_LAYOUT refs); 60 sites in <4s. Manifest: org/modules/graph/types-index/<TypeName>.yaml"
      blast: "comp-types blast TenantLayoutConfig -- files directly importing the type (blast radius for interface changes)"
      fields: "comp-types fields TenantLayoutConfig -- enumerates all top-level fields with TS type and access count"
    output_format: "consumer site list: file:line | kind (USE/IMPORT/FIELD/LAYOUT) | content snippet. Manifest written to types-index/<TypeName>.yaml"
    exit_codes: "0=PASS (findings logged; no exit-1 unless --severity error + WARNs present), 1=FAIL or definition not found"
    cost: "<5s (regex-based portal grep; no ts-morph required)"
    incidents_caught: |
      ADHC_COMPIL_V4.026 (2026-05-14): TenantLayoutConfig blast = 10 files, 60 consumer sites — supports multi-tenant FIRMSEP refactor scope analysis.
    replaces: "Manual portal src grep for TypeName; blast-radius estimation before type restructuring"
    note: "ADHC_COMPIL_V4.026 (AE 0.7, 2026-05-14). Python regex approach (ts-morph absent on this machine). Strips Config/Type/Props suffix to derive hook name (useTenantLayout from TenantLayoutConfig). Windows C: drive-letter path parsing handled."

  comp-adapter-audit:
    command: "comp-adapter-audit <adapter-fn> [--severity warn|error]"
    when: |
      - About to write or modify a portal adapter function: pre-ship field-threading audit
      - After pulling new platinum S3 data: verify typed interface matches live envelope
      - Debugging "component shows undefined / 0 for a field that S3 has": comp-adapter-audit <adapter-fn>
      - Reviewing a multi-tenant adapter (e.g., Inflection vs 49F): check schema-drift vs live S3
    output_format: "per-field audit: STATUS (SCHEMA-DRIFT|NOT-THREADED|TYPE-ONLY|NESTED-SCHEMA-DRIFT|FALLBACK-ORDER) | SEV (WARN|INFO) | field.path | detail. Manifest: org/modules/graph/adapter-audit/<adapter-fn>.yaml"
    exit_codes: "0=PASS (findings written; no crash), 1=FAIL or adapter not found, or --severity error + WARNs"
    cost: "<60s (live S3 fetch ~10s + regex parse)"
    incidents_caught: |
      INFFIN #7 (32df3b85->cae9dcb2 2026-05-13): FALLBACK-ORDER WARN — raw.book ?? raw.summary inverted fallback silently dropped historical_quarters
      Surface #2 (pre-d622a249 2026-05-13): SCHEMA-DRIFT WARN — relationship_stacked_periods in S3 but not typed, not threaded
      Surface #8 (.012): is_fee_paying type-aligned but adapter missed propagation
    replaces: "Manual S3 envelope inspection at adapter boundary; empirical post-ship drift detection"
    note: "ADHC_COMPIL_V4.031 (AE 0.7, 2026-05-15). Uses live S3 fetch (sys.executable -m awscli). Field access uses .field notation to avoid variable-name collisions. Python regex-based (no ts-morph). Manifests under org/modules/graph/adapter-audit/."

