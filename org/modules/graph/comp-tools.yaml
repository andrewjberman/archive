tools_continued:
  comp-ontolint:
    command: "comp-ontolint {check | self-test | role-resolve <Role>...}"
    segment_scope: cross-segment
    when: |
      - "Is the ontology's Relation-vs-Role DUAL-AXIS exception consistent?" (the relation-vs-role invariant)
      - Machine-lint the rule-bank: routes-to->Router / resolves-through->Registry / projects->Gateway are dual-axis; every other relation is single-axis (a Relation, no Role)
      - Replaces the prose "load-bearing subtlety" (Rule-20: prose re-drifts; a lint blocks) -- NFRA_ONTOCLARITY WS-B fog-7
    cost: "~seconds (reads the canonical org/modules/graph/NFRA_ONTOLOGY_RULE_BANK.yaml; pure, no AWS/graph)"
    output: "the machine-read DUAL-AXIS exception list + PASS/FAIL (FIRES on a Relation-vs-Role violation); self-test seeds mutants (base-relation-given-role, composite-undeclared-role) + a random-input control"

  comp-lambdamap:
    command: "comp-lambdamap check"
    segment_scope: cross-segment
    when: |
      - Before/after editing infra/aws/lambda/ci/lambda-source-map.json: verify it matches TF + on-disk dirs
      - CI gate: detect lambda source-map drift (always-on; exits 1 on drift)
      - After adding/renaming a Lambda or its source dir: confirm the map tracks it
    cost: "~1s (read-only; no AWS, no map mutation)"
    output: |
      Drift report keyed by class: WRONG_SOURCE_DIR (source-map source_dir != TF, or absent on disk),
      MISSING_ENTRY (TF-backed lambda w/ no functions{} entry = CI-drift-blind), INCOMPLETE_SCHEMA
      (functions{} entry w/o source_dir), MISLOCATED (top-level key outside functions{}), ORPHAN_ENTRY
      (entry w/ no TF + no dir). EXTERNAL sentinel = not drift. Phase-1 (check) shipped 218c1b289 off CTO
      PRD f9e70457a / CVO audit 359375d87 (day-1 regression fixture). Phase-2 (sha-recompute vs live
      CodeSha256 / multi-runtime dir enum / derive[--write] normalize-by-construction, CVO-gated write) WIP.
    impl: org/modules/graph/lambdamap_cli.py

  comp-iam:
    command: "comp-iam <subcommand>"
    segment_scope: segment-aware
    segment_scope_note: "service subcommand: Lambda-name first, IAM-role-name fallback (V4.013). gaps/roles/services/role/stats: multi-pipeline scan. NOTE: ~100 BD Lambdas show '(role not mapped)' due to incomplete mapping in lambda-source-map.json (NUISANCE; see V4.OPS triage). cross-firm subcommand pending V4.006. V4.024 ship: false-positive elimination — EC2-shipped-shell `aws s3 cp` patterns inside USER_DATA_SCRIPT/SSM commands excluded from Lambda-role gap analysis; AWS-managed-policy attachments (aws_iam_role_policy_attachment) credit the role with managed actions (s3:Get*, dynamodb:*, etc.). FP rate 78% -> 0% on V4.023 anchor cases. V5.001 ship (2026-05-26): full EC2 catalog coverage — `_load_ec2_profiles` now iterates every EC2_MANIFEST.json service with iam_role + source_path (was hardcoded bd-gold-runner only), surfacing 8 EC2 profiles (was 1) including bd-allocations/bd-assets/bd-fees/bd-price-runner/bd-transactions on bd-exporter-ec2-role + demo-transform-runner + moltbot + bd-gold-runner; underscore↔dash normalization in service-name lookup (e.g. `comp-iam service bd_exporter` now resolves to role `bd-exporter-ec2-role` per the Terraform-resource-vs-role-name dash/underscore convention). Anchor: 2026-05-26 AE 0.6.1 manual IAM additions (b00e2733e INF + 053bba6f7 BD adding cloudfront:CreateInvalidation) where the role-side audit required terraform-grep workaround pre-extension."
    when: |
      - Before deploying a Lambda or EC2 script change: verify IAM permissions are sufficient
      - Debugging silent AWS permission failures (no exception caught, operation silently fails)
      - After adding a new boto3 S3/SSM/DynamoDB call: verify role grants the action
      - Infra audit: confirm all Lambda/EC2 roles have correct permissions
    subcommands:
      gaps: "comp-iam gaps -- show all detected permission gaps (default command)"
      roles: "comp-iam roles -- list all IAM roles parsed from Terraform"
      services: "comp-iam services -- list all Lambda/EC2 services with detected operations"
      service: "comp-iam service bd-gold-trigger -- show operations + grant status for one service"
      role: "comp-iam role bd-exporter-ec2-role -- show all granted actions for one role (real role names: bd-exporter-ec2-role, bd-gold-layer-lambda-role, inf-gold-trigger-lambda-role; NOT bd-gold-runner-role which doesn't exist)"
      stats: "comp-iam stats -- summary counts (roles, services, gaps)"
      reconcile: "comp-iam reconcile [--census <json>] -- DESIRED(TF-parse)-vs-LIVE(comp-aws census) drift: live-only roles (ungoverned-by-IaC), live-only actions, over-perm flags. The runtime overlay (see overlay_pattern below)."
    cost: "~2s (scans Lambda sources + Terraform; no AWS API calls in default path; managed-policy unknown ARNs trigger one-time aws iam get-policy-version + cache to .comp-graph/managed_policy_actions_cache.json)"
    data_sources: "infra/aws/lambda/ci/lambda-source-map.json, infra/aws/terraform/*/iam.tf, Lambda/gold script sources, .comp-graph/managed_policy_actions_cache.json (managed-policy action cache)"
    replaces: "Manual cross-reference of boto3 calls against iam.tf; AWS IAM console audit"
    note: "Catches permission gaps before they cause silent failures. The IAM watchdog loop incident (2026-04-09) was caused by s3:DeleteObject missing from bd-exporter-ec2-role -- comp-iam would have flagged this during the Terraform review. V4.024 (2026-05-08) eliminated the two FP classes that surfaced post-V4.022 backfill: (A) EC2-shipped-shell distinction — aws-cli patterns inside triple-quoted strings shipped via run_instances UserData= or send_command commands=[] no longer flag against the Lambda role; (B) AWS-managed-policy attachment parsing — aws_iam_role_policy_attachment with policy_arn = arn:aws:iam::aws:policy/X contributes X's actions to the role's grant set via static lookup table (S3/Lambda/SSM/DynamoDB/SecretsManager/CloudWatch + 21 ARNs) plus aws iam get-policy-version cache+API fallback for unknown ARNs (emits MANAGED_POLICY_UNKNOWN advisory + does NOT claim coverage when offline)."
    overlay_pattern: "DESIRED-vs-LIVE OVERLAY (generalizable + worth knowing): comp-iam parses Terraform = the DESIRED/source state (fast, offline); the LIVE-AWS census is emitted ESTATE-SIDE by the cloud-graph engine's own runners and served for reading (comp-kuzu) -- deprecated for agent use 2026-09-09, CG-s-30; `comp-iam reconcile` OVERLAYS live ON desired to regress one against the other, surfacing drift the source-parse is structurally blind to (ungoverned/console-created roles, grants added outside IaC, over-perms). The same shape applies to ANY source-parse tool + a live census -- comp-routes (CF/router from TF+index.mjs) and comp-lambdamap (source-map vs TF) are desired-state too and could be overlaid the same way. Source-parse = the cheap always-on check; live census = the periodic regression."

  # comp-aws was placed adjacent to comp-iam ON PURPOSE (the two halves of the overlay/
  # regression pattern above -- comp-iam = desired/source, comp-aws = live) -- BUT it was a
  # DUPLICATE `comp-aws:` KEY: yaml.safe_load keeps the LAST key, so this thin early-Phase-0
  # stub silently REPLACED the canonical comp-aws entry (the one above, which documents every
  # subcommand) in every load of this catalog. Found + fixed 2026-07-14
  # (NFRA_COMPCLOSE Phase A). The canonical entry now carries the overlay_role note; this block
  # is retained as prose only:
  #   comp-aws <axis> (early Phase-0; 0.7.0_AE-owned) -- LIVE-AWS ground truth vs repo/TF
  #   desired-state; feeds `comp-iam reconcile` (per-role statements in its contract shape) +
  #   S3 declared-vs-live. Phase-0 shipped as fixtures (docs/briefs/cmpaws-{iam,s3}-*-census-*.json);
  #   EC2/Dynamo/eventing/edge/observability WIP + CVO-cert pending.

  comp-registry:
    command: "comp-registry sync ROW=N | --project CODE | --all | (+ --apply)"
    segment_scope: workspace-wide
    segment_scope_note: "Operates on `org/projects/REGISTRY.md` table rows + `org/projects/{CODE}.json` source-of-truth fields. ADHC_COMPIL_V5.003 ship (2026-05-26): NEW tool — REGISTRY-vs-JSON-vs-PRD narrative drift detection + write-back per ADHC_COMPIL_V5 PRD v0.1 §6 TO-003 + CVO brief 92b198aac §3 Fix 3. Author: 3.0.0_SA_CVO per Andrew direct delegation 2026-05-26 ~16:55Z overriding the original [[cvo-self-validation-mitigation-pattern]] default carve-out. Detects 5 drift classes: PHASE-LAG (REGISTRY narrative cites Phase N < JSON status='phaseM_'), COMMIT-CITATION-LAG (REGISTRY narrative missing >25% or >=3 of JSON-cited commit hashes), PRD-LABEL-LAG (JSON cites PRD vX.Y newer than REGISTRY PRD column reference), STATUS-MISMATCH (JSON status='complete' but row in Active table = missed Closure-Discipline-3-step move), ROW-MISSING (project JSON exists but no REGISTRY row found). Acceptance anchor: 7 Sub-class Y CVO /spot-check fires today (bca1e1234 + bdaed5f7b + 6d8d4206b + 146f033db + 1082f9b56 + 47ad2978a + a84912406) + 3rd-fire today of 'new-project REGISTRY-row backlog' class (5 YALP Wave-1 PRDs missing rows; ADHC_COMPIL_V5 row pre-COO-add; ADVI_DEMOV1 row 22 multi-day stale narrative) — tool empirically reproduces all 3 classes on present-state --all sweep."
    when: |
      - After a project JSON `status` / `current_phase` / `blocking` advance: verify REGISTRY row narrative reflects the change
      - After a new project JSON ships: check REGISTRY row exists (ROW-MISSING detection)
      - After a PRD-version-revision (v0.N → v0.N+1): verify REGISTRY PRD column cites the new version
      - Post-Closure-Discipline-3-step check: confirm JSON `status=complete` rows actually moved to Completed table
      - Periodic workspace-wide drift sweep (`--all`) — recommended at /verify-channel 2h cron tick
    subcommands:
      sync: "comp-registry sync -- diff-report (default) or write-back with --apply"
    modes:
      row: "comp-registry sync ROW=N -- diff-report for row N (1-indexed within active table; falls back to other tables)"
      project: "comp-registry sync --project YALP_MKTOVR -- diff-report by project code (handles JSON-without-row case via ROW-MISSING)"
      all: "comp-registry sync --all -- workspace-wide sweep across all Active rows + all project JSONs (catches both row-side drift and JSON-without-row backlog)"
      apply: "comp-registry sync ROW=N --apply -- write JSON-derived narrative back to REGISTRY via safe-commit.sh under CVO author line (lane discipline preserved)"
    cost: "<1s (read-only stdlib; no AWS API calls; no comp-build invocation; pure filesystem read of REGISTRY.md + project JSONs)"
    data_sources: "org/projects/REGISTRY.md (active + completed + held tables); org/projects/*.json (project JSONs)"
    replaces: "Manual REGISTRY-vs-JSON narrative cross-reference; multi-day-latent Sub-class Y /spot-check cascade fires; new-project REGISTRY-row backlog catch via ad-hoc COO observation"
    note: "Empirically validated 2026-05-26 ship: --all sweep on workspace caught 10 drift findings (5 YALP Wave-1 ROW-MISSING + ADVI_DEMOV1 COMMIT-CITATION-LAG + ADVI_SHARED COMMIT-CITATION-LAG + ADHC_FECACHE_COHERENCE COMMIT-CITATION-LAG + ADVI_BFIX4/ADVI_FIRMSEP ROW-MISSING) reproducing the same drift classes that today's 7 Sub-class Y CVO /spot-check fires manually caught. --apply write-back regenerates phase narrative from JSON current_phase as authoritative source; safe-commit.sh wrapper invocation preserves CVO-author-line + --only pathspec discipline (no lane drift; no FORCE-BYPASS). Read-only is the default — no --apply flag = report-only stdout (no mutation, no commit). Exit code: 0 if no drift, 2 if drift detected (CI-flag-friendly). Honest-limit: PRD §6 TO-003 AC#1+#2 strict historical-commit-state replay (`bca1e1234`-window etc.) is PARTIAL via present-state-equivalent-class-detection — the tool catches the same drift CLASSES the historical fires caught; strict git-checkout-and-replay deferred to TO-VAL composite regression (AE 0.7 lead with CVO co-consult). Pattern matches AE 0.7 TO-002 honest-partial-discipline shape."

  check-lambda-layer-deps:
    command: "check-lambda-layer-deps [--function <name>] [--pipeline <name>] [--strict] [--verbose] [--json]"
    segment_scope: segment-aware
    segment_scope_note: "No positional args. Default: full repo audit. --function <name> for single Lambda, --pipeline <name> for pipeline scope, --strict to exit 1 on any FAIL, --json for CI-friendly machine output (V4.021 ship). --all flag does NOT exist (default no-flag = repo-wide)."
    when: |
      - Before deploying a Lambda zip change: confirm imports resolve through declared layers
      - After adding a new third-party import to a Lambda: verify a layer covers it
      - Auditing inline-vendoring drift: layer ARN comments may have drifted from layer requirements.txt
      - Triaging "ModuleNotFoundError" Lambda failures: surface which import is missing from which layer
    subcommands:
      single: "check-lambda-layer-deps <lambda> -- audit one Lambda's imports vs its declared layers (handles aws_lambda_layer_version + module references via ADHC_LAMBDADOC.003)"
      all: "check-lambda-layer-deps --all -- repo-wide audit of every Lambda in lambda-source-map.json"
      json: "--json output mode for CI/programmatic consumption"
    cost: "<2s per Lambda (parses Python imports + reads layer requirements.txt; no AWS API calls)"
    data_sources: "infra/aws/lambda/ci/lambda-source-map.json, infra/aws/lambda/<pipeline>/<lambda>/*.py, infra/aws/lambda/layers/<layer>/requirements.txt, Terraform aws_lambda_layer_version resources"
    replaces: "Manual cross-reference of Lambda imports against layer requirements.txt; AWS Lambda console trial-and-error for ModuleNotFoundError"
    note: "Shipped 2026-05-07 under ADHC_LAMBDADOC.003 (`fc4d1f18f` MVP + `59350fdc2` aws_lambda_layer_version + module-reference handling). Empirical anchor: v1.7.38 inf-pipeline regression where 3 of 4 inf-api-* Lambdas had nested-path source_map files leading to ModuleNotFoundError + inf-api-assets-v2 had layers=[pandas_layer] but layer didn't have `requests` — old zip masked it via inline-vendoring. v1.7.39 hotfix flat-zip + layer switch to pandas_pyarrow_requests_layer caught + fixed; this tool prevents the class going forward. Cataloged 2026-05-08 under ADHC_COMPIL_V4.007 doc close-out."

  comp-constants:
    command: "comp-constants [--config CONFIG] {check,index,new,list} [--file PATH] [--lane {bd,inf,multifirm}]"
    segment_scope: segment-aware
    segment_scope_note: "Lane is determined by config metadata (bd/inf/multifirm), auto-detected from constant-name prefix during scan. V4.021 ship: --lane flag added to `check` for filtering to one lane (e.g. `comp-constants check --lane inf` shows INF drifts only)."
    when: |
      - Pre-commit on any Python edit -> drift gate (wired into ds-commit-gate.sh)
      - "Did the rep_id=6 propagation actually land in all sites?" -> comp-constants check
      - After a coordinated marker-constant change (rep_id sweep, FIRM_ID rename, AUA bound bump) -> comp-constants index to refresh sites + flag missed drift
      - Pre-PRD authoring: discover undocumented marker constants -> comp-constants new
      - Lambda-bundled silver/gold copy drift detection -> check covers infra/aws/lambda/<pipeline>/**/*.py per lane
    subcommands:
      check: "comp-constants check [--file PATH] -- drift detection. Exit 1 on drift, 0 on clean. With --file, filters to sites in that file (used by pre-commit hook). Lane-aware: BD canonical compared only against BD sites, INF vs INF, multifirm vs multifirm. Semantic equivalence for sets/lists/comma-strings ({3,6,11,12} ~ [3,6,11,12] ~ '3,6,11,12')."
      index: "comp-constants index -- live AST re-scan; rewrites sites[] in comp-constants.config.yaml from current state. Preserves notes, canonical_value, lane. Stable alphabetical site ordering. Run after coordinated propagation (e.g., rep_id sweep) to refresh ground truth."
      new: "comp-constants new -- discovery surface. Lists ALL_CAPS_SNAKE constants found in scan but NOT in config. Filters utility patterns (BUFFER_*, RETRY_*, MAX_*, etc.). Operator reviews + manually adds chosen ones. Use case: PRD authoring, pre-FIRMSEP onboarding, post-incident audit."
      list: "comp-constants list -- print current config summary (debug surface). Shows lane, name, site count, drift count per constant."
    cost: "<5s full-repo (~150 Python files); <1s --file (single file). Pre-commit hook overhead acceptable."
    data_sources: "comp-constants.config.yaml (workspace root) + AST parse of Python files matching search_surfaces glob patterns"
    replaces: "Manual grep + spreadsheet drift tracking. Caught the rep_id=6 propagation gap (INFNNA Joe Brandenburg attribution incident 2026-05-07) but only AFTER it shipped to production -- this tool runs at pre-commit so it catches BEFORE."
    note: "AST-only (literal forms str/int/float/list/set/frozenset/dict + os.environ.get(name, default) defaults). MISSED forms: function calls (frozenset({...})), subscripts (PARTNER_FIRM_TAGS['inflection']), name references. JS/TS deferred to v2 (SEED-MULTIFIRM 7 constants in .mjs not scanned). Lane-aware drift filtering: same name across lanes (FIRM_ID bd='49financial' vs inf='inflection') is NOT flagged. Semantic-set normalization handles type-form equivalence."

  comp-tooltip:
    command: "comp-tooltip <subcommand>"
    segment_scope: cross-segment
    when: |
      - Tooltip migration audit: which sites use inline navy/silver/hardcoded tooltips vs <DataTooltip>
      - Before a tooltip cleanup sprint: get full inventory of drift sites
      - After a tooltip migration: verify all sites are canonical (DATATOOLTIP)
      - One-off audit tool -- not needed for routine gold/portal work
    subcommands:
      scan: "Full scan, all variants -- shows every tooltip site grouped by type"
      drift: "Only non-conforming sites (migration targets)"
      canonical: "Only sites using <DataTooltip> (post-migration)"
      migrated: "Alias for canonical"
      summary: "Counts by variant + migration progress percentage"
    cost: "<1s"
    data_sources: "portal/src/**/*.tsx"
    note: "One-off audit tool. Scans for inline navy/silver/hardcoded tooltip patterns vs <DataTooltip> canonical component. Use for tooltip migration sprints only."

  loop-quiescence:
    command: "loop-quiescence <PROJECT_CODE> [--summary]"
    segment_scope: cross-segment
    segment_scope_note: "Pass full PROJECT_CODE (e.g. ADHC_COMPIL_V4), NOT macro prefix (e.g. ADHC). Bare macro prefix returns false-positive QUIESCENT_CLEAN total=0 (V4.OPS triage #7). Tier-1 SA only."
    when: |
      - Tier-1 SA agent (CTO/COO/CVO) about to fire /loop {MACRO} expansion mode and needs to validate quiescence first
      - "Is this macro lane truly quiescent or are there active TOs I'm about to ignore?"
      - Before triggering a CTO+CVO bespoke planning thread on apparent macro quiescence (per feedback_loop_macro_expansion.md)
      - Reconciling task_order <status> claims against git log closure-keyword commits for a macro
    output: |
      JSON by default; --summary for human-readable.
      Verdicts:
        ACTIVE                       -- one or more task orders open; do NOT fire expansion; babysit instead
        QUIESCENT_WITH_DISCREPANCIES -- TOs marked closed but git log lacks closure-keyword commits (or vice versa); reconcile docs before expansion
        QUIESCENT_CLEAN              -- all TOs closed, git log corroborates; safe to fire planning-thread expansion
    cost: "<1s (stdlib only, read-only)"
    data_sources: "org/tier1_exec/<serial>/task_orders/<MACRO>.*.md, org/tier2_senior/<serial>/task_orders/<MACRO>.*.md, git log --all"
    replaces: "Manual scan of every tier-1/tier-2 agent's task_orders/ + git log --grep across the whole macro lane"
    note: "Tier-1 SA only (CTO/COO/CVO). The /loop {MACRO} expansion validate-decide-expand protocol relies on this — see auto-memory feedback_loop_macro_expansion.md (Andrew design 2026-04-28). Workflow tool, not a comp-* graph tool; lives in this catalog because it shares the situation-recognition + structured-output pattern. Status parser handles XML <status>X</status> + markdown-bold legacy forms; ACTIVE_KEYWORDS includes 'staged'. Discrepancy classification distinguishes hard signals (zero commit references) from soft signals (commits exist but no closure keyword in subject -- usually convention drift, not missing work). Drafted by 1.1.0_SA_CTO; cataloged by 1.0.0_SA_CTO under cross-CTO assist (1.1.0 is COMP-scoped, can't author general-workspace docs)."

# ============================================================================
# AGENT DECISION TREE
# ============================================================================
#
# Pick the right tool for the question:
#
#   PIPELINE (gold scripts, S3 artifacts, execution order):
#     Q: "What does script D_00 read/write?"              -> comp-pipescript io D_00
#     Q: "What feeds script D_00?"                        -> comp-pipescript feeds D_00
#     Q: "What consumes C_07 output?"                     -> comp-pipescript consumers C_07
#     Q: "What's the chain execution order?"              -> comp-pipescript chain downstream
#     Q: "Do D_00 and D_03 share inputs?"                 -> comp-pipescript overlap D_00 D_03
#     Q: "Is this script deployed to S3?"                 -> comp-pipescript deployed D_00
#     Q: "Are all gold scripts up-to-date on S3?"         -> comp-pipescript deployed
#     Q: "What portal components consume D_04 output?"    -> comp-pipescript io D_04  (see PORTAL CONSUMERS)
#     Q: "Does D_00 access a column it forgot to load?"   -> comp-pipescript io D_00  (see COLUMN GAPS)
#     Q: "What post-steps must run after this script?"    -> comp-pipescript postdeps D_00
#     Q: "Is this gold artifact output correct?"          -> comp-validate D_04 --artifact /tmp/leaderboard.json
#     Q: "Does this Lambda role have required permissions?"-> comp-iam service bd-gold-trigger
#     Q: "Are there any IAM permission gaps across all services?" -> comp-iam gaps
#     Q: "Do this Lambda's imports resolve through its layers?" -> check-lambda-layer-deps <lambda>
#     Q: "Are any Lambdas in the repo missing layer coverage?"   -> check-lambda-layer-deps --all
#
#   SERVING (CloudFront, auth, Lambda, frontend):
#     Q: "How does this data reach the browser?" -> comp-routes trace getEmployeeLeaderboard
#     Q: "What auth does this path go through?"  -> comp-routes auth-map
#     Q: "What does this component fetch?"       -> comp-routes trace PartnerAnalytics
#     Q: "Which paths are S3 vs API Gateway?"    -> comp-routes stats
#     Q: "What rewrite rules exist?"             -> comp-routes rewrites
#
#   CLIENT-SIDE DATA FLOW (inside React components):
#     Q: "What fields does this component use?"  -> comp-transform fields PartnerAnalytics
#     Q: "What transforms happen after fetch?"   -> comp-transform chains PartnerAnalytics
#     Q: "What response fields are wasted?"      -> comp-transform unused PartnerAnalytics
#     Q: "Full fetch-to-render data flow?"       -> comp-transform trace PartnerAnalytics
#
#   CROSS-LAYER (generic graph: components, endpoints, Lambdas, S3, EventBridge):
#     Q: "What depends on this component?"       -> comp-trace X --direction up
#     Q: "What breaks if I change this?"         -> comp-blast Y
#     Q: "Full data path end to end?"            -> comp-trace X --direction both
#     Q: "What did my changes affect?"           -> comp-diff
#     Q: "Did the graph change since baseline?"  -> comp-xref
#
#   FULL-STACK (page-level end-to-end audit):
#     Q: "Full audit of this page's data flow?"  -> comp-platinum page PartnerAnalytics
#     Q: "What S3 key backs this and who writes it?" -> comp-platinum page X
#     Q: "Reverse: who consumes this S3 key?"     -> comp-platinum reverse gold/artifacts/X.json
#     Q: "Audit every ADVI tab at once?"          -> comp-platinum tab-audit
#
#   CACHE (React Query key management):
#     Q: "Do components share cache keys?"         -> comp-cache collisions
#     Q: "All cache keys and their owners?"        -> comp-cache map
#
#   LOOP EXPANSION (tier-1 SA only -- CTO/COO/CVO /loop {MACRO} mode):
#     Q: "Is this macro lane truly quiescent before I fire expansion?" -> loop-quiescence MACRO --summary
#     Q: "Are TO claims reconciled with git log for this macro?"       -> loop-quiescence MACRO
#
#   RULE: comp-platinum for full page audits, comp-pipescript for pipeline,
#   comp-routes for serving, comp-transform for component internals,
#   comp-cache for query key issues, comp-trace/comp-blast for everything
#   else. Never use Explore agents for dependency/data-path questions.
#
# ============================================================================
# MANDATORY USAGE
# ============================================================================
#
# DS agents: comp-pipescript io/feeds/consumers before modifying gold scripts.
#            comp-pipescript io ALSO checks COLUMN GAPS (accessed but not loaded columns) -- zero extra work.
#            comp-pipescript deployed before every gold run (confirm runner has latest code).
#            comp-pipescript overlap when consolidating scripts OR before authoring cross-domain TOs.
#            comp-pipescript postdeps before any ad-hoc script run (check required post-steps).
#            comp-validate <script> --artifact <file> before signaling AE -- MANDATORY if script has validate config.
#            comp-platinum tab-audit for Phase 2 audits (replaces manual tracing).
# DE agents: comp-transform trace before reading component source (may save the read).
#            comp-platinum page before any component wiring changes.
#            comp-cache collisions before changing queryKeys or response types.
#            comp-routes auth-map when touching auth-sensitive paths.
#            comp-routes behaviors when debugging 4xx responses (check custom_error_response intercepts).
# RD agents: comp-platinum page on your component to see the full stack.
# DT agents: comp-diff --staged before committing. comp-routes behaviors
#            before touching CloudFront or Lambda@Edge.
#            comp-iam service <lambda-name> after adding any new boto3 call to a Lambda.
# AE agents: comp-pipescript chain before modifying dispatch.
#            comp-pipescript deployed before triggering any gold run (verify code is on S3).
#            comp-pipescript postdeps before every manual gold run (check required post-steps).
#            comp-iam gaps after any iam.tf change (verify no new permission gaps).
#            comp-blast on infrastructure resources before changes.
#            comp-shell scan <file> before committing any .sh to .tools/ or org/mcp/.
# COO: comp-platinum tab-audit + comp-blast when decomposing PRDs.
#      comp-pipescript overlap A B before creating cross-domain coordination blocks in TOs.
#      loop-quiescence <MACRO> --summary BEFORE firing /loop {MACRO} expansion (validate-decide-expand).
# CTO: comp-platinum + comp-routes + comp-pipescript for architecture design.
#      loop-quiescence <MACRO> --summary BEFORE firing /loop {MACRO} expansion (validate-decide-expand).
#
# After comp-build, run "comp-pipescript inject" to enrich the trace graph
# with pipeline edges. Without this, comp-trace cannot walk upstream
# through gold script dependencies.
#
# PATH: .tools/ is in PATH. All comp-* commands work from any directory.
