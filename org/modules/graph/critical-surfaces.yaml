# critical-surfaces.yaml — the production guardrail registry (NFRA_GRAPHS D8, §10).
#
# Named client-facing surfaces whose backend dependency subgraph is MONITORED for any break or
# unexpected change. Per-firm, severity-tiered. Mechanism: carve the subgraph -> sign a baseline ->
# (B) commit-time change-gate + (C) scheduled break/change scan + SEV-routed alarm. The risk is the
# BACKEND (firm-specific AWS/data resources feeding the tab), NOT React -> carve deep on the data chain,
# light on the frontend. Design: docs/architecture/NFRA_GRAPHS.md §10. STATUS: v0.3 (CTO carve-review 2026-06-12; v0.2 paths VERIFIED
# against the live portal submodule 2026-06-11).
#
# severity: SEV1 (must-always-be-right; block-with-ack on commit-touch; page on break)
#           SEV2 (lesser; warn on commit-touch; digest on break)
# firms: all = {49financial/bd, inflection/inf, cottonwood/cot} -- monitored independently per firm
# NOTE: portal/ is a submodule -- the component paths below are submodule-relative (portal/src/...).

surfaces:

  # ---- SEV1: must always be right ----
  - id: model_portfolios.headline
    severity: SEV1
    firms: all
    carve:
      frontend_root: "the 'Portfolio Analytics' top panel of the Model Portfolios page -- portal/src/pages/ModelPortfolios.tsx (<Panel> PanelHeader title='Portfolio Analytics', ~L941-946; the first panel after the page header)"
      backend_chain: "getAUMMetrics + getAUMTimeSeries + getAccountDistribution + getAccountDistributionByFirm + getMdpfAggregateAUATimeSeriesByFirm (portal/src/api/endpoints/aum.ts; wired at ModelPortfolios.tsx L37 import + L386-L432 useQuery roots) -> route -> Lambda (mdpf / portfolios) -> S3 -> gold. [v0.3 CTO carve-review: named the fetch roots explicitly -- 'the page-level headline fetches' was too vague for comp-xref to carve deterministically. NOTE: this SEV1 chain and the SEV2 model_portfolios.aum chain are substantially THE SAME nodes -- see monitor.severity_resolution.]"
      backend_depth: full
      frontend_depth: existence
    why: "Andrew: the 'Portfolio Analytics' panel at the top of the Model Portfolios page -- SEV1, must always be right."

  - id: model_portfolios.benchmark
    severity: SEV1
    firms: all
    carve:
      frontend_root: "the 'Benchmark Comparison' panel + BenchmarkHeatmap (performance tab) -- portal/src/components/BenchmarkHeatmap.tsx, rendered in ModelPortfolios.tsx ~L1857-1937 (activeTab=='performance')"
      backend_chain: "getModelPortfolioBenchmarks + getETFBenchmarkReturns (portal/src/api/portal-proxy.ts L806/L867) -> route -> Lambda -> S3 -> gold"
      backend_depth: full
      frontend_depth: existence
    why: "Andrew: the Benchmark tab must ALWAYS be right; any logic/resource change or break raises a flag."

  - id: advisor_intelligence
    severity: SEV1
    firms: all
    carve:
      frontend_root: "the Advisor Intelligence page (whole) -- portal/src/pages/AdvisorIntelligence/index.tsx; top panel = PartnerAnalytics (portal/src/pages/AdvisorIntelligence/_shared/components/PartnerAnalytics.tsx)"
      backend_chain: "all ADVI fetches -> route -> Lambda -> S3 platinum/gold -> gold script -> upstream (per firm; 49F=Black Diamond, inf=Orion API)"
      backend_depth: full
      frontend_depth: existence
    why: "Andrew: same severity as the Benchmark tab -- keep an alert on breaking logic on ADVI as a whole."

  # ---- SEV2: lesser ----
  - id: model_portfolios.peers
    severity: SEV2
    firms: all
    carve:
      frontend_root: "the Peers tab -- portal/src/pages/ModelPortfolios/tabs/PeersTab.tsx (ModelPortfolios.tsx ~L1960-1961, activeTab=='peers')"
      backend_chain: "getPeerPerformance (portal/src/api/portal-proxy.ts L912) -> route -> Lambda -> S3 -> gold"
      backend_depth: full
      frontend_depth: existence
    why: "Andrew: lesser severity than Benchmark, same monitoring shape."

  - id: model_portfolios.aum
    severity: SEV2
    firms: all
    carve:
      frontend_root: "the AUM/growth panels -- portal/src/components/AUMGrowthMetrics.tsx (ModelPortfolios.tsx growth tab ~L1191/L1210 + the top panel)"
      backend_chain: "getAUMMetrics + getAUMTimeSeries + getMdpfAggregateAUATimeSeriesByFirm + getAccountDistribution[ByFirm] (portal/src/api/endpoints/aum.ts) -> route -> Lambda (mdpf / portfolios) -> S3 -> gold"
      backend_depth: full
      frontend_depth: existence
    why: "Andrew: lesser severity than Benchmark, same monitoring shape."
    known_findings:
      - "getAUMMetrics resolves to 'url: (not resolved)' in comp-platinum -- a graph-unresolved fetch (day-0 break candidate to triage)."

monitor:
  severity_resolution: "a node carved into MULTIPLE surfaces takes the MAX severity of its containing surfaces (block-with-ack wins over warn). LOAD-BEARING, not theoretical: model_portfolios.headline (SEV1) and model_portfolios.aum (SEV2) share substantially the same aum.ts backend chain -- without this rule comp-surface-check behavior on those shared nodes is ambiguous. [v0.3 CTO carve-review]"
  commit_gate:
    tool: comp-surface-check   # sibling of comp-manifest-check (D6); maps changed files -> critical subgraph nodes via comp-diff
    SEV1: block-with-ack       # "this change touches the <surface> backend for firm <f> -- confirm + justify"
    SEV2: warn
  scheduled_scan:
    when: "nightly graph refresh (derive -> Nessie -> kuzu_stitch_load)"
    per: surface_x_firm
    checks:
      - "§9 break-scans (scan.wiring.dangling_fetch / scan.firm.asymmetry / scan.orphan.dead_producer) over the carved subgraph"
      - "diff current subgraph vs the SIGNED baseline (node/edge added|removed|SHA-changed)"
    alarm: "SNS/EventBridge, reuse the deployed firm_isolation_guard_triggered SEV1 pattern; SEV1 page / SEV2 digest"
    clear: "a deliberately re-signed baseline clears an EXPECTED change"
  baseline:
    method: "comp-xref --save per surface x firm at carve-time"
    provenance: "each signed baseline RECORDS the F6 branch-head marker state at sign-time (warehouse/_branch_head.main.json: nessie_commit_hash + per-table snapshot_ids) so baseline-vs-current diffs are vintage-anchored -- a diff across un-anchored graph vintages is ambiguous (PRD NFRA_GLOBGRPH v0.4.3 F6). [v0.3 CTO carve-review]"
    signed: true    # D8 DE baseline generated 2026-06-12T~1815Z by 0.4.0_DE_ClientPlatform
    baseline_generated: "2026-06-12T~1815Z"
    baseline_artifact: ".comp-graph/baseline.json"   # global graph snapshot (comp-xref --save); 2139 nodes, 2691 edges
    baseline_vintage_anchor: "F6 s3://opal-313476888478-globgrph/warehouse/_branch_head.main.json -- nessie_commit_hash=59b0a6a9a98d7d2ed03e5e8f7123f331e20cbac8063b9e8c7c6970a10f8dd3f5, graph_nodes_snapshot=2373504567134934158, graph_edges_snapshot=6719449234129434488, committed_at=2026-06-12T16:15:51Z, writer=incremental_updater (NFRA_GLOBGRPH v0.1.11/v0.1.12, certified b22320a4c). CVO P2 correction 175033Z: prior CLOUD-commit anchor was wrong -- F6 marker was live since 16:15:51Z."
    baseline_findings: "org/modules/graph/D8-findings.md"
    # NOTE: comp-xref --save saves a GLOBAL graph snapshot (no per-surface/per-firm save mode).
    # Per-surface carving is done via comp-platinum page scans (see D8-findings.md).
    # comp-platinum scan coverage gaps documented in D8-findings.md (BenchmarkHeatmap not registered;
    # PeersTab no direct fetches; getAUMTimeSeries/getMdpfAggregateAUATimeSeriesByFirm not detected).
