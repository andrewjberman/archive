#   Organization   = abstract above the tenant/firm plane; same binding event as Person.
# (The quoted "Person"/"Organization" style is an import tell from the CSE source plane -- kept byte-as-ratified.)
contextual_types: [LAMBDA, Service, Component, ReactComponent, Hook, "Person", "Organization", MS_USER, SERVICE_PRINCIPAL, STATE_MACHINE]

# --- AXIS: RELATION (C1, CSE re-layered) -- 10, owner-ratified --------------------------------------
# each abstract relation lists the concrete graph/CSE edge_types that BIND UP to it (the adapter).
relations:
  produces:      { binds_up: [WRITES, WRITES_S3, EMITS_TO, PUBLISHES_TO, NOTIFIES, LOGS_TO, DEAD_LETTERS_TO, SUBSCRIBES], note: "+ONTOLOGY2 P1 c1_frontend_adapter (additive, grounded): NOTIFIES (CW_ALARM->SNS_TOPIC, publish-to-topic like PUBLISHES_TO); LOGS_TO (LAMBDA->LOG_GROUP store); DEAD_LETTERS_TO (->SQS_QUEUE store); SUBSCRIBES (SNS_TOPIC->SQS/LAMBDA fanout delivery; SNS->LAMBDA leg is trigger-flavored -- see c1_frontend_adapter)" }
  consumes:      { binds_up: [READS, READS_S3, READS_FIELD, READS_SECRET, READS_URL, FETCHES, RENDERS], note: "+ONTOLOGY2 P1 c1_frontend_adapter (additive, grounded): RENDERS (JSXRender->Field, a render consumes field data to display; grain=field -- the 2447-edge FRONTEND mass, 62.6% of the unmapped set)" }
  derives-from:  { binds_up: [FLOWS_TO, PROP_PASSES], carries: EdgeKind(passthrough|rename|recompute_guarded), note: "D5: EdgeKind stays on flows_to. +ONTOLOGY2 P1 c1_frontend_adapter (additive, grounded): PROP_PASSES (JSXElement->Field/Prop, a prop value flows parent->child at field grain -- 1382 edges; EdgeKind not yet emitted on PROP_PASSES -> forward)" }
  depends-on:    { binds_up: [DEPENDS_ON, REQUIRES, IMPORTS, USES_LAYER, USES_SG, IN_VPC, ALIAS_TO], note: "D1: requires is concrete. +ONTOLOGY2 P1 c1_frontend_adapter (additive, grounded): USES_SG (->SECURITY_GROUP, network dep); IN_VPC (LAMBDA->SECURITY_GROUP, network placement); ALIAS_TO (ROUTE53_RECORD->LOAD_BALANCER, a name-resolution dep -- resolution-flavored, resolves-through-adjacent, kept on depends-on base)" }
  contains:      { binds_up: [CONTAINS, CONTAINS_DRILLDOWN, HAS_FIELD, HAS_PROP, HAS_KEY, HAS_ROUTE, HAS_PROPS_TYPE, CLUSTERS, HAS_PROFILE] }
  triggers:      { binds_up: [TRIGGERS, CALLS, RUNS, INVOKES], note: "a data-returning CALL also emits consumes" }
  guards:        { binds_up: [HAS_POLICY, ASSUMES, CAN_ASSUME, AUTHENTICATES, AUTHORIZES, ALLOWED, GRANTS], note: "D3: the GATING archetype, parent of the auth family. +ONTOLOGY2 P1 c1_frontend_adapter (additive, grounded): GRANTS (IAM_POLICY->SERVICE_PRINCIPAL/IAM_USER, a permission grant -- the auth family)" }
  governs:       { binds_up: [GOVERNS], note: "D3: narrow policy/authority -- SPLIT from guards" }
  denies:        { binds_up: [DENIED], note: "explicit prohibition (guard-family outcome, kept named)" }
  owns:          { binds_up: [OWNED_BY], sense: custody, note: "D6: a governed CSE OWNS primitive -- 0.4->0.5 bump LANDED (CVO 22/22 + live-parity mutant PASS; COO wave-GO @221142Z). OWNED_BY(custody, ->Person/Org actor)->OWNS (RE-POINTED FROM GOVERNS); OWNED_BY(fine->coarse containment, ->Container)->contains-inverse (no new primitive)" }

# concrete relations carried by a Role + a base relation (NOT standalone primitives) -- D4/D7
relation_composites:
  projects:         { concrete: SERVED_FROM, binds_up: derives-from, role: Gateway, also: [PROJECTS_TO, ORIGIN, USES_OAI, USES_OAC] }   # +ONTOLOGY2 P1 c1_frontend_adapter: USES_OAC (CLOUDFRONT_DISTRIBUTION->S3_BUCKET origin access -- the OAC successor to USES_OAI, same boundary/origin-access semantic)
  routes-to:        { concrete: ROUTES_TO, binds_up: derives-from, role: Router }
  resolves-through: { concrete: REFERENCES, binds_up: depends-on, role: Registry }

# graph edges that are NOT relations -- inputs to other axes
non_relation_edges:
  MONITORS:      { axis: ROLE, assigns: Observer }
  SHARES_SOURCE: { axis: VARIANCE, note: "lateral-sibling signal -- a candidate twin input, not a flow relation" }
  ENCRYPTS_WITH: { binds_up: depends-on, note: "a security dependency (KMS)" }
  IS_ENDPOINT:   { binds_up: projects, note: "boundary" }
  DECLARES: { axis: TYPE, note: "definitional (D8 axis)" }
  INSTANTIATES: { binds_up: contains, note: "component composition" }
  REFERENCES_TYPE: { axis: TYPE, note: "definitional" }
  HAS_TYPE: { axis: TYPE, note: "definitional" }

# --- AXIS: VARIANCE (cross-instance operator) -- 6, mechanism @f904033ea; WIRED+LANDED (NEXT-3 fold) -------
# LIVE: contract @1f258ee21 (rev.3), ~D wire @566ea8cd7 (self-test 10/10 incl M10 mutants), governed catalog
# variance_dimensions.yaml v2 @136999d97 exec-landed (co-land LD-0315), render EXERCISE-verified
# (bd=Canonical / inf=Twin / cot=Fork-Shadow rendered "(candidate -- advisory, pending adjudication)", NOT "(debt)").
variance:
  labels: [Canonical, Twin, Variant, Fork-Shadow, Superseded, Orphan]
  catalog: "org/modules/graph/variance_dimensions.yaml  # governed dimensions + allowed_facets + verdict phrasing; read-from-file, graceful-degrade (absent -> no clause)"
  mechanism:
    grouping_key: "(node_type, position_key)   # NOT position_key alone -- a bucket's twin is a BUCKET, not its same-named policy (empty-membership collision inverted the verdict; fix @566ea8cd7)"
    position_key: "logical identity with the declared dimension token STRIPPED (name-minus-firm: opal-data-bd -> opal-data-{firm}); dimension-stripped, NO structure. unchanged-key -> no verdict (in denominator)"
    structure_compared: "generic (motif-shape, role, edge-set); at the firm/aggregate grain NARROWED to the C2 motif-membership SET (reuses the computed membership; base-ratified narrowing). COMPARED not keyed"
    ref: "the MODAL membership-SET among PRESENT siblings (NOT a fixed instance -- a fixed ref INVERTS on a ref-instance divergence, hiding its drift). Canonical = a deterministic label-badge among modal-matchers (alpha-first). @f904033ea: 'designated OR modal' -> modal default"
    dimensions_are: "{name, values[], scope, allowed_facets[]}   # governed, read-from-file (the catalog above)"
    test: "group by (node_type, position_key); compare each present sibling's structure to the MODAL; allowed_facets scopes legitimate off-modal diffs"
    empty_modal: "SUPPRESS -> no verdict (an empty set is not a reference; never let an empty-membership node define the modal)"
    no_majority: "no unique modal (tie / all-distinct) -> flag ALL as Fork-Shadow 'no canonical majority'; NEVER silently pick a ref"
    verdicts:
      Canonical:   "a modal-matcher designated the reference (label-badge; of_names = the siblings)"
      Twin:        "present + structure == the MODAL"
      Variant:     "off-modal diff WITHIN allowed_facets  (UNREACHABLE for firm; allowed_facets=[])"
      Fork-Shadow: "off-modal diff OUTSIDE allowed_facets, OR undeclared-missing sibling  (the only DEBT-CANDIDATE verdict -- advisory, see below)"
      Superseded:  "same (position_key, dim_value); one supersedes the other"
      Orphan:      "singleton, no sibling, no consumer"
    polarity: "CLEARS designed parallels (Canonical/Twin/Variant); FLAGS only Fork-Shadow/Orphan"
    advisory: "firm verdicts are STRICTLY ADVISORY while allowed_facets=[] -- every Fork-Shadow is a CANDIDATE, never a filed finding (CVO-adjudicated). A candidate can ground out to: real-debt / graph-coverage-gap / designed-legit-difference (ground-then-populate). LIVE EXAMPLE: opal-data-cot b-io grounded to a 0.7.0 derive coverage-gap, NOT debt (trace @1fe0f5e6f)"
    render_disposition: "v2 (CTO 013249Z, advisory-CONDITIONAL): the visible Fork-Shadow suffix must match the regime's certainty+direction. advisory (allowed_facets=[]) -> DISPOSITION-NEUTRAL '(candidate -- advisory, pending adjudication)' (asserts NEITHER certainty NOR direction -- the render can't know the downstream adjudication); grounded (allowed_facets populated+cited) -> '(debt)' (confirmed). enricher branches on the flag. cot proves a candidate can be NON-debt"
    hard_invariant: "firm dimension: allowed_facets=[]; firms NEVER interchangeable (adapter denies); Twin != fungible; the operator READS firm, never authorizes a merge (Rule 13)"
    no_feedback: "structure -> verdict ONLY; NEVER reads an llm_* attribute (the membership-SET is deterministic; same discipline as the C2/C3 membership clause)"

# --- LINEAGE (C2 motif; compositional grammar, no new primitives) ----------------------------------
lineage:
  definition: "a canonical composition of Role-nodes joined by Relations"
  grain: "typed multi-hop path @ recurrence >= 50-100  (the max-signal grain; ~70-90 motifs / 98% coverage)"
  catalog: "NFRA_ONTOLOGY_CANONICAL_MOTIF_CATALOG.md @ef94dafda  (~20 named families across 4 planes)"
  a_b_detectors: "NFRA_ONTOLOGY_AB_MATERIALIZE_SPEC.md @7892f3fbc  (13 A+B detectors, materialize-first)"

# --- C3 SYSTEM naming (inherited, never invented) --------------------------------------------------
c3_naming_ladder:
  1_capability_cluster: "shared PanelCluster/named-thread -> its capability (AdvisorIntelligence/Attribution/Correlation)"
  2_pipeline_thread:    "shared Pipeline -> its thread (bd-gold/inf-gold/mdpf-gold)"
  3_resource_domain:    "shared firm/domain token -> the domain (opal-data-bd -> bd)"
  4_governed_catalog:   "where 1-3 underdetermine -> a blessed read-from-file name for the component signature"
  5_never_invented:     "no inheritable name + no catalog entry -> unnamed placeholder, counted (honest-degrade)"
  implementation_status: "HONESTY (NFRA_ONTOCLARITY naming review 2026-07-20): rungs 1-3 above are the ASPIRATIONAL target, currently UNWIRED. LIVE reality -- C3 names = anchor-type category (object-data/compute-orchestration/pipeline, via the ratified overlapping-domain-cover model); C2 names = the matching detector's shape-label (AStore/AGrant/BStruct/...). The one capability-signal implementation (NFRA_MOTIF_P2 _name_system's PanelCluster rung) is DEAD/unused AND portal-bound -- it cannot name non-portal (AWS/code) systems. Wiring target = rungs 2-3 (pipeline_thread / resource_domain, from naming conventions); the deterministic ceiling for non-portal systems is STRUCTURAL, with capability supplied by the ORTHOGONAL llm label (NFRA_ONTOLOGY_LLM_CLASSIFICATION), one-way + deterministic-name-wins. Full review + code-vs-content plan: infra/system/ontology/."
  emergence: "NFRA_SYSTEM C2->C3 union-find (>=2 connected motifs); ontology CONSUMES it, does not re-implement"

# --- TYPE axis + scope-outs (distinct from OPAL_TAXONOMY -- what a node is CALLED) ------------------
scope_outs:
  Type: definitional/taxonomy axis (D8)
  Symbol: definitional/taxonomy axis (D8)
  Concept: honest-degrade (no forced Role, counted in the denominator)
  implements_spec: definitional  # structural-conformance stays IN as Variance (D3)

