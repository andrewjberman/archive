# 11 UNMAPPED live edge types carry flow/grain but have NO ratified relation binding {RENDERS 2447,
# PROP_PASSES 1382, NOTIFIES 40, GRANTS 17, LOGS_TO 13, DEAD_LETTERS_TO 5, SUBSCRIBES 3, USES_SG 2,
# USES_OAC 1, ALIAS_TO 1, IN_VPC 1}; 9 ratified relation tokens have ZERO live instances {DEPENDS_ON,
# REQUIRES, IMPORTS, AUTHENTICATES, AUTHORIZES, ALLOWED, GOVERNS, DENIED, REFERENCES}. Binding an
# UNMAPPED edge to a relation, or retiring a ZERO-LIVE token, is a change to RATIFIED vocab -> OUT OF
# SCOPE here, routes to the ratification chain via ~Z. The rails READ these edges' grain/flow where
# present; they do NOT re-map them.
# ==================================================================================================

dynamic_rails:

  # =================================================================================================
  # HELD-OUT FENCE -- BINDING ON EVERY RAIL AUTHOR. READ BEFORE SHAPING ANY D-RAIL.
  # =================================================================================================
  held_out_fence:
    rule: "*** ADVI_PERFORMANCE AND MDPF_GLOBAL ARE THE HELD-OUT TEST SET. THEY MUST NOT SHAPE THESE RAILS. ***
      No surface of either may be used as a vocabulary example, and no contract may be authored to make a rail
      look expressive. Andrew-direct, 2026-07-29 ~2325Z, VERBATIM: 'this is setting up the framework... the real
      test will be running ADVI_PERFORMANCE MDPF_GLOBAL and others.' Relayed via 0.0.0_AB_MSTR~Z 20260729T233721Z."
    why_it_is_the_most_dangerous_item: "IF YOU SHAPE THE RAILS USING THEM, THE ONLY REAL TEST OF THIS FRAMEWORK IS
      DESTROYED AND NOTHING WILL REPORT IT. A breached held-out set looks EXACTLY like a well-fitting rail: the
      instrument's expectation would be derived from the very population it is meant to be tested against, so the
      gap reads structurally zero and the fit reads excellent. THERE IS NO DOWNSTREAM SIGNAL THAT FIRES. This is a
      silent-FALSE-CLEAN with no failure channel, and the only control is not to touch them."
    obligation_on_every_author: "PUBLISH YOUR SHAPING CORPUS -- the denominator you drew from -- so a later reader
      can verify the two held-out projects are absent. AN UNNAMED SHAPING CORPUS IS INDISTINGUISHABLE FROM A
      BREACHED ONE. This is not a courtesy; it is the only way the fence is CHECKABLE by anyone other than the
      author it binds."
    verifiable_without_breaching: "A FENCE MUST BE VERIFIABLE WITHOUT READING THE FENCED SURFACE. A fence whose
      enforcement requires the enforcer to breach it is not a fence (3.0.0_SA_CVO~Z, Amendment 1 corollary).
      Check a declared shaping corpus against a schema, never against ADVI_PERFORMANCE or MDPF_GLOBAL."
    binds_on: "the CAUSAL PATH INTO RAIL AUTHORSHIP -- not fabric, and NOT SEAT. Seat is a leaky proxy (it failed
      twice in one session); it is the cheapest administrable approximation, and where proxy and principle
      disagree, THE PRINCIPLE BINDS."
    scope_note: "the DECOMPOSITION precondition on those two projects was RELEASED 2026-07-31 (@e8c7a32fa). THAT
      IS NOT THIS FENCE. Decomposition may proceed; READING THOSE RECORDS BY VALUE TO SHAPE RAIL VOCABULARY STILL
      MAY NOT. Anyone reading 'RELEASE' as 'the fence is down' has read a subject line and not a body."
    lifted_only_by: "Andrew, or the CVO who owns the fence (3.0.0_SA_CVO~Z). NOT by a rail author, NOT by a phase
      close, and NOT by the release of an adjacent precondition."
    recorded_here_because: "WS-C2 acceptance requires the fence be stated IN THE RAIL SECTIONS THEMSELVES, so a
      future author CANNOT INNOCENTLY BREACH IT. A constraint carried only in a design document or an inbox is a
      single-carrier record whose failure mode is that nobody knows it exists -- and rail authorship is exactly
      the moment it must be visible."

  D1_value_grain:
    sits_between: [C0, C1]
    names: "the VALUE that travels an edge and the GRAIN at which it is resolved."
    seed: "derives-from already carries EdgeKind(passthrough|rename|recompute_guarded) on FLOWS_TO -- the ratified embryonic value semantic. D1 EXTENDS it with an explicit grain axis; it invents no new primitive."
    grain_axis:
      ordered: [artifact, partition, row, field]   # coarse -> fine; a COARSER answer to a FINER question is the #1 MSBEFF layer-mismatch
      artifact:  "a whole object/table/topic as a unit (S3_BUCKET, DYNAMODB_TABLE, SNS_TOPIC, SQS_QUEUE, LOG_GROUP)."
      partition: "a dated/keyed slice of an artifact (an S3 object key under a firm/date prefix; a table partition). node_type S3Key."
      row:       { forward: true, note: "a record within a partition (a DDB item, a parquet row). NOT materialized as a graph node today -- declared, unpopulated." }
      field:     "a column/attribute of a record (node_types Field, Prop)."
    edge_grain_binding:   # which LIVE edge types carry which grain, denominators printed (comp-kuzu 2026-07-23)
      field:
        FLOWS_TO:    "srcField -> dstField in props; 884/961 FLOWS_TO carry a non-null dstField (field grain)."
        READS_FIELD: "2110 live -- a consume at field grain."
        HAS_FIELD:   "4269 live -- structural field membership (the C0/C1 boundary)."
        PROP_PASSES: "1382 live -- portal prop flow at field grain (UNMAPPED as a relation; grain readable, binding is a tick-29 gap -> ratification chain)."
      artifact:
        WRITES:    "562 live -- produce at artifact grain."
        READS:     "712 live -- consume at artifact grain."
        WRITES_S3: "275 live -- produce an S3 object."
        READS_S3:  "323 live -- consume an S3 object."
      partition:
        S3Key: "232 S3Key nodes -- the live partition-grain atom (an object key). The partition SCHEME (the prefix grammar that says what the key MEANS) is forward; only the instance key is present."
    grain_node_denominators:   # the grain-bearing atoms (comp-kuzu 2026-07-23)
      field:     { Field: 4969, Prop: 359 }
      partition: { S3Key: 232 }
      artifact:  { S3_BUCKET: 39, DYNAMODB_TABLE: 37 }
    edgekind_semantic:   # the ratified value semantic, EXTENDED (not replaced) by D1
      passthrough:       "value crosses unchanged (identity); rename=false. LIVE: 337/961."
      rename:            "same value, new name/field; rename=true. LIVE: 142/961 (== the rename-flag count -- cross-checks)."
      recompute_guarded: "value re-derived under a guard/condition (props.condition carries the guard). LIVE: 482/961."
      live_form_note: "the graph SERIALIZES props.kind as 'recompute/guarded' (slash); the ratified token is 'recompute_guarded' (underscore). SAME semantic, a producer serialization form -- RECORDED, not 'fixed' (a graph-producer concern, not an ontology change; additive-only)."
    derivations_licensed:
      - "provenance / canonical-origin = D1 grain + D2 path walked BACKWARD (comp-dataflow, MSBEFF R2, becomes a QUERY over D1+D2, not a bespoke tool)."
      - "blast = D2 forward-walk AT A DECLARED GRAIN (comp-blast's script-vs-function-name confusion is a GRAIN error; D1 makes it expressible)."
    coverage_boundary:
      - "row grain is FORWARD -- DDB items + parquet rows are not graph nodes."
      - "partition SCHEME is FORWARD -- only the instance S3Key is present, not the prefix grammar that types it."
      - "PROP_PASSES (1382) + RENDERS (2447) carry field-grain flow but are UNMAPPED relations -- grain readable, relation binding is a ratified-vocab change (ratification chain), not bound here."
      - "77/961 FLOWS_TO carry no dstField -- coarser-than-field flow; grain read as artifact."

  D2_path_flow:
    sits_between: [C1, C2]
    names: "a composed DIRECTED TYPED PATH: the ordered hops a value takes, each hop's EdgeKind (D1), the transform at each, and the CADENCE the path is contracted to run at. A motif is a shape; a path is a shape WITH direction, transform, and time."
    seed: "C2 motifs are already 'typed multi-hop paths @ recurrence' (lineage.grain) -- the TOPOLOGY exists. D2 adds DIRECTION + TRANSFORM + TIME to it; it does not re-implement motif membership."
    path_is:
      hops:             "an ordered list of edges, each a (produces | consumes | derives-from) at a D1 grain."
      direction:        "NATIVE -- CloudEdge is directed (a -> b). A path is the transitive closure over produces/consumes/FLOWS_TO."
      transform_at_hop: "the hop's EdgeKind (D1.edgekind_semantic): passthrough | rename | recompute_guarded."
      cadence:          { forward_where_undeclared: true, note: "the contracted run-frequency. NOT a native edge/node property (see D3.graph_evidence -- FLOWS_TO props carry NO cadence key). SOURCED FROM D3 (a contract); forward where no contract is declared." }
    graph_evidence:
      flow_edges:    { FLOWS_TO: 961, WRITES: 562, READS: 712, WRITES_S3: 275, READS_S3: 323, EMITS_TO: 144, FETCHES: 109, PUBLISHES_TO: 36 }
      control_edges: { RUNS: 248, TRIGGERS: 145, INVOKES: 41 }   # the cadence SKELETON (who fires whom); the promised TIME is a D3 obligation
      cadence_nodes: { EVENT_RULE: 141, EVENT_SOURCE: 95, SCHEDULE: 10, STATE_MACHINE: 1 }
      motif_topology: "the RATIFIED C2 catalog: NFRA_ONTOLOGY_C2C3_CANONICAL.yaml#c2_motif_families (12 canonical agnostic families, Andrew-ratified 2026-07-30) -- the un-timed shapes D2 times. LINEAGE: seeded from the ~20-family/4-plane exploration catalog at org/tier2_senior/0.8.0_AE_CloudComp/deliverables/NFRA_ONTOLOGY_CANONICAL_MOTIF_CATALOG.md @ef94dafda (cited here as a bare filename until 2026-07-30, which resolved from nowhere; the exploration catalog PROPOSES, the ratified catalog ADMITS -- population law: canon-first-debt-subset)."
    derivations_licensed:
      - "freshness = D2 path + D3 cadence + upstream vintages + trading calendar (NEVER a wall-clock mtime -- CLAUDE.md NEVER#1). Freshness DERIVES FROM FLOW or it lies."
      - "staleness-vs-frozen = vintage advancing along the path vs the value not changing (the corpus 'FROZEN-BUT-FRESH' question, today unanswerable)."
      - "provenance = D2 walked BACKWARD at a D1 grain."
    coverage_boundary:
      - "CADENCE is not a graph primitive -- D3-sourced, forward where undeclared (BY DESIGN: freshness is downstream of flow+contract, not an artifact property)."
      - "upstream VINTAGE (when a value last actually moved) is not a graph edge property -- it is a RUN-TIME live probe of the artifact (s3api LastModified with explicit Z, or a marker), never the static graph. A D2 path types WHERE to look; the vintage read stays live."
      - "cross-plane hops (aws -> portal via FETCHES/PROJECTS_TO) often carry no typed transform (EdgeKind lives on FLOWS_TO) -- forward for cross-plane transform semantics."

  D3_contract_obligation:
    sits_between: [C2, C3]
    names: "the OBLIGATION a motif/system carries: delivery cadence, completeness-over-a-scope, canonical-source, layer-grammar. The INTENT half of INTENT_DENOMINATOR_SYNCHRONIZATION -- sourced from ABOVE (a governed contract), NEVER from the artifact being checked."
    seed: "PSTMRT's completeness axis + TRIGGER_LAYER doctrine are proto-D3 obligations; the MDPF delivery-cadence contract (T-1 by 02:00Z) is a WRITTEN D3 instance. D3 names the obligation TYPE so the intent-source is explicit."
    obligation_types:
      delivery_cadence:  "the path must deliver by a contracted time. Intent-source: the pipeline cadence contract (PRD / SCHEDULE). Violation = staleness (a D2/D3 gap), NEVER a wall-clock age."
      completeness:      "the assertion must cover a whole declared POPULATION. Intent-source: a governed registry (data/firm_registry.json). Realized by the `completeness` axis (PSTMRT P2 fold-in, below). Violation = Incomplete(missing=[...])."
      canonical_source:  "a value must originate from THE ONE blessed writer (one writer per quantity). Intent-source: the canonical-source ruling. Violation = shadow-recompute / wrong-writer."
      layer_grammar:     "a layer does ONLY its job (bronze raw / silver dedup+dtype / gold business-logic -- CLAUDE.md 17/17a). Intent-source: the layer-grammar law. Violation = a layer doing a later layer's job early (irreversible)."

    # --- LIFECYCLE AXIS (v1.8, NFRA_VELOCITY WS-C1) -----------------------------------------------
    # Built from WS-C1_LIFECYCLE_DESIGN_SPEC.md REV 3 @691860493 (1.0.0_SA_CTO~Z design+gate owner).
    # ADDITIVE: ratified C0-C3 + 14 roles + 10 relations + variance + completeness BYTE-IDENTICAL to
    # the pinned pre-touch oracle 8f8a63200 (md5 37e16648dc965424b75c14677927a636, 48217B/425 lines);
    # type_tuple NOT amended -- lifecycle_class is a D3 obligation FIELD, never a fifth tuple field
    # (a tuple field would apply to EVERY node, making UNDECLARED universal and the axis unshippable;
    # as a D3 field it binds only CONTRACTED resources, which is the correct denominator).
    #
    # THE PROBLEM: an EXISTENCE CHECK is asked a question about LIFECYCLE that existence cannot answer.
    # One "absent" symbol (404 / head-object miss / test -f false) stands for at least FOUR states:
    #   (a) never existed and never will -- flat        (b) existed, deleted -- terminal
    #   (c) absent RIGHT NOW, by design -- a TROUGH      (d) not yet occurred -- a monotonic PREFIX
    # ABSENCE IS NOT A STATE. IT IS A SET OF STATES, AND AN EXISTENCE CHECK CANNOT PARTITION IT.
    # Re-observation does NOT fix (c): sample forever and you keep landing in troughs -- sampling
    # harder makes you MORE CONFIDENT AND NO MORE CORRECT. This is why a >=2-CONFIRMED bar fails: a
    # transient key independently reads absent AND dormant AND reader-less, so two confirmed signals
    # agree and both are wrong. CONFIRMATION ACROSS CORRELATED INSTRUMENTS IS NOT INDEPENDENCE.
    contract_record:
      names: "the record a CONTRACTED resource/process carries. ONE record, TWO views -- never two schemas. CORE fixes the vocabulary; ESTATE WS-E1 declares INSTANCES against it and adds no terms."
      required: [intent_source, obligation, lifecycle_class, revalidate_by, locality]
      optional: [successor, expiry_condition, cadence, vintage_probe, describes]
      describes_first_exercise: "*** SEMANTIC READ PERFORMED 20260731 (CTO~Z) -- THE ONLY POSSIBLE DETECTOR, BECAUSE THE LINT IS STRUCTURALLY BLIND TO THIS FIELD BY DESIGN. *** VERDICT: ALL 7 landed `describes` values are LEGITIMATE SUBJECT DESCRIPTIONS. None asserts a population the obligation is complete-over. `describes` IS NOW EXERCISED 7 of 7 -- evidenced by a read, NOT by a lint pass. A LINT PASS IS ZERO EVIDENCE HERE: contract_declare_lint.py:106-108 builds its `unlintable` set from this field's own NOT-LINT-CHECKED marker and skips it, so `lint PASS therefore describes clean` joins a true statement to an unsupported one with a `therefore`. CORRECTION TO MY OWN EARLIER READING, WHICH CVO~Z RATIFIED AND WHICH WAS WRONG: I classified 5 of the 7 as `the ratified type_tuple.scope sense written in prose` and ruled the backfill was 2. I WAS MAPPING STRINGS TO ENUM VALUES BECAUSE THEY COULD MAP, NOT BECAUSE THEY ASSERTED A DENOMINATOR. `per-firm account distribution` DESCRIBES AN ARTIFACT PARTITIONED BY FIRM -- a property of the subject, visible in its own key -- it does NOT assert that the obligation covers the firm population. Those are different claims and I conflated them. THE BACKFILL IS 7, NOT 2; the landed record is correct and the ratified count was my error. WHAT STANDS UNCHANGED: no_population_scope_field above -- that prohibition rests on D3 intent_from_above, not on this classification, and is unaffected."
      no_population_scope_field: "*** A contract_record DOES NOT AND MUST NOT CARRY A POPULATION/DENOMINATOR SCOPE FIELD. THE ABSENCE IS A PROHIBITION, NOT A GAP. *** RULED 20260731 (CTO~Z) after WS-E1 tranche 1 put FIVE ratified-scope-sense values into the field then named `scope`. FORCED BY D3's OWN BINDING LAW, not a design preference: intent_denominator_binding.intent_from_above -- `a D3 obligation is sourced from a governance level ABOVE the artifact (registry / contract / law) -- NEVER the artifact's own config`. A contract_record IS the subject's own declaration; a population stated ON it would be sourced FROM the artifact, which is the denominator-is-its-own-configuration defect (INTENT_DENOMINATOR_SYNCHRONIZATION s.2) and mechanism M1 SHARED DENOMINATOR. WHERE THE POPULATION ACTUALLY COMES FROM: obligation_types.completeness names it -- `a governed registry (data/firm_registry.json)` -- reached via intent_source, i.e. FROM ABOVE. ADDING A SCOPE FIELD HERE WOULD LET EVERY SUBJECT DECLARE ITS OWN DENOMINATOR, which is the single defect D3 exists to prevent. So the five dropped values are NOT homeless content awaiting a field; they are content that does not belong on this record type, and the describes backfill is 2 records, never 7."
      fields:
        intent_source:    "WHERE the obligation comes from -- a governance level ABOVE the artifact (a governed registry / a PRD / a law / a module's consumer-anchored PURPOSE). Binds to intent_denominator_binding.intent_from_above. An intent_source naming the artifact itself IS the denominator-is-its-own-configuration defect and is REJECTED at declaration."
        obligation:       "which obligation_types entr(ies) bind. ZERO obligations is not 'no obligation' -- it is UNDECLARED."
        lifecycle_class:  "exactly one lifecycle.enum value, PRODUCER-ASSERTED."
        revalidate_by:    "REQUIRED ON EVERY DECLARATION -- see lifecycle.decay."
        describes:        "OPTIONAL free-text: WHAT THE SUBJECT IS (e.g. 'the mdpf daily convergence gate', 'a served-timeseries staleness metric'). *** EXPLICITLY NON-VOCABULARY AND NOT LINT-CHECKED. *** No token in this field resolves against the bank and no value-checking lint may be pointed at it -- A FREE-TEXT FIELD THAT IS NOT DECLARED UN-LINTABLE WILL EVENTUALLY BE LINTED, manufacturing exactly the noise the A9 sequence exists to avoid. WHY IT EXISTS (CVO~Z, ratified): its value is SEGREGATION, not convenience -- GIVING PROSE A DESIGNATED NON-VOCABULARY HOME IS WHAT KEEPS PROSE OUT OF VOCABULARY SLOTS. A schema with prose to record and exactly one field that looks like it accepts prose will put the prose there every time; WS-E1 tranche 1 put FIVE ratified-sense values AND two subject descriptions into `scope` because it had one exit. This removes the pressure, it does not merely absorb the overflow."
        locality:         "REQUIRED ON EVERY DECLARATION -- see lifecycle.locality_binding. RENAMED FROM `scope` 20260731 (CVO~Z ruling): the ratified type_tuple.scope means the DENOMINATOR BOUNDARY an assertion is complete-OVER; THIS field means WHERE THE ARTIFACT IS OBSERVABLE. Two different properties. The new name deliberately shares NO ROOT with the ratified token -- a shared root teaches a reader that `scope` is a FAMILY, which buys visibility without buying separation."
        expiry_condition: "the STATED condition under which the obligation lapses; consumed by the debt derivation. MUST BE MACHINE-EVALUABLE or it is decorative."

    lifecycle:
      field: lifecycle_class
      names: "the SHAPE of a contracted thing's life -- NOT its current phase. Names how the thing behaves over time so a detector can select the CORRECT PREDICATE instead of assuming a single polarity."
      producer_asserted: "PRODUCER-ASSERTED, NEVER OBSERVER-INFERRED. The observer cannot distinguish never-yet from dead BY LOOKING -- that is the entire problem -- so a vocabulary requiring the OBSERVER to classify has MOVED the impossible judgement, not removed it. ANY implementation inferring lifecycle_class from KEY NAMES, DIRECTORY POSITION, or OBSERVED ABSENCE has rebuilt the comp-legacywriter name-pattern stopgap with more syntax. Transience cannot be derived; it must be DECLARED."
      enum: [PERMANENT, TRANSIENT, EVENT_CREATED, DORMANT, LEGACY, RETIRED, UNDECLARED]
      token_hygiene: "SUPERSEDED and ORPHAN are DELIBERATELY ABSENT from this enum and from typed_violations. Both are ALREADY-OCCUPIED tokens on the ratified variance axis with DIFFERENT definitions (variance.labels :115; variance.Superseded is a cross-instance SIBLING verdict, variance.Orphan is 'singleton, no sibling, no consumer'). Reusing either would put two definitions on one token in ONE file -- against the settled prohibition (v1.6 @222b0c27c, Andrew-ratified; the C4 terminology_law reserving 'estate'). The lifecycle value is LEGACY (it matches the violation it produces, LEGACY-WRITER) and the typed violation is SILENT-RESIDENT (the PRD's own phrase, 'a C-SILENT resident'). Both verified ZERO occurrences at the oracle before adoption."
      # THE POLARITY TABLE -- THE DELIVERABLE, NOT DECORATION. Both polarities on every row, because a
      # detector must know WHICH PREDICATE TO RUN, not merely which rows to skip.
      polarity:
        PERMANENT:
          meaning:          "present from creation onward."
          absent_at_rest:   "FINDING (missing)"
          present_at_rest:  "healthy; with a declared cadence, healthy IFF vintage advances, else FROZEN"
          requires:         [intent_source]
          optional:         [cadence, vintage_probe]
          falsifiable_by:   "the default-LOOKING value is still a CLAIM FROM ABOVE, never the artifact's own config."
        TRANSIENT:
          meaning:          "written -> consumed -> DELETED; oscillates. The trough case."
          absent_at_rest:   "HEALTHY"
          present_at_rest:  "healthy IFF dwell < max_dwell; STRANDED beyond"
          requires:         [consumer, max_dwell, locality]
          falsifiable_by:   "you CANNOT declare TRANSIENT to silence a detector without naming a consumer that is EXERCISED (see exercised_not_resolved) and a max_dwell BOUND to that consumer's cadence (see max_dwell_binding). max_dwell creates the STRANDED finding that PROVES the declaration can still fail."
        EVENT_CREATED:
          meaning:          "absent until a triggering occurrence; monotonic + append-only thereafter. The prefix case."
          absent_at_rest:   "HEALTHY (zero occurrences so far)"
          present_at_rest:  "healthy; a NON-APPEND edit is an INTEGRITY finding"
          requires:         [creating_event, event_observable, locality]
          falsifiable_by:   "without an INDEPENDENT observable for the occurrence, 'absence == zero events' is unverifiable and BYTE-IDENTICAL to 'the writer is broken'. The observable must be independent OF THE ARTIFACT whose absence is being explained -- and independent of the INSTRUMENT that reported it (a re-run of one instrument on one device is not a second observation)."
        DORMANT:
          meaning:          "deliberately inactive and deliberately RETAINED -- a rollback lever, a wired-not-armed path, an armed fallback."
          absent_at_rest:   "FINDING (a belt that vanished)"
          present_at_rest:  "healthy"
          zero_traffic_at_rest: "HEALTHY -- and this THIRD question is unique to this row. With a declared cadence, no traffic is FROZEN (a finding); for DORMANT, NO TRAFFIC IS THE DECLARED HEALTHY STATE. A rollback lever being exercised is not a lever. So an existence-PLUS-traffic detector is STILL WRONG here; only the declaration separates belt from corpse."
          requires:         [reason, rearm_condition, annotation_cite, revalidate_by]
          intent_source:    "org/modules/graph/keep-dormant.yaml -- the CANONICAL registry (CTO arch-gated RULING 1; schema_version 1; revalidation_default_days 180) + its guard org/modules/graph/comp_debt/dormant_guard.py. THIS AXIS DOES NOT REPLACE THE REGISTRY -- IT TYPES IT."
          do_not_copy:      "DORMANT declarations CITE the registry; they NEVER copy its entries into this file. A second copy of a governed list IS the frozen-enumeration defect."
          fields_adopted_verbatim: "reason / rearm_condition / annotation_cite / revalidate_by are keep-dormant.yaml's OWN RULING-1 required fields (registry :14-17), adopted from it -- not invented here, and adopted with ONE STRENGTHENING (annotation_cite_vintage below). rearm_condition is the load-bearing one: A BELT NOBODY CAN STATE THE RE-ARM FOR IS NOT A BELT."
          annotation_cite_vintage: "annotation_cite TAKES `file:line @ <commit-ish>` -- NEVER a bare `file:line`. CLAUDE.md Rule 22: A LINE CITATION WITHOUT A VINTAGE IS NOT A CITATION, because a bare file:line resolves at EVERY vintage, to DIFFERENT code. At re-grounding time a bare pointer resolves against the CURRENT file and STILL READS VALID even if the cited line moved or its meaning inverted -- THE RE-GROUNDING CANNOT DETECT THAT IT RE-GROUNDED ON DIFFERENT CODE. Combined with revalidation_predicate below, that is the difference between a revalidation and a ritual."
          inherited_defect_disclosed: "THE REGISTRY'S SEVEN LIVE ENTRIES CARRY THE BARE FORM TODAY, and DORMANT cites that registry as intent_source -- so this axis would INHERIT the defect if it merely adopted the field as-is. It does not: the axis states the STRONGER requirement, and the registry correction is routed on its own path (keep-dormant.yaml is CTO arch-gated and is not edited from here). Disclosed rather than silently diverged, so a reader who finds the two forms disagreeing knows which is intended and why."
          why:              "the registry states the gap in the estate's own words: 'A deliberate belt and a corpse are IDENTICAL on every mechanical signal (both DISABLED, both 0-invocation, both 0-consumer). Only the INTENT ANNOTATION separates them' -- and 'a false-positive (decommission a deliberate belt) is THE named failure mode.' Its tier_c_never_sufficient signals (bare DISABLED / 0 CloudTrail / 0 invocations / no graph consumer / git-cold / un-queried) are DEBT signals, never a keep on their own."
        LEGACY:
          meaning:          "a live successor exists; the thing may still be READ."
          absent_at_rest:   "per successor"
          present_at_rest:  "healthy to READ; a WRITE is LEGACY-WRITER"
          requires:         [successor, intent_source]
          falsifiable_by:   "successor must be LIVE and EXERCISED (see exercised_not_resolved) -- that is what makes debt COMPUTABLE. An unresolvable successor is not a supersession, it is a deletion wearing the wrong label."
        RETIRED:
          meaning:          "decommissioned by ruling; absence is the correct TERMINAL state."
          absent_at_rest:   "healthy (terminal)"
          present_at_rest:  "FINDING (incomplete decommission)"
          requires:         [retirement_ruling]
          falsifiable_by:   "a retirement with NO RULING is an outage with paperwork."
        UNDECLARED:
          meaning:          "no lifecycle declared. TODAY THIS IS ESSENTIALLY THE WHOLE ESTATE."
          absent_at_rest:   "UNKNOWN, LOUD"
          present_at_rest:  "UNKNOWN, LOUD"
          requires:         []
          falsifiable_by:   "n/a -- UNDECLARED is the honest absence of a claim, never a claim itself. It NEVER silently resolves to PERMANENT."
      polarity_inversion:
        law:        "A DETECTOR CANNOT MERELY KNOW ABOUT TRANSIENT AND SKIP IT. IT MUST RUN THE OPPOSITE PREDICATE."
        arithmetic: "absence is HEALTHY on 2 of 7 rows (TRANSIENT, EVENT_CREATED) and presence is a FINDING on 2 of 7 (RETIRED; a WRITE to LEGACY). A SINGLE-POLARITY EXISTENCE DETECTOR IS WRONG ON FOUR OF SEVEN ROWS -- and wrong in the DANGEROUS direction on TRANSIENT, EVENT_CREATED and DORMANT, where it reports a healthy system as dead and PROPOSES DELETING A LIVE ONE."
        measured:   "not hypothetical: a live pipeline trigger (the gold/trigger-pending.json class) reached a kill list's TOP TIER on 'no object found'."
        skip_vs_type: "A SKIP-LIST SUPPRESSES; A TYPE INVERTS. Suppression also loses the OTHER direction -- STRANDED (presence beyond dwell) is a real defect with no name today: a transient marker written and never consumed is a DEAD PIPELINE LEG, and no current instrument can state it in either direction."
      exercised_not_resolved:
        rule: "consumer and successor must be EXERCISED, NOT MERELY RESOLVED."
        why:  "A CONSUMER THAT RESOLVES IN D2 BUT DIED SIX MONTHS AGO STILL RESOLVES. Resolution proves a name binds; it never proves the thing runs. Same structural reason WS-C7's reachability limb must EXERCISE rather than RESOLVE (the RESOLVED-BUT-CANNOT-RUN specimen: a forwarder that resolves while its target is gone)."
        chained_failure: "unfixed, this chains with an unbound max_dwell: TRANSIENT declared -> SILENT-RESIDENT gated OFF -> STRANDED bounded by a declarer-chosen scalar -> A GENUINELY DEAD TRANSIENT KEY IS INVISIBLE TO BOTH DETECTORS. Strictly WORSE than today, which at least reports it -- wrongly, but loudly."
      max_dwell_binding:
        rule: "max_dwell BINDS to the declared consumer's D3 delivery_cadence. It is NOT a free scalar chosen by the declarer."
        why:  "max_dwell was the ONLY free scalar among the required fields -- every other one (consumer, successor, creating_event, event_observable, retirement_ruling, cadence, vintage_probe, intent_source) is a POINTER the graph must resolve. ATTACK: declare TRANSIENT, name any consumer, set max_dwell absurdly large -- the falsifier is satisfied TO THE LETTER, SILENT-RESIDENT is gated off, and STRANDED never fires. A PERMANENT SILENCER WEARING A FALSIFIER. The cure is this axis's own PERMANENT rule: never the artifact's own config."
        mechanism: "D3 already carries delivery_cadence (obligation_types.delivery_cadence), so the binding exists and costs nothing. A transient key CANNOT legitimately dwell longer than the cycle that consumes it."
        landing_state: "HONEST CONSEQUENCE AT THIS LANDING: no consumer has a declared D3 cadence yet (WS-E1's registry does not exist), so every TRANSIENT declaration is currently UNRESOLVABLE and renders UNKNOWN LOUD per required_field_failure. THAT IS THE CORRECT FAILURE DIRECTION -- the axis ships LOUD rather than SILENCING -- and the marker population stays on the comp-legacywriter stopgap until cadences are declared. Stated so it is not later read as a defect."
      decay:
        rule: "revalidate_by is REQUIRED ON EVERY DECLARATION, not only DORMANT."
        why:  "A FALSIFIER VERIFIED ONCE AND NEVER AGAIN IS A CONTROL THAT CANNOT FAIL. A TRANSIENT declaration whose consumer was deleted last month is a perfectly-formed, fully-populated, PERMANENTLY-SILENCING LIE -- it still names a consumer, the field is still present, and the detector it disarms will never fire again. A falsifier-requirement without decay PASSES it."
        source: "not invented here: keep-dormant.yaml already carries revalidation_default_days 180 + a per-entry revalidate_by, on RULING-1's reasoning that 'A deliberate belt can DECAY into a true corpse... The registry is NOT write-once.' Generalized from that registry to every lifecycle value."
        stale_verdict: "past its window a declaration renders STALE -- re-confirm or promote."
        stale_never_auto_promotes: "STALE NEVER AUTO-PROMOTES TO A FINDING. That would make EXPIRY A DELETION WARRANT -- precisely the failure this axis exists to prevent. Stale is LOUD and NON-ACTIONABLE, which is the correct pairing."
        stale_semantics:
          rule: "A STALE DECLARATION SUPPRESSES THE DELETION-CLASS VERDICT AND RELEASES THE OBSERVATION."
          emits: "`ABSENT (lifecycle STALE)` / `PRESENT (lifecycle STALE)` -- honest, visible, NON-ACTIONABLE, and NOT a kill-list candidate. It degrades to exactly the undeclared_scope bound; no new concept is needed."
          why_not_keep_suppressing: "if STALE kept suppressing, SILENT-RESIDENT would stay gated off FOREVER -- THE SILENCER WOULD SURVIVE ITS OWN EXPIRY, and revalidate_by would buy only a log line beside a still-silent detector. THE DECAY CONTROL WOULD ITSELF DECAY."
          why_not_stop_suppressing: "if STALE stopped suppressing, expiry would RE-ARM A DETECTOR ON A TIMER -- the deletion-warrant-by-clock forbidden one line above."
          asymmetry: "the whole axis rests on this: AN EXPIRED DECLARATION MUST STOP CONCEALING, BUT EXPIRY MUST NEVER ITSELF BECOME EVIDENCE OF DEATH. The observation returning is what a human re-grounding needs; the verdict staying suppressed is what stops the clock from authorizing a deletion."
        revalidation_predicate:
          rule: "WHATEVER PREDICATE THE DECLARATION REQUIRED, REVALIDATION REQUIRES AT LEAST THAT. If consumer had to be EXERCISED to declare, it must be EXERCISED to revalidate."
          why:  "declared BY EXERCISE, re-confirmed BY READING means an artifact CONVERGES OVER TIME TO THE WEAKER CHECK -- every declaration eventually sits on a read-through with an exercise somewhere in its history and a fresh-looking date on top. A FRESHNESS DATE ON A WEAKER CHECK IS WORSE THAN NO DATE, because it reads as recently verified. Otherwise what has been scheduled is a re-ASSERTION, not a re-VALIDATION."
          exercise_has_no_frequency: "this is also what makes EXERCISE a STANDING PROPERTY rather than an ADMISSION TICKET. 'Exercised' once at declaration decays exactly like everything else; without this rule, EXERCISED has no frequency attached to it at all."
      locality_binding:
        enum: [global, per-device, UNKNOWN]
        enum_means:
          global:     "one shared truth across the fabric -- every device observes the same state. The DEFAULT for cloud/S3/DDB/pipeline subjects."
          per-device: "NO SHARED ORACLE -- each device has its own state, and a claim about one is not a claim about another. Worked specimen: the three override audit logs are gitignored (.gitignore:68 `*.log`), so `absent here` says nothing about the other device."
          UNKNOWN:    "locality undetermined. LOUD, never silently `global` -- assuming `global` is what makes a device-local artifact readable as a fabric fact, which is the RV-0057 F-001 class."
        enum_is_lint_checked: "YES. This field IS value-checked -- the enum above IS the oracle, and the A10.2 un-lintable marker does NOT apply here. Contrast `describes`, which is free text and explicitly NOT lint-checked. A field is one or the other and MUST SAY WHICH; `locality` was briefly a THIRD state -- ratified-as-a-field, enum-less, unmarked -- which A10.2 predicts gets linted by whoever adds the next value-check."
        enum_exercised: "*** ONE OF THREE VALUES HAS EVER BEEN USED. *** The only landed declaration set (WS-E1 tranche 1) is `global` 7 of 7. So a value-check on this enum PASSES EVERYTHING TODAY and is UNEXERCISED against `per-device` and `UNKNOWN` -- ratified by construction, not demonstrated by use, exactly as `describes` is. THE FALSIFIER EXISTS AND IS NAMED: the three gitignored override audit logs are genuine `per-device` subjects and are the standing candidate for the first real exercise."
        rule: "every declaration carries an explicit LOCALITY. A DEVICE-LOCAL ARTIFACT IS PER-DEVICE OR IT IS UNKNOWN."
        why:  "a lifecycle state that differs per device with no shared oracle cannot be declared globally. Worked specimen: the three override logs are gitignored (.gitignore:68 `*.log`) = DEVICE-LOCAL, while the archive MANIFEST is a DECLARED path list carrying NO device qualifier -- so the same key is absent on one device and possibly written on another, and NO OBSERVER ON EITHER DEVICE CAN SEE BOTH. By the event_observable rule such a declaration renders UNKNOWN, LOUD."
        renamed_not_reused: "*** THIS FIELD WAS ORIGINALLY NAMED `scope` AND THAT WAS A USE-DRIFT DEFECT, CORRECTED 20260731. *** The superseded clause read: 'scope already exists in the type_tuple vocabulary; this is a FIELD ON THE DECLARATION REUSING that vocabulary.' IT DID NOT REUSE IT. type_tuple.scope means the DENOMINATOR BOUNDARY an assertion is complete-OVER (enum: estate|tree|firm|pipeline|motif|partition-window|single-artifact); this field means WHERE AN ARTIFACT IS OBSERVABLE. Neither `per-device` nor `global` is in that enum -- the two senses were not even co-typed, and a clause CERTIFIED the identity it was breaking. Authored by 3.0.0_SA_CVO~Z (F-6), transcribed and GATED by 1.0.0_SA_CTO~Z (19/19, presence-only). FIRST LIVE SPECIMEN of the A7.3 use-drift residual -- surfaced by 0.7.0_AE_CloudOps~D reaching for the field as the bank's own pointer directed. The seam is still not reopened: type_tuple is UNAMENDED."
      required_field_failure:
        rule:        "a MISSING or UNRESOLVABLE required field renders the declaration UNKNOWN, LOUD."
        no_fallback: "it does NOT fall back to the declared value, and it does NOT fall back to PERMANENT."
        why:         "a HALF-DECLARED lifecycle is the UNFALSIFIABLE case and must be NOISIER than no declaration, not quieter. This axis SUPPRESSES findings, so an unfalsifiable declaration is a silencer that now carries the authority of a type system."
      undeclared_scope:
        NOTE_ON_THE_WORD_SCOPE: "`scope` HERE MEANS THE REACH OF THIS RULE -- how far the UNDECLARED default extends. It is NOT `type_tuple.scope` (the DENOMINATOR BOUNDARY an assertion is complete-OVER) and NOT the declaration's `locality` field. DELIBERATELY NOT RENAMED (CVO~Z ruling, 20260731). The discriminating test is: DOES THIS KEY HOLD, OR COULD IT COME TO HOLD, A VALUE FROM THE RATIFIED ENUM? YES -> rename, because the value-bearing slot is what a lint resolves and what an author fills from the wrong vocabulary. NO -> the ordinary English word is fine and renaming is OVER-APPLICATION -- applying a minimum as a maximum. This key holds PROSE ABOUT A RULE'S REACH: no enum value, nothing a lint resolves, no slot an author fills. DO NOT LET 'no shared root' BECOME A RULE AGAINST A COMMON WORD. This clause closes the reader hazard at the cost of one line."
        default:     "UNDECLARED is the default for every uncontracted resource; coverage today is ~the whole estate."
        bound:       "UNDECLARED CONSTRAINS WHAT A TOOL MAY CLAIM; IT DOES NOT DISABLE WHAT A TOOL MAY CHECK."
        permitted:   "an existence check MAY still run and MAY still report 'absent'."
        forbidden:   "it may NOT convert that observation into a LIFECYCLE VERDICT -- dead / orphan / kill-list candidate -- without a resolvable lifecycle_class."
        emit:        "the honest finding is `ABSENT (lifecycle UNDECLARED)` -- honest, actionable, cheap. It is NOT `DEAD`."
        why_bounded: "if UNDECLARED made every existing detector render UNKNOWN, the axis would be unshippable and quietly bypassed within a week. The bound is part of the design, not a concession."
        stated_is_not_enforced: "A BOUND STATED HERE AND NOT ENFORCED IN A CONSUMER IS A DESIRED-ONLY CONTROL READING AS APPLIED -- CLAUDE.md Rule 22a's exact class. Ship that and every consumer keeps emitting DEAD while this file says they must not, which makes the estate LOOK governed. See typed_violations.gate.enforcement for the consumer actually gated."
        ramp:        "announce-then-enforce. Declaration coverage is a PRINTED DENOMINATOR (N of M contracted resources carry a resolvable lifecycle_class), never a boolean -- and the GATE owns that count, never this prose."
        inherits:    "D3's standing coverage_boundary law extended one axis: the ABSENCE of a declared contract is NOT the absence of an obligation."

    lifecycle_derivations_licensed:   # definitional, never primitives
      debt:                    "expired_obligation UNION legacy_with_live_successor, where expired_obligation = a contract whose expiry_condition is TRUE and whose class is NOT RETIRED; legacy_with_live_successor = class LEGACY with an EXERCISED live successor AND a live writer still writing to it."
      stranded:                "class TRANSIENT AND observed dwell > max_dwell (itself cadence-bound). NEW -- not statable by any current instrument in EITHER direction."
      incomplete_decommission: "class RETIRED AND present at rest."
      frozen_vs_stale:         "a PERMANENT with a declared cadence: NON-ADVANCING vintage (frozen) vs a vintage advancing but behind cadence (stale)."
      rolling_is_a_derivation: "ROLLING IS A DERIVATION, NOT A CLASS. ROLLING == PERMANENT + a declared D3 cadence, with FROZEN falling straight out of its own required fields -- so promoting it to a class would violate the PRD's own law that every derived property is DEFINED AS A DERIVATION, never a primitive. FLAGGED FOR WS-C2 RE-TEST: if the walk finds a rolling artifact NOT expressible as PERMANENT+cadence, this collapse was wrong and the value returns."
      recall_scoping:          "debt recall EQUALS contract coverage, which starts near zero. Today's debt lives in the UNCONTRACTED complement, so a derived kill list and a source census cover COMPLEMENTARY populations; BOTH counts print every wave with the gap named as coverage debt."
    typed_violations:
      LEGACY_WRITER:        "a D2 WRITES edge whose target carries LEGACY with a live successor, or whose obligation is expired."
      CLOBBER:              "two writers at one (key, grain) with no adjudicating canonical_source contract."
      TRIGGER_MISSEQUENCE:  "an edge firing against the D2 topological + temporal order."
      SILENT_RESIDENT:      "a C-SILENT resident: no enumerator traverses it, no predicate reacts. (Named SILENT-RESIDENT, never ZOMBIE/ORPHAN -- see lifecycle.token_hygiene.)"
      gate:
        gated_consumers: "THE GATE MUST NAME BOTH DETECTORS -- naming only the typed violation leaves the danger reachable."
        one_silent_resident: "SILENT-RESIDENT is gated on `lifecycle_class NOT IN {TRANSIENT, EVENT_CREATED, DORMANT}`; on UNDECLARED it RENDERS UNKNOWN rather than asserting."
        two_variance_orphan: "variance.Orphan IS A GATED CONSUMER AND IS NAMED AS ONE -- but as a DEFERRED-UNTIL-IMPLEMENTED PRECONDITION, NOT as a guard on running code. **IT HAS NO EMITTER. IT IS DECLARED AT EVERY DECLARATIVE LAYER AND IMPLEMENTED AT NONE.** Source-confirmed 20260731 (0.8.0_AE_CloudComp~C found it; 1.0.0_SA_CTO~Z re-confirmed with a discriminating positive control) at org/modules/graph/debtscan/summary_corpus.py::_variance_verdict :581-582 -- `if len(present) < 2: return None  # singleton -> no firm-sibling; Orphan/Superseded deferred v1`. A SINGLETON RETURNS None: not an Orphan verdict, NO verdict. The function has exactly FOUR emission sites (:590 :597 :598 :599) and they emit only Fork-Shadow x2 / Canonical / Twin. ZERO python in the repo emits 'Orphan' as a VALUE, and `kind` is never constructed dynamically, so there is no indirect path; the positive control (the same search finds Fork-Shadow and Canonical) proves the search discriminates. THEREFORE THERE IS NO REACHABLE BYPASS TODAY."
        two_variance_orphan_precondition: "**ORPHAN MAY NOT BE IMPLEMENTED WITHOUT (1) THE LIFECYCLE EXCLUSION AND (2) AN EXPLICIT STATEMENT OF WHICH NO-CONSUMER READING IT USES, BOTH LANDING IN THE SAME CHANGE.** The gate is a PRECONDITION ON THE IMPLEMENTATION, enforceable at the moment it becomes enforceable, and honest in the interval. Whoever implements the deferred verdict INHERITS both requirements instead of discovering them. Gating a non-existent emitter would instead have produced a control that CAN NEVER FIRE and can never be shown to fire -- unfalsifiable, unmutatable, passing every review while meaning nothing: the exact object this workstream exists to prevent."
        two_variance_orphan_named_casualty: "**THE PRECONDITION HAS A NAMED FIRST CASUALTY WAITING FOR IT.** Measured 20260731 (0.8.0_AE_CloudComp~C, 1 node, exact name, BOTH directions, ALL incident edges returned, no LIMIT hit): `inf-gold-incremental-daily` -- keep-dormant entry 1, TIER A, firm=inf -- CLEARS BOTH STRUCTURAL CONJUNCTS of variance.Orphan. no-sibling: SATISFIED (singleton at (CloudNode, '{firm}-gold-incremental-daily')). no-consumer: SATISFIED under the governed reading -- its four incident edges are TRIGGERS out, DEAD_LETTERS_TO out, EMITS_TO in (a cron), CONTAINS in (AEventMotif), and ZERO are consumes-class (relations.consumes.binds_up = {READS, READS_S3, READS_FIELD, READS_SECRET, READS_URL, FETCHES, RENDERS}; denominator 7, present 0). **SO THE INSTANT SOMEONE IMPLEMENTS THE DEFERRED VERDICT, A REGISTERED TIER-A DELIBERATE BELT IS FLAGGED -- UNLESS THE EXCLUSION LANDS IN THE SAME CHANGE.** That is what makes this precondition load-bearing rather than hygienic."
        two_variance_orphan_undefined_predicate: "**AND THE READING IS UNMADE, WHICH IS THE SHARPER FINDING: 'no consumer' HAS NO IMPLEMENTED DEFINITION.** Orphan is deferred, so no code defines which edges count as consumption. The measurement therefore did NOT pick one -- it applied the rule bank's own `consumes` binding as the governed proxy and reported BOTH readings: **READING A (strict governed consumes) -> no consumer -> full Orphan candidate; READING B (any inbound dependency at all) -> it has two (EMITS_TO, CONTAINS) -> not isolated.** A matches this rule bank's own relation axis and is weighted accordingly, **but THE DIVERGENCE IS THE FINDING: whoever implements Orphan WILL pick one, nothing today tells them which, and THAT CHOICE ALONE DETERMINES WHETHER A LIVE KEEP-DORMANT BELT IS FLAGGED.** An unmade definitional choice with a live consequence, sitting unrecorded until now -- hence requirement (2) in the precondition above."
        silent_resident_divergence: "**SILENT-RESIDENT AND variance.Orphan DIVERGE ON THIS EXACT RESOURCE, which is substantive evidence the rename did real work beyond token hygiene.** `inf-gold-incremental-daily` IS CONTAINED BY `AEventMotif`, so a motif enumerator DOES traverse it -- and SILENT-RESIDENT is 'no enumerator traverses it, no predicate reacts'. **It would be a variance.Orphan candidate (under reading A) and NOT a SILENT-RESIDENT.** The two violations were therefore never interchangeable, and the F-1/F-2 renames separated two genuinely different predicates rather than merely two colliding tokens."
        two_variance_orphan_correction: "THIS ENTRY PREVIOUSLY READ 'a SEPARATE, LIVE, ALREADY-WIRED detector that FLAGS on...'. **THAT WAS FALSE, AND IT WAS GATED BY CTO~Z AND VERIFIED BY CVO~Z BEFORE ANYONE CHECKED THE EMITTER.** The chain: variance.labels LISTS Orphan; variance.catalog DEFINES it ('singleton, no sibling, no consumer'); variance.polarity ASSERTS it on the FLAGS side; variance_dimensions.yaml:80 PHRASES it. **EVERY ARTIFACT ONE WOULD CONSULT TO CHECK WHETHER IT EXISTS SAYS IT EXISTS. The single layer that would falsify it -- the emitter -- is the one nobody opened.** Three seats asserted liveness from a catalog entry: CVO~Z in finding F-2, CTO~Z relaying it into a BLOCKING ruling and a spec revision, and ~C writing this very sentence. It is the DESIRED-READ-AS-APPLIED substitution (CLAUDE.md Rule 22a), committed INSIDE the axis built to stop it, by all three of the people building it. **F-2's STRUCTURAL INSIGHT STANDS UNCHANGED -- a shared token across two axes makes a reader believe both are gated when only one is; that is what forced the LEGACY / SILENT-RESIDENT renames and those renames remain correct. ONLY ITS LIVENESS PREMISE WAS FALSE.** The danger was never 'live and unguarded'; it was 'DECLARED, UNBUILT, AND INDISTINGUISHABLE FROM LIVE AT EVERY LAYER WE CHECKED' -- which is the more dangerous shape, because it is what a careful reader confirms."
        why_the_collision_was_load_bearing: "the shared token is WHY the bypass looked covered: a builder reading 'ORPHAN is gated' reasonably believes BOTH are gated, when only the typed violation was. A GATE WHOSE NAMING CONCEALED ITS OWN BYPASS. variance carries an advisory: clause, but it names Fork-Shadow explicitly and is SILENT on Orphan while polarity: says it FLAGS Orphan -- the silence is the gap."
        danger_ranking: "the kill-list path is the SINGLE MOST DANGEROUS CONSUMER of this axis: UNGATED, IT DOES NOT MERELY MISS THE FINDING -- IT PROPOSES DELETING THE LIVE THING. A build requirement, not an optimisation."
        affected_population:
          verdict: "MEASURED 20260731 (0.8.0_AE_CloudComp~C): AT MOST 3 OF 7, with EXACTLY ONE CONFIRMED SINGLETON and a CONFIRMED FLOOR OF 0. Supersedes the prior 'UNKNOWN, bounded above by 7', which itself superseded an assumed 'all 7' -- see mechanism_error below, which is the load-bearing half."
          measured_result: "4 of 7 POSITIVELY EXCLUDED. THREE (entries 2 /mdpf/custody_source, 3 the mdpf ledger LEVER, 7 imo-find-insure-credentials) CANNOT RECEIVE A VARIANCE VERDICT AT ALL -- mdpf and imo are not values of the firm dimension [bd, cot, inf], so position_key is UNCHANGED and the governed mechanism explicitly yields 'no firm dimension -> NO VERDICT (counted, never guessed)'. They were never reachable by this detector. ONE (entry 4 bd-gold-qa-runner) HAS A LIVE SIBLING, inf-gold-qa-runner: both group to (CloudNode, '{firm}-gold-qa-runner'), and variance.Orphan requires 'singleton, NO SIBLING, no consumer' -- a two-member group fails the conjunction at the second conjunct. THE REGISTRY'S MOST CONCRETE, MOST OBVIOUSLY-DORMANT-LOOKING BELT -- AN IDLE QA-RUNNER EC2 INSTANCE -- WAS NEVER AN ORPHAN CANDIDATE. ONE CONFIRMED SINGLETON: entry 1 inf-gold-incremental-daily (a substring probe that WOULD have returned bd/cot counterparts returned none), which clears the no-sibling conjunct ONLY; its no-consumer conjunct is UNMEASURED, so it is NOT called an Orphan. TWO (entries 5, 6) returned zero rows and are recorded as NOT PRESENT UNDER THEIR REGISTRY NAME -- which is what was measured, NOT 'absent from the graph'."
          method: "the GOVERNED implementation was RUN, not hand-simulated: summary_corpus.py::_position_key -- the function the variance axis itself uses -- fed from variance_dimensions.yaml (firm values + the governed firm_aliases map). Hand-simulating the stripping rule would have been re-deriving a governed mechanism and calling the result a measurement."
          probe_denominator: "4 name substrings, 1 graph query, 7 CloudNode rows returned, CloudNode label ONLY."
          error_direction: "A MISSED SIBLING INFLATES THE SINGLETON COUNT, IT DOES NOT DEFLATE IT -- anything called SINGLETON might have a sibling under a naming convention the substring missed. So 1 is an UPPER bound on confirmed singletons and the true count could be 0. The error runs toward OVER-counting orphans, which is the SAFE direction for a kill-list gate. A measurement that states which way it fails is worth several that state only a value."
          limits: "the no-consumer conjunct is unmeasured for EVERY entry; only the CloudNode label was probed, so a sibling or candidate could sit outside it; entries 5/6's zero rows are a statement about the PROBE, not about the graph."
          mechanism_error: "THE ASSUMED 7 WAS NOT MERELY IMPRECISE -- IT WAS WRONG ABOUT THE MECHANISM. It came from reasoning 'belts are 0-consumer, therefore belts are Orphans': SATISFYING ONE CONJUNCT OF A CONJUNCTION AND TREATING IT AS THE WHOLE. variance.Orphan is singleton AND no-sibling AND no-consumer; keep-dormant establishes only the third. The claim then propagated from the design spec into a staged build, PAST EVERY MECHANICAL CHECK, because A COLLAPSED CONJUNCTION READS AS A CONFIDENT SENTENCE and no parser reads prose about a population."
          gate_sizing_rule: "THE GATE IS SIZED ON CLASS-CORRECTNESS, NEVER ON THIS COUNT. DORMANT is excluded because ABSENCE AND ZERO-TRAFFIC ARE ITS DECLARED HEALTHY STATE -- true at 7 exposed entries, at 3, at 1, and at 0. A COUNT-BASED JUSTIFICATION WOULD HAVE ROTTED THE MOMENT THE REGISTRY GREW, and would have INVERTED on this very measurement: a gate justified by '7 belts at risk' looks unnecessary once the answer is 'at most 3, possibly 0', when in fact the gate is no less right. Cite this measurement as evidence that THE DETECTOR'S REACH IS NARROWER THAN ASSUMED -- never as the reason the gate exists."
          why_unknown: "variance.Orphan is a CONJUNCTION -- 'singleton, NO SIBLING, no consumer'. keep-dormant states belts are 0-consumer, so they satisfy THAT conjunct; whether they ALSO satisfy no-sibling under variance's grouping_key (node_type, position_key) HAS NOT BEEN MEASURED BY ANYONE. Satisfying one conjunct of a conjunction is not satisfying the conjunction."
          denominator: "7 registered keep-dormant.yaml entries is the UPPER BOUND (the full registry), not the affected count."
          attempt: "attempted here against the live graph (comp-kuzu, resolving the registry's resource_ids to nodes to test the no-sibling conjunct). The FOREGROUND call exceeded 120s and was BACKGROUNDED; IT COMPLETED, exit 0, RETURNING 3 CloudNode rows -- so this is a PARTIAL measurement, NOT a failed one. RESOLVED: bd-gold-qa-runner (entry 4, ec2_instance) and inf-gold-incremental-daily (entry 1, event_rule). DID NOT RESOLVE: /mdpf/custody_source (entry 2) under a name-contains probe. Entries 3, 5, 6, 7 were NOT PROBED -- the query covered 3 of 7, and THAT is this attempt's denominator. NOTABLE: a DISTINCT CloudNode `bd-gold-qa-runner-forgotten` exists alongside entry 4 with the same node_type; IF the two group together under variance's grouping_key (node_type, position_key) then entry 4 HAS A SIBLING and is therefore not a singleton, hence never a variance.Orphan candidate at all. THAT IS NOT COMPUTED HERE -- position_key was not derived, and a shared name prefix is NOT a shared position_key. Two entries are additionally doubtful as graph nodes on separate grounds -- entry 3 is a LEDGER LEVER (a change-management record, not an AWS resource) and entry 7 a secret_version the registry itself annotates as having NO TF secret_version -- so the true affected count may be materially below 7 for reasons unrelated to the sibling test. VERDICT UNCHANGED: UNKNOWN, bounded above by 7."
          attempt_provenance: "an earlier form of this field read 'the query EXCEEDED A 120s TIMEOUT and returned nothing.' THE SECOND HALF WAS FALSE and its author (0.8.0_AE_CloudComp~C) caught and reported it BEFORE this landed, unprompted. The query had been backgrounded and COMPLETED SUCCESSFULLY WITH RESULTS; the exit code and output file were available the whole time and were not read. RECORDED HERE BECAUSE IT IS THE SAME DEFECT THIS FIELD EXISTS TO PREVENT, ONE LEVEL DOWN: item 17 exists because an unmeasured NUMBER propagated; this was a TOOL'S NON-RETURN standing in for a NULL RESULT. A backgrounded process that completes is the most recoverable kind of 'nothing' there is -- and 'the tool did not come back' is not a measurement, it is a missing observation wearing one."
          gate_consequence: "THE SILENT-RESIDENT GATE IS THEREFORE NOT SIZED AGAINST THIS POPULATION. The gate is correct independent of the count: it excludes DORMANT by CLASS, not by blast radius. The measurement is owed before anyone reasons about how much the gate BUYS."
          provenance: "an earlier form of this section asserted the affected population as 'all 7 registered entries'. That number was never measured, was withdrawn by its author, and HAD ALREADY PROPAGATED INTO THIS FILE'S STAGED BUILD before withdrawal -- past every mechanical check, because it is PROSE ABOUT A POPULATION and no parser reads that. Recorded because it is the cheapest available demonstration of why a printed denominator is a gate item and not a note."
        measured: "the structural fact, which does NOT depend on the count: a design gating only TRANSIENT + EVENT_CREATED leaves a deliberate belt (present, zero traffic, zero consumers) MATCHING THE PREDICATE -- the outcome keep-dormant.yaml names as THE named failure mode."
        enforcement: "SEE comp_legacywriter.py -- the kill-list consumer is ACTUALLY GATED (not merely bounded here), per the acceptance rule that a stated-only bound is a DESIRED control masquerading as APPLIED."
    supersedes_stopgap:
      what:         "org/modules/graph/comp_legacywriter.py `_MARKER_PATTERNS` -- 9 hardcoded name substrings matched by is_transient_marker(), demoting a hit to score 0 with signal TRANSIENT-MARKER-DO-NOT-RETIRE. Landed @d51f6b38a0 (1.0.0_SA_CTO~C, 2026-07-29)."
      why_replaced: "A PATTERN-MATCH ON KEY NAMES IS NOT A TYPE SYSTEM, and this one is itself a FROZEN ENUMERATION. It fails BOTH directions: a transient key matching no pattern is silently retirable (false NEGATIVE -- the live-trigger kill), and a DURABLE key containing '.lock' or '/state.json' is silently demoted to score 0 (false POSITIVE -- real debt made invisible). NEITHER direction is observable from its own output. It is also a SKIP-LIST, so it can never produce STRANDED."
      status:       "KEEP THE GUARD until TRANSIENT declarations cover the marker population. Retiring the stopgap the day the type lands would drop real coverage to the contracted set (near zero) while REPORTING PROGRESS -- the denominator-shrinks-and-looks-like-progress shape. THE STOPGAP RETIRES WHEN THE COVERAGE GAP IS ZERO, NOT WHEN THE TYPE EXISTS."

    intent_denominator_binding:
      intent_from_above:      "a D3 obligation is sourced from a governance level ABOVE the artifact (registry / contract / law) -- NEVER the artifact's own config (the denominator-is-its-own-configuration defect, INTENT_DENOMINATOR_SYNCHRONIZATION s.2)."
      denominator_from_below: "enumerated AT RUN TIME via a D2 path at a D1 grain -- the real instances, never a frozen or curated list, never the same artifact that supplied the intent."
      gap_is_the_finding:     "INTENT \\ DENOMINATOR, printed every run. A zero gap is a claim to be SHOWN, never assumed; an instrument that cannot compute the gap renders UNKNOWN, loudly."
    graph_evidence:
      freshness_downstream_of_flow_PROOF: "FLOWS_TO props keys are EXACTLY {condition, dstField, kind, rename, resolution, srcField, via} -- there is NO cadence, NO vintage, NO partition key on any flow edge (comp-kuzu 2026-07-23, all 961 FLOWS_TO). Therefore cadence + freshness CANNOT be edge properties; they are D3-contract-sourced or forward BY CONSTRUCTION. This is the mechanical proof of Andrew's thesis 'data freshness is a downstream function of flow rather than a separate aspect' (NFRA_ONTOLOGY2_PRD s.0)."
      declared_contracts:  "data/firm_registry.json (5 firms enabled + global pseudo); the MDPF cadence PRD; the R1R3 output contracts (comp-output-contracts.yaml, base 0.8.0). D3 is contract-sourced, read-from-file, by construction."
      graph_side_skeleton: "TRIGGERS 145 / RUNS 248 / SCHEDULE 10 give the cadence SKELETON; the promised TIME (the obligation) is NOT in the graph -- forward / contract-sourced."
    derivations_licensed:
      - "freshness = this cadence obligation + D2 path + upstream vintages + trading calendar."
      - "completeness verdict = this completeness obligation (population from the registry) vs the D1/D2-enumerated present structures (see the `completeness` axis)."
      - "debt / stranded / incomplete-decommission / frozen-vs-stale / rolling = the LIFECYCLE derivations -- see lifecycle_derivations_licensed above."
    coverage_boundary:
      - "MOST obligations are NOT in the graph -- they are declared contracts. D3 is the rail most reliant on read-from-file intent-sources; an undeclared obligation is a FORWARD element, marked LOUD."
      - "the ABSENCE of a declared contract is NOT the absence of an obligation -- it is an UNDECLARED obligation (a gap), rendered UNKNOWN, never Complete."
      - "LIFECYCLE COVERAGE AT THIS LANDING IS ZERO INSTANCES. The vocabulary is declared here; the instance population is ESTATE WS-E1's registry, which does not exist yet. Every estate resource is therefore UNDECLARED today (honest denominator 0 / all-contracted). Reading this section as though the estate were typed is the frozen-record defect applied to a rail that just landed."
      - "THIS VOCABULARY IS PROPOSED, NOT VALIDATED -- fitted to the spec's declared corpus and its real acceptance test is the WS-C2 walk against MSBEFF's 718 findings, the 210-incident INCIDENT_TAXONOMY and the DEBTLOOPS shapes. EXPECT THE ENUM TO CHANGE THERE; if it does not change at all, be suspicious of the walk."
      - "EVENT_CREATED RESTS SUBSTANTIALLY ON A SINGLE INSTRUMENT. Its specimen and the 'independent second observation' of that specimen came from the SAME instrument (audit-archive-invoker) on the SAME device against the SAME declared manifest -- a RE-RUN, not a second observation. Three agents ran it; that is three runs of ONE instrument. Discharged at WS-C2 by a specimen from a DIFFERENT instrument. Recorded because this axis's own S.1 law is that confirmation across correlated instruments is not independence -- and this is the degenerate case, one instrument."
      - "TRANSIENCE IS UNVERIFIABLE AGAINST THE GRAPH BY CONSTRUCTION -- a written-then-deleted marker is not a durable object, so no graph read and no existence probe can CONFIRM a TRANSIENT declaration. It is producer-asserted and falsifiable only via its EXERCISED consumer + cadence-bound max_dwell (the STRANDED path). A real asymmetry, not a gap to close later."
      - "THE max_dwell CADENCE BINDING IS CURRENTLY UNSATISFIABLE IN PRACTICE -- no consumer carries a declared D3 delivery_cadence yet, so every TRANSIENT declaration renders UNKNOWN LOUD today. Correct failure direction (loud, not silencing), but it means the axis ships INERT for the marker population and the comp-legacywriter stopgap remains load-bearing until WS-E1 declares cadences."
      - "EXERCISED-not-resolved IS A REQUIREMENT ON DECLARATIONS, NOT A CAPABILITY THIS FILE PROVIDES -- no exerciser exists yet. Until one does, 'EXERCISED' is enforced only by the declarer's honesty and by review, which is exactly the DESIRED-vs-APPLIED gap this axis warns about. Named so it is not read as already-mechanized."
      - "expiry_condition MACHINE-EVALUABILITY IS UNENFORCED -- the grammar REQUIRES it, no gate CHECKS it, so the debt derivation's expired_obligation limb cannot fire for an unevaluable condition. Gate candidate for WS-E1."

# --- AXIS: COMPLETENESS (cross-instance operator, orthogonal to VARIANCE) -- NFRA_PSTMRT P2 fold -----
# Separation (variance) says NEVER-MERGE; completeness says NEVER-MISSING -- orthogonal axes of the SAME
# dimension. Where variance FLAGS divergence, completeness FLAGS omission. A D3-class OBLIGATION
# (complete-over-a-scope); dynamic_rails.D3.obligation_types.completeness references it. Design:
# NFRA_PSTMRT_PRD.md s.3. Placed alongside `variance` per that PRD ("the rule bank gains a COMPLETENESS
# axis section alongside VARIANCE").
completeness:
  axis_of: firm                       # the first governed dimension; the operator generalizes to any enumerable population
  population: read-from-file          # the INTENT source, from ABOVE -- NEVER the artifact being checked (kills the s.2 tautology)
  registry: data/firm_registry.json   # the ONE firm enumeration (NFRA_PSTMRT P1). population = firms[] where enabled, filtered by the asserted scope
  semantics: mechanical               # NOT advisory-candidate (contrast variance.advisory): the reference is a GOVERNED REGISTRY, not an inferred modal. An Incomplete is a FILED finding with an owner (per TRIGGER_LAYER), not a diary entry
  verdicts:
    Complete:         "DENOMINATOR (present firm-keyed structures) covers INTENT (registry population @ scope); gap=0, SHOWN not assumed."
    Incomplete:       "missing=[...] -- INTENT \\ DENOMINATOR nonempty: a registry firm has no structure. The omission hazard (onboarding firm #N invisible; the MDPF class). FILED per TRIGGER_LAYER (owner + severity)."
    Unregistered:     "extra=[...] -- DENOMINATOR \\ INTENT nonempty: a firm-keyed structure whose firm is absent from the registry (the silent-extra half)."
    Undeclared-keyed: "a firm-keyed structure that declares NO population binding -- cannot be checked; renders UNKNOWN, LOUD, never silently Complete."
  polarity: "FLAGS omission (Incomplete) + extra (Unregistered); CLEARS Complete. ORTHOGONAL to variance polarity (which flags divergence): the two axes co-exist on the same dimension (separation AND completeness)."
  scope_binding: "population is SCOPED: firm_registry firms[] filtered by the asserted scope (scopes.pipeline for a pipeline-completeness assertion; scopes.mdpf for MDPF). The `global` pseudo is NEVER required (an aggregate channel, not a firm; separation rules never apply to it)."
  change_law: "a change touching a firm-keyed structure MUST re-assert cardinality against the registry (INTENT_DENOMINATOR_SYNCHRONIZATION s.5: re-derive BOTH directions or it is drift). This is the PSTMRT commit-time completeness gate."
  registry_binding_parity: "the P1 gate asserts variance_dimensions.yaml dimensions.firm.values[] == registry enabled pipeline-scope tree_tokens, and firm_names/firm_aliases parity vs (registry aliases UNION {firm_id}) -- the catalog's alias lists include the canonical id, the registry factors it out; normalize on (aliases UNION firm_id) or it false-flags day one (CVO~Z s.7-i1 @1b650071d)."
  seed: "PSTMRT completeness axis + TRIGGER_LAYER; the catalog's own `values: [bd, cot, inf]` was itself a hardcoded firm enumeration (the class inside the instrument) -- this axis binds it to the ONE registry instead."

# --- THE TYPING TUPLE (rail, grain, plane, scope) -- NFRA_ONTOLOGY2 P4 vocabulary -------------------
# The SINGLE canonical vocabulary a tool declaration and an agent question are BOTH typed in. base 0.8.0's
# registration invariant (comp-output-contracts.yaml + comp_output_contract.py) validates every comp-tool's
# coverage declaration AGAINST these enums -- an out-of-vocab value is a LOUD gate fail (stage-2 value-
# validation, activated at THIS section's canonization -- CTO~Z two-stage ruling 184541Z). Consumers READ
# the enums from type_tuple.<field>.enum at meta.canonical_source -- one authority, never a re-stated copy.
# Extensible ONLY by explicit promotion with a printed denominator (LAW-2). comp-which (P4) becomes a TYPE
# MATCH with an HONEST EMPTY: no tool covers (rail,grain,plane,scope) -> say so, never the nearest-scoring tool.
type_tuple:
  rail:
    enum: [C0, C1, C2, C3, D1, D2, D3]
    means: "the ontology layer/rail the assertion ANSWERS at. C0-C3 = STRUCTURE (what exists / how wired); D1-D3 = DYNAMICS (D1 value/grain, D2 path/flow, D3 contract/obligation). An assertion that cannot name its rail is answering an unknown question (INTENT_DENOMINATOR_SYNCHRONIZATION s.7.1)."
  grain:
    enum: [artifact, partition, row, field]   # coarse -> fine
    forward: [row]                            # row not in the live graph -- declared, unpopulated
    means: "the resolution of the value (dynamic_rails.D1_value_grain.grain_axis). A COARSER answer to a FINER question is the #1 MSBEFF layer-mismatch."
  plane:
    enum: [source, projection, desired, applied, live, mixed, graph-cache]
    means: "WHERE the value is observed -- the intent-vs-config axis (INTENT_DENOMINATOR_SYNCHRONIZATION s.6). source=code AST; projection/graph-cache=a vintage'd graph read (a projection, not live); desired=declared config INTENT (TF/registry); applied=the config as landed; live=the runtime plane observed now; mixed=spans planes."
    adopted_from: "base 0.8.0 comp-output-contracts.yaml @546f8c0e7 (enum taken VERBATIM -> one plane vocabulary, zero reconcile). Origin: comp-kuzu provenance header (a projection is a vintage) + comp-iam DESIRED/APPLIED (CLAUDE.md 22a)."
  scope:
    enum: [estate, tree, firm, pipeline, motif, partition-window, single-artifact]
    means: "the DENOMINATOR boundary the assertion is complete-OVER (INTENT_DENOMINATOR_SYNCHRONIZATION s.1). 'complete over FIRM' != 'complete over ESTATE'. An assertion must NAME its scope or its coverage claim is unfalsifiable. tree = a firm's whole resource tree (bd/cot/inf); partition-window = a dated slice for a freshness assertion."
  usage: "a tool DECLARES the tuple it answers at (base's contract); a question is typed in the same tuple; a mismatch (a question at D2/field/applied routed to a tool declaring D1/artifact/desired) is MACHINE-DETECTABLE, not a silent wrong answer -- the single most common failure in the 718-finding MSBEFF corpus."
  enforcement: "base 0.8.0 registration invariant, two-stage (CTO~Z ruling 184541Z): stage-1 presence-only ships now; stage-2 value-validation against these enums activates on canonization. Out-of-vocab plane/grain/scope -> LOUD gate fail, never a silent parallel term."

# --- C1 FRONTEND ADAPTER -- the tick-29 UNMAPPED-EDGE fork resolution (CTO~Z DESIGN FORK 191540Z) ----
# ~D's archetype census (@f38a386a6) is the demand signal: 11 LIVE edge types (3912 edges) carry
# flow/grain but had NO ratified relation binding, of which RENDERS 2447 + PROP_PASSES 1382 = 97.9% are
# FRONTEND flow the cloud/pipeline-sourced 10-relation axis had no verb for -- the measured root of
# MSBEFF's frontend coverage failures. THE FORK (per edge): does it binds_up to an EXISTING relation
# (ADDITIVE ADAPTER -- the 10 relation NAMES + semantics stay byte-identical, ~C's scope) or need a NEW
# relation (RATIFIED vocab -> CTO~Z ratification chain)? DETERMINATION (grounded per edge, comp-kuzu
# 2026-07-23, src->dst printed): ALL 11 MAP ADDITIVELY. ZERO need new ratified vocab. The frontend gap
# DISSOLVES into the additive rail+adapter work -- exactly because the frontend edges are consumes/
# derives-from AT FIELD GRAIN, which is precisely what D1 adds. The binds_up entries above are extended
# accordingly (authority-of-record); the LIVE classifier consumes canon-patterns.yaml, so propagating
# these mappings to that adapter is a FLAGGED downstream wiring step (P2+), NOT done here (touching
# canon-patterns.yaml would break the summary_corpus.py zero-diff acceptance).
c1_frontend_adapter:
  denominator: "11 unmapped live edge types / 3912 edges (comp-kuzu @2026-07-23T14:52Z, HEAD current)."
  verdict: "11/11 bind to an existing relation additively; 0/11 require a new ratified relation."
  determinations:
    RENDERS:         { n: 2447, grounded: "JSXRender -> Field", binds_up: consumes,     grain: field,    verdict: additive, note: "a render consumes field data to display it. NOTE: JSXRender is currently role=Sink (inbound-consumes); the outbound RENDERS edge to its Field source is the read it consumes -- the RELATION binding (consumes) holds; the role-vs-edge-direction nuance is recorded, not a blocker." }
    PROP_PASSES:     { n: 1382, grounded: "JSXElement -> Field(965)/Prop(417)", binds_up: derives-from, grain: field, verdict: additive, note: "a prop value flows parent->child at field grain -- the D1/D2 value-flow semantic. EdgeKind not yet emitted on PROP_PASSES -> forward (a producer step, not an ontology gap)." }
    NOTIFIES:        { n: 40, grounded: "CW_ALARM -> SNS_TOPIC", binds_up: produces,   verdict: additive, note: "an alarm publishes a notification to a topic -- same shape as PUBLISHES_TO/EMITS_TO." }
    GRANTS:          { n: 17, grounded: "IAM_POLICY -> SERVICE_PRINCIPAL(16)/IAM_USER(1)", binds_up: guards, verdict: additive, note: "a permission grant -- the auth/guard family." }
    LOGS_TO:         { n: 13, grounded: "LAMBDA -> LOG_GROUP", binds_up: produces,     verdict: additive, note: "writes log data to a LOG_GROUP store." }
    DEAD_LETTERS_TO: { n: 5,  grounded: "EVENT_RULE->SQS_QUEUE(4)/SQS_QUEUE->SQS_QUEUE(1)", binds_up: produces, verdict: additive, note: "emits failed messages to a DLQ store. (routes-to was considered; DLQ is a failure sink, not predicate-routing -> produces.)" }
    SUBSCRIBES:      { n: 3,  grounded: "SNS_TOPIC->SQS_QUEUE(2)/SNS_TOPIC->LAMBDA(1)", binds_up: produces, verdict: additive, note: "topic fanout DELIVERY to a subscriber. The SNS->LAMBDA leg is trigger-flavored (an invocation); bound to produces (delivery) with the trigger nuance recorded -- a candidate future split if invocation-vs-delivery must be distinguished." }
    USES_SG:         { n: 2,  grounded: "VPC_ENDPOINT/LOAD_BALANCER -> SECURITY_GROUP", binds_up: depends-on, verdict: additive, note: "a network security dependency -- same as ENCRYPTS_WITH->depends-on." }
    USES_OAC:        { n: 1,  grounded: "CLOUDFRONT_DISTRIBUTION -> S3_BUCKET", binds_up: projects, verdict: additive, note: "origin-access-control, the OAC successor to USES_OAI (already under projects.also) -- same boundary/origin-access semantic." }
    ALIAS_TO:        { n: 1,  grounded: "ROUTE53_RECORD -> LOAD_BALANCER", binds_up: depends-on, verdict: additive, note: "a DNS name-resolution to a target. resolution-flavored (resolves-through-adjacent, role Registry); kept on the depends-on base additively -- a resolves-through composite promotion is a candidate if DNS resolution warrants the Registry role." }
    IN_VPC:          { n: 1,  grounded: "LAMBDA -> SECURITY_GROUP", binds_up: depends-on, verdict: additive, note: "network placement dependency (the lambda's VPC attachment via its SG)." }
  zero_live_direction2: "the 9 ZERO-LIVE ratified tokens {DEPENDS_ON, REQUIRES, IMPORTS, AUTHENTICATES, AUTHORIZES, ALLOWED, GOVERNS, DENIED, REFERENCES} are a SEPARATE fork (not this adapter): per ~D's census, the auth family (ALLOWED/AUTHENTICATES/AUTHORIZES/DENIED/GOVERNS) is likely a PLANE-VISIBILITY gap (CSE/trace plane -- fix = a stated-intent plane annotation, not content), while DEPENDS_ON/REQUIRES/IMPORTS = the code-import dependency plane genuinely ABSENT from the graph (forward). Neither is retired here (retiring ratified vocab -> ratification chain)."
  routed_to_gate: "this determination table is part of the P1 arch-gate package to CTO~Z (per DESIGN FORK 191540Z). No ratified-vocab candidate raised -- all additive."


