# =============================================================================
# NODE / EDGE SCHEMA (AE-agreed)
# =============================================================================
schema:
  nodes:
    - IAM_ROLE          # role_name, role_arn, tf_managed, owner_pipeline, statement_count, overperm_flags
    - IAM_POLICY        # managed (ARN) | inline (name); attached-to role
    - INSTANCE_PROFILE  # name; wraps one IAM_ROLE
    - EC2_INSTANCE      # instance_id, name, instance_type, instance_profile, imdsv2_enforced, ebs_encrypted, public_ip, owner_pipeline, tf_managed
  edges:
    - "EC2_INSTANCE -[HAS_PROFILE]-> INSTANCE_PROFILE"
    - "INSTANCE_PROFILE -[ASSUMES]-> IAM_ROLE"
    - "IAM_ROLE -[HAS_POLICY]-> IAM_POLICY"
    - "IAM_POLICY -[GRANTS]-> {resource}"      # S3/Dynamo/Secrets/KMS/ECR/* — the grant set
    - "{LAMBDA|IAM_ROLE} -[STARTS]-> EC2_INSTANCE"   # compute-lifecycle-control family (CTO-ruled in S3-v1.5 D4); ec2:StartInstances
  drift_classes: [DECLARED, DECLARED-no-LIVE, LIVE-no-DECLARED, NO-PROVENANCE]

