    - EC2_INSTANCE      # instance_id, name, instance_type, instance_profile, imdsv2_enforced, ebs_encrypted, public_ip, owner_pipeline, tf_managed
  edges:
    - "EC2_INSTANCE -[HAS_PROFILE]-> INSTANCE_PROFILE"
    - "INSTANCE_PROFILE -[ASSUMES]-> IAM_ROLE"
    - "IAM_ROLE -[HAS_POLICY]-> IAM_POLICY"
    - "IAM_POLICY -[GRANTS]-> {resource}"      # S3/Dynamo/Secrets/KMS/ECR/* — the grant set
