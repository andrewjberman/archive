# =============================================================================
# SCHEMA — aligned to CTO canonical §3.3 (one vocabulary; oracle + compiler never diverge)
# =============================================================================
schema:
  node_EVENT_RULE_props: [rule_name, arn, event_pattern, schedule_expression, state, event_bus, tf_managed, provenance, owner_pipeline]   # §3.3 exact
  node_EVENT_SOURCE_props: [source_kind, service_or_api, detail_type, provenance]   # CTO v0.2 0fc6f95d3; source_kind enum {AWS_SERVICE|CLOUDTRAIL_API|CUSTOM|SCHEDULED}
  edges:
    - "EVENT_RULE -[TRIGGERS]-> {LAMBDA|EC2_INSTANCE|SNS_TOPIC|SQS_QUEUE|STEP_FN}"   # §3.3; multiple targets = multiple TRIGGERS edges
    - "{S3_BUCKET|EC2_INSTANCE|...resource} -[EMITS_TO]-> EVENT_RULE"                # RESOURCE-BOUND: pattern pins a concrete id -> that resource node is the source. Pairwise fan-out, source out-degree (D4).
    - "EVENT_SOURCE -[EMITS_TO]-> EVENT_RULE"                                         # SERVICE/API-SCOPED + SCHEDULED: typed EVENT_SOURCE node is the origin (CTO ruling)
    - "{LAMBDA} -[STARTS]-> EC2_INSTANCE"                                             # §1.2/§3.3 compute-lifecycle-control (D4 STARTS; ec2:StartInstances)
  origin_totality: "EVERY rule has exactly one typed EMITS_TO origin (CTO ruling): resource-bound -> the resource node; service/API -> EVENT_SOURCE{AWS_SERVICE|CLOUDTRAIL_API|CUSTOM}; cron -> EVENT_SOURCE{SCHEDULED, schedule_expression}. No untyped/no-edge case -> 0-untyped gate trivially total. Determination is deterministic from event_pattern."

