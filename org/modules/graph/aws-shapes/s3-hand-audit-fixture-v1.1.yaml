event_rules:
- event_rule_id: inf-silver-chain-rule
  source_bucket: opal-data-inf
  event_pattern:
    source:
    - aws.s3
    detail_type:
    - Object Created
    detail:
      bucket.name:
      - opal-data-inf
      object.key:
      - prefix: bronze/orion-api/
      - suffix: _BRONZE_COMPLETE.json
  tf_resource: inf-pipeline/inf-silver-chain.tf
  tf_managed: true
  target_lambda: inf-silver-chain
  notes: AE live-AWS cross-check verified the rule ENABLED + pattern matches TF (2026-06-05).
- event_rule_id: inf-assets-trigger-bronze-complete
  source_bucket: opal-data-inf
  event_pattern:
    source:
    - aws.s3
    detail_type:
    - Object Created
    detail:
      bucket.name:
      - opal-data-inf
      object.key:
      - prefix: bronze/orion-api/
      - suffix: _BRONZE_COMPLETE.json
  tf_managed: true
  target_lambda: inf-assets-trigger
  downstream_ec2_start: 'inf-assets-trigger (LAMBDA) -[STARTS]-> EC2 i-0ed5afded2ebd4ed4 (inf-gold-layer-runner) via ec2:StartInstances, for assets_v2 silver. STARTS = new first-class compute-lifecycle-control
    edge family (CTO-ruled): distinct from TRIGGERS (event-source-driven), IAM-gated like the Lambda->S3 data edges. Folds into the EC2 sub-compiler taxonomy.'
  cto_ruling: 'D4 RULED (CTO 133316Z): EventBridge S3-event routing is inherently many-to-many — every enabled rule whose pattern matches fires independently, so two rules on the same _BRONZE_COMPLETE.json
    pattern is the BASELINE semantic, not an anomaly. Model as TWO PAIRWISE EMITS_TO edges (opal-data-inf out-degree 2), NOT one multi-target edge — fan-out is the source node''s out-degree, which makes
    comp-blast surface BOTH rules+Lambdas automatically. Pattern-specificity + enabled + provenance live on each EVENT_RULE node, EMITS_TO stays generic (the S3->EventBridge bridge). VALIDATES the GAP-7
    first-class-node decision (a property-on-direct-edge model could not express two rules matching one pattern).'
  notes: 'Node factual + fully resolved (v1.5): ENABLED + TF-DECLARED + 3-edge chain CTO-ruled. Full D4 chain = EMITS_TO -> TRIGGERS -> STARTS (3 edges, all declared=true, no drift).'
