    effect: "Allow"
    principals:
      - "cloudfront.amazonaws.com (OAC: EVTSA9VEHNZVH SourceArn condition)"
      - "arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity E139998VWH0PD"
    actions: ["s3:GetObject"]
    conditions:
      - "AllowCloudFrontOACReadPlatinum: SourceArn = EVTSA9VEHNZVH; resource = platinum/*"
      - "AllowScopedAdvisorOAI: OAI E139998VWH0PD; resource = /*"
    provenance: {source: "tf"}
    grants_iam_principals:
      - "IAM_PRINCIPAL:cloudfront-oac-EVTSA9VEHNZVH"
      - "IAM_PRINCIPAL:cloudfront-oai-E139998VWH0PD"

