# =============================================================================
# EVENT_RULE NODES (S3_BUCKET -[EMITS_TO]-> EVENT_RULE -[TRIGGERS]-> LAMBDA)
# =============================================================================
#
# CTO GAP-7 disposition (204113Z): EventBridge-routed triggers use a SEPARATE EVENT_RULE node.
# Edge model: S3_BUCKET -[EMITS_TO]-> EVENT_RULE -[TRIGGERS]-> LAMBDA
# (distinct from direct S3 bucket notification: S3_BUCKET -[TRIGGERS]-> LAMBDA)

event_rules:

  - event_rule_id: "inf-silver-chain-rule"
    source_bucket: "opal-data-inf"
    event_pattern:
      source: ["aws.s3"]
      detail_type: ["Object Created"]
      detail:
        bucket.name: ["opal-data-inf"]
        object.key: [{prefix: "bronze/orion-api/"}, {suffix: "_BRONZE_COMPLETE.json"}]
    tf_resource: "inf-pipeline/inf-silver-chain.tf"
    tf_managed: true
    target_lambda: "inf-silver-chain"
    notes: "AE live-AWS cross-check verified the rule ENABLED + pattern matches TF (2026-06-05)."
    # Edges:
    #   opal-data-inf -[EMITS_TO]-> EVENT_RULE:inf-silver-chain-rule
    #   EVENT_RULE:inf-silver-chain-rule -[TRIGGERS]-> LAMBDA:inf-silver-chain

  - event_rule_id: "inf-assets-trigger-bronze-complete"   # D4 (v1.2): AE-found 2nd ENABLED rule on the same pattern
    source_bucket: "opal-data-inf"
    event_pattern:
      source: ["aws.s3"]
      detail_type: ["Object Created"]
      detail:
        bucket.name: ["opal-data-inf"]
        object.key: [{prefix: "bronze/orion-api/"}, {suffix: "_BRONZE_COMPLETE.json"}]
    tf_managed: "UNKNOWN — provenance LIVE-no-DECLARED pending AE TF re-pull (CTO 133316Z: the EMITS_TO edge carries declared-vs-live status like any other)"
    target_lambda: "inf-assets-trigger (per rule name; AE to confirm target on re-pull)"
    cto_ruling: "D4 RULED (CTO 133316Z): EventBridge S3-event routing is inherently many-to-many — every enabled rule whose pattern matches fires independently, so two rules on the same _BRONZE_COMPLETE.json pattern is the BASELINE semantic, not an anomaly. Model as TWO PAIRWISE EMITS_TO edges (opal-data-inf out-degree 2), NOT one multi-target edge — fan-out is the source node's out-degree, which makes comp-blast surface BOTH rules+Lambdas automatically. Pattern-specificity + enabled + provenance live on each EVENT_RULE node, EMITS_TO stays generic (the S3->EventBridge bridge). VALIDATES the GAP-7 first-class-node decision (a property-on-direct-edge model could not express two rules matching one pattern)."
    notes: "Node factual (AE live-confirmed ENABLED). Edge model CTO-RULED (pairwise EMITS_TO); TF-provenance pending AE re-pull."
    # Edges (CTO-ruled 133316Z — pairwise, source out-degree 2):
    #   opal-data-inf -[EMITS_TO]-> EVENT_RULE:inf-assets-trigger-bronze-complete
    #   EVENT_RULE:inf-assets-trigger-bronze-complete -[TRIGGERS]-> LAMBDA:inf-assets-trigger

