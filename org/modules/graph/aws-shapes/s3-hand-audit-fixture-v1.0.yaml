# =============================================================================
# S3_BUCKET_POLICY NODES (separate graph nodes per CTO Q2)
# =============================================================================
#
# Edges:
#   S3_BUCKET -[HAS_POLICY]-> S3_BUCKET_POLICY
#   S3_BUCKET_POLICY -[GRANTS]-> IAM_PRINCIPAL  (stubs — Phase 1 IAM co-class resolves)
#
# DRIFT-EDGE DESIGN REQUIREMENT (CTO 133316Z, v1.3 — hard spec for the S3 sub-compiler):
#   The DECLARED<->LIVE drift edge on an S3_BUCKET_POLICY node MUST assert FULL-NORMALIZED-
#   STATEMENT-SET EQUALITY (a set-diff over every statement: OAI, OAC, cross-account, deny,
#   condition blocks) — NOT a single-principal presence predicate. The current portal-auth
#   read-only data.aws_s3_bucket_policy OAI-presence assertion is a PARTIAL PROXY: it cannot
#   see OAC statements (D3) so an OAC grant console-added/removed is invisible to `terraform
#   plan` = LIVE-no-DECLARED biting the catch-mechanism itself. Presence-of-X cannot detect
#   removal-of-Y; only full-set equality catches add/remove/mutate across all statement classes.
#   Each policy node below therefore carries the FULL `statements:` set as the certified oracle
#   baseline for that set-diff.

s3_bucket_policies:

  - policy_id: "opal-analytics-dashboard-policy"
    bucket_name: "opal-analytics-dashboard"
    tf_managed: true
    tf_resource: "analytics-dashboard/cloudfront.tf: aws_s3_bucket_policy.dashboard"
    effect: "Allow"
    principals: ["cloudfront.amazonaws.com (OAC)"]
    actions: ["s3:GetObject"]
    conditions: ["AWS:SourceArn = CF distribution ARN"]
    provenance: {source: "tf"}
    grants_iam_principals: ["IAM_PRINCIPAL:cloudfront-oac-ANALYTICS-DASHBOARD"]

  - policy_id: "opal-data-demo-policy"
