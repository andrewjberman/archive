# Seeded by 2.0.0_SA_COO 2026-07-22 (WSE_COTMDL WS-4 unblock).
# Consumed by comp-constants (`comp-constants check --lane cot`) -- the `cot` lane was ALREADY a
# recognised value in the tool's own usage string (`check [--lane bd|inf|cot|multifirm]`); only the
# seed file was missing. This is the registry catching up to a real fourth firm, not a new concept.
# Scope: Cottonwood model-portfolio tree -- data/assets/scripts/gold/ (cottonwood slice producers),
#        blackdiamond/cottonwood/** on s3://opal-data-assets (the OPAL_ASSETS consolidated taxonomy).
#
# WHY THIS FILE EXISTS (the finding, not just the fix): `.tools/commit-gate.sh` fail-closed on
# 0.4.0_DE_ClientPlatform's WS-4 producer with
#     build_cottonwood_mdpf_slice.py:67 :: FIRM_ID actual 'cottonwood' canonical '49financial'
#     build_cottonwood_mdpf_slice.py:67 :: FIRM_ID actual 'cottonwood' canonical 'inflection'
# i.e. THE ESTATE DID NOT KNOW COTTONWOOD EXISTS. DE could have cleared it in ten seconds by renaming
# his constant to COTTONWOOD_FIRM_ID and REFUSED, on the grounds that the constant means exactly what
# the registry tracks ("which firm does this producer serve"), so renaming would not resolve the drift
# -- it would HIDE it from the instrument built to catch it. That refusal is why this file is a
# registry entry rather than an undetected divergence. It will recur for anything else firm-scoped.
#
# FIRM SEPARATION (NEVER#2 / Rule 13) IS NOT WEAKENED BY THIS FILE. Declaring a `cot` lane records
# that Cottonwood is a DISTINCT firm with its OWN canonical identifier. It creates no cross-firm
# reference: no bd or inf canonical value is touched, and the cot sites read only
# opal-data-assets/blackdiamond/cottonwood/** (CTO condition (i), 2026-07-22 -- never opal-data-cot,
# never opal-data-bd).
#
# ############################################################################################
# ## !! THIS FILE DOES **NOT** CLEAR THE COMMIT GATE. VERIFIED, NOT ASSUMED. !!
# ##
# ## After landing this seed I ran the check rather than declaring victory:
# ##   comp-constants check --file data/assets/scripts/gold/build_cottonwood_mdpf_slice.py
# ##   -> DRIFT: 2 site(s) diverge  (actual 'cottonwood' vs canonical '49financial' AND 'inflection')
# ## STILL BLOCKED. The seed is correct and worth having, but it is NOT the unblock.
# ##
# ## MECHANISM (why a lane seed cannot fix this): comp-constants checks any file defining a
# ## REGISTERED CONSTANT NAME against EVERY lane's canonical value for that name. It has NO
# ## per-file lane scoping -- declaring this file as a `cot` site does not exempt it from the bd
# ## and inf canonicals. So `FIRM_ID` now has THREE canonicals and any single file necessarily
# ## "drifts" from the two it is not.
# ## => A GENUINELY NEW FIRM CANNOT BE REPRESENTED IN THIS REGISTRY WITHOUT A TOOL CHANGE
# ##    (file->lane resolution), and this will recur for EVERY firm-scoped constant added.
# ##    That is an architecture item for CTO, not something to paper over.
# ##
# ## DO NOT "FIX" THIS BY RENAMING THE CONSTANT (e.g. COTTONWOOD_FIRM_ID). DE was offered exactly
# ## that ten-second escape and refused it: the constant means what the registry tracks, so a
# ## rename would not resolve the drift -- it would HIDE it from the one instrument built to catch
# ## it. A gate dodged to make a deadline is the failure mode, not the fix.
# ##
# ## RELATED, AND IT SHOWS THIS IS A KNOWN UNLANDED SEQUENCE RATHER THAN A NOVEL PROBLEM:
# ## comp-constants-seed-multifirm.yaml already carries Cottonwood in FIRM_ALLOWED_PATHS and
# ## FIRM_EMAIL_DOMAINS (portal side, "pre-populated for Cottonwood onboarding readiness") while
# ## explicitly noting "Cottonwood NOT yet present" in FIRM_CONFIG / FIRM_BUCKET_MAP, both tagged
# ## **pre-FIRMSEP.10**. So firm onboarding has a designated phase and Cottonwood is mid-way
# ## through it -- the data-lane FIRM_ID is simply the part that has not landed.
# ############################################################################################
#
# SEPARATE FINDING SURFACED WHILE VERIFYING THIS (routed to CTO, recorded here so it is not lost):
# `comp-constants check --lane cot` REFUSES with
#   "SOVEREIGN-HELD -- would ast-parse sovereign-held search_surface(s): bd:data/black_diamond/scripts/**/*.py"
# That hold is the 2026-07-09 bd/49F prohibition, which Andrew LIFTED COMPLETELY on 2026-07-14
# ("take the sovereign block off completely, that is no excuse to not verify the work").
# **A RETRACTED SOVEREIGN PROHIBITION IS STILL ENFORCING INSIDE A LIVE TOOL, 8 DAYS LATER** --
# the retraction-propagates-to-every-enforcing-copy class. It degrades the tool (whole-lane scans
# refuse) and it is not fixed by noticing it in a log.
lane: cot
constants:
  - name: FIRM_ID
    type: str
    canonical_value: "'cottonwood'"
    sites:
      - file: data/assets/scripts/gold/build_cottonwood_mdpf_slice.py
        line: 67
        value: "'cottonwood'"
        comment: "FIRM_ID = 'cottonwood'  # WS-4 Cottonwood MDPF slice producer (WSE_COTMDL)"
    notes: >
      Cottonwood's firm identifier, as used in the MDPF per-firm slice key
      (gold/mdpf_revamp/cottonwood/) and in the by_model union that composes the Global view.
      ONE site at seeding time -- this is a NEW firm entering MDPF as its fourth leg, not a
      pre-existing constant being catalogued, so a single site is the correct and complete
      denominator today rather than a coverage gap. Expect it to grow as WS-4/WS-5 land the
      converter and publisher legs; add sites here rather than letting a second literal drift in.
      Sister-constant note: bd and inf both carry a FIRM_NAME alongside FIRM_ID. Cottonwood has no
      FIRM_NAME constant yet -- the display name currently rides the artifact's partner_name field
      rather than a module constant. NOT seeded here because it does not exist as a constant; do not
      add one speculatively (a registry entry for a constant nobody defines is a false canonical).
