# comp-aws -- agent usage guide (NFRA_COMPAWS cloud compiler)
# The deterministic, typed graph of the AWS cloud (live-AWS reconciled vs terraform-state).
# In PATH at .tools/comp-aws. Read-only AWS (boto3 in-process). Design: docs/architecture/NFRA_GRAPH_ARCHITECTURE.md
tool: comp-aws
source: org/modules/graph/comp_aws_cli.py
when_to_use: >
  Any question about what exists in the cloud, who-can-reach-what (blast radius),
  IaC drift (live vs terraform-state), or to snapshot/diff the cloud over time.
  Deterministic + brittleness-safe -- prefer it over ad-hoc aws-cli spelunking.

commands:
  - cmd: comp-aws derive [--class C] [--out FILE]
    does: >
      Build the full typed graph (17 node classes + edges + drift_class) by reconciling
      live-AWS with the terraform-state union. --class limits to one class; --out writes JSON.
    use_when: You need the whole graph, or one class's nodes/edges/provenance.
    output: JSON of classes_data + edges + meta; stdout prints per-class + edge-type counts.

  - cmd: comp-aws classes
    does: List the supported resource classes + their terraform types.
    use_when: Quick reference for what the compiler covers.

  - cmd: comp-aws metrics [--graph FILE]
    does: >
      Key summary numbers: per-class + drift-class + edge-type counts, untyped count
      (must be 0), and security findings (overperm roles, IMDSv2-optional EC2,
      unencrypted SNS, unmanaged secrets, LIVE-no-DECLARED total).
    use_when: The daily posture/alarm surface, or a one-shot security tally.
    output: JSON metrics block. --graph reads a snapshot JSON; omit to derive live.

  - cmd: comp-aws diff PRIOR CURRENT
    does: >
      Diff two graph JSONs: nodes/edges ADDED/REMOVED/MODIFIED + drift-class transitions
      + per-class count and security-finding deltas (the graph_changes audit timeline).
    use_when: Incident forensics or change review -- what changed between two snapshots.
    output: JSON of nodes_added/removed/modified, edge counts, and deltas.

  - cmd: comp-aws dual-managed
    does: >
      Flag ARNs managed in more than one terraform root-module state (MULTI_STATE_MANAGED --
      the over-declared mirror of LIVE-no-DECLARED; an apply-conflict footgun).
    use_when: Config-integrity audit; before touching a resource you suspect is dual-owned.
    output: count + each arn with its owning modules.

  - cmd: comp-aws snapshot [--stamp TS] [--no-s3]
    does: >
      Full derive then gzip tarball then archive to s3://opal-313476888478-globgrph/snapshots/
      {date}/graph-{stamp}.tar.gz + latest.txt pointer (the black-box recorder). --no-s3 = local only.
    use_when: Record a point-in-time cloud shape (the versioned-store + Kuzu feed).
    output: local tar.gz path + the S3 archive key.

  - cmd: comp-aws score [--class C]
    does: P/R/F1 of the derivation vs the CVO-certified hand-audit oracles (advisory harness).
    use_when: Self-check a class's precision/recall before signaling a cert.

key_facts:
  drift_classes: [DECLARED, LIVE-no-DECLARED, DECLARED-no-LIVE, AWS_MANAGED, MULTI_STATE_MANAGED]
  edge_semantic: data-access edges are CAPABILITY (what a role COULD reach), not observed-use.
  zero_dangling: every concrete edge ends at a real node; unresolved becomes wildcard=true, never dangling.
  declared_side: terraform-STATE union across 25 root modules, NOT a .tf text-grep.
  runtime: full derive about 3-4 min (parallel boto3); read-only, safe to run anytime.
related_tools: comp-trace, comp-blast, comp-iam, comp-routes, comp-platinum (targeted probes; comp-aws is the unified graph)
