    affected_types: [API_ROUTE]
    name_patterns:
      - getAUMMetrics
    evidence: NFRA_GRAPHS D8-AE Part A; advisory mode pending blocking-flip 2026-06-13

  - id: DAY0_ADVISOR_INTELLIGENCE_AUTH_NONE
