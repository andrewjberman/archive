  # ---------- IAM family (TO-D2 AE lane, comp-iam gaps) ----------

  - id: FP_CROSS_FIRM_DENY_GUARDRAIL
    reason: >
      comp-iam gaps reports DENY-PRESENT instances as if they were findings, but an explicit
      Deny is a SECURITY CONTROL, not a missing permission. All 198 instances (2026-06-12 TO-D2
      AE sweep) are identical: bd-exporter-ec2-role has an explicit Deny on opal-data-cot and
      opal-data-cot/* — the intentional cross-firm isolation guardrail per NFRA_DTAFLP. Same FP
      class as the reference_deny_principal_star_is_guardrail_not_public_grant.md memory: gate any
      public-exposure / missing-permission finding on effect==Allow; a Deny+resource is a guardrail.
    affected_types: [IAM_ROLE, IAM_POLICY_STATEMENT]
    edge_conditions:
      - effect: Deny
    confirmed_fp_count: 198
    evidence: TO-D2 AE lane comp-iam gaps sweep 2026-06-12 (07848c565); NFRA_DTAFLP cross-firm isolation

  # ---------- Reachability family (TO-D1 iteration, CVO adjudication 0.70) ----------

  - id: FP_INF_DISPATCHER_CATALOG
    active: false  # RETIRED 2026-07-07 by 2.0.0_SA_COO: retire_when SATISFIED -- the stitch now carries 73 dispatcher->gold TRIGGERS edges (DS~A rebuild 07:43Z over 0.8.0's grain-complete regen; the 84bb8377b fix materialized). FPs #7/#8 (INF_A_02.fee_rate_history + INF_A_-1.materialize_txn_cache) now carry inbound TRIGGERS -> retire STRUCTURALLY (edged), NOT by this blanket mask. A 0-edge INF_* gold script AFTER this is a REAL orphan again. Persists on tonight's 02:00Z nightly (0.7.0's durable IAM+container fix). D1 reachability promotes ~1.0 on structural correctness.
    reason: >
      A gold script whose ONLY connection is inf dispatcher-catalog membership (orion-gold-dispatch.sh
      pipe-delimited catalog + CHAIN_* sets) read as 0-edge orphaned because the catalog was not parsed
      into graph edges. CVO TO-D1 adjudication FPs #7/#8 (INF_A_-1.materialize_txn_cache,
      INF_A_02.fee_rate_history — both dispatched live in CHAIN_FULL nightly). DURABLE FIX LANDED
      2026-06-12 (TO-D1 iteration): inject_pipeline_edges now emits dispatcher -[TRIGGERS]-> script
      for every chain member (bd + inf; 73 edges on first rebuild). This suppression covers the window
      until the nightly stitch rebuild carries the fix, then RETIRES — a 0-edge INF_* gold script
      after that is a REAL orphan again.
    affected_types: [GOLD_SCRIPT]
    name_patterns:
      - "INF_*"
    retire_when: "nightly stitch graph carries dispatch_catalog TRIGGERS edges (check meta/source=dispatch_catalog)"
    evidence: CVO adjudication 2026-06-12 (7/10, FPs one mechanism); fix commit TO-D1-iteration; 03ea4aed1 ledger

  - id: FP_MDPF_UNSTITCHED
    reason: >
      The mdpf tree was not stitched into the graph at all, so a live mdpf script's bucket reads were
      invisible — an S3 bucket whose only consumer is an mdpf script read as ORPHANED_S3 (CVO TO-D1
      FP #5: opal-data-etfs, read live by build_mdpf_wsd2_etf_netassets_feeder.py). PARTIAL DURABLE FIX
      LANDED 2026-06-12 (TO-D1 iteration): build_mdpf_dag (TOOL-02) is now injected into the trace-graph
      build (mdpf scripts + key-grain S3 I/O visible). REMAINING GAP this suppression still covers:
      key nodes are bare (no bucket attribution), so BUCKET-grain reachability for non-firm buckets
      (opal-data-etfs, opal-data-aaii-v2, opal-data-mdpf itself) still cannot see mdpf consumers.
      Retires when the bucket-qualified extractor leg (TOOL-02 follow-on) lands.
    affected_types: [S3_BUCKET]
    name_patterns:
      - "opal-data-etfs"
      # opal-data-aaii-v2 DROPPED 2026-07-07 by 2.0.0_SA_COO: CVO adjudicated FP #4 as a REAL orphan
      # (zero code refs, still isolated on the fresh 07-07 Nessie) -- this suppression was MASKING a
      # CVO-confirmed real orphan (the recall-hole the >=0.80 precision gate exists to prevent). Unmasked.
      - "opal-data-mdpf"
    retire_when: "extractor records bucket-qualified keys for mdpf reads (TOOL-02 follow-on)"
    evidence: CVO adjudication 2026-06-12 FP #5; mdpf DAG injection landed TO-D1-iteration

  # ---------- Reachability by-design-EDGELESS family (CVO adjudication 2026-07-07) ----------
  # The 07-07 comp-debt standing-scan surfaced 23 residuals; the dispatch-GAP ones (MDPF-runner /
  # ss4c-weekly / lambda-reads) are RECOGNIZER-fixed (DS~A lane), NOT suppressed. These three cover
  # the genuinely by-design-EDGELESS scripts: a gate/util/one-shot correctly sits ISOLATED (0-edge) in
  # the daily-dispatch DAG. ENGINE MECHANISM (verified vs comp_debt.py:_suppressed_by, 2026-07-07):
  # the D1 sweep only ever surfaces ISOLATED (0-edge, BOTH directions) script-level GOLD_SCRIPT nodes;
  # a class clears one iff (node_type in affected_types) AND (a name_patterns entry re.search-matches the
  # node_id, `gold:`-prefix included). The engine reads ONLY id/affected_types/filter=="isolated_only"/
  # name_patterns -- `reason`/`cannot_mask`/`review_note`/`evidence` are DOC-ONLY (CTO cond-1 auditability),
  # and `filter` here is omitted (the engine's only live filter token is "isolated_only", which the sweep
  # already implies). The cannot-mask guarantee is therefore NAMING, not any output-vs-input distinction:
  # only a ground-truthed name clears; a NEW validator/util surfaces as a residual for its own adjudication
  # (active-flag contract). Full grounding: cvo_NFRA_DEBTSCAN_comp-debt_23-residual_adjudication.md.

  - id: FP_VALIDATION_SCRIPT
    reason: >
      A validator/gate script is by design ISOLATED in the daily-dispatch DAG -- it gates (rc=1
      fail-closed) and publishes no scheduled S3 output, so a 0-edge reading is EXPECTED, not orphan.
      CVO ground-truthed (2026-07-07): I certed validate_schwab_native_custody tonight (a fail-closed
      MDPF custody gate, zero S3 write); the other three are the same family.
    affected_types: [GOLD_SCRIPT]
    name_patterns:   # NAMED (not a validate_*/*_gate glob) -- a NEW validator adjudicates separately
      - validate_schwab_native_custody
      - validate_platinum_consistency
      - sl_nightly_gate
      - verify_wsd2
    cannot_mask: >
      NAMED-specific -- ONLY these 4 ground-truthed by-design gates clear (each is an isolated-by-design
      gate: certed schwab). Any OTHER validator, incl. one that SHOULD be dispatched but is not, does not
      match -> it surfaces as a residual for its own adjudication (active-flag contract). So no real orphan
      can hide behind this class -- broadening to a validate_* glob (which COULD auto-mask a future
      un-ruled validator) was deliberately declined.
    evidence: CVO comp-debt adjudication 2026-07-07 (schwab gate certed tonight)

  - id: FP_BACKFILL_SCRIPT
    reason: >
      A one-shot historical backfill / one-time data patch is ISOLATED in the DAILY-dispatch DAG BY
      DESIGN (it ran once; it is not a daily chain member), so a 0-edge reading is a reachability FP,
      not a live orphan. SCOPE: this clears the REACHABILITY residual ONLY. It does NOT assert the
      backfill is non-obsolete -- whether a specific one-time patch (e.g. a patch_mdpf_* whose fix is
      now superseded) is REMOVABLE is a SEPARATE cleanup/obsolescence dimension, not a reachability
      finding; route those to a cleanup-sweep, not this class.
    affected_types: [GOLD_SCRIPT]
    name_patterns:   # regex (engine uses re.search); naming convention IS the one-shot signal (cf. FP_DIAG_ADHOC E_*)
      - ".*_backfill.*"
      - "patch_mdpf_.*"
    cannot_mask: >
      a script that SHOULD be daily-dispatched is not named *_backfill/patch_mdpf_* -- those names signal
      one-shot intent BY CONSTRUCTION; a genuinely-orphaned daily script carries a normal gold name and
      does not match. A new one-shot naming would be an explicit, auditable edit here.
    review_note: obsolescence of a specific patch_mdpf_* is a SEPARATE cleanup dimension -- not masked-as-fine-forever
    evidence: CVO comp-debt adjudication 2026-07-07

  - id: FP_UTIL
    reason: >
      A shared util/lib helper (leading-underscore internal) is imported by dispatched scripts, not
      itself a dispatch target -- so it sits isolated in the daily DAG by design. CVO ground-truthed:
      _trading_day_calendar is imported by build_mdpf_etf_ownership_timeseries (dispatched) -- a
      NYSE-calendar helper, benign.
    affected_types: [GOLD_SCRIPT]
    name_patterns:   # NAMED specific (engine re.search) -- a new util adjudicates separately
      - _trading_day_calendar
    cannot_mask: >
      a real orphan is a standalone script; a leading-underscore helper imported by a live consumer is
      reachable transitively. This single named entry covers exactly the one ground-truthed util -- no glob.
    evidence: CVO comp-debt adjudication 2026-07-07 (imported build_mdpf_etf_ownership_timeseries)

