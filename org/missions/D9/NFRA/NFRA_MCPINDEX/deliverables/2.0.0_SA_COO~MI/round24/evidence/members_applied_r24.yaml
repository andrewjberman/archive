# tool_index/members.yaml -- MX-c-8 (FWD-20): the member (a / b / c) of every tool the DEPLOYED gateway serves.
#
# THE DENOMINATOR is not in this file. emit_catalog_v02.py runs tool_census.py (the gateway code at
# services.opal-gateway.deployed_commit, never the trunk); a served tool with no entry here, or an entry here for a tool
# the deployed gateway does not serve, REFUSES the emit. `definition` is the census's, written by the emitter.
#
# Each member is classified from what the tool's DEFINITION does, never from its name:
#   a  reads data that a catalog row describes: read_tool (= the tool), index (the id of one such row, the `entity` or `key` of a
#      row outside tool_index; MX-c-9: NEVER an `entity` or `key` here, row Z-S106), links (EVERY such row id), history_depth and freshness (claim measured | inferred | absent).
#   b  reads data that no catalog row describes yet: owner (the project code that owns the data, or `unowned`).
#   c  is not a data read (it sends, writes, uploads, issues a ticket or probes status): reason.
# `measure: {row: <channel row id>}` (an (a) entry) names the catalog row whose served key measure.py lists, read-only, into
# measured.yaml; the key is read from the catalog row, never typed here. `depth:` (MX-c-9, MX-c-10) is what measure.py reads for
# history_depth, ONE named date field per object (nothing else of a body is printed or stored):
#   {row, scope?, field, method?}      measured: the field's date; method body-field (default) | snapshot-asof | series-first
#   {row, field, claim: inferred, source}   inferred: the date of one named field, where the object cannot be re-read at answer time
#   {row, listing: {...}}              inferred: the served window (earliest..latest) of a live-queried row's partition listing
#   {claim: per-link, links: [spec]}   a multi-index tool: one spec per row it links
# The emitter reads the claim from measured.yaml and composes a measured claim's basis from the row's key. A claim written here is literal.
# MX-c-21 (PRD v0.17 C-GROUP item 3): `bucket` and `bucket_source` are declared on EVERY member the catalog rows do not name
#   (no row carries it as its read_tool). `bucket` is the S3 bucket the tool reads (opal-data-...), or dynamodb, graph (the Microsoft
#   365 tools), or a store word (kuzu, ycharts, gateway, portal-refresh). `bucket_source` is <path>:<line>, the path relative to
#   infra/aws/ec2/opal-gateway and the line in the tool's own code that names the bucket or the store; for an S3 bucket the bucket
#   name must appear within 6 lines of that line (the emitter refuses otherwise).

members:
- tool: blackdiamond_list_fees
  member: a
  index: blackdiamond_fees
  links:
  - blackdiamond_fees
  depth:
    row: blackdiamond_fees
    listing:
      producer_read_at: true
      basis_ref: the silver tier named by the row's producer, listed read-only by partition
  freshness:
    claim: absent
    reason: a live-queried Black Diamond vendor API row has no served artifact to list; the fee dates come from the vendor
      per request
