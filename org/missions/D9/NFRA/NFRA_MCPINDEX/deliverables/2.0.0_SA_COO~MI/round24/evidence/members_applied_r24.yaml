    - row: etfs.01.positioning-data
      field: data_as_of
      method: snapshot-asof
    - row: mac.01.macro-data
      field: data_as_of
      method: snapshot-asof
    - row: mac.02.timeseries-family
      listing: {row_prefix: true}
    - row: mac.03.volatility-data
      field: data_as_of
      method: snapshot-asof
    - row: mac.04.yield-curve-fred
      field: generated_at
      method: snapshot-asof
    - row: mkt.01.tiered-all-returns-PRIMARY
      field: data_as_of
      claim: inferred
      source: 'data_as_of read by the worker from the object; the row is BLOCKED-BY-ALLOWLIST for every principal, so the gateway serves nothing from it and opal_discover reads nothing from it at answer time'
    - row: mp.01.aum-metrics
      scope: global
      field: total.series_start
      method: body-field
      depth_kind: series_start
    - row: mp.02.account-distribution
      scope: global
      field: _provenance.source_vintages.global/account-distribution
      method: snapshot-asof
    - row: mp.03.aggregate-aua-timeseries
      scope: global
      field: as_of_first
      method: body-field
      depth_kind: series_start
    - row: mp.07.peer-performance
      field: data_as_of
      method: snapshot-asof
    - row: att.01.allocation-summary
      field: data_as_of
      claim: inferred
      source: 'data_as_of read by the worker after decoding the object, which is stored gzip-encoded (Content-Encoding gzip); the aws CLI and the opal_discover read do not decode it, so it is not re-read at answer time'
    - row: att.04.positioning-data
      field: data_as_of
      claim: inferred
      source: 'data_as_of read by the worker after decoding the object, which is stored gzip-encoded (Content-Encoding gzip); the aws CLI and the opal_discover read do not decode it, so it is not re-read at answer time'
    - row: att.02.holdings-attribution
      field: data_as_of
      method: snapshot-asof
    - row: news.03.live-singletons
      field: generated_at
      claim: inferred
      source: 'generated_at read by the worker from the first of the two singleton objects the row names; the row names two objects, so no single object is measured and opal_discover does not re-read it'
      key_part: 0
    - row: val.01.valuation-data
      field: data_as_of
      claim: inferred
      source: 'data_as_of read from the served object by the worker; the object is over the answer-time read bound of opal_discover, so the gateway does not re-read it at answer time'
    - row: val.02.risk-premium-data
      field: data_as_of
      method: snapshot-asof
  freshness:
    claim: absent
    reason: this tool reads any one catalogued key per call; each key is a single overwritten JSON object described by its
      own row, so there is no one served prefix to list (per-key as-of is answered by opal_discover from the row)
