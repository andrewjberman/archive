    - row: mp.06.etf-returns
      field: data_as_of
      method: snapshot-asof
    - row: cma.01.assumptions
      field: generated_at
      claim: inferred
      source: 'generated_at (the publish time of the assumption set) read from the served object by the worker; the object''s data_as_of is the year string 2026, not a date, so no as-of date is measured'
    - row: cma.02.views
      field: data_as_of
      method: snapshot-asof
    - row: cor.01.correlation-data
      field: data_as_of
      method: snapshot-asof
    - row: ft.01.tier1-snapshot
