    frontier: "Wire comp-which to IMPORT tool_index instead of re-parsing the manifest."
    blocked_on: "1.0.0_SA_CTO -- the wiring call."
  - id: INFRASTRUCTURE.TOOLS.O2
    title: "Response scope -- high-signal output that is not truncated, redacted or garbled"
    state: "ACTIVE -- Andrew named it a SEPARATE function from coverage"
    decided: "NO"
    built: "PARTIAL"
    serving: "NO"
    built_anchor: "CVO 212235Z -- the 8-field card now carries `knows_own_denominator` and `excludes`,
      the two fields that make silent truncation DETECTABLE. PARTIAL and NOT YES because NO TOOL HAS
      BEEN CHANGED TO USE THEM YET: the artifact exists, the behaviour has not. That distinction is the
      whole point of the three axes, and CVO drew it without being asked."
    principle: "BOUNDING IS NOT THE PROBLEM. UNDECLARED BOUNDING IS. A tool returning 40 of 400 AND
      SAYING SO is correct. The defect is truncation the reader cannot detect -- the same property as
      an unenumerated coverage universe, because the output is byte-identical to the complete one.
      O2 IS THE COVERAGE PROBLEM ON THE OUTPUT SIDE."
    contract:
      - "C1 declare the denominator IN-BAND (showing N of M, M measured BEFORE bounding)"
      - "C2 truncation is a VISIBLE TOKEN, never an absence"
      - "C3 an EMPTY result must be distinguishable from a FAILED retrieval"
      - "C4 THE CONTRACT IS THE TOOL'S, NOT THE CALLER'S -- every measured instance came from a
         caller's bounding, and a tool that emits its own denominator survives a careless caller"
    frontier: "Change a tool to actually USE knows_own_denominator/excludes. Until one does, the fields
      are declared and unexercised."
    blocked_on: ""
