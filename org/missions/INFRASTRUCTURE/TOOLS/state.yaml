denominators:
  tools_total: 93
  scanning_population: 90
  note: "THE REGISTER'S DENOMINATOR IS 90, NOT 93. Three tools legitimately enumerate nothing --
    comp-to (a WRITER, sets session TO context), comp-imgread (PIL binary reader),
    comp-v5-composite-test.sh (test harness). NO PRIMITIVE and NOT AN ENUMERATOR are different
    verdicts and only the first is a gap; recording 93 would read as three uncovered tools that do
    not exist."
  THE_COUNT_CASCADE: "FIVE numbers, EVERY ONE CORRECT FOR A DIFFERENT POPULATION, AND NONE OF THEM IS
    'THE TOOLKIT': 93 on disk / 89 classified / 89 homed in the coverage map / 69 in tools_index /
    105 use-cases. >> THIS LANDS DIRECTLY ON MSTR, BECAUSE THE REGISTER COMPILES COUNTS. The rule is
    VERIFICATION LAW (6): enumerate what a number is OF before quoting it. A bare tool count in this
    register is a defect regardless of which of the five it is -- the population must ride with the
    number. <<
    >> UPGRADED SAME DAY BY CTO DOCTRINE III-g (4505b71fef), AND MY VERSION WAS INSUFFICIENT:
    'A SCALAR CANNOT REPORT ITS OWN OMISSIONS.' Carrying the population with the number is NECESSARY
    AND NOT SUFFICIENT -- two populations can share a denominator and NOT share a member, BECAUSE THE
    DENOMINATOR IS A SCALAR TOO. Proven on first exercise of CVO's parity guard: AUTHORITY 89,
    MASTER 89, COUNTS MATCH EXACTLY, SETS DIVERGE BY 12 MEMBERS -- a count-equality check would have
    passed clean and said nothing. THE RULE FOR THIS REGISTER IS NOW: COMPARE SETS, BOTH DIRECTIONS,
    AND NAME THE DIVERGING MEMBERS. My earlier rule would have passed the very check that caught this. <<"
  correction: "CVO earlier reported 57 of 92 unresolved. The denominator is 93, not 92 -- a tool
    landed mid-session (comp-missions, the register's OWN tool). Corrected at source because MSTR
    was compiling from CVO's numbers."
