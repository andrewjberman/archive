sub_group: INFRASTRUCTURE.TOOLS
title: "Enumerated coverage universe per tool"
# GOAL -- synthesized by MSTR from Andrew's 2026-07-28 charter, held at PROPOSED until he
# approves. An UNAPPROVED goal is a DRAFT and must never be rendered as sovereign intent.
# Approval flow: MSTR synthesizes -> Andrew approves per sub-group AND at summary level ->
# the stamp lands here and is rendered on org/missions/MISSIONS.md.
goal: >
  Establish an enumerated coverage universe per tool -- what each tool covers, what it does not,
  and where its silence means nothing-there rather than cannot-see -- consolidating the
  extensive prior art already held in the NFRA projects; and define how each tool must present
  information so that responses are high-signal and never inadvertently truncated, redacted or
  garbled.
