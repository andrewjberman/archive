debt_vs_blindspot_discriminator:
  note: ">> THE MOST VALUABLE THING IN CVO'S REPORT, AND IT BELONGS TO THE REGISTER RATHER THAN TO
    ANY ONE FINDING: debt and blind spots PRESENT IDENTICALLY, and the answer changes the OWNER. <<"
  rule: |
    an UNMODELLED thing that is DEAD   -> DEBT        (housekeeping; delete or document)
    an UNMODELLED thing that is ALIVE  -> BLIND SPOT  (coverage defect; the graph is WRONG)
  discriminator: "WRITE-LIVENESS. A prefix still being written is being produced FOR SOMEONE.
    Banded mechanically -- ALIVE <=7d / DORMANT <=90d / STALE >90d -- so it is RE-DERIVED on each run
    rather than judged once and remembered."
  applied: "The 7 unconsumed prefixes split 1 ALIVE / 2 DORMANT / 4 STALE. ONLY THE ALIVE ONE IS A
    DEFECT: json/latest/, 6 keys, WRITTEN TODAY, with no modelled consumer."
  routed_away: "CVO routed json/latest/ AWAY from this debt item deliberately -- it is a
    canonical-graph COVERAGE gap and belongs with INFRASTRUCTURE.GRAPH, not here."
  why_the_split_matters: ">> THOSE 7 LOOKED LIKE ONE POPULATION. Reported as a list, THE LIVE DEFECT
    HIDES INSIDE THE DEAD ONES -- and the dead ones are exactly the kind of finding that gets
    deprioritised as housekeeping. COLLAPSING THE TWO CLASSES IS HOW A REAL GAP GETS FILED AS DEBT AND
    THEN NEVER LOOKED AT AGAIN. <<"
