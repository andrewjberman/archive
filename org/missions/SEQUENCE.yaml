  MDPF_TAXSMA:
    fabric: laptop
    stage: 0
    waits_on: []
    why: "Andrew's next COO seat (~12:5xZ, 'If push mdpf_taxsma as the next one followed by nfra_oplgtw'). PRD v0.2 is ADMITTED on both halves (60c722fe64); L5 is next and is a COO's. 0.0.0_AB_MSTR seats the lane; the project's coo_lane is recorded in its project.json when seated."
    notes: "Resolves LD-0567's carried conflict: this seat, not LGIC_CANON, takes 2.0.0_SA_COO~F's next free slot. The tail placement proposed @8c70cabc48 was never adopted."

  NFRA_OPLGTW:
    fabric: laptop
    stage: 0
    waits_on: []
    why: "Second in Andrew's seat order, the same word. In flight at EXECUTING under 2.0.0_SA_COO~O, so it takes no new slot now; placed here so it is next for a seat if that lane goes dark."

  LGIC_NAMING:
    fabric: laptop
    stage: 1
    waits_on: []
    why: "The vocabulary every later name and storage key is minted from (org/standards/NAMING_SCHEMA.json)."

  LGIC_ENFORCE:
    fabric: laptop
    stage: 1
    waits_on:
      - {project: LGIC_NAMING, prd_admitted: true}
    why: "Consumes the naming schema: its key() and name() builders and the registry-derived fence read NAMING_SCHEMA.json (LGIC_NAMING's CONTRACTS)."

  LGIC_CANON:
    fabric: laptop
    stage: 1
    waits_on: []
    why: "In the Platform Logic stage by Andrew's priority word. No hard dependency on the other two; its PRD is queued after LGIC_ENFORCE's as the CTO's work order, which is not a gate."

  ADVI_FIRMBKTS:
    fabric: laptop
    stage: 2
    waits_on: []
    hold:
      max_dep_stage: DECOMP
      until:
        - {project: LGIC_ENFORCE, prd_admitted: true}
        - {manual: "LGIC_ENFORCE's scope-derived fence (Andrew ~18:4xZ card 1, on its three conditions) is applied on infra/aws/terraform/shared-infra/s3-49financial.tf, the template opal-data-inflection and opal-data-cottonwood are minted from", confirmed: "1.0.0_SA_CTO 2026-09-15 ruling 97031 -- EN-f-2 applied; its drain completed @d482e58ecf (merge c6d652a6dc landed 2 of the branch's 8 paths, row LGIC_ENFORCE-S18; the other 6 landed @5ee8e068fd, @8c77a1400a, @d482e58ecf); 4 of 4 probe arms; live policy on opal-data-49financial 1 Deny with 17 ArnNotLike values; card 1 conditions (1)-(3) met for opal-data-49financial"}
    why: "The legacy firm buckets (opal-data-bd, -inf, -cot) move into opal-data-49financial and the two new buckets. The new buckets must be minted with the rebuilt fence, and FWD-3 needs LGIC_ENFORCE's registry. Its PRD and decomposition may proceed; execution waits."
    notes: "Card 3 (read logging on the legacy buckets, order 4db66568a6) ran ahead of this stage on Andrew's own words (~18:4xZ card 3, ~19:0xZ, ~21:3xZ): it starts FWD-6's 45-day clock and touches no naming. CARRIES for this project's L4 (1.0.0_SA_CTO ruling 97031, 2026-09-15). They are acceptance lines when the project is seated, not holds. (C1) irpt-directory-refresh-role carries no firm token and reads/writes the served IRPT directory. When its grants repoint to opal-data-inflection or opal-data-cottonwood, it needs an exemption row on EACH new bucket, under never-widen sign-off, BEFORE the repoint, or the fence denies it and the trading-weekday 09:00 ET directory refresh breaks. The writer census re-runs PER NEW BUCKET; the 49financial census does not cover them. (C2) That per-bucket census includes service-principal delivery (access logs, inventory, replication). If it is non-empty for a new bucket, a registry-generated aws:PrincipalServiceName arm is built before that bucket is fenced."

  MDPF_CANON:
    fabric: laptop
    stage: 2
    waits_on: []
    hold:
      max_dep_stage: REGISTERED
      until:
        - {project: LGIC_ENFORCE, prd_admitted: true}
    why: "Andrew's priority word puts MDPF after the Logic projects, and its keys come from LGIC_NAMING's schema. Its FWD-2 and FWD-6 also need ADVI_FIRMBKTS's firm buckets -- added as a gate on its execution when its PRD cuts cells."

  IRPT_BCKEND:
    fabric: laptop
    stage: 3
    waits_on: []
    why: "Investor Reporting's backend. Its per-firm platinum lands in the firm buckets (its row 11, which bucket serves 49 Financial, is answered by ADVI_FIRMBKTS's cutover), and IRPT_FNTEND cannot close without it. Round 2 is in flight with its COO lane dark, so it needs a seat to finish. It follows Platform Logic by Andrew's word, which also binds what it becomes: its next revision is built on the patterns the Logic projects establish (~14:5xZ, 'No, we need the logic projects done first because that will establish the patterns for the new backend properly')."
    notes: "No hold: the round in flight is not ordered against anything, and a hold would mark it out of sequence. The row-11 dependency is a gate on that OUTCOME, added when its next PRD revision cuts the cell (the MDPF_CANON pattern), not on the project. BACKEND ADMIN WALL, Andrew-direct 2026-09-15 ~14:2xZ at the 1.0.0_SA_CTO terminal, 'recs approved', on /open-calls card 2: before ANY IRPT_BCKEND route serves, the backend refuses a caller who is not role admin AND firm opal-capital (the portal predicate, enforced server-side, not only in the UI). It lands as an IRPT_BCKEND FWD at its next PRD revision. That FWD first answers _scope/resolve.py:186-187's note that the injected header set cannot separate an Opal admin from a partner-firm admin. It carries row IRPT_FNTEND-S66."

