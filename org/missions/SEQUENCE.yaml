# org/missions/SEQUENCE.yaml -- THE SEQUENCE: the projects that must run in order, and the gates between them.
#
# AUTHORITY: Andrew-direct 2026-09-14 ~01:xxZ at the 1.0.0_SA_CTO terminal. Record, every word verbatim:
#   org/tier1_exec/1.0.0_SA_CTO/deliverables/ANDREW_DIRECT_20260914_01xxZ_LAPTOP_SEQUENCE_DOCUMENT_APPROVED.md @cc79b6191a
#   "some kind of document that governs the sequence of multiple projects ... you as CTO can be the master orchestrator
#    and effectively track progress against a master document across many projects"
#   "the sequence will govern projects that require chronology compliance by way of dependencies/design ... it has to be
#    writable by both the laptop cto and the sitez cto becuase there may be overlap"
#
# WHO WRITES IT: 1.0.0_SA_CTO (laptop) and 1.0.0_SA_CTO~Z (site Z). The ORDER changes only on Andrew's word, and every
# change adds a change_log entry quoting it. A gate or a note may be corrected by either CTO without his word when it
# changes no order; the change_log still records it.
#
# WHAT IT HOLDS -- only what the register cannot answer: which projects are ordered, what each waits on, and why.
# WHAT IT NEVER HOLDS -- STATUS. dep_stage, status, PRD sign-off and last activity are read live by
#   .tools/sequence-check.py every time it runs. A status written here would be a second carrier and would go stale.
# WHAT IS NOT HERE -- a project with no ordering constraint. Its own directive's rules govern it; it is not placed.
#
# GATE VOCABULARY (the reader evaluates each form; any other form is refused as UNREADABLE):
#   {project: X, prd_admitted: true}         X's PRD reads ADMITTED under .tools/prd_signoff_lib.py (both halves signed)
#   {project: X, dep_stage_at_least: S}      X's register row has reached S
#                                            (REGISTERED < PRD < DECOMP < EXECUTING < ROUND_CLOSE < CLOSED)
#   {project: X, status: complete}           X's register row reads status complete
#   {manual: "<text>"}                       no tool can check it: UNMEASURED, and treated as UNMET until a CTO adds
#                                            confirmed: "<serial> <date> <evidence>" to the gate and a change_log line
#
# waits_on  -- the project may not START (reach PRD) until every gate is met.
# hold      -- the project may advance up to max_dep_stage while the hold's gates are unmet; past that is OUT OF SEQUENCE.
#
# CAPACITY: at most N COO sessions run their projects and subagents at once on a box (capacity.coo_sessions, per
# fabric). Andrew-direct 2026-09-14 ~07:0xZ: "We can only have 3 COOs running their respective projects/subagents at any one time, otherwise it gets too overloaded on the box. This is why the sequence function is important, so that chronology is managed in line with available resources." (record org/tier0_exec/0.0.0_AB_MSTR/deliverables/ANDREW_DIRECT_20260914_070xZ_THREE_COO_CAP_AND_PUSH_WINDOW.md @f21c5d8290).
# The reader counts the live COO lanes on the box and flags NEEDS-SLOT on a project whose PRD is admitted, whose next
# step is a COO's, and which has no lane. At the cap, the next slot goes to the first NEEDS-SLOT project in this
# file's order. 0.0.0_AB_MSTR seats lanes; no driver asks for a lane past the cap; Andrew's word overrides the order.
#
# ENFORCEMENT: TRACK. Andrew ~01:xxZ card 1: the reader flags and the CTO raises. A task-order gate limb refusing new
# orders for a project whose stage is not open is approved to follow once this order has held about a week; it is
# announced before it is armed.

version: 4
owners: ["1.0.0_SA_CTO", "1.0.0_SA_CTO~Z"]
enforcement: TRACK

capacity:
  coo_sessions:
    laptop: 3
  why: "Andrew-direct 2026-09-14 ~07:0xZ (org/tier0_exec/0.0.0_AB_MSTR/deliverables/ANDREW_DIRECT_20260914_070xZ_THREE_COO_CAP_AND_PUSH_WINDOW.md @f21c5d8290): 'We can only have 3 COOs running their respective projects/subagents at any one time, otherwise it gets too overloaded on the box. This is why the sequence function is important, so that chronology is managed in line with available resources.' Site Z's cap is not ruled."

stages:
  - id: 0
    name: "Andrew's seat priority -- MDPF_TAXSMA, then NFRA_OPLGTW"
    why: "Andrew-direct 2026-09-15 ~12:5xZ at the 1.0.0_SA_CTO terminal, answering the seat conflict LD-0567 carried to him (his 09-14 ~18:2xZ word gave 2.0.0_SA_COO~F's next free slot to LGIC_CANON): 'If push mdpf_taxsma as the next one followed by nfra_oplgtw'. It confirms his ~07:5xZ capacity order (org/tier0_exec/0.0.0_AB_MSTR/deliverables/ANDREW_DIRECT_20260915_075xZ_LAPTOP_CAPACITY_ORDER_TAXSMA_THEN_OPLGTW_THEN_IRPT_BCKEND.md @4524cc2466, LD-0567): 'If laptop has capacity let's get mdpf_Taxsma going; then nfra_opalgt or whatever the mcp hook up new nfra project was, then IPRT_BCKND if the lgic work is in proper position and we can address backend canonically now'. This stage orders SEATS, not dependencies: the reader queues NEEDS-SLOT by stage, so stage 0 puts these two ahead of every other project for a COO slot."
  - id: 1
    name: "Platform Logic -- the naming schema, the enforcement layer, the canon"
    why: "Andrew-direct 2026-09-13 ~19:2xZ (relayed 4.0.0_SA_CRO~D 96400): 'I want to proceed with the Logic projects into the MDPF and so on'."
  - id: 2
    name: "The D8 migrations built on Platform Logic"
    why: "The same word: the Logic projects first, then MDPF and the migrations. The new firm buckets must be minted with LGIC_ENFORCE's rebuilt fence (Andrew ~18:4xZ card 1)."
  - id: 3
    name: "Projects whose outcomes land in the migrated firm buckets"
    why: "Placed after everything already ordered so that no existing order moves (Andrew-direct 2026-09-14 ~13:4xZ, 'recs + sequence approved', record org/tier1_exec/1.0.0_SA_CTO/deliverables/ANDREW_DIRECT_20260914_134xZ_NEXT_CALLS_RECS_AND_SEQUENCE_APPROVED.md). Moving a stage-3 project ahead of Platform Logic is a reorder, and a reorder is Andrew's word. ASKED AND ANSWERED for IRPT_BCKEND, ~14:5xZ: 'No, we need the logic projects done first because that will establish the patterns for the new backend properly' (record org/tier1_exec/1.0.0_SA_CTO/deliverables/ANDREW_DIRECT_20260914_145xZ_LOGIC_FIRST_THE_BACKEND_FOLLOWS_ITS_PATTERNS.md)."

