# >>> CURRENT STATE: run `/sequence` (= `python .tools/sequence-check.py --compile`) -- it recompiles the nested `compiled:` JSON at the
# >>> BOTTOM of this file from the live project register, PRD sign-offs, git and the COO roster, and prints it. The block
