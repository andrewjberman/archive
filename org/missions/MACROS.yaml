# org/missions/MACROS.yaml -- the RATIFIED macro enum, PER DIRECTIVE (spec s.5 / s.5a; Rule 24).
#
# DATA, not prose: .tools/missions-tree-index.py reads `directives.<D>.macros` and
# `directives.<D>.ratification` (refusal R2 -- a project cannot register under a macro that is
# absent here or whose directive's enum is not RATIFIED). A macro folder org/missions/<D>/<MACRO>/
# may exist only if <MACRO> is listed under <D> here.
#
# WHO WRITES WHAT:
#   proposal      2.0.0_SA_COO authors the per-directive set WITH its Rule 24 four-postulate record
#                 and a word-boundary token census (the `record` path below). A bare edit is not a
#                 proposal.
#   ratification  Andrew ONLY (spec s.5a "who ratifies": Andrew, as the per-directive enum). The
#                 `ratification` value flips from PROPOSED to "RATIFIED <record> <date>" on his word,
#                 quoting the record that carries it. Nobody else flips it.
#   scope         PROSPECTIVE ONLY (spec s.8). This enum governs what may ENTER the tree under a
#                 directive; the 352 flat rows in org/projects/ are untouched by it.
#
# A macro repeats across directives by design (NFRA under D0 and D11): each directive's list is
# ratified on its own, and ratifying one list moves no other (Rule 24 iv, state coherence).
version: 1
grammar: "^[A-Z]{4}$"
record: org/tier1_exec/2.0.0_SA_COO/deliverables/MACRO_ENUM_RULE24_D0_D8_D11_20260902.md
census_vintage: "org/projects/*.json, 352 rows, read 2026-09-02 ~21:2xZ at @b1ead3af6f"

charters:
  AMGT: "Asset Management -- ALL of D5's research and analysis, including the alt-research corpus (research-call transcripts, the 63-name materiality queue), not only the named-security research packs (D5)"
  NFRA: "Infrastructure and substrate -- agent process infrastructure, the estate graph, comp-tools, deploy and register mechanics (D0, D11)"
  ETFS: "ETF satellites products -- positioning, ingest, guardrails on the served model-portfolio surfaces (D4, D8)"
  MDPF: "Model-portfolio data pipeline -- the served MP surfaces, their remediation and fortification (D8)"
  AUTH: "Portal authentication and its self-healing (D8)"

directives:
  D0:
    macros: [NFRA]
    ratification: "RATIFIED org/tier1_exec/2.0.0_SA_COO/deliverables/ANDREW_DIRECT_20260903_015xZ_ALL_RECS_APPROVED_RATIFY_D0_D8_MACRO_ENUMS.md 2026-09-03 -- verbatim: 'All recs approved, ratify D0 and D8' (Andrew-direct ~01:5xZ at the 2.0.0_SA_COO terminal, answering /open-calls CALL 1 'Ratify D0's macro enum: [NFRA]?', REC yes [NFRA]). Rule 24 (iv): this flip moves D0 only."
    census: "5 of 5 rows with directive D0 carry macro_code NFRA and prefix NFRA (NFRA_CLDGRPH, NFRA_COMPTOOLS, NFRA_DEPLOYCENSUS, NFRA_DEPLOYLEDGER, NFRA_TORECORD)"
  D5:
    macros: [AMGT]
    ratification: "RATIFIED org/tier1_exec/2.0.0_SA_COO~Z/deliverables/MACRO_ENUM_RULE24_D5_20260910.md 2026-09-10 -- Andrew-direct, THREE words on this subject and all three quoted here so the flip rests on the whole of what he said, not the convenient part. At the 1.0.0_SA_CTO~Z terminal ~17:4xZ (record org/tier1_exec/1.0.0_SA_CTO/deliverables/ANDREW_DIRECT_20260910_174xZ_D5_MACRO_AMGT_AND_ITS_SCOPE.md, relayed msgs 20998/21006): 'AMGT is a new macro, short for Asset Management' / 'can get that registered.' / 'AMGT can definitely hold all of this, all of that research and analysis and etc is Asset Management'. THEN, at the 0.0.0_AB_MSTR~Z terminal AFTER this record existed, to the register holder directly: 'you need to register the macro CTO~Z asked of you'. ⛔ THAT LAST WORD IS WHAT MAKES THIS A RATIFICATION AND NOT A SECOND PROCEED. 2.0.0_SA_COO~Z was right to refuse the flip on the first word and said exactly why -- it was given BEFORE the record existed, so it read as proceed-with-registration; its own line said 'one word flips this'. That word has now been given, after the record, to the seat that holds the register, in the imperative. Flip recorded by 0.0.0_AB_MSTR~Z as site-Z register owner (lane TREE_MACROS), on the D12 precedent where this seat authored a RATIFIED line quoting an Andrew word rather than Andrew editing the file. ⛔ RULE 24 (iv), WHAT THIS FLIP DOES NOT MOVE: it moves D5 ONLY. It does not ratify any other directive's enum. It does not register AMGT_RESAPP as a tree project -- that is a separate act and R2 now permits it where it previously refused. It does not decide whether the alt-research corpus becomes its own PROJECT under AMGT: he ruled on what the MACRO covers, not on how work is packaged, which is an L3 question nobody has asked. And it does not widen the enum -- [AMGT] is the whole list for D5 and any second macro needs its own record, census and word."
    census: "\bAMGT\b -> 32 hits across 53,759 files [corpus=all], bands SURFACED=1 DOC=31 -- ALL 32 are today's inbox copies of the messages deciding this, plus this lane's own comp-which-rail log line. ZERO PRIOR USE; no collision. NEGATIVE CONTROL \bAMG\b -> 18 hits, a REAL UNRELATED LIVE POPULATION (AMG YACKTMAN fund names; AFFILIATED MANAGERS GROUP INC -> AMG in data/black_diamond/scripts/{gold,silver}/lib/ticker_overrides.py) -- a 3-char neighbour of this macro is a live issuer token in the data plane, which the word-boundary pattern separates. POSITIVE CONTROL \bETFS\b -> 3,353 hits, same instrument same corpus. LIMIT STATED: \bamgt\b -> 16, not zero, so this lane does NOT claim a clean case-negative from the census; the ^[A-Z]{4}$ grammar is what excludes it. MEMBERSHIP: 357 flat register rows, ZERO carrying directive D5; DIRECTIVES.yaml declares projects: [AMGT_RESAPP] with no register row yet, so the enum is authored BEFORE its first member exists as a row -- the correct order, since R2 refuses a registration whose macro is not enumerated."
  D8:
    macros: [ETFS, MDPF, AUTH]
    ratification: "RATIFIED org/tier1_exec/2.0.0_SA_COO/deliverables/ANDREW_DIRECT_20260903_015xZ_ALL_RECS_APPROVED_RATIFY_D0_D8_MACRO_ENUMS.md 2026-09-03 -- verbatim: 'All recs approved, ratify D0 and D8' (Andrew-direct ~01:5xZ at the 2.0.0_SA_COO terminal, answering /open-calls CALL 2 'Ratify D8's macro enum: [ETFS, MDPF, AUTH]?', REC yes all three; GLOBALALARM stays a flat row outside the domain). Rule 24 (iv): this flip moves D8 only."
    census: "5 of 5 rows with directive D8: MDPF x2 (MDPF_COTREMEDIATION, MDPF_HEALGAP), ETFS x1 (ETFS_GUARDRAIL), AUTH x1 (AUTH_SELFHEAL), and GLOBALALARM which carries NO macro prefix. ⛔ RESTATED 2026-09-02 ~23:4xZ (CVO residual R-v): the prior line read '4 of 4 ... macro_code == prefix on EVERY row' and was made false the same day by 0.0.0_AB_MSTR moving GLOBALALARM D10 -> D8 on Andrew-direct ('Call 1 - I would put this in D8 yes', LD-0519). A census is a MEASUREMENT AT A VINTAGE, and this one was invalidated by an edit to a DIFFERENT file an hour after it was written -- the D8 membership list, not this enum. THE ENUM IS NOT WIDENED AND NO 'GLOB' MACRO IS MINTED: adding one would need its own Rule 24 record, its own census and Andrew's word, and inventing a macro to make a census line true again is the tail wagging the dog. GLOBALALARM is legal exactly because scope is PROSPECTIVE ONLY (spec s.8) -- it is a pre-macro FLAT row that this enum does not govern. FORWARD CONSEQUENCE, stated rather than discovered later: GLOBALALARM can never be moved INTO the D8 tree under the current enum; a tree home for it needs a ratified macro first."
    alternative_named: "ETFS only (the water-test minimum the spec wrote before the census) -- rejected in the record: the most likely next D8 registrant is an MDPF_* successor arc, and an enum that refuses it on day one is a bare prohibition, not a taxonomy"
  D11:
    macros: [NFRA]
    ratification: "RATIFIED org/tier1_exec/2.0.0_SA_COO/deliverables/MACRO_ENUM_RULE24_D0_D8_D11_20260902.md 2026-09-02 -- verbatim: 'commit macros.yaml and ratify D11' (Andrew-direct ~22:3xZ at the 0.0.0_AB_MSTR terminal; record org/tier0_exec/0.0.0_AB_MSTR/deliverables/ANDREW_DIRECT_20260902_MACRO_ENUM_D11_RATIFIED.md). HE NAMED D11 AND ONLY D11 -- D0 and D8 stay PROPOSED, and Rule 24 (iv) is why that is expressible: ratifying one directive's list moves no other."
    census: "2 of 2 rows with directive D11 carry macro_code NFRA (NFRA_C3MATERIALIZE, NFRA_SUBSTRATECARDING); NFRA_COMPEFFICACY (no row yet; Andrew ~21:0xZ 'laptop under D11') conforms"
  D12:
    macros: [NFRA]
    ratification: "RATIFIED org/tier0_exec/0.0.0_AB_MSTR/deliverables/MACRO_ENUM_RULE24_D12_20260903.md 2026-09-03 -- Andrew APPROVED [NFRA] FOR D12 IN ADVANCE, verbatim: 'All recs approved, ratify D0 and D8' (~01:5xZ at the laptop COO terminal), answering an /open-calls card 3 that read 'Ratify D12s enum when MSTR~Zs proposal lands? Expected [NFRA]' with the rec '[NFRA], one word when the record is in front of you'; relayed by 2.0.0_SA_COO standing in for 0.0.0_AB_MSTR at bus id e8421d1a-4e33-4b7d-a6d3-0558bab6a752, whose instruction was to cite BOTH records and that no further word is needed for [NFRA]. ANY WIDER D12 LIST NEEDS A FRESH WORD. Record authored by 0.0.0_AB_MSTR~Z as site-Z register owner (lane TREE_MACROS)."
    census: "3 of 3 rows with directive D12, read 2026-09-03 ~02:0xZ over 354 flat rows parsed of 354 files, 0 parse errors. NFRA_SECURITY202609 carries macro_code NFRA and conforms. D12_PHONE_OTP_ALL_AWS and PLATFORM_OPS_USERMGMT carry PLATFORM_OPS, 12 characters, which CANNOT match the ratified macro grammar ^[A-Z]{4}$ -- not a macro this enum declines to list, not a macro at all; both are pre-macro flat rows outside the domain (spec s.8, prospective only). FORWARD CONSEQUENCE: neither can enter the D12 tree while it carries PLATFORM_OPS; a tree home needs a ratified 4-char macro first. SEPARATELY, NFRA_SECURITY202609 is barred by refusal R1 -- SECURITY202609 is 14 chars against ^[A-Z]{4}_[A-Z0-9]{4,12}$ -- an INDEPENDENT constraint, recorded because a reader checking only the macro would call it tree-ready. UNCOVERED MEMBER NAMED (postulate i): D12s remaining named scope (remembered-device policy, onboarding redesign, front-end admin UI, partner-admin delegated user-add) is platform/user-management, which NFRA does NOT describe; not yet in the domain because no such project is entering the tree, and the first that does needs a new macro, a new Rule 24 record and a fresh word. || RESOLVED 2026-09-03 ~06:5xZ, Andrew-direct at the 1.0.0_SA_CTO~Z terminal, verbatim 'Call it NFRA_OPSEC202609': the D12 member formerly NFRA_SECURITY202609 is NFRA_OPSEC202609 (macro NFRA, name OPSEC202609 = 11 chars, conforms to ^[A-Z]{4}_[A-Z0-9]{4,12}$) and entered the tree at org/missions/D12/NFRA/NFRA_OPSEC202609/ the same hour (record org/tier1_exec/1.0.0_SA_CTO/deliverables/ANDREW_DIRECT_20260903_065xZ_CTOZ_CALL_IT_NFRA_OPSEC202609.md). The R1 sentence above is a measurement at its vintage and stands as written; the two PLATFORM_OPS rows are unchanged."
