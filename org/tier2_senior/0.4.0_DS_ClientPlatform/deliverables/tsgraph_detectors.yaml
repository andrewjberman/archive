# NFRA_TSGRAPH P3-2 -- frontend bug/logic detector library
# =========================================================================
# TO: NFRA_TSGRAPH.P3-2 (0.4.0_DE_ClientPlatform) | anchors: P3-1 catalog
#   (org/tier1_exec/3.0.0_SA_CVO/deliverables/NFRA_TSGRAPH_P3-1_bugclass_catalog.md)
# PRD: docs/architecture/NFRA_TSGRAPH_PRD.md section 9
#
# PURPOSE
#   Codify the frontend-detectable bug/logic classes from the P3-1 catalog
#   (partition A1-A11) into canonical comp-kuzu / Cypher detectors that run
#   against the LIVE NFRA_TSGRAPH graph (Rule 20: QUERY, never rebuild).
#   Each detector is EMPIRICALLY VALIDATED: its query was run against the live
#   graph and MUST return its log-anchored exemplar. A detector that returns 0
#   rows / does not catch its exemplar is REJECTED and reported as a finding
#   (not faked). The `empirical` block on each detector records the actual run.
#
# SUBSTRATE
#   Single CloudNode / CloudEdge table, string discriminators (node_type /
#   edge_type), props = JSON STRING. The Kuzu build lacks SPLIT() -- every
#   query below is SPLIT-free (CONTAINS / STARTS WITH / CASE / count(DISTINCT)).
#   Run surface: `.tools/comp-kuzu --json "<cypher>"` (HEAD-current; auto-refresh
#   marker oracle; read the provenance header on every call).
#
# HEAD-CURRENT PROVENANCE (the graph these detectors + empirical runs were validated on)
