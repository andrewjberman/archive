Smartx_Bd_Join_Disposition:

  definition: >-
    THE JOIN-RESOLUTION OUTCOME of a single SmartX allocation row against the 49F
    account universe: did this allocation resolve to a 49F account, and if not, what
    STRUCTURALLY prevented it. Values: JOINED | KEY_OUTSIDE_ACCOUNT_GRAMMAR |
    KEY_VALID_ACCOUNT_ABSENT | UNRESOLVED. The axis carries OUTCOME ONLY -- it does
    NOT carry cause, lifecycle state, custodian attribution, or attribute provenance;
    each of those is a different intent and belongs on a different axis. Measured
    2026-08-19 against a printed denominator of 7,305 allocation rows and a 7,316-account
    universe: 7,286 JOINED (99.74%), 16 KEY_OUTSIDE_ACCOUNT_GRAMMAR (13 distinct, all
    9-digit keys), 3 KEY_VALID_ACCOUNT_ABSENT, 0 UNRESOLVED -- arithmetically exhaustive.
    UNRESOLVED is retained AT ZERO deliberately as the collectively-exhaustive guarantee:
    a future row that no class explains is PUBLISHED here, never dropped from the
    denominator.

  authority: >-
    data/_contracts/smartx_bd_join_disposition.yaml v1.0 (the machine-readable contract)
    + docs-side spec org/tier2_senior/0.4.0_DS_ClientPlatform/deliverables/
    SMARTX_BD_EXACT_JOIN_SPEC_20260819.md, authored under D3_MODELOVERLAY.TO-D3.1
    (D3_ACCOUNT_MODEL_OVERLAY_PRD.md sec-4.1 @52a85baf08). Registration required by the
    taxonomy-owner ruling of 4.0.0_SA_CRO~A, 2026-08-19 ~20:45Z (criterion D3.1-6).

  sits_at: >-
    join-resolution axis over the SmartX <-> 49F account pair grain; SIBLING of
    identity_source on the identity plane, related BY REGISTRATION, never merged

  status: PLACEHOLDER-REGISTRY-OWNER-SETS-THIS   # see "WHY THIS IS A DRAFT" above

  grain: >-
    ONE ROW of smartx/platform/silver/fact_allocation_account_map, i.e.
    (allocation_id x as_of). Every value is a property an allocation ROW can have. A
    value that could only be a property of an ACCOUNT is excluded BY CONSTRUCTION --
    which is why the proposed NO_SMARTX_ALLOCATION was rejected: it is account-grain,
    and there is no allocation row to carry it (measured separately and published as an
    account-side number: 1,575 of 7,316 universe accounts, 21.53%, carry no allocation;
    that is the EXPECTED state for a non-model account, not prima facie a defect).

  distinct_from:
    identity_source: >-
      SIBLING ON THE IDENTITY PLANE -- DECLARED, NOT LATENT. identity_source
      (bd-allocation | fam-carried | fam-live | bd-householding), emitted by
      ADVI_IDSPINE.WP-3 over the BD <-> Schwab spine, classifies ATTRIBUTE PROVENANCE
      at the ACCOUNT-ATTRIBUTE grain ("which layer answered this field"). This axis
      classifies JOIN-RESOLUTION DISPOSITION at the SMARTX-BD PAIR grain ("why did this
      pair not resolve"). RULED: DO NOT MERGE, DO RELATE -- forcing them onto one axis
      would put disposition and provenance together, the exact foundational break Rule
      24(iii) names. VALUE-LEVEL CONVERGENCE IS LEGAL and needs no coordination (both
      may carry a 'bd'-ish value); values converging under distinct axes is normal,
      AXES MERGING IS THE DEFECT.

  stability_frame: >-
    Rule 24(iv): THE AXIS SPLITS AND THAT IS NAMED. KEY_VALID_ACCOUNT_ABSENT MOVES under
    an account-universe refresh (the account is expressible in the universe's grammar and
    may appear or reappear). KEY_OUTSIDE_ACCOUNT_GRAMMAR DOES NOT MOVE under any refresh
    -- no refresh of a universe composed entirely of zfilled 8-digit ids can ever admit a
    9-digit key; its remedy is a SCOPE DECISION with a different owner. CONSEQUENCE: a
    plan of the form "refresh the account dimension and the residual clears" covers 3 of
    19 rows and structurally cannot reach the other 16.

  measured: >-
    2026-08-19 via a06_dim_identity_crosswalk.build_crosswalk over map as_of 2026-08-19
    and fact_acc as_of 2026-08-18. Controls run: POSITIVE -- 50 of 50 known 8-digit keys
    present in the universe (the membership test discriminates); NEGATIVE -- synthetic
    9999999999 absent (not undiscriminating); RELAXED-JOIN -- 0 of 13 distinct 9-digit
    keys present when zfilled to 10, so the \d{8} filter is NOT manufacturing the
    residual; UNIVERSE SHAPE -- 7,316 of 7,316 account ids are 10-char and '00'-leading,
    zero native 9/10-digit members.

  declared_readers: >-
    D3_ACCOUNT_MODEL_OVERLAY (residual table design, sec-4.1; producer sec-4.2) and
    D6/TO-G, the entity-resolution service, which GATES on this enum -- its
    disambiguation classes are DRAWN FROM these values. CTO's ruled reason: a resolver
    built before the enum lands would assign confidence over a universe whose residual is
    unclassified, making "unresolvable" and "resolvable-but-in-the-residual"
    indistinguishable. A change to this term is a change to a cross-package contract.
