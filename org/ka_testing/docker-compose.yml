services:
  runtime:
    build: .
    ports:
      - "8111:8111"
    volumes:
      - ${WORKSPACE_DIR:-./../..}:/workspace
      - runtime-results:/workspace/.runtime/results
    environment:
      - HIERARCHY_LLM_PROVIDER=${HIERARCHY_LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_EC2_METADATA_DISABLED=true
    working_dir: /workspace
    # Override command per run:
    #   docker compose run runtime --prd docs/architecture/ADVI_CLSUNI_PRD.md \
    #     --config .runtime/config.json --phase both --branch CLOUD_test

volumes:
  runtime-results:
